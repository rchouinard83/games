<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#060c1c">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Alien Putt</title>
<style>
  :root { --bg: #060c1c; --panel: #0e1a30; --line: #2a3e66; --ink: #e6f0ff; --dim: #93a6c9; --good: #5dff9b; --bad: #ff5d7a; --accent: #4fd1ff; --gold: #ffd25d; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; overscroll-behavior: none;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #app { height: 100%; height: 100dvh; display: flex; flex-direction: column; align-items: center; padding: calc(6px + env(safe-area-inset-top)) 6px calc(8px + env(safe-area-inset-bottom)); gap: 6px; }
  #hud { width: 100%; max-width: 480px; display: flex; gap: 6px; align-items: stretch; }
  .chip { background: rgba(14,26,48,0.9); border: 1px solid var(--line); border-radius: 12px; padding: 4px 9px 5px; font-weight: 800; font-size: 15px; line-height: 1.15; white-space: nowrap; }
  .chip small { display: block; font-size: 9.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); font-weight: 700; }
  .spacer { flex: 1; }
  .hudBtn { background: rgba(14,26,48,0.9); color: var(--ink); border: 1px solid var(--line); border-radius: 12px; font: inherit; font-weight: 900; font-size: 15px; padding: 0 11px; }
  #stage { flex: 1; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; }
  #cv { display: block; border-radius: 16px; border: 1px solid var(--line); touch-action: none; }
  #bubble { position: fixed; left: 50%; top: calc(60px + env(safe-area-inset-top)); transform: translate(-50%, -8px); max-width: min(92vw, 380px); background: #f0f8ff; color: #0c1a30;
    border-radius: 14px; padding: 8px 12px; font-size: 15px; font-weight: 700; line-height: 1.3; box-shadow: 0 4px 16px rgba(0,0,0,0.45); opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; z-index: 4; text-align: center; }
  #bubble.on { opacity: 1; transform: translate(-50%, 0); }
  #bubble b { color: #1a6ac4; }
  /* Menu styles travel with this HTML when it is published on its own. */
  #overlay {
    position: fixed; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center;
    padding: 12px;
    padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right))
      max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
    background: rgba(5, 5, 16, .78);
  }
  #overlay.hidden { display: none; }
  #box {
    width: min(100%, 430px); max-height: 100%; overflow: auto; overscroll-behavior: contain;
    touch-action: pan-y; padding: 16px; border: 1px solid #33336e; border-radius: 18px;
    background: #141436; color: #eef0ff; text-align: center; box-shadow: 0 0 40px #7070ca26;
  }
  #box h1 {
    margin: 8px 0 5px; font-size: clamp(32px, 9vw, 46px); letter-spacing: -.04em; line-height: 1.04;
    background: linear-gradient(90deg, #ff8bd0, #ffd25d 40%, #5dff9b 70%, #4fd1ff);
    background-clip: text; -webkit-background-clip: text; color: transparent;
  }
  #box h2 { margin: 4px 0 6px; font-size: 26px; line-height: 1.14; }
  #box p { margin: 6px 0 10px; color: #dcdff7; font-size: 15px; line-height: 1.4; }
  #box .kicker { margin: 6px 0 4px; color: #8fe9dc; font-size: 11px; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; }
  #titleArt { width: 100%; height: 145px; display: block; border-radius: 12px; }
  .big {
    display: block; width: 100%; min-height: 48px; margin: 8px 0; padding: 10px 11px;
    border: 1px solid #33336e; border-radius: 12px; background: #22225a; color: #eef0ff;
    font: 800 16px/1.2 system-ui, sans-serif; text-align: center; text-decoration: none;
  }
  a.big { display: grid; place-items: center; }
  .big.main { background: #1d4a3a; border-color: #2f7a5c; color: #82f7b2; }
  #box :is(button, a):focus-visible { outline: 2px solid #a7f5e5; outline-offset: 2px; }
  .menuList { display: grid; gap: 8px; margin: 8px 0; }
  .menuList .big { margin: 0; }
  .menuFooter { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .menuFooter .big { width: auto; flex: 1 1 135px; margin: 0; }
  .big:disabled { opacity: .44; }
  .big small { display: block; font-size: 12px; font-weight: 650; color: var(--dim); margin-top: 2px; }
  .row { display: flex; gap: 8px; } .row .big { flex: 1; }
  .worldCard { display: flex; align-items: center; gap: 12px; text-align: left; }
  .worldCard canvas { width: 60px; height: 60px; flex: none; border-radius: 12px; }
  .worldCard span { flex: 1; min-width: 0; }
  .holes { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin: 10px 0; }
  .holes .big { margin: 0; padding: 12px 0 6px; font-size: 18px; position: relative; }
  .holes .big .par { position: absolute; top: 2px; right: 3px; font-size: 9px; font-weight: 900; line-height: 1; padding: 2px 3px; border-radius: 5px; background: rgba(79,209,255,0.18); color: var(--accent); }
  .holes .big small { font-size: 9px; letter-spacing: 0; color: var(--gold); margin-top: 1px; }
  .holes .big small i, .stars i, .bigStars i { color: #2a3e66; font-style: normal; }
  .stars { color: var(--gold); }
  .bigStars { font-size: 46px; letter-spacing: 0.1em; color: var(--gold); margin: 2px 0 6px; }
  .score { font-size: 15px; color: var(--dim); font-weight: 700; }
  .chars { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0; }
  .charBtn { background: #0a1428; border: 2px solid #2a3e66; border-radius: 14px; padding: 6px 4px 8px; color: var(--ink); font: inherit; font-weight: 800; font-size: 14px; }
  .charBtn.on { border-color: var(--good); background: #10301f; }
  .charBtn canvas { width: 100%; aspect-ratio: 1; display: block; }
  .charDesc { min-height: 42px; }
  #howCv { width: 100%; height: 200px; display: block; border-radius: 12px; background: #0a1428; border: 1px solid #2a3e66; margin: 6px 0 4px; }
  .how { list-style: none; margin: 10px 0 8px; display: grid; gap: 6px; text-align: left; }
  .how li { font-size: 18px; font-weight: 650; line-height: 1.3; padding: 7px 12px; background: #0a1428; border: 1px solid #2a3e66; border-radius: 10px; }
  .how b { font-weight: 900; color: #fff; } .how b.c { color: var(--accent); } .how b.y { color: var(--gold); } .how b.g { color: var(--good); } .how b.r { color: var(--bad); }
  .dots { display: flex; justify-content: center; gap: 6px; margin: 4px 0 2px; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: #2a3e66; }
  .dots i.on { background: var(--accent); }
  @media (max-width: 520px), (max-height: 500px) and (pointer: coarse) {
    #overlay {
      bottom: auto; height: 100vh; height: 100dvh;
      background: radial-gradient(ellipse at 50% 18%, #20214a, #090c24 74%);
      -webkit-text-size-adjust: 100%;
    }
    #box { padding: clamp(12px, 4vw, 16px); }
    #box h1 { font-size: clamp(29px, 8vw, 39px); }
    #box h2 { font-size: clamp(23px, 6vw, 26px); }
    #box p { font-size: 14px; }
    #titleArt { height: clamp(100px, 19vh, 122px); }
    .big.main { min-height: 52px; background: #21744f; border-color: #429e70; color: #f3fff7; }
    .charBtn canvas { width: min(100%, 62px); margin: 0 auto; }
    #box:has(> .menuList) { display: flex; flex-direction: column; }
    #box:has(> .menuList) > :not(.menuList) { flex: 0 0 auto; }
    .menuList {
      min-height: min(112px, 32vh); overflow-y: auto; overscroll-behavior: contain;
      grid-auto-rows: max-content; padding: 2px;
    }
    .menuList canvas { width: 42px; height: 42px; }
  }
  @media (max-height: 500px) and (pointer: coarse) {
    #box { width: min(100%, 580px); padding: 12px; }
    #titleArt { height: min(90px, 27vh); }
    .menuList { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .chars { grid-template-columns: repeat(6, minmax(0, 1fr)); }
    .charBtn canvas { width: min(100%, 42px); }
    #howCv { height: min(100px, 28vh); }
  }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="chip"><small id="hWorld">Oort Gate</small><span id="hHole">Hole 1</span></div>
    <div class="chip"><small>Par</small><span id="hPar">2</span></div>
    <div class="chip"><small>Strokes</small><span id="hStrokes">0</span></div>
    <div class="spacer"></div>
    <button class="hudBtn" id="helpBtn" aria-label="How to play">?</button>
    <button class="hudBtn" id="retryBtn" aria-label="Restart hole">↻</button>
    <button class="hudBtn" id="menuBtn">Pause</button>
  </div>
  <div id="stage"><canvas id="cv"></canvas></div>
</div>
<div id="bubble"></div>
<div id="overlay"><div id="box"></div></div>
<script>
"use strict";
// ============================================================
//  ALIEN PUTT — mini golf across the four Alien Arcade worlds, 18 holes each.
//  Pull back from anywhere on the course and let go to putt.
//  The world is 360 x 640 units: a 9 x 16 grid of 40-unit tiles, scaled to fit the screen.
// ============================================================
const $ = id => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d");
const TAU = Math.PI * 2, PI = Math.PI;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const LW = 360, LH = 640, TILE = 40, COLS = 9, ROWS = 16;
const BALL_R = 9, CUP_R = 13, BUMPER_R = 14;
const PUTT = { maxPower: 760, dragFullPx: 95 };     // a full pull-back is 95 screen pixels of finger movement, so it fits on any phone
const CUP = { sinkSpeed: 430, pull: 900 };          // slower than sinkSpeed over the cup drops in; near the cup the ball is pulled toward it
const BOUNCE = { wall: 0.78, bumper: 1.15 };        // speed kept off a wall; bumpers kick it back harder
const SAND = { drag: 3.2, rolling: 170 };           // sand: slows the ball hard
const ICE = { drag: 0.12, rolling: 10 };            // ice patches: hardly slows at all
const SLOPE = 240;                                  // slopes (Mars, Earth) and wind (Jupiter): push per second
const WELL = { r: 105, pull: 720 };                 // gravity wells: reach and strongest pull
const PORTAL_R = 15, MILL = { arm: 36, spin: 1.5 }; // portals; windmill blade length and turn speed (radians/s)
const MAX_STROKES = 10;
const RAMP = 420;                                   // ramps up to a raised deck: how hard they push the ball back down
const JUMP = { min: 230, lift: 0.5, g: 1500 };      // launch pads: slowest speed that jumps, how high, how fast it falls
const ROCK_R = 15;                                  // asteroids
const MOON = { r: 10, orbit: 24, spin: 1.8 };       // orbiting moons: size, orbit radius, speed
const SAUCER = { r: 14, range: 60, speed: 1.2 };    // patrol saucers: size, how far each way, speed

// ============================================================
//  THE CHARACTERS: Stage 1 "First Contact" aliens from Alien Defense (attacker-design.html)
//  Each is drawn upright at the origin; s = body radius.
// ============================================================
const CHARS = (() => {
  function shade(hex, f) { const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255; const m = f < 0 ? 0 : 255, a = Math.abs(f);
    r = Math.round(r + (m - r) * a); g = Math.round(g + (m - g) * a); b = Math.round(b + (m - b) * a); return `rgb(${r},${g},${b})`; }
  const circle = (c, x, y, r) => { c.beginPath(); c.arc(x, y, r, 0, TAU); };
  const oval = (c, x, y, rx, ry, rot = 0) => { c.beginPath(); c.ellipse(x, y, rx, ry, rot, 0, TAU); };
  function shadow(c, s, y = 1.0, w = 0.9) { c.fillStyle = "rgba(0,0,0,0.35)"; oval(c, 0, s * y, s * w, s * 0.22); c.fill(); }
  function eye(c, x, y, r, pupil = "#10131f", lx = 0.25, ly = 0) {
    c.fillStyle = "#ffffff"; circle(c, x, y, r); c.fill();
    c.fillStyle = pupil; circle(c, x + r * lx, y + r * ly, r * 0.52); c.fill();
    c.fillStyle = "#ffffff"; circle(c, x + r * lx - r * 0.18, y + r * ly - r * 0.2, r * 0.16); c.fill();
  }
  const G = "#5dff9b", Y = "#ffe35d", P = "#ff8bd0", B = "#7ab8ff", O = "#ff8f5d", R = "#ff5d7a";
  const list = [
    { id: "blip", name: "Blip", color: G, fit: 1, desc: "One-eyed blob that bounces along, antennae bobbing.",
      draw(c, t, s, hit = 0) {
        const b = Math.sin(t * 8); c.translate(0, s * 0.1); c.scale(1 - 0.06 * b, 1 + 0.08 * b);
        c.fillStyle = shade(G, -0.4); oval(c, -s * 0.4, s * 0.75, s * 0.25, s * 0.13); c.fill(); oval(c, s * 0.4, s * 0.75, s * 0.25, s * 0.13); c.fill();
        c.strokeStyle = shade(G, -0.2); c.lineWidth = s * 0.08; c.lineCap = "round";
        for (const sd of [-1, 1]) { const tx = sd * s * (0.5 + 0.06 * Math.sin(t * 5 + sd));
          c.beginPath(); c.moveTo(sd * s * 0.25, -s * 0.7); c.quadraticCurveTo(sd * s * 0.35, -s * 1.05, tx, -s * 1.2); c.stroke();
          c.fillStyle = "#fff7a0"; circle(c, tx, -s * 1.2, s * 0.1); c.fill(); }
        c.fillStyle = G; c.beginPath(); c.moveTo(-s * 0.85, s * 0.7);
        c.bezierCurveTo(-s * 1.0, -s * 0.3, -s * 0.5, -s * 0.85, 0, -s * 0.85); c.bezierCurveTo(s * 0.5, -s * 0.85, s * 1.0, -s * 0.3, s * 0.85, s * 0.7); c.closePath(); c.fill();
        c.fillStyle = shade(G, 0.4); oval(c, -s * 0.4, -s * 0.38, s * 0.18, s * 0.09, -0.6); c.fill();
        if (hit > 0.15 || Math.sin(t * 1.3) > 0.97) { c.strokeStyle = "#10261a"; c.lineWidth = s * 0.07; c.beginPath(); c.moveTo(-s * 0.3, -s * 0.15); c.lineTo(s * 0.3, -s * 0.15); c.stroke(); }
        else eye(c, 0, -s * 0.15, s * 0.36, "#10261a", 0.25, 0.05);
        c.strokeStyle = "#10261a"; c.lineWidth = s * 0.06; c.beginPath(); c.arc(0, s * 0.3, s * 0.15, 0.2, Math.PI - 0.2); c.stroke();
      } },
    { id: "runner", name: "Runner", color: Y, fit: 1, desc: "Skinny legs, wobbly eye stalks, always in a hurry.",
      draw(c, t, s) {
        c.translate(0, -s * 0.1);
        c.strokeStyle = "rgba(255,227,93,0.35)"; c.lineWidth = s * 0.07; c.lineCap = "round";
        for (let k = 0; k < 3; k++) { const y = -s * 0.3 + k * s * 0.3; c.beginPath(); c.moveTo(-s * 0.7, y); c.lineTo(-s * (1.05 + 0.2 * Math.sin(t * 20 + k)), y); c.stroke(); }
        c.strokeStyle = shade(Y, -0.4); c.lineWidth = s * 0.12;
        for (const ph of [0, Math.PI]) { const a = t * 16 + ph, fx = Math.sin(a) * s * 0.5, fy = s * 1.0 - Math.max(0, Math.cos(a)) * s * 0.3;
          c.beginPath(); c.moveTo(0, s * 0.3); c.lineTo(fx * 0.5 + s * 0.1, s * 0.65); c.lineTo(fx, fy); c.stroke(); }
        c.fillStyle = Y; oval(c, s * 0.05, 0, s * 0.55, s * 0.48, 0.15); c.fill();
        c.fillStyle = shade(Y, 0.45); oval(c, -s * 0.15, -s * 0.2, s * 0.15, s * 0.08, -0.5); c.fill();
        c.strokeStyle = shade(Y, -0.2); c.lineWidth = s * 0.08;
        for (const [ex, ey, ph] of [[s * 0.1, -s * 0.95, 0], [s * 0.5, -s * 0.85, 1.5]]) { const w = Math.sin(t * 6 + ph) * s * 0.06;
          c.beginPath(); c.moveTo(s * 0.15, -s * 0.35); c.quadraticCurveTo(ex - s * 0.1, ey + s * 0.3, ex + w, ey); c.stroke();
          eye(c, ex + w, ey, s * 0.17, "#2a1a00", 0.4, 0.1); }
        c.strokeStyle = "#2a1a00"; c.lineWidth = s * 0.05; c.beginPath(); c.arc(s * 0.3, s * 0.1, s * 0.1, 0.2, Math.PI - 0.4); c.stroke();
      } },
    { id: "goo", name: "Goo", color: P, fit: 1.15, desc: "Little wobbling slime drop. Squishy and bouncy.",
      draw(c, t, s) {
        const w = Math.sin(t * 10); c.scale(1 + 0.1 * w, 1 - 0.1 * w);
        c.fillStyle = P; c.beginPath(); c.moveTo(0, -s * 1.0);
        c.bezierCurveTo(s * 0.5, -s * 0.4, s * 0.9, s * 0.1, s * 0.75, s * 0.55); c.quadraticCurveTo(0, s * 0.85, -s * 0.75, s * 0.55);
        c.bezierCurveTo(-s * 0.9, s * 0.1, -s * 0.5, -s * 0.4, 0, -s * 1.0); c.fill();
        c.fillStyle = shade(P, 0.45); oval(c, -s * 0.25, -s * 0.25, s * 0.12, s * 0.22, 0.4); c.fill();
        c.fillStyle = "#3a0a22"; circle(c, -s * 0.2, s * 0.15, s * 0.11); c.fill(); circle(c, s * 0.25, s * 0.15, s * 0.11); c.fill();
      } },
    { id: "jelly", name: "Jelly", color: B, fit: 1, desc: "Floating jellyfish that drifts along, tentacles waving.",
      draw(c, t, s, hit = 0) {
        shadow(c, s, 1.0, 0.7); c.translate(0, Math.sin(t * 2.5) * s * 0.12 - s * 0.25);
        c.strokeStyle = shade(B, 0.2); c.lineWidth = s * 0.08; c.lineCap = "round";
        for (let k = 0; k < 5; k++) { const x = -s * 0.5 + k * s * 0.25; c.beginPath(); c.moveTo(x, s * 0.1);
          c.quadraticCurveTo(x + Math.sin(t * 4 + k) * s * 0.2, s * (0.6 - hit * 0.27), x * (1 - hit * 0.4) + Math.sin(t * 4 + k + 1) * s * 0.15, s * (1 - hit * 0.57)); c.stroke(); }
        const pul = 1 + 0.06 * Math.sin(t * 5);
        const g = c.createRadialGradient(-s * 0.2, -s * 0.4, s * 0.1, 0, -s * 0.1, s * 0.8); g.addColorStop(0, shade(B, 0.55)); g.addColorStop(1, shade(B, -0.1));
        c.fillStyle = g; c.beginPath(); c.ellipse(0, 0, s * 0.75 * pul, s * 0.7 / pul, 0, Math.PI, TAU);
        c.quadraticCurveTo(s * 0.4, s * 0.25, 0, s * 0.12); c.quadraticCurveTo(-s * 0.4, s * 0.25, -s * 0.75 * pul, 0); c.fill();
        c.fillStyle = "#0d1830"; circle(c, -s * 0.2, -s * 0.25, s * 0.09); c.fill(); circle(c, s * 0.2, -s * 0.25, s * 0.09); c.fill();
      } },
    { id: "chonk", name: "Chonk", color: O, fit: 0.95, desc: "Big round three-eyed bruiser. Built like a bowling ball.",
      draw(c, t, s, hit = 0) {
        c.translate(0, -Math.abs(Math.sin(t * 3)) * s * 0.12 + s * 0.05);
        c.fillStyle = shade(O, -0.3);
        for (const sd of [-1, 1]) { oval(c, sd * s * 0.95, s * 0.05 + Math.sin(t * 3 + sd) * s * 0.08, s * 0.18, s * 0.28, sd * 0.4); c.fill(); }
        oval(c, -s * 0.45, s * 0.82, s * 0.28, s * 0.14); c.fill(); oval(c, s * 0.45, s * 0.82, s * 0.28, s * 0.14); c.fill();
        const g = c.createRadialGradient(-s * 0.3, -s * 0.4, s * 0.1, 0, 0, s); g.addColorStop(0, shade(O, 0.35)); g.addColorStop(1, shade(O, -0.15));
        c.fillStyle = g; oval(c, 0, 0, s * 0.92, s * 0.85); c.fill();
        c.fillStyle = shade(O, -0.2); circle(c, -s * 0.6, s * 0.35, s * 0.1); c.fill(); circle(c, s * 0.62, s * 0.3, s * 0.08); c.fill(); circle(c, s * 0.5, -s * 0.55, s * 0.07); c.fill();
        eye(c, -s * 0.35, -s * 0.2, s * 0.2, "#2a1205"); eye(c, s * 0.35, -s * 0.2, s * 0.2, "#2a1205"); eye(c, 0, -s * 0.52, s * 0.16, "#2a1205");
        if (hit > 0.15) { c.strokeStyle = "#3a1405"; c.lineWidth = s * 0.14; c.lineCap = "round"; c.beginPath(); c.moveTo(-s * 0.26, s * 0.38); c.quadraticCurveTo(0, s * 0.08, s * 0.26, s * 0.38); c.stroke(); }
        else { c.fillStyle = "#3a1405"; oval(c, 0, s * 0.3, s * 0.25, s * (0.1 + 0.05 * Math.sin(t * 3))); c.fill(); }
      } },
    { id: "mother", name: "Mother Blob", color: R, fit: 0.85, desc: "Huge blob covered in eyes that all look in different directions.",
      draw(c, t, s) {
        const w = Math.sin(t * 2); c.scale(1 + 0.04 * w, 1 - 0.04 * w);
        const g = c.createRadialGradient(-s * 0.3, -s * 0.35, s * 0.1, 0, 0, s * 1.05); g.addColorStop(0, shade(R, 0.35)); g.addColorStop(1, shade(R, -0.25));
        c.fillStyle = g; c.beginPath(); c.moveTo(-s * 1.05, s * 0.75);
        c.bezierCurveTo(-s * 1.2, -s * 0.4, -s * 0.6, -s * 1.0, 0, -s * 1.0); c.bezierCurveTo(s * 0.6, -s * 1.0, s * 1.2, -s * 0.4, s * 1.05, s * 0.75);
        c.quadraticCurveTo(0, s * 0.95, -s * 1.05, s * 0.75); c.fill();

const FEATURES = {
  o: { title: "Bumper", lines: ["Purple <b>bumpers</b> kick the ball back <b>hard</b>", "<b>Bank</b> off them to reach the cup"] },
  i: { title: "Ice patch", lines: ["Pale <b class='c'>ice</b> hardly slows the ball", "Putt <b>softer</b> than you think"] },
  s: { title: "Sand trap", lines: ["<b class='y'>Sand</b> slows the ball right down", "Putt <b>harder</b> to get through it"] },
  slope: { title: "Slope", lines: ["The ground tilts where the <b>arrows</b> point", "The ball <b>rolls downhill</b> that way"] },
  wind: { title: "Wind stream", lines: ["Storm wind <b>pushes</b> the ball the way it blows", "Ride it, or putt <b>harder</b> against it"] },
  well: { title: "Gravity well", lines: ["A tiny <b>black hole</b> that <b>pulls</b> the ball toward it", "The <b>dotted ring</b> shows its reach: it bends your putt"] },
  portal: { title: "Portals", lines: ["Roll into <b>IN</b> and pop out of <b>OUT</b>", "Same colour = same pair · same speed, <b>same direction</b>"] },
  mill: { title: "Windmill", lines: ["Spinning blades <b>knock</b> the ball away", "<b>Time</b> your putt through the gap"] },
  hz_crack: { title: "Space crack", lines: ["A crack into <b>empty space</b>", "<b class='r'>+1 stroke</b>, back to where you putted"] },
  hz_radiation: { title: "Radiation belt", lines: ["Purple <b>radiation</b> zaps the ball", "<b class='r'>+1 stroke</b>, back to where you putted"] },
  hz_crystal: { title: "Crystal field", lines: ["Sharp red <b>crystals</b> stop the ball cold", "<b class='r'>+1 stroke</b>, back to where you putted"] },
  hz_water: { title: "Pond", lines: ["<b class='c'>Splash!</b> The ball sinks", "<b class='r'>+1 stroke</b>, back to where you putted"] },
  x: { title: "Asteroids", lines: ["Space <b>rocks</b> block the way", "<b>Bank</b> around them"] },
  a: { title: "Orbiting moon", lines: ["A little <b>moon</b> circles round and round", "<b>Time</b> your putt to slip past it"] },
  z: { title: "Patrol saucer", lines: ["A <b class='r'>saucer</b> slides back and forth", "Wait for the <b>gap</b>, then putt"] },
  J: { title: "Launch pad", lines: ["Hit the <b class='c'>pad</b> fast and you <b>jump</b>", "Clear the gap. <b>Too hard</b> = lost in space!"] },
  deck: { title: "Upper deck", lines: ["A <b>raised deck</b>: its edges are walls", "Climb the <b>ramp</b>: putt hard or roll back down"] },
  H: { title: "Drop hole", lines: ["Roll into the <b>▼ hole</b> on the deck", "The dotted tube drops you out the <b>▲ ring</b>, rolling <b>up</b>"] },
};
function featuresOf() { // which objects this hole has, in the order they matter
  const all = grid.flat().join(""), out = [];
  if (all.includes("~")) out.push("hz_" + W.look.hz);
  if (all.includes("o")) out.push("o");
  if (all.includes("i")) out.push("i");
  if (all.includes("s")) out.push("s");
  if (/[<>^v]/.test(all)) out.push(wi === 1 ? "wind" : "slope");
  if (all.includes("@")) out.push("well");
  if (all.includes("A") || all.includes("D")) out.push("portal");
  if (all.includes("W")) out.push("mill");
  if (all.includes("x")) out.push("x");
  if (all.includes("a")) out.push("a");
  if (all.includes("z")) out.push("z");
  if (all.includes("J")) out.push("J");
  if (/[uQK]/.test(all)) out.push("deck");
  if (all.includes("H")) out.push("H");
  return out;
}
function featureMenu(list, i) {
  const key = list[i], F = FEATURES[key], lastOne = i === list.length - 1;
  if (!SAVE.seen.includes(key)) { SAVE.seen.push(key); save(); }
  openMenu(`<p class="kicker">New on this hole${list.length > 1 ? ` · ${i + 1} of ${list.length}` : ""}</p><h2>${F.title}</h2>
    <canvas id="howCv"></canvas><ul class="how">${F.lines.map(l => `<li>${l}</li>`).join("")}</ul>
    <button class="big main" data-act="${lastOne ? "go" : "feat"}" data-arg="${i + 1}">${lastOne ? `Play hole ${hi + 1} ▶` : "Next ▶"}</button>`,
    tt => { const cvs = $("howCv"); if (!cvs) return; const [c, w, h] = fitCanvas(cvs); featureDemo(c, key, tt, w, h); });
  featList = list;
}
let featList = [];
function featureDemo(c, key, tt, w, h) { // a 5 x 3 tile patch with the object in it and your alien showing what it does
  const sc = Math.min(w / 200, h / 120);
  c.fillStyle = W.look.sky[1]; c.fillRect(0, 0, w, h);
  c.save(); c.translate((w - 200 * sc) / 2, (h - 120 * sc) / 2); c.scale(sc, sc);
  const tiles = [["g", "g", "g", "g", "g"], ["g", "g", "g", "g", "g"], ["g", "g", "g", "g", "g"]];
  const arrow = key === "wind" || key === "slope";
  if (key === "i") tiles[1] = ["g", "i", "i", "i", "i"];
  if (key === "s") tiles[1] = ["g", "g", "s", "s", "g"], tiles[0][2] = tiles[0][3] = tiles[2][2] = tiles[2][3] = "s";
  if (arrow) for (const r of tiles) r[1] = r[2] = r[3] = ">";
  if (key.startsWith("hz_")) tiles[0][3] = tiles[1][3] = tiles[2][3] = "~";
  if (key === "J") for (const r of tiles) r[2] = r[3] = ".", tiles[1][1] = "J";
  if (key === "deck") for (const r of tiles) r[2] = r[3] = r[4] = "u", tiles[1][1] = "r";
  if (key === "H") for (const r of tiles) r[0] = r[1] = r[2] = "u", r[3] = ".", tiles[1][2] = "H", tiles[1][4] = "X";
  if (key === "x") tiles[1][3] = "x";
  tiles.forEach((r, y) => r.forEach((ch, x) => { if (ch !== ".") drawTile(c, ch, x * TILE, y * TILE, x, y, [1, 0]); }));
  if (key === "deck" || key === "H") { c.fillStyle = "rgba(0,0,0,0.3)"; c.fillRect(key === "H" ? 120 : 70, 0, 9, 120); }
  if (key === "wind") tiles.forEach((r, y) => r.forEach((ch, x) => { if (ch === ">") drawWind(c, ch, x, y, tt); }));
  c.strokeStyle = W.look.wall; c.lineWidth = 4; c.strokeRect(0, 0, 200, 120);
  const T = tt % 3.2, ease = k => 1 - (1 - k) * (1 - k);
  let x = 20, y = 60, show = true, note = "";
  if (key === "o") { const b = { x: 150, y: 60, flash: T > 0.9 && T < 1.2 ? 0.3 - (T - 0.9) : 0 }; drawBumper(c, b);
    x = T < 0.9 ? 20 + (126 - 20) * (T / 0.9) : 126 - 106 * ease(Math.min(1, (T - 0.9) / 1.2)); note = T > 0.9 && T < 1.6 ? "boing!" : ""; }
  else if (key === "i") { x = 20 + 165 * ease(Math.min(1, T / 2.4)); note = "wheee..."; }
  else if (key === "s") { x = T < 0.6 ? 20 + 80 * (T / 0.6) : 100 + 14 * ease(Math.min(1, (T - 0.6) / 0.5)); note = T > 0.8 ? "stuck in the sand" : ""; }
  else if (arrow) { const k = Math.min(1, T / 2.4); x = 30 + 150 * k * k; y = 60; note = key === "wind" ? "blown along" : "rolling downhill"; }
  else if (key === "well") { const wl = { x: 100, y: 60 }; drawWell(c, wl, tt);
    const k = Math.min(1, T / 2.6), a = -PI * 0.9 + k * PI * 2.6, r = 80 * (1 - k * 0.85); x = wl.x + Math.cos(a) * r; y = wl.y + Math.sin(a) * r * 0.55; note = "pulled in..."; }
  else if (key === "portal") { const pin = { x: 60, y: 60, ch: "A", col: "#c77dff" }, pout = { x: 150, y: 60, ch: "B", col: "#c77dff" }; drawPortal(c, pin, tt); drawPortal(c, pout, tt);
    if (T < 0.8) x = 15 + 45 * (T / 0.8); else if (T < 1.1) show = false; else { x = 150 + 35 * ease(Math.min(1, (T - 1.1) / 1)); } note = T > 0.8 ? "warp!" : ""; }
  else if (key === "mill") { const m = { x: 100, y: 60 }; drawMill(c, m, tt * MILL.spin); x = 20 + 160 * Math.min(1, T / 2.6); y = 60 + (Math.abs(x - 100) < 30 ? Math.sin(tt * 6) * 6 : 0); note = "mind the blades"; }
  else if (key.startsWith("hz_")) { if (T < 1.1) x = 20 + 110 * ease(T / 1.1); else if (T < 1.8) { show = false; if (T < 1.3) for (let k = 0; k < 6; k++) { c.fillStyle = "#fff"; c.fillRect(130 + Math.cos(k) * (T - 1.1) * 90, 60 + Math.sin(k) * (T - 1.1) * 90, 3, 3); } }
    else x = 20; note = T > 1.1 && T < 2.4 ? "+1 stroke" : ""; }
  let z = 0;
  if (key === "x") { x = T < 0.8 ? 20 + 82 * (T / 0.8) : 102 - 80 * ease(Math.min(1, (T - 0.8) / 1.2)); y = 60 + (T > 0.8 ? -20 * ease(Math.min(1, (T - 0.8) / 1.2)) : 0); note = T > 0.8 && T < 1.4 ? "bonk" : ""; }
  else if (key === "a") { const mo = { x: 100, y: 60, dir: 1, ph: 0 }, a = tt * MOON.spin; drawMoon(c, 100 + Math.cos(a) * MOON.orbit, 60 + Math.sin(a) * MOON.orbit, 100, 60); x = 20 + 165 * Math.min(1, T / 2.8); y = 104; note = "slip past the moon"; }
  else if (key === "z") { const k = tt * SAUCER.speed; drawSaucer(c, 100 + Math.sin(k) * SAUCER.range, 60, tt, 100); x = 100; y = 112 - Math.min(1, T / 2.8) * 100; note = "wait for the gap"; }
  else if (key === "J") { if (T < 0.5) x = 20 + 40 * (T / 0.5); else { const k = Math.min(1, (T - 0.5) / 0.9); x = 60 + 115 * k; z = Math.sin(k * PI) * 40; } note = T > 0.5 && T < 1.5 ? "jump!" : ""; }
  else if (key === "deck") { x = 20 + 150 * ease(Math.min(1, T / 2.2)); note = x > 80 ? "up on the deck" : "up the ramp"; }
  else if (key === "H") { if (T < 0.9) x = 20 + 80 * (T / 0.9); else if (T < 1.4) show = false; else x = 180 + Math.min(10, (T - 1.4) * 20); note = T > 0.9 ? "down the tube..." : ""; }
  if (show) CHARS.draw(c, SAVE.char, x, y - 2, 11 * (1 + z / 110) * (key === "deck" && x > 80 ? 1.08 : 1), tt * 2, z);
  if (note) { c.fillStyle = "#fff"; c.font = "800 12px system-ui"; c.textAlign = "center"; c.fillText(note, 100, 14); }
  c.restore();
}

const ACT = {
  feat: i => featureMenu(featList, +i),
  go: () => { closeMenu(); if (H.tip) say(H.tip, 4); },
  world: w => worldMenu(+w),
  play: arg => { const [w, h] = String(arg).split("|").map(Number); pending = [w, h]; if (!SAVE.seenHelp) { SAVE.seenHelp = true; save(); helpMenu("first", 0); } else ACT.start(); },
  start: () => { loadHole(pending[0], pending[1]); const fresh = featuresOf().filter(f => !SAVE.seen.includes(f));
    if (fresh.length) featureMenu(fresh, 0); else closeMenu(); },
  title: () => titleMenu(),
  worlds: () => worldsMenu(),
  setup: a => setupMenu(...a.split("|").map(Number)),
  chars: a => charMenu(...a.split("|").map(Number)),
  pick: id => { SAVE.char = id; save(); for (const b of $("box").querySelectorAll(".charBtn")) { const on = b.dataset.arg === id; b.classList.toggle("on", on); b.setAttribute("aria-pressed", on); } $("charDesc").textContent = CHARS.byId(id).desc; },
  help: arg => { const [back, page] = String(arg).split("|"); helpMenu(back, +(page || 0)); },
  resume: () => closeMenu(),
  restart: () => { loadHole(wi, hi); closeMenu(); },
};
let pending = [0, 0];
$("helpBtn").onclick = () => { audio(); if ($("overlay").classList.contains("hidden")) helpMenu("game", 0); };
$("retryBtn").onclick = () => { audio(); ACT.restart(); };
$("menuBtn").onclick = () => { audio(); if (!paused) pauseMenu(); };

// ============================================================
//  LOOP
// ============================================================
function resize() {
  const st = $("stage"), w = st.clientWidth, h = st.clientHeight, d = Math.min(3, devicePixelRatio || 1);
  K = Math.max(0.3, Math.min(w / LW, h / LH));
  cv.style.width = LW * K + "px"; cv.style.height = LH * K + "px"; cv.width = Math.round(LW * K * d); cv.height = Math.round(LH * K * d);
}
addEventListener("resize", resize); if (window.ResizeObserver) new ResizeObserver(resize).observe($("stage"));
let last = performance.now(), acc = 0;
function frame(now) {
  const dt = clamp((now - last) / 1000, 0, 0.1);
  last = now; // never let the clock run backwards or jump
  if (!paused) { acc += dt; while (acc >= 1 / 60) { acc -= 1 / 60; update(1 / 60); } }
  if (bubbleT > 0) { bubbleT -= dt; if (bubbleT <= 0) $("bubble").classList.remove("on"); }
  draw(now / 1000);
  if (menuAnim) menuAnim(now / 1000);
  requestAnimationFrame(frame);
}
// quick self-check of the maps: every hole needs exactly one tee and one cup, 9 x 16 tiles
WORLDS.forEach((w, i) => w.holes.forEach((h, j) => { const all = h.map.join(""), bad = h.map.length !== ROWS || h.map.some(r => r.length !== COLS) || (all.match(/[TQ]/g) || []).length !== 1 || (all.match(/[CK]/g) || []).length !== 1 || (all.includes("H") && !all.includes("X"));
  if (bad) console.warn(`Alien Putt map problem: world ${i + 1} hole ${j + 1} (${h.name})`); }));
resize(); loadHole(0, 0); $("bubble").classList.remove("on"); bubbleT = 0;
titleMenu();
requestAnimationFrame(frame);
</script>
