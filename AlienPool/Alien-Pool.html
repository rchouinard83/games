<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070915">
<title>Alien Pool</title>
<style>
/* ---- Arcade menu standard (from lib/arcade-menu.css) ---- */
.arcade-menu {
  position: fixed;
  inset: 0;
  z-index: 5;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right))
    max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
  background: rgba(5, 5, 16, .78);
}
#panel.arcade-panel {
  box-sizing: border-box;
  width: min(100%, 430px);
  max-height: 100%;
  overflow: auto;
  overscroll-behavior: contain;
  touch-action: pan-y;
  padding: 16px;
  border: 1px solid #33336e;
  border-radius: 18px;
  background: #141436;
  color: #eef0ff;
  text-align: center;
  box-shadow: 0 0 40px #7070ca26;
}
#panel.arcade-panel h1 {
  margin: 8px 0 5px;
  font-size: clamp(32px, 9vw, 46px);
  letter-spacing: -.04em;
  line-height: 1.04;
  background: linear-gradient(90deg, #ff8bd0, #ffd25d 40%, #5dff9b 70%, #4fd1ff);
  background-clip: text;
  -webkit-background-clip: text;
  color: transparent;
}
#panel.arcade-panel h2 { margin: 4px 0 6px; font-size: 26px; line-height: 1.14; }
#panel.arcade-panel p { margin: 6px 0 10px; color: #dcdff7; font-size: 15px; line-height: 1.4; }
#panel.arcade-panel .kicker,
#panel.arcade-panel .eyebrow,
#panel.arcade-panel .step {
  margin: 6px 0 4px;
  color: var(--menu-accent, #8fe9dc);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: .13em;
  text-transform: uppercase;
}
#panel.arcade-panel :is(button, a.arcade, a.button) {
  display: flex;
  width: 100%;
  min-height: 48px;
  align-items: center;
  justify-content: center;
  box-sizing: border-box;
  padding: 10px 11px;
  border: 1px solid #33336e;
  border-radius: 12px;
  background: #22225a;
  color: #eef0ff;
  font: 800 16px/1.2 system-ui, sans-serif;
  text-align: center;
  text-decoration: none;
  white-space: normal;
}
#panel.arcade-panel :is(button, a):focus-visible { outline: 2px solid #a7f5e5; outline-offset: 2px; }
#panel.arcade-panel button.primary { background: #1d4a3a; border-color: #2f7a5c; color: #82f7b2; }
#panel.arcade-panel button:disabled { opacity: .44; }
#panel.arcade-panel button small {
  display: block;
  margin: 3px 0 0;
  color: #aeb4dd;
  font: 700 12px/1.25 system-ui, sans-serif;
  text-transform: none;
  letter-spacing: 0;
}
#panel.arcade-panel > :is(button, a) { margin: 8px 0 0; }
#panel.arcade-panel :is(.actions, .choices, .menu-actions, .stage-list, .worlds, .balls) { gap: 8px; margin: 8px 0; }
#panel.arcade-panel :is(.actions, .choices, .menu-actions, .stage-list, .worlds) {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
}
#panel.arcade-panel :is(.choices, .stage-list) button:not(.arcade-stage) { display: block; }
#panel.arcade-panel :is(.choices, .stage-list, .worlds).arcade-stages { grid-template-columns: 1fr; }
#panel.arcade-panel button.arcade-stage {
  justify-content: flex-start;
  gap: 12px;
  text-align: left;
}
.arcade-stage > span:last-child { min-width: 0; }
.arcade-planet {
  --planet: #90e4ff;
  --shade: #23436e;
  position: relative;
  display: grid;
  place-items: center;
  width: 50px;
  height: 50px;
  flex: 0 0 50px;
  border-radius: 10px;
  background: radial-gradient(circle at 15% 16%, #acb6dc 0 1px, transparent 2px),
    radial-gradient(circle at 85% 72%, #acb6dc 0 1px, transparent 2px), #0d1331;
}
.arcade-planet::after {
  content: "";
  width: 29px;
  height: 29px;
  border-radius: 50%;
  background: radial-gradient(circle at 29% 27%, #ffffffaa, transparent 42%),
    repeating-linear-gradient(-22deg, transparent 0 4px, #15264a35 5px 7px),
    radial-gradient(circle at 32% 34%, var(--planet), var(--shade) 76%);
  box-shadow: 0 0 8px var(--shade);
}
.arcade-planet[data-world="1"] { --planet: #f6cc9d; --shade: #874265; }
.arcade-planet[data-world="2"] { --planet: #ff9276; --shade: #70283d; }
.arcade-planet[data-world="3"] { --planet: #92efb3; --shade: #2552a0; }
.arcade-hero {
  display: block;
  width: 100%;
  height: clamp(75px, 22dvh, 145px);
  border-radius: 12px;
  background: radial-gradient(ellipse at 50% 80%, #272759, #0b1231 70%);
}
#panel.arcade-panel button.arcade-choice { justify-content: space-between; text-align: left; }
#panel.arcade-panel button.arcade-choice > span:last-child { color: #94f0c4; font-size: 13px; }
#panel.arcade-panel .balls button { justify-content: flex-start; text-align: left; }
#panel.arcade-panel .balls button.on { background: #193d37; border-color: #589d80; }
#panel.arcade-panel .stars { color: #ffd25d; }

#panel.arcade-panel .arcade-footer {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
#panel.arcade-panel .arcade-footer > * {
  width: auto;
  flex: 1 1 135px;
  margin: 0;
}

/* The phone menu has its own backdrop and keeps its actions outside scrolling lists. */
@media (max-width: 520px), (max-height: 500px) and (pointer: coarse) {
  .arcade-menu {
    box-sizing: border-box;
    bottom: auto;
    height: 100vh;
    height: 100dvh;
    padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right))
      max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
    background: radial-gradient(ellipse at 50% 18%, #20214a, #090c24 74%);
    -webkit-text-size-adjust: 100%;
  }
  #panel.arcade-panel { padding: clamp(12px, 4vw, 16px); }
  #panel.arcade-panel .arcade-hero { height: clamp(72px, 19dvh, 122px); }
  #panel.arcade-panel h1 { font-size: clamp(29px, 8vw, 39px); }
  #panel.arcade-panel h2 { font-size: clamp(23px, 6vw, 26px); }
  #panel.arcade-panel p { font-size: 14px; }
  #panel.arcade-panel :is(button, a.arcade, a.button) { font-size: 15px; }
  #panel.arcade-panel:has(> :is(.balls, .arcade-stages)) {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #panel.arcade-panel:has(> :is(.balls, .arcade-stages)) > :not(.balls, .arcade-stages) {
    flex: 0 0 auto;
  }
  #panel.arcade-panel > :is(.balls, .arcade-stages) {
    grid-auto-rows: max-content;
    align-content: start;
    min-height: 0;
    overflow-y: auto;
    overscroll-behavior: contain;
    padding: 2px;
    -webkit-overflow-scrolling: touch;
  }
  #panel.arcade-panel .balls i { width: 32px; height: 32px; }
}
@media (max-height: 500px) and (pointer: coarse) {
  #panel.arcade-panel { width: min(100%, 580px); padding: 12px; }
  #panel.arcade-panel:has(> .arcade-hero) {
    display: grid;
    grid-template-columns: minmax(105px, .42fr) minmax(0, 1fr);
    align-items: center;
    column-gap: 14px;
  }
  #panel.arcade-panel > .arcade-hero {
    grid-row: 1 / 7;
    height: clamp(92px, 37dvh, 155px);
  }
  #panel.arcade-panel:has(> .arcade-hero) > :not(.arcade-hero) { grid-column: 2; }
  #panel.arcade-panel h1 { font-size: clamp(26px, 6dvh + 12px, 36px); }
  #panel.arcade-panel p { margin: 4px 0 7px; }
  #panel.arcade-panel > :is(button, a) { margin-top: 6px; }
  #panel.arcade-panel :is(.actions, .choices, .menu-actions) { margin: 6px 0; }
  #panel.arcade-panel :is(.balls, .arcade-stages) { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  #panel.arcade-panel button.arcade-stage { gap: 9px; padding: 7px 10px; }
  #panel.arcade-panel .arcade-planet { width: 40px; height: 40px; flex-basis: 40px; }
  #panel.arcade-panel .arcade-planet::after { width: 25px; height: 25px; }
  #panel.arcade-panel :is(.guide svg, #howCv) { height: min(85px, 25dvh); }
}
/* ---- Alien Pool ---- */
.arcade-menu[hidden], .hud[hidden] { display: none; }
:root { --ink: #eef0ff; --dim: #aeb4dd; --line: #2c3758; --box: #161c35e6; --good: #5dff9b; --cyan: #4fd1ff; }
html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: #070915; color: var(--ink);
  font-family: system-ui, sans-serif; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
#view { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; touch-action: none; }
.hud { position: fixed; z-index: 2; top: max(8px, env(safe-area-inset-top)); left: max(8px, env(safe-area-inset-left)); right: max(8px, env(safe-area-inset-right));
  display: grid; grid-template-columns: repeat(var(--np, 2), minmax(0, 1fr)) auto auto; gap: 6px; pointer-events: none; }
.hud > * { pointer-events: auto; }
.hud .pl, .hud .rec { background: var(--box); border: 1px solid var(--line); border-radius: 10px; padding: 6px 9px; min-width: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 7px; align-items: center; transition: border-color .2s, box-shadow .2s; }
.hud .rec { grid-template-columns: 1fr; text-align: center; }
.hud .pl.turn { border-color: var(--pc); box-shadow: 0 0 14px color-mix(in srgb, var(--pc) 40%, transparent); }
.hud .pl.out { opacity: .45; }
.hud small { display: block; color: var(--dim); font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hud strong { display: block; font-size: clamp(13px, 3.4vw, 16px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hud .face { width: 34px; height: 34px; grid-row: span 3; }
.hud .youface { width: 34px; height: 34px; grid-row: span 3; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 35% 30%, #fff, #cfd6e8 60%, #8e97b5); color: #10131f; font-weight: 900; font-size: 13px; }
.rack { display: flex; gap: 2px; flex-wrap: wrap; min-height: 10px; margin-top: 2px; }
.rack i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); box-shadow: inset -2px -2px 3px #0006; }
.rack i.st { background: linear-gradient(#f4f1e6 0 25%, var(--c) 25% 75%, #f4f1e6 75%); }
.hud #pauseBtn { min-height: 0; padding: 0 14px; border-radius: 10px; background: #161c35; border: 1px solid var(--line); color: var(--ink); font: 800 14px system-ui, sans-serif; }
#toast { position: fixed; z-index: 2; left: 50%; top: calc(max(8px, env(safe-area-inset-top)) + 62px); transform: translateX(-50%); max-width: min(92vw, 520px);
  padding: 8px 14px; border-radius: 12px; background: #0d1230e8; border: 1px solid #3a4680; font-weight: 800; font-size: 15px; text-align: center; pointer-events: none;
  opacity: 0; transition: opacity .25s; }
#toast.show { opacity: 1; }
#toast.foul { border-color: #ff5d7a; color: #ffd0d8; }
#toast.good { border-color: var(--good); color: #c9ffe0; }
.ctl { position: fixed; z-index: 2; display: none; }
body.playing .ctl { display: flex; }
body.playing.cpu .ctl.mine { opacity: .35; pointer-events: none; }
#spin { left: max(12px, env(safe-area-inset-left)); bottom: max(12px, env(safe-area-inset-bottom)); width: 84px; height: 84px; border-radius: 50%; touch-action: none;
  background: radial-gradient(circle at 36% 30%, #ffffff, #e7e9f2 45%, #aab2cc 80%, #7a83a3); box-shadow: 0 4px 16px #0008, inset 0 0 0 2px #ffffff55; cursor: crosshair; }
#spin::before, #spin::after { content: ""; position: absolute; background: #10131f33; }
#spin::before { left: 50%; top: 12%; bottom: 12%; width: 1px; }
#spin::after { top: 50%; left: 12%; right: 12%; height: 1px; }
#spinDot { position: absolute; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; background: #ff3d6e; box-shadow: 0 0 0 2px #fff, 0 0 10px #ff3d6e; left: 50%; top: 50%; pointer-events: none; }
#spinLbl { position: absolute; left: 50%; bottom: -18px; transform: translateX(-50%); font: 800 11px system-ui; color: var(--dim); white-space: nowrap; letter-spacing: .05em; text-transform: uppercase; }
#aimRow { left: 50%; transform: translateX(-50%); bottom: max(12px, env(safe-area-inset-bottom)); gap: 8px; }
#aimRow button { min-width: 52px; min-height: 48px; border-radius: 12px; border: 1px solid #3a4680; background: #161c35e6; color: var(--ink); font: 800 15px system-ui, sans-serif; touch-action: none; }
#aimRow #viewBtn { min-width: 84px; }
#power { right: max(12px, env(safe-area-inset-right)); bottom: max(12px, env(safe-area-inset-bottom)); top: calc(max(8px, env(safe-area-inset-top)) + 64px); max-height: 380px; margin-top: auto;
  width: 58px; border-radius: 16px; border: 1px solid #3a4680; background: #0d1230d9; touch-action: none; flex-direction: column; align-items: center; padding: 8px 0; box-sizing: border-box; cursor: ns-resize; }
#power .track { position: relative; flex: 1; width: 18px; border-radius: 9px; background: #232a52; overflow: hidden; margin: 6px 0; }
#power .fill { position: absolute; left: 0; right: 0; top: 0; height: 0; background: linear-gradient(#5dff9b, #ffd25d 60%, #ff5d7a); border-radius: 9px; }
#power small { font: 800 10px system-ui; color: var(--dim); letter-spacing: .08em; text-align: center; line-height: 1.2; }
#power b { font: 900 14px system-ui; }
@media (max-width: 560px) {
  .hud { grid-template-columns: repeat(var(--np, 2), minmax(0, 1fr)) auto; gap: 4px; }
  .hud .pl { padding: 4px 6px; column-gap: 5px; }
  .hud .rec { display: none; }
  .hud .face, .hud .youface { width: 28px; height: 28px; }
  #spin { width: 70px; height: 70px; }
  #aimRow button { min-width: 46px; } #aimRow #viewBtn { min-width: 70px; }
  #power { width: 52px; }
}
@media (max-height: 460px) {
  #toast { top: calc(max(6px, env(safe-area-inset-top)) + 54px); font-size: 13px; }
  .hud .pl, .hud .rec { padding: 3px 8px; }
  .rack { display: none; }
}
/* menu extras */
#panel.arcade-panel .chars { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 8px 0; }
#panel.arcade-panel button.charBtn { display: block; min-height: 0; padding: 6px 4px 8px; background: #0b1430; border: 2px solid #2f4274; border-radius: 14px; }
#panel.arcade-panel button.charBtn.on { border-color: var(--good); background: #10301f; }
#panel.arcade-panel button.charBtn canvas { width: min(100%, 92px); aspect-ratio: 1; display: block; margin: 0 auto; }
#panel.arcade-panel button.charBtn small { color: #7ff0b0; }
#panel .tables { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 6px 0 10px; }
#panel.arcade-panel .tables button { display: block; min-height: 0; padding: 8px 6px; }
#panel.arcade-panel .tables button[aria-pressed="true"], #panel.arcade-panel .cues button[aria-pressed="true"] { background: #193d37; border-color: #589d80; }
#panel .tables .swatch { display: block; width: 100%; height: 26px; margin: 0 auto 6px; border-radius: 6px; border: 3px solid #6b4426; background: var(--felt); box-sizing: border-box; }
#panel .cues { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin: 6px 0 10px; }
#panel.arcade-panel .cues button { display: block; text-align: left; min-height: 0; padding: 8px 10px; }
#panel .cues .stick { display: block; height: 8px; margin: 2px 0 6px; border-radius: 4px; background: var(--stick); }
#panel .stat { display: grid; grid-template-columns: 52px 1fr; align-items: center; gap: 6px; font: 800 11px system-ui; color: #aeb4dd; margin-top: 2px; }
#panel .stat span { display: flex; gap: 2px; }
#panel .stat span i { flex: 1; height: 6px; border-radius: 3px; background: #2a3366; }
#panel .stat span i.on { background: var(--sc, #5dff9b); }
#panel.arcade-panel .modes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 6px 0 10px; }
#panel.arcade-panel .modes button { display: block; min-height: 0; padding: 8px 6px; }
#panel.arcade-panel .modes button[aria-pressed="true"] { background: #193d37; border-color: #589d80; }
#panel.arcade-panel .chars.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
#panel.arcade-panel .chars.two canvas { width: min(100%, 64px); }
#panel canvas.cuehero { display: block; width: 100%; height: auto; aspect-ratio: 800 / 84; margin: 2px 0 6px; border-radius: 10px; background: radial-gradient(ellipse at 50% 50%, #26306a, #0b1231 75%); }
#panel .cues canvas.cuepic { display: block; width: 100%; height: auto; aspect-ratio: 360 / 44; margin: 0 0 4px; }
#panel .guide { display: block; width: 100%; height: 130px; border-radius: 12px; background: #0b1231; margin: 6px 0; }
#panel .result-face { width: 110px; height: 110px; display: block; margin: 0 auto; }
@media (max-width: 520px) { #panel .cues { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<canvas id="view" aria-label="3D pool table"></canvas>
<div class="hud" id="hud" hidden></div>
<div id="toast" role="status"></div>
<div class="ctl mine" id="spin" aria-label="Cue tip position: drag to set spin"><span id="spinDot"></span><span id="spinLbl">Center</span></div>
<div class="ctl" id="aimRow">
  <button class="mine-btn" id="aimL" type="button" aria-label="Fine aim left">◀</button>
  <button id="viewBtn" type="button">Top view</button>
  <button class="mine-btn" id="aimR" type="button" aria-label="Fine aim right">▶</button>
</div>
<div class="ctl mine" id="power" aria-label="Power: drag down, release to shoot"><small>PULL<br>▼</small><div class="track"><div class="fill" id="powerFill"></div></div><b id="powerPct">0%</b></div>
<section class="arcade-menu" id="overlay" aria-label="Game menu"><div class="arcade-panel" id="panel" style="--menu-accent:#8fe9dc"></div></section>
<script src="../lib/three.min.js"></script>
<script>
"use strict";
const TAU = Math.PI * 2;
// ===================== PHYSICS (pure JS, no DOM) =====================
// Units: metres, seconds, radians. x runs along the table, z across it, y is up. Cloth surface is y = 0.
// Ball model: sliding friction turns slip into rolling (the 2/7 rule falls out of it), then rolling
// resistance; vertical-axis (side) spin decays on its own and changes cushion rebounds and ball-to-ball throw.
const BALL_R = 0.028575, GRAV = 9.81;
const MU_SLIDE = 0.2, MU_ROLL = 0.010, SPIN_DECEL = 10;
const E_BALL = 0.94, MU_BALL = 0.06, E_CUSH = 0.78, MU_CUSH = 0.18;
const CUSHION_W = 0.05, RAIL_W = 0.115;
const TABLES = {
  "7": { id: "7", name: "7 ft", sub: "Bar box · roomy pockets", L: 1.981, W: 0.991, corner: 0.124, side: 0.137, felt: "#11703f" },
  "8": { id: "8", name: "8 ft", sub: "Home table", L: 2.235, W: 1.118, corner: 0.119, side: 0.133, felt: "#17508f" },
  "9": { id: "9", name: "9 ft · Olympic", sub: "Pro tournament size · tight pockets", L: 2.54, W: 1.27, corner: 0.114, side: 0.127, felt: "#44308c" },
};

function buildTable(spec) {
  const hx = spec.L / 2, hz = spec.W / 2, B = CUSHION_W;
  const dC = spec.corner / Math.SQRT2, dS = spec.side / 2;
  const segs = [], cushions = [], pockets = [];
  const seg = (ax, az, bx, bz) => segs.push({ ax, az, bx, bz, dx: bx - ax, dz: bz - az, len2: (bx - ax) ** 2 + (bz - az) ** 2 });
  const c38 = Math.cos(38 * Math.PI / 180), s38 = Math.sin(38 * Math.PI / 180), t13 = Math.tan(13 * Math.PI / 180);
  // Corner pockets: capture point a little past the corner, on the pocket's axis.
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
    // A ball is gone once its centre is ~1 cm past the mouth; shots that clip a jaw knuckle still rattle out.
    const d = 0.012 / Math.SQRT2;
    pockets.push({ x: sx * hx + sx * d, z: sz * hz + sz * d, r: 0.052, vis: 0.066, corner: true, sx, sz });
  }
  for (const sz of [-1, 1]) pockets.push({ x: 0, z: sz * (hz + 0.03), r: 0.055, vis: 0.064, corner: false, sx: 0, sz });
  // Long rails: two halves per side. Corner jaws are cut at 142 degrees, side jaws at 103 degrees (throats narrow inward).
  for (const sz of [-1, 1]) for (const half of [-1, 1]) {
    const z = sz * hz, xc = half * (hx - dC), xs = half * dS;
    const jc = [xc + half * (B / s38) * c38, sz * (hz + B)];
    const js = [xs - half * B * t13, sz * (hz + B)];
    seg(xc, z, xs, z); seg(xc, z, jc[0], jc[1]); seg(xs, z, js[0], js[1]);
    cushions.push([jc, [xc, z], [xs, z], js]);
  }
  // Short rails.
  for (const sx of [-1, 1]) {
    const x = sx * hx, z1 = -(hz - dC), z2 = hz - dC;
    const j1 = [sx * (hx + B), z1 - (B / s38) * c38], j2 = [sx * (hx + B), z2 + (B / s38) * c38];
    seg(x, z1, x, z2); seg(x, z1, j1[0], j1[1]); seg(x, z2, j2[0], j2[1]);
    cushions.push([j1, [x, z1], [x, z2], j2]);
  }

// Where the computer puts the cue ball with ball in hand: behind an easy straight-in shot.
function placeCueBall(table, balls, game, shooter, levelId, kitchenOnly, rand = Math.random) {
  const cue = balls.find(b => b.id === 0), targets = legalTargets(game, balls, shooter);
  const spots = [];
  for (const id of targets) {
    const ob = balls.find(b => b.id === id);
    for (const pk of table.pockets) {
      let ux = pk.x - ob.x, uz = pk.z - ob.z; const d = Math.hypot(ux, uz); ux /= d; uz /= d;
      for (const back of [0.18, 0.3, 0.45]) for (const skew of [0, 0.25, -0.25]) {
        const ang = Math.atan2(uz, ux) + skew;
        const x = ob.x - Math.cos(ang) * (2 * BALL_R + back), z = ob.z - Math.sin(ang) * (2 * BALL_R + back);
        if (validCueSpot(table, balls, x, z, kitchenOnly)) spots.push({ x, z, score: d + back * 0.6 + Math.abs(skew) * (levelId === "hard" ? 0.1 : 0.6) + rand() * (levelId === "easy" ? 0.8 : 0.1) });
      }

  spots.sort((p, q) => p.score - q.score);

}

  if (Math.abs(x) > table.hx - BALL_R - 0.002 || Math.abs(z) > table.hz - BALL_R - 0.002) return false;
  if (kitchenOnly && x > table.headX) return false;
  return balls.every(b => b.id === 0 || !b.on || (b.x - x) ** 2 + (b.z - z) ** 2 > (2 * BALL_R + 0.002) ** 2);
}

  for (let r = 0; r < 1.5; r += 0.02) for (let k = 0; k < 16; k++) {
    const x = (kitchenOnly ? table.headX : 0) - r * Math.cos(k * Math.PI / 8) * (kitchenOnly ? 1 : 1), z = r * Math.sin(k * Math.PI / 8);
    if (validCueSpot(table, balls, x, z, kitchenOnly)) return { x, z };
  }
  return { x: table.headX, z: 0 };
}

  const e = balls.find(b => b.id === id);
  // On the foot spot, or the nearest free point behind it on the long string (then in front of it).
  for (const dir of [1, -1]) for (let x = table.footX; Math.abs(x) < table.hx - BALL_R; x += 0.002 * dir) {
    if (balls.every(b => b.id === id || !b.on || (b.x - x) ** 2 + b.z ** 2 > (2 * BALL_R + 0.001) ** 2)) { Object.assign(e, { x, z: 0, on: true, moving: false, vx: 0, vz: 0, wx: 0, wy: 0, wz: 0 }); return; }
  }
  Object.assign(e, { x: table.footX, z: 0, on: true });
}

function drawCuePic(cv, def) {

    [0.012, 0.92, 0.92, "#151515"], [0.09, 0.9, 0.86, def.body, "sleeve"], [0.17, 0.85, 0.8, def.wrap, "wrap"], [0.22, 0.79, 0.68, def.body, "forearm"],
    [0.016, 0.67, 0.67, "#d9dde8", "joint"], [0.45, 0.62, 0.42, def.shaft, "shaft"], [0.016, 0.4, 0.4, "#f3efe2"], [0.01, 0.39, 0.39, "#3c7bd6"],

      for (const s of [-1, 1]) { c.beginPath(); c.moveTo(x + len, mid + s * a * 0.15); c.lineTo(x + len * 0.25, mid + s * a * 0.08); c.lineTo(x + len, mid + s * a * 0.85); c.fill(); }

}

const raycaster = new THREE.Raycaster(), tablePlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -BALL_R);

  if (drag.moveBall) {
