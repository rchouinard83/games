<style>

  .proto { display: inline-block; background: #3a2a10; color: var(--gold); border: 1px solid #7a5a20; border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 800; margin-bottom: 4px; }

  #fsSheet .sheet { width: 100%; max-width: 420px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px 14px calc(14px + env(safe-area-inset-bottom)); text-align: left; }
  #fsSheet h3 { font-size: 19px; margin-bottom: 6px; } #fsSheet p { font-size: 14px; color: #dcdff7; line-height: 1.4; margin: 4px 0 8px; }
  #fsSheet ol { list-style: none; display: grid; gap: 8px; margin: 0 0 10px; } #fsSheet li { background: #0d1130; border-radius: 10px; padding: 8px 10px; font-size: 14px; line-height: 1.35; } #fsSheet li b { color: var(--accent); }
  @media (max-width: 520px), (max-height: 500px) and (pointer: coarse) {

<body>
<div id="app">
  <div id="hud">
    <div class="chip"><small id="hStage">Moon · Sumo</small><span id="hLevel">Level 1</span></div>
    <div class="chip"><small id="hTimeL">Shrinks in</small><span id="hTime">10 s</span></div>
    <div class="spacer"></div>
    <button class="hudBtn" id="fsBtn" aria-label="Full screen" aria-pressed="false"></button>
    <button class="hudBtn" id="helpBtn" aria-label="How to play">?</button>
    <button class="hudBtn" id="menuBtn">Pause</button>
  </div>
  <div id="stage"><canvas id="cv"></canvas></div>
</div>
<div id="overlay"><div id="box"></div></div>
<script>
"use strict";
// ============================================================
//  ALIEN BALL — a 'many games in one' collection. Every alien rolls around inside a bubble ball.
//  The hub lists the ball games (Sumo is built; more to come); each game has its own 4 stages x 8 levels and stars.
//  SUMO: CRATER RING. You and three computer aliens on a floating moon pad. One life: roll off and you're out.
//  Bumps build up WOBBLE: one bump only nudges you, but every hit makes you wobblier and the next one sends you further.
//  Get ganged up on or hit again and again and you go flying. Keep clear for a moment and the wobble settles.
//  Every knock-off (or every 15 s) the outer band of the pad crumbles away. At the final circle a 10 s countdown starts,
//  then the circle shrinks until one ball is left. World units: the pad starts as a circle of radius 210 around (0, 0).
// ============================================================
const $ = id => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d");
const TAU = Math.PI * 2, PI = Math.PI;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const AI_DASH = 0.035, RAM_PUSH = 0.4, RAM_FLING = 0.8; // how much a high-speed slam adds to knockback and to the flying-speed cap
// wobble: how much a bump adds (per unit of speed change), how much it scales knockback, and how fast it settles
const WOB_GAIN = 0.036, WOB_MIN = 60, WOB_DASH = 1.8, WOB_BASE = 0.3, WOB_SCALE = 1 / 70, WOB_REST = 1.0, WOB_DECAY = 15;
const RAMP_LEN = 110, RAMP_W = 62, RAMP_PULL = 560; // launch ramps: everyone starts at the top and rolls in
const R0 = 210, STEPS = [210, 158, 118, 88, 64], DROP_EVERY = 10, WARN = 1.6, FINAL_COUNT = 10, SHRINK_RATE = 4.5, DASH_CD = 2, BALL_R = 22;

const CHARS = (() => {
  function shade(hex, f) { const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255; const m = f < 0 ? 0 : 255, a = Math.abs(f);
    r = Math.round(r + (m - r) * a); g = Math.round(g + (m - g) * a); b = Math.round(b + (m - b) * a); return `rgb(${r},${g},${b})`; }
  const circle = (c, x, y, r) => { c.beginPath(); c.arc(x, y, r, 0, TAU); };
  const oval = (c, x, y, rx, ry, rot = 0) => { c.beginPath(); c.ellipse(x, y, rx, ry, rot, 0, TAU); };
  function shadow(c, s, y = 1.0, w = 0.9) { c.fillStyle = "rgba(0,0,0,0.35)"; oval(c, 0, s * y, s * w, s * 0.22); c.fill(); }
  function eye(c, x, y, r, pupil = "#10131f", lx = 0.25, ly = 0) {
    c.fillStyle = "#ffffff"; circle(c, x, y, r); c.fill();
    c.fillStyle = pupil; circle(c, x + r * lx, y + r * ly, r * 0.52); c.fill();
    c.fillStyle = "#ffffff"; circle(c, x + r * lx - r * 0.18, y + r * ly - r * 0.2, r * 0.16); c.fill();
  }
  const G = "#5dff9b", Y = "#ffe35d", P = "#ff8bd0", B = "#7ab8ff", O = "#ff8f5d", R = "#ff5d7a";
  const list = [
    { id: "blip", name: "Blip", color: G, fit: 1, desc: "One-eyed blob that bounces along, antennae bobbing.",
      draw(c, t, s, hit = 0) {
        const b = Math.sin(t * 8); c.translate(0, s * 0.1); c.scale(1 - 0.06 * b, 1 + 0.08 * b);
        c.fillStyle = shade(G, -0.4); oval(c, -s * 0.4, s * 0.75, s * 0.25, s * 0.13); c.fill(); oval(c, s * 0.4, s * 0.75, s * 0.25, s * 0.13); c.fill();
        c.strokeStyle = shade(G, -0.2); c.lineWidth = s * 0.08; c.lineCap = "round";
        for (const sd of [-1, 1]) { const tx = sd * s * (0.5 + 0.06 * Math.sin(t * 5 + sd));
          c.beginPath(); c.moveTo(sd * s * 0.25, -s * 0.7); c.quadraticCurveTo(sd * s * 0.35, -s * 1.05, tx, -s * 1.2); c.stroke();
          c.fillStyle = "#fff7a0"; circle(c, tx, -s * 1.2, s * 0.1); c.fill(); }
        c.fillStyle = G; c.beginPath(); c.moveTo(-s * 0.85, s * 0.7);
        c.bezierCurveTo(-s * 1.0, -s * 0.3, -s * 0.5, -s * 0.85, 0, -s * 0.85); c.bezierCurveTo(s * 0.5, -s * 0.85, s * 1.0, -s * 0.3, s * 0.85, s * 0.7); c.closePath(); c.fill();
        c.fillStyle = shade(G, 0.4); oval(c, -s * 0.4, -s * 0.38, s * 0.18, s * 0.09, -0.6); c.fill();
        if (hit > 0.15 || Math.sin(t * 1.3) > 0.97) { c.strokeStyle = "#10261a"; c.lineWidth = s * 0.07; c.beginPath(); c.moveTo(-s * 0.3, -s * 0.15); c.lineTo(s * 0.3, -s * 0.15); c.stroke(); }
        else eye(c, 0, -s * 0.15, s * 0.36, "#10261a", 0.25, 0.05);
        c.strokeStyle = "#10261a"; c.lineWidth = s * 0.06; c.beginPath(); c.arc(0, s * 0.3, s * 0.15, 0.2, Math.PI - 0.2); c.stroke();
      } },
    { id: "runner", name: "Runner", color: Y, fit: 1, desc: "Skinny legs, wobbly eye stalks, always in a hurry.",
      draw(c, t, s) {
        c.translate(0, -s * 0.1);
        c.strokeStyle = "rgba(255,227,93,0.35)"; c.lineWidth = s * 0.07; c.lineCap = "round";
        for (let k = 0; k < 3; k++) { const y = -s * 0.3 + k * s * 0.3; c.beginPath(); c.moveTo(-s * 0.7, y); c.lineTo(-s * (1.05 + 0.2 * Math.sin(t * 20 + k)), y); c.stroke(); }
        c.strokeStyle = shade(Y, -0.4); c.lineWidth = s * 0.12;
        for (const ph of [0, Math.PI]) { const a = t * 16 + ph, fx = Math.sin(a) * s * 0.5, fy = s * 1.0 - Math.max(0, Math.cos(a)) * s * 0.3;
          c.beginPath(); c.moveTo(0, s * 0.3); c.lineTo(fx * 0.5 + s * 0.1, s * 0.65); c.lineTo(fx, fy); c.stroke(); }
        c.fillStyle = Y; oval(c, s * 0.05, 0, s * 0.55, s * 0.48, 0.15); c.fill();
        c.fillStyle = shade(Y, 0.45); oval(c, -s * 0.15, -s * 0.2, s * 0.15, s * 0.08, -0.5); c.fill();
        c.strokeStyle = shade(Y, -0.2); c.lineWidth = s * 0.08;
        for (const [ex, ey, ph] of [[s * 0.1, -s * 0.95, 0], [s * 0.5, -s * 0.85, 1.5]]) { const w = Math.sin(t * 6 + ph) * s * 0.06;
          c.beginPath(); c.moveTo(s * 0.15, -s * 0.35); c.quadraticCurveTo(ex - s * 0.1, ey + s * 0.3, ex + w, ey); c.stroke();
          eye(c, ex + w, ey, s * 0.17, "#2a1a00", 0.4, 0.1); }
        c.strokeStyle = "#2a1a00"; c.lineWidth = s * 0.05; c.beginPath(); c.arc(s * 0.3, s * 0.1, s * 0.1, 0.2, Math.PI - 0.4); c.stroke();
      } },
    { id: "goo", name: "Goo", color: P, fit: 1.15, desc: "Little wobbling slime drop. Squishy and bouncy.",
      draw(c, t, s) {
        const w = Math.sin(t * 10); c.scale(1 + 0.1 * w, 1 - 0.1 * w);
        c.fillStyle = P; c.beginPath(); c.moveTo(0, -s * 1.0);
        c.bezierCurveTo(s * 0.5, -s * 0.4, s * 0.9, s * 0.1, s * 0.75, s * 0.55); c.quadraticCurveTo(0, s * 0.85, -s * 0.75, s * 0.55);
        c.bezierCurveTo(-s * 0.9, s * 0.1, -s * 0.5, -s * 0.4, 0, -s * 1.0); c.fill();
        c.fillStyle = shade(P, 0.45); oval(c, -s * 0.25, -s * 0.25, s * 0.12, s * 0.22, 0.4); c.fill();
        c.fillStyle = "#3a0a22"; circle(c, -s * 0.2, s * 0.15, s * 0.11); c.fill(); circle(c, s * 0.25, s * 0.15, s * 0.11); c.fill();
      } },
    { id: "jelly", name: "Jelly", color: B, fit: 1, desc: "Floating jellyfish that drifts along, tentacles waving.",
      draw(c, t, s, hit = 0) {
        shadow(c, s, 1.0, 0.7); c.translate(0, Math.sin(t * 2.5) * s * 0.12 - s * 0.25);
        c.strokeStyle = shade(B, 0.2); c.lineWidth = s * 0.08; c.lineCap = "round";
        for (let k = 0; k < 5; k++) { const x = -s * 0.5 + k * s * 0.25; c.beginPath(); c.moveTo(x, s * 0.1);
          c.quadraticCurveTo(x + Math.sin(t * 4 + k) * s * 0.2, s * (0.6 - hit * 0.27), x * (1 - hit * 0.4) + Math.sin(t * 4 + k + 1) * s * 0.15, s * (1 - hit * 0.57)); c.stroke(); }
        const pul = 1 + 0.06 * Math.sin(t * 5);
        const g = c.createRadialGradient(-s * 0.2, -s * 0.4, s * 0.1, 0, -s * 0.1, s * 0.8); g.addColorStop(0, shade(B, 0.55)); g.addColorStop(1, shade(B, -0.1));
        c.fillStyle = g; c.beginPath(); c.ellipse(0, 0, s * 0.75 * pul, s * 0.7 / pul, 0, Math.PI, TAU);
        c.quadraticCurveTo(s * 0.4, s * 0.25, 0, s * 0.12); c.quadraticCurveTo(-s * 0.4, s * 0.25, -s * 0.75 * pul, 0); c.fill();
        c.fillStyle = "#0d1830"; circle(c, -s * 0.2, -s * 0.25, s * 0.09); c.fill(); circle(c, s * 0.2, -s * 0.25, s * 0.09); c.fill();
      } },
    { id: "chonk", name: "Chonk", color: O, fit: 0.95, desc: "Big round three-eyed bruiser. Built like a bowling ball.",
      draw(c, t, s, hit = 0) {
        c.translate(0, -Math.abs(Math.sin(t * 3)) * s * 0.12 + s * 0.05);
        c.fillStyle = shade(O, -0.3);
        for (const sd of [-1, 1]) { oval(c, sd * s * 0.95, s * 0.05 + Math.sin(t * 3 + sd) * s * 0.08, s * 0.18, s * 0.28, sd * 0.4); c.fill(); }
        oval(c, -s * 0.45, s * 0.82, s * 0.28, s * 0.14); c.fill(); oval(c, s * 0.45, s * 0.82, s * 0.28, s * 0.14); c.fill();
        const g = c.createRadialGradient(-s * 0.3, -s * 0.4, s * 0.1, 0, 0, s); g.addColorStop(0, shade(O, 0.35)); g.addColorStop(1, shade(O, -0.15));
        c.fillStyle = g; oval(c, 0, 0, s * 0.92, s * 0.85); c.fill();

    <div class="levels">${Array.from({ length: LEVELS }, (_, i) => `<button class="big ${levelOpen(s, i) && !stars()[s][i] ? "main" : ""}" data-act="setup" data-arg="${s}|${i}" ${levelOpen(s, i) ? "" : "disabled"}>${levelOpen(s, i) ? i + 1 : "🔒"}<small>${starStrS(stars()[s][i])}</small></button>`).join("")}</div>
    <button class="big" data-act="game">◀ ${name} stages</button>`, null, "stage");
}
function setupMenu(s, l) {
  const glide = cur === "glide", st = stagesOf(cur)[s], ch = CHARS.byId(SAVE.char);
  const perk = STATS[ch.id];
  openMenu(`<p class="kicker">${glide ? "Glide" : "Sumo"} · Level setup</p><h2>${st.short} · Level ${l + 1}</h2>
    <button class="big" data-act="chars" data-arg="${s}|${l}">Alien: <b>${ch.name}</b><small>Change alien ›</small></button>
    <p class="powerDesc">${glide ? "All aliens use the same glider handling." : `<b>${perk.name}</b> · ${perk.text}`}</p>
    <button class="big main" data-act="play" data-arg="${s}|${l}">Play ▶</button>
    <button class="big" data-act="stage" data-arg="${s}">Back to levels</button>`, null, "setup");
}
function charMenu(s, l) {
  const glide = cur === "glide", P = STATS[SAVE.char];
  openMenu(`<p class="kicker">Choose your alien</p><h2>Who's rolling?</h2>
    <p>${glide ? "Pick who flies. All aliens use the same glider handling." : "Every ball handles differently. Heavy balls push, light balls fly."}</p>
    <div class="chars">${CHARS.list.map(ch => `<button class="charBtn ${ch.id === SAVE.char ? "on" : ""}" aria-pressed="${ch.id === SAVE.char}" data-act="pick" data-arg="${s}|${l}|${ch.id}"><canvas data-char="${ch.id}"></canvas>${ch.name}${glide ? "" : `<small>${STATS[ch.id].name}</small>`}</button>`).join("")}</div>
    ${glide ? "" : `<p class="powerDesc"><b>${P.name}:</b> ${P.text}</p>`}
    <button class="big main" data-act="setup" data-arg="${s}|${l}">Done</button>`,
    tt => { for (const cvs of $("box").querySelectorAll("canvas[data-char]")) { const [c, w, h] = fitCanvas(cvs); c.clearRect(0, 0, w, h); const id = cvs.dataset.char, on = id === SAVE.char;
      drawBall(c, { id, x: w / 2, y: h * 0.52 - (on ? Math.abs(Math.sin(tt * 5)) * 5 : 0), r: w * 0.3 * (STATS[id].size ? 1.12 : 1), roll: tt * (on ? 4 : 1), face: 1, falling: 0, respawn: 0, ghost: 0, hover: 0, st: STATS[id], me: false }, tt + w); } }, "chars");
}
function resultMenu() {
  const place = order.indexOf(me()) + 1, got = place === 1 ? 3 : place === 2 ? 2 : place === 3 ? 1 : 0;
  if (got > stars()[si][li]) stars()[si][li] = got; save();
  const name = ["1st", "2nd", "3rd", "4th"], next = !got ? null : li + 1 < LEVELS ? [si, li + 1] : si + 1 < SUMO.length && stageOpen(si + 1) ? [si + 1, 0] : null;
  openMenu(`<p class="kicker">Sumo · ${SS.short} · Level ${li + 1}</p><h2>${place === 1 ? "You win!" : place === 4 ? "Knocked out!" : `You came ${name[place - 1]}`}</h2>
    <div class="bigStars">${starStr(got)}</div>
    <div class="podium">${order.map((b, i) => `<div class="${b.me ? "me" : ""}"><b>${name[i]}</b><span>${b.me ? "You (" + CHARS.byId(b.id).name + ")" : CHARS.byId(b.id).name}</span><small>${b.out ? "fell off" : "last one rolling"} · 💥${b.kos}</small></div>`).join("")}</div>
    <p>${got === 3 ? "Last ball rolling!" : got ? "Win the match for three stars." : "Finish in the top three to earn a star and open the next level."} Tip: wobble them first, then <b>DASH</b> them off.</p>
    ${next ? `<button class="big main" data-act="play" data-arg="${next[0]}|${next[1]}">${next[0] !== si ? `Next stage: ${SUMO[next[0]].short} ▶` : `Level ${next[1] + 1} ▶`}</button>` : ""}
    <button class="big ${next ? "" : "main"}" data-act="play" data-arg="${si}|${li}">Rematch</button>
    <button class="big" data-act="stage" data-arg="${si}">All levels</button>`, null, "result");
}
function pauseMenu() {
  openMenu(`<p class="kicker">Paused</p><h2>${cur === "glide" ? `Glide · ${GS.short}` : `Sumo · ${SS.short}`} · Level ${li + 1}</h2>
    <button class="big main" data-act="resume">Resume ▶</button>
    <button class="big" data-act="play" data-arg="${si}|${li}">Restart</button>
    <button class="big" data-act="help" data-arg="game|0">How to play</button>
    <button class="big" data-act="stage" data-arg="${si}">All levels</button>
    ${cur === "glide" ? invBtn() : ""}
    ${soundBtn()}
    <button class="big" data-act="title">Alien Ball games</button>`, null, "pause");
}
const HOWTO = [
  { title: "Roll", lines: ["Everyone starts on a <b class='o'>launch ramp</b> and rolls in fast, then the ramps fold away", "<b>Drag</b> anywhere: a thumb stick appears and your ball rolls that way", "Balls have <b>momentum</b>. Keys: <b>arrows/WASD</b> to roll, <b>space</b> to dash"], demo: demoRoll },
  { title: "Dash and wobble", lines: ["On touch, <b class='o'>tap, then quickly touch and drag</b> in the direction you want to dash. You can also use the DASH button", "Every bump adds <b class='y'>wobble</b>: the wobblier a ball, the further it flies", "Hit them again and again, or gang up, then shove them off. Keep clear to calm down"], demo: demoDash },
  { title: "One life, falling pad", lines: ["<b class='r'>One life</b>: roll off and you're out", "Every knock-off (or 10 s) the pad's <b class='o'>outer edge</b> flashes red and crumbles", "Then the <b class='y'>final circle</b>: a 10 s countdown, then it shrinks"], demo: demoFall },
  { title: "Winning", lines: ["Last ball rolling wins: get off the red edge fast!", "1st = <b class='y'>★★★</b> · 2nd = <b class='y'>★★</b> · 3rd = <b class='y'>★</b> (top 3 opens the next level)", "<b class='c'>Comet</b> ice · <b class='o'>Lava</b> tilting pad · <b class='g'>Earth</b> wind and bumpers"], demo: demoWin },
];
function helpMenu(back, page = 0) {
  const H = cur === "glide" ? GHOWTO : HOWTO, pg = H[page], lastPage = page === H.length - 1, done = back === "game" ? "resume" : back === "gm" ? "game" : "title";
  openMenu(`<p class="kicker">How to play ${cur === "glide" ? "Glide" : "Sumo"} · ${page + 1} of ${H.length}</p><h2>${pg.title}</h2>
    <canvas id="howCv"></canvas><ul class="how">${pg.lines.map(l => `<li>${l}</li>`).join("")}</ul>
    <div class="dots">${H.map((_, k) => `<i class="${k === page ? "on" : ""}"></i>`).join("")}</div>
    <div class="row">${page ? `<button class="big" data-act="help" data-arg="${back}|${page - 1}">◀ Back</button>` : `<button class="big" data-act="${done}">Close</button>`}
      ${lastPage ? `<button class="big main" data-act="${done}">Done</button>` : `<button class="big main" data-act="help" data-arg="${back}|${page + 1}">Next ▶</button>`}</div>`,
    tt => { const cvs = $("howCv"); if (!cvs) return; const [c, w, h] = fitCanvas(cvs); pg.demo(c, tt, w, h); }, "help");
}
function finger(c, x, y, down) { c.fillStyle = down ? "rgba(93,255,155,0.35)" : "rgba(255,255,255,0.22)"; c.beginPath(); c.arc(x, y, 15, 0, TAU); c.fill(); c.fillStyle = down ? "#5dff9b" : "#fff"; c.beginPath(); c.arc(x, y, 6, 0, TAU); c.fill(); }
function demoRoll(c, tt, w, h) { const a = tt * 1.3; miniScene(c, w, h, tt, R => [{ id: SAVE.char, x: Math.cos(a) * R * 0.5, y: Math.sin(a) * R * 0.5, me: true, face: -Math.sin(a) > 0 ? 1 : -1 }]);
  const fx0 = w * 0.82, fy0 = h * 0.72; c.strokeStyle = "rgba(255,255,255,0.4)"; c.lineWidth = 2; c.beginPath(); c.arc(fx0, fy0, 22, 0, TAU); c.stroke(); finger(c, fx0 - Math.sin(a) * 18, fy0 + Math.cos(a) * 18 * 0.5, true); }
function demoDash(c, tt, w, h) { const T = tt % 2.6; miniScene(c, w, h, tt, R => { const hit = T > 0.9, rx = hit ? R * 0.45 + (T - 0.9) * 150 : R * 0.45;
  return [{ id: "runner", x: Math.min(rx, R + 40), y: 0, fall: rx > R ? Math.min(0.69, (rx - R) / 100) : 0 }, { id: SAVE.char, x: hit ? R * 0.05 + (T - 0.9) * 20 : -R * 0.5 + T * (R * 0.55 / 0.9), y: 0, me: true }]; });
  c.fillStyle = T > 0.5 && T < 0.9 ? "#ff9a3c" : "rgba(255,154,60,0.5)"; c.beginPath(); c.arc(w - 34, h - 30, 22, 0, TAU); c.fill(); c.fillStyle = "#fff"; c.font = "900 10px system-ui"; c.textAlign = "center"; c.fillText("DASH", w - 34, h - 26); if (T > 0.5 && T < 0.9) finger(c, w - 34, h - 30, true); }
function demoFall(c, tt, w, h) { const T = tt % 3; miniScene(c, w, h, tt, R => [{ id: SAVE.char, x: T < 1.5 ? -R * 0.3 - T * R * 0.6 : 0, y: T < 1.5 ? 0 : 0, fall: T > 1 && T < 1.5 ? (T - 1) * 1.3 : 0, me: true }]);
  if (T > 1.4) { c.font = "900 20px system-ui"; c.textAlign = "left"; c.fillStyle = "#ff5d7a"; c.fillText("OUT!", 12, 26); } }
function demoWin(c, tt, w, h) { miniScene(c, w, h, tt, R => [{ id: SAVE.char, x: 0, y: -Math.abs(Math.sin(tt * 4)) * 30, me: true }]); c.fillStyle = "#ffd25d"; c.font = "900 26px system-ui"; c.textAlign = "center"; c.fillText("★★★", w / 2, 30); }

const ACT = {
  title: () => titleMenu(),
  setup: a => setupMenu(...a.split("|").map(Number)),
  chars: a => charMenu(...a.split("|").map(Number)),
  pick: a => {
    const [s, l, id] = a.split("|");
    SAVE.char = id;
    save();
    charMenu(+s, +l);
  },
  game: a => gameMenu(a !== undefined ? GAMES[+a].id : cur),
  gnext: () => { glideRound(); closeMenu(); },
  ginv: () => { SAVE.ginv = !SAVE.ginv; save(); if (menuName === "pause") pauseMenu(); else gameMenu("glide"); },
  soon: i => { const b = $("box").querySelector(`[data-arg="${i}"] small`); if (b) b.innerHTML = "We haven't built this one yet: coming soon!"; tone(300, 0.1, "triangle", 0.05); },
  stage: s => stageMenu(+s),
  play: a => { const [s, l] = (a || `${si}|${li}`).split("|").map(Number); if (cur === "glide") glideStart(s, l); else newMatch(s, l); closeMenu(); },
  resume: () => closeMenu(),
  help: a => { const [back, page] = a.split("|"); helpMenu(back, +page || 0); },
  sound: () => { SAVE.sound = !SAVE.sound; save(); if (!SAVE.sound && keepAlive) keepAlive.pause(); else audio();
    for (const b of $("box").querySelectorAll("[data-act='sound']")) b.textContent = SAVE.sound ? "🔊 Sound: On" : "🔇 Sound: Off"; tone(520, 0.1, "triangle", 0.07); },
};
$("menuBtn").onclick = () => { audio(); if (!paused && isLive()) pauseMenu(); else if (paused && menuName === "pause") closeMenu(); else titleMenu(); };
$("helpBtn").onclick = () => { audio(); helpMenu(!paused && isLive() ? "game" : "title", 0); };

// ---------- full screen (like Dr Alien). iPhones can't, so there the button explains Add to Home Screen. ----------
(() => {
  const btn = $("fsBtn"), root = document.documentElement, req = root.requestFullscreen || root.webkitRequestFullscreen;
  const can = !!(req && (document.fullscreenEnabled || document.webkitFullscreenEnabled));
  const ICON = on => `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="${on ? "M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5" : "M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"}"/></svg>`;
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  if (!can) {
    if (standalone) { btn.hidden = true; return; }
    btn.innerHTML = ICON(false);
    btn.onclick = () => {
      const chrome = /CriOS/.test(navigator.userAgent), other = /FxiOS|EdgiOS|OPiOS/.test(navigator.userAgent), el = document.createElement("div"); el.id = "fsSheet";
      el.innerHTML = `<div class="sheet"><h3>Full screen on iPhone</h3><p>Apple doesn't let iPhone browsers fill the screen with a web page. This works:</p><ol>
        ${other ? `<li>Open this page in <b>Safari</b>, tap <b>Share</b> (□↑), then <b>Add to Home Screen</b>.</li>` : `<li>Tap <b>Share</b> (□↑)${chrome ? " at the right of the address bar" : ""}, then <b>Add to Home Screen</b>.</li>`}
        <li>Open <b>Alien Ball</b> from its new icon: it fills the whole screen like an app.</li>
        ${!chrome && !other ? `<li>Quick option: tap <b>aA</b> in the address bar, then <b>Hide Toolbar</b>.</li>` : ""}</ol>
        <button class="big main" type="button">Got it</button></div>`;
      el.addEventListener("click", e => { if (e.target === el || e.target.tagName === "BUTTON") el.remove(); }); document.body.appendChild(el);
    };
    return;
  }
  const isFull = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
  const sync = () => { const on = isFull(); btn.innerHTML = ICON(on); btn.setAttribute("aria-label", on ? "Exit full screen" : "Full screen"); btn.setAttribute("aria-pressed", String(on)); setTimeout(resize, 120); };
  btn.onclick = () => { audio(); const r = isFull() ? (document.exitFullscreen || document.webkitExitFullscreen).call(document) : req.call(root); if (r && r.catch) r.catch(() => {}); };
  document.addEventListener("fullscreenchange", sync); document.addEventListener("webkitfullscreenchange", sync); sync();
})();

// ============================================================
//  MAIN LOOP: fixed 1/60 s steps
// ============================================================
let last = performance.now(), acc = 0;
function frame(now) {
  const dt = clamp((now - last) / 1000, 0, 0.1);
  last = now;
  // Keep the same physics step and give Glide less real time between steps in flight.
  acc += dt * (cur === "glide" && !paused && gl.state === "fly" ? G_PLAYBACK_RATE : 1);
  let n = 0;
  while (acc >= 1 / 60 && n < 6) { update(1 / 60); acc -= 1 / 60; n++; }
  if (n === 6) acc = 0;
  if (menuAnim) menuAnim(now / 1000);
  draw(now / 1000);
  requestAnimationFrame(frame);
}
resize();
newMatch(); banner = null;
titleMenu();
requestAnimationFrame(frame);
</script>
</body>
