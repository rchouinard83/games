<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090c24">
<title>Alien Starhop</title>
<style>
.arcade-menu {
  position: fixed;
  inset: 0;
  z-index: 5;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right))
    max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
  background: rgba(5, 5, 16, .78);
}
#panel.arcade-panel {
  box-sizing: border-box;
  width: min(100%, 430px);
  max-height: 100%;
  overflow: auto;
  overscroll-behavior: contain;
  touch-action: pan-y;
  padding: 16px;
  border: 1px solid #33336e;
  border-radius: 18px;
  background: #141436;
  color: #eef0ff;
  text-align: center;
  box-shadow: 0 0 40px #7070ca26;
}
#panel.arcade-panel h1 {
  margin: 8px 0 5px;
  font-size: clamp(32px, 9vw, 46px);
  letter-spacing: -.04em;
  line-height: 1.04;
  background: linear-gradient(90deg, #ff8bd0, #ffd25d 40%, #5dff9b 70%, #4fd1ff);
  background-clip: text;
  -webkit-background-clip: text;
  color: transparent;
}
#panel.arcade-panel h2 { margin: 4px 0 6px; font-size: 26px; line-height: 1.14; }
#panel.arcade-panel p { margin: 6px 0 10px; color: #dcdff7; font-size: 15px; line-height: 1.4; }
#panel.arcade-panel .kicker,
#panel.arcade-panel .eyebrow,
#panel.arcade-panel .step {
  margin: 6px 0 4px;
  color: var(--menu-accent, #8fe9dc);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: .13em;
  text-transform: uppercase;
}
#panel.arcade-panel :is(button, a.arcade, a.button) {
  display: flex;
  width: 100%;
  min-height: 48px;
  align-items: center;
  justify-content: center;
  box-sizing: border-box;
  padding: 10px 11px;
  border: 1px solid #33336e;
  border-radius: 12px;
  background: #22225a;
  color: #eef0ff;
  font: 800 16px/1.2 system-ui, sans-serif;
  text-align: center;
  text-decoration: none;
  white-space: normal;
}
#panel.arcade-panel :is(button, a):focus-visible { outline: 2px solid #a7f5e5; outline-offset: 2px; }
#panel.arcade-panel button.primary { background: #1d4a3a; border-color: #2f7a5c; color: #82f7b2; }
#panel.arcade-panel button:disabled { opacity: .44; }
#panel.arcade-panel button small {
  display: block;
  margin: 3px 0 0;
  color: #aeb4dd;
  font: 700 12px/1.25 system-ui, sans-serif;
  text-transform: none;
  letter-spacing: 0;
}
#panel.arcade-panel > :is(button, a) { margin: 8px 0 0; }
#panel.arcade-panel :is(.actions, .choices, .menu-actions, .stage-list, .worlds, .balls) { gap: 8px; margin: 8px 0; }
#panel.arcade-panel :is(.actions, .choices, .menu-actions, .stage-list, .worlds) {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
}
#panel.arcade-panel :is(.choices, .stage-list) button:not(.arcade-stage) { display: block; }
#panel.arcade-panel :is(.choices, .stage-list, .worlds).arcade-stages { grid-template-columns: 1fr; }
#panel.arcade-panel button.arcade-stage {
  justify-content: flex-start;
  gap: 12px;
  text-align: left;
}
.arcade-stage > span:last-child { min-width: 0; }
.arcade-planet {
  --planet: #90e4ff;
  --shade: #23436e;
  position: relative;
  display: grid;
  place-items: center;
  width: 50px;
  height: 50px;
  flex: 0 0 50px;
  border-radius: 10px;
  background: radial-gradient(circle at 15% 16%, #acb6dc 0 1px, transparent 2px),
    radial-gradient(circle at 85% 72%, #acb6dc 0 1px, transparent 2px), #0d1331;
}
.arcade-planet::after {
  content: "";
  width: 29px;
  height: 29px;
  border-radius: 50%;
  background: radial-gradient(circle at 29% 27%, #ffffffaa, transparent 42%),
    repeating-linear-gradient(-22deg, transparent 0 4px, #15264a35 5px 7px),
    radial-gradient(circle at 32% 34%, var(--planet), var(--shade) 76%);
  box-shadow: 0 0 8px var(--shade);
}
.arcade-planet[data-world="1"] { --planet: #f6cc9d; --shade: #874265; }
.arcade-planet[data-world="2"] { --planet: #ff9276; --shade: #70283d; }
.arcade-planet[data-world="3"] { --planet: #92efb3; --shade: #2552a0; }
.arcade-hero {
  display: block;
  width: 100%;
  height: clamp(75px, 22dvh, 145px);
  border-radius: 12px;
  background: radial-gradient(ellipse at 50% 80%, #272759, #0b1231 70%);
}
#panel.arcade-panel button.arcade-choice { justify-content: space-between; text-align: left; }
#panel.arcade-panel button.arcade-choice > span:last-child { color: #94f0c4; font-size: 13px; }
#panel.arcade-panel .balls button { justify-content: flex-start; text-align: left; }
#panel.arcade-panel .balls button.on { background: #193d37; border-color: #589d80; }
#panel.arcade-panel .stars { color: #ffd25d; }

#panel.arcade-panel .arcade-footer {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
#panel.arcade-panel .arcade-footer > * {
  width: auto;
  flex: 1 1 135px;
  margin: 0;
}

/* The phone menu has its own backdrop and keeps its actions outside scrolling lists. */
@media (max-width: 520px), (max-height: 500px) and (pointer: coarse) {
  .arcade-menu {
    box-sizing: border-box;
    bottom: auto;
    height: 100vh;
    height: 100dvh;
    padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right))
      max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
    background: radial-gradient(ellipse at 50% 18%, #20214a, #090c24 74%);
    -webkit-text-size-adjust: 100%;
  }
  #panel.arcade-panel { padding: clamp(12px, 4vw, 16px); }
  #panel.arcade-panel .arcade-hero { height: clamp(72px, 19dvh, 122px); }
  #panel.arcade-panel h1 { font-size: clamp(29px, 8vw, 39px); }
  #panel.arcade-panel h2 { font-size: clamp(23px, 6vw, 26px); }
  #panel.arcade-panel p { font-size: 14px; }
  #panel.arcade-panel :is(button, a.arcade, a.button) { font-size: 15px; }
  #panel.arcade-panel:has(> :is(.balls, .arcade-stages)) {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #panel.arcade-panel:has(> :is(.balls, .arcade-stages)) > :not(.balls, .arcade-stages) {
    flex: 0 0 auto;
  }
  #panel.arcade-panel > :is(.balls, .arcade-stages) {
    grid-auto-rows: max-content;
    align-content: start;
    min-height: 0;
    overflow-y: auto;
    overscroll-behavior: contain;
    padding: 2px;
    -webkit-overflow-scrolling: touch;
  }
  #panel.arcade-panel .balls i { width: 32px; height: 32px; }
}
@media (max-height: 500px) and (pointer: coarse) {
  #panel.arcade-panel { width: min(100%, 580px); padding: 12px; }
  #panel.arcade-panel:has(> .arcade-hero) {
    display: grid;
    grid-template-columns: minmax(105px, .42fr) minmax(0, 1fr);
    align-items: center;
    column-gap: 14px;
  }
  #panel.arcade-panel > .arcade-hero {
    grid-row: 1 / 7;
    height: clamp(92px, 37dvh, 155px);
  }
  #panel.arcade-panel:has(> .arcade-hero) > :not(.arcade-hero) { grid-column: 2; }
  #panel.arcade-panel h1 { font-size: clamp(26px, 6dvh + 12px, 36px); }
  #panel.arcade-panel p { margin: 4px 0 7px; }
  #panel.arcade-panel > :is(button, a) { margin-top: 6px; }
  #panel.arcade-panel :is(.actions, .choices, .menu-actions) { margin: 6px 0; }
  #panel.arcade-panel :is(.balls, .arcade-stages) { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  #panel.arcade-panel button.arcade-stage { gap: 9px; padding: 7px 10px; }
  #panel.arcade-panel .arcade-planet { width: 40px; height: 40px; flex-basis: 40px; }
  #panel.arcade-panel .arcade-planet::after { width: 25px; height: 25px; }
  #panel.arcade-panel :is(.guide svg, #howCv) { height: min(85px, 25dvh); }
}

/* ---- Alien Starhop ---- */
.arcade-menu[hidden] { display: none; }
:root { --ink: #eef0ff; --dim: #aeb4dd; --line: #2c3758; --box: #10163af0; --good: #5dff9b; }
html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: #070915; color: var(--ink); font-family: system-ui, sans-serif;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none; }
#game { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; }
.hud { position: fixed; z-index: 2; top: max(6px, env(safe-area-inset-top)); left: max(6px, env(safe-area-inset-left)); right: max(6px, env(safe-area-inset-right));
  display: flex; gap: 6px; align-items: stretch; pointer-events: none; }
.hud[hidden] { display: none; }
.hud > * { background: var(--box); border: 1px solid var(--line); border-radius: 10px; padding: 4px 9px; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
.hud small { display: block; color: var(--dim); font-size: 10px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; white-space: nowrap; }
.hud strong { display: block; font-size: 16px; white-space: nowrap; }
.hud .who { flex-direction: row; align-items: center; gap: 6px; }
.hud .who canvas { width: 32px; height: 32px; }
.hud #hudShards { color: #ffd25d; letter-spacing: .06em; }
.hud #hudShards i { font-style: normal; color: #444b7a; }
.hud #hudHearts { color: #ff6d86; letter-spacing: .04em; }
.hud #hudHearts i { font-style: normal; color: #3c2534; }
.hud #hudBuddy.got { color: var(--good); }
.hud .grow { flex: 1; visibility: hidden; padding: 0; border: 0; background: none; }
.hud #best { color: #ffd25d; }
.hud button { pointer-events: auto; padding: 0 14px; border-radius: 10px; background: #161c35; border: 1px solid var(--line); color: var(--ink); font: 800 14px system-ui, sans-serif; cursor: pointer; }
@media (max-width: 640px) { .hud .timeBox, .hud .bestBox { display: none; } .hud strong { font-size: 14px; } .hud > * { padding: 3px 7px; } }
#sign { position: fixed; z-index: 2; left: 50%; top: calc(max(6px, env(safe-area-inset-top)) + 60px); transform: translateX(-50%); max-width: min(92vw, 560px); padding: 9px 14px;
  border-radius: 12px; background: #0d1230f0; border: 1px solid #8fe9dc; color: #e6fbff; font: 700 15px/1.35 system-ui, sans-serif; text-align: center; pointer-events: none; opacity: 0; transition: opacity .2s; }
#sign.show { opacity: 1; }
#banner { position: fixed; z-index: 2; left: 50%; top: 36%; transform: translate(-50%, -50%); font: 900 clamp(26px, 6vw, 48px) system-ui, sans-serif; letter-spacing: .02em; text-align: center;
  color: #fff; text-shadow: 0 3px 0 #0008, 0 0 24px #ffd25d88; pointer-events: none; opacity: 0; transition: opacity .3s; white-space: nowrap; }
#banner.show { opacity: 1; }
#banner small { display: block; font-size: .42em; color: #ffe9a8; letter-spacing: .1em; text-transform: uppercase; }
/* touch controls */
.pad { position: fixed; z-index: 2; bottom: max(10px, env(safe-area-inset-bottom)); display: none; gap: 10px; align-items: flex-end; }
body.touch.playing .pad { display: flex; }
.pad.left { left: max(10px, env(safe-area-inset-left)); }
.pad.right { right: max(10px, env(safe-area-inset-right)); }
.pad button { width: 70px; height: 70px; border-radius: 50%; border: 2px solid #ffffff33; background: #ffffff1c; color: #fff; font: 900 22px system-ui, sans-serif; touch-action: none; backdrop-filter: blur(2px); }
.pad button.on { background: #ffffff44; border-color: #ffffff88; }
.pad .stack { display: flex; flex-direction: column; gap: 8px; align-items: center; }
.pad #bLeft, .pad #bRight { width: 84px; height: 84px; font-size: 28px; }
.pad #bDown { width: 62px; height: 62px; background: #ff8f5d2b; border-color: #ff8f5d88; font-size: 13px; }
.pad #bJump { width: 86px; height: 86px; background: #5dff9b33; border-color: #5dff9b88; font-size: 15px; }
.pad #bDash { width: 66px; height: 66px; background: #4fd1ff2b; border-color: #4fd1ff88; font-size: 13px; }
@media (max-height: 420px) { .pad button { width: 60px; height: 60px; } .pad #bLeft, .pad #bRight { width: 74px; height: 74px; } .pad #bJump { width: 74px; height: 74px; } .pad #bDown, .pad #bDash { width: 56px; height: 56px; font-size: 12px; } }
@media (max-width: 420px) { .pad { gap: 6px; } .pad #bLeft, .pad #bRight { width: 72px; height: 72px; } .pad #bDown, .pad #bDash { width: 54px; height: 54px; font-size: 11px; } .pad #bJump { width: 72px; height: 72px; } }
/* menus */
#panel.arcade-panel .chars { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 8px 0; }
#panel.arcade-panel button.charBtn { display: block; min-height: 0; padding: 6px 4px 8px; background: #0b1430; border: 2px solid #2f4274; border-radius: 14px; }
#panel.arcade-panel button.charBtn[aria-pressed="true"] { border-color: var(--good); background: #10301f; }
#panel.arcade-panel button.charBtn canvas { width: min(100%, 70px); aspect-ratio: 1; display: block; margin: 0 auto; }
#panel.arcade-panel button.charBtn small { color: #7ff0b0; display: block; }
#panel.arcade-panel .arcade-stages { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin: 8px 0; }
#panel.arcade-panel button.arcade-stage { display: flex; align-items: center; gap: 10px; text-align: left; justify-content: flex-start; padding: 8px 10px; min-height: 58px; }
#panel.arcade-panel button.arcade-stage small { display: block; }
#panel.arcade-panel .arcade-planet { width: 40px; height: 40px; flex: 0 0 40px; }
#panel.arcade-panel .arcade-planet::after { width: 25px; height: 25px; }
#panel.arcade-panel .levels { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 7px; margin: 8px 0 12px; }
#panel.arcade-panel .levels button { display: grid; place-items: center; gap: 0; min-height: 54px; padding: 4px 0; }
#panel.arcade-panel .levels button span { font-size: 18px; font-weight: 900; }
#panel.arcade-panel .levels button small { color: #ffd25d; font-size: 11px; letter-spacing: .05em; margin: 0; }
#panel.arcade-panel .levels button.next { background: #1d4a3a; border-color: #2f7a5c; }
#panel.arcade-panel .levels button.boss span { color: #ff8ba0; }
#panel.arcade-panel p.bigstars { font-size: 40px; line-height: 1.1; letter-spacing: .14em; color: #ffd25d; margin: 2px 0; }
#panel .bigstars i { font-style: normal; color: #39406b; }
#panel .goals { display: grid; gap: 4px; margin: 6px 0 10px; text-align: left; }
#panel .goals div { display: flex; justify-content: space-between; gap: 10px; padding: 6px 10px; border-radius: 10px; background: #0b1430; font-size: 14px; }
#panel .goals div b { color: #ffd25d; } #panel .goals div.miss b { color: #59608c; }
#panel canvas.hero { display: block; width: 100%; height: clamp(90px, 22dvh, 150px); border-radius: 12px; background: #0b1231; }
#panel svg.guide { display: block; width: 100%; height: 120px; border-radius: 12px; background: #0b1231; margin: 6px 0; }
#panel.arcade-panel .arcade-footer { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
#panel.arcade-panel .arcade-footer > * { flex: 1 1 135px; margin: 0; width: auto; }
#panel.arcade-panel .arcade-footer > a.arcade { flex-basis: 100%; }
/* No holes in two-column button rows: an odd last button spans the row. */
#panel.arcade-panel .actions > :last-child:nth-child(odd) { grid-column: 1 / -1; }
#panel.arcade-panel button.charBtn > span { display: block; }
@media (max-height: 820px), (max-width: 420px) {
  #panel canvas.hero { display: none; }
  #panel.arcade-panel h1 { font-size: clamp(28px, 8vw, 36px); margin: 2px 0; }
  #panel.arcade-panel button.charBtn { display: flex; align-items: center; justify-content: flex-start; gap: 6px; padding: 4px 6px; text-align: left; font-size: 14px; }
  #panel.arcade-panel button.charBtn canvas { width: 38px; flex: 0 0 38px; margin: 0; }
  #panel.arcade-panel button.charBtn small { font-size: 11px; }
}
@media (max-height: 700px) { #panel.arcade-panel p.blurb { display: none; } }
@media (max-height: 520px) and (min-aspect-ratio: 5/4) {
  #panel.arcade-panel:has(.mm) { width: min(100%, 780px); }
  #panel .mm { display: grid; grid-template-columns: minmax(0, 0.85fr) minmax(0, 1.15fr); gap: 14px; align-items: start; }
  #panel.arcade-panel .chars { grid-template-columns: 1fr; }
}
@media (max-width: 400px) { #panel.arcade-panel .arcade-stages { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<canvas id="game" aria-label="Alien Starhop"></canvas>
<div class="hud" id="hud" hidden>
  <div class="who"><canvas id="hudFace" width="64" height="64"></canvas><div><small id="hudWorld">Oort Gate</small><strong id="hudLevel">1-1</strong></div></div>
  <div><small>Gems</small><strong id="hudGems">0</strong></div>
  <div><small>Shards</small><strong id="hudShards">☆☆☆</strong></div>
  <div><small>Buddy</small><strong id="hudBuddy">🔒</strong></div>
  <div><small>Health</small><strong id="hudHearts">♥♥♥</strong></div>
  <div><small>Lives</small><strong id="hudLives">×3</strong></div>
  <div class="timeBox"><small>Time</small><strong id="hudTime">0:00</strong></div>
  <div class="grow"></div>
  <div class="bestBox"><small>Best</small><strong id="best">—</strong></div>
  <button id="pauseBtn" type="button">Pause</button>
</div>
<div id="sign"></div>
<div id="banner"></div>
<div class="pad left"><button id="bLeft" type="button" aria-label="Left">◀</button><button id="bRight" type="button" aria-label="Right">▶</button></div>
<div class="pad right"><button id="bDown" type="button" aria-label="Bash (ground pound)">BASH</button><button id="bDash" type="button">DASH</button><button id="bJump" type="button">JUMP</button></div>
<section class="arcade-menu" id="overlay" aria-label="Game menu"><div class="arcade-panel" id="panel"></div></section>
<script>
"use strict";
const TAU = Math.PI * 2;
const CHARS = (() => {
  function shade(hex, f) { const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255; const m = f < 0 ? 0 : 255, a = Math.abs(f);
    r = Math.round(r + (m - r) * a); g = Math.round(g + (m - g) * a); b = Math.round(b + (m - b) * a); return `rgb(${r},${g},${b})`; }
  const circle = (c, x, y, r) => { c.beginPath(); c.arc(x, y, r, 0, TAU); };
  const oval = (c, x, y, rx, ry, rot = 0) => { c.beginPath(); c.ellipse(x, y, rx, ry, rot, 0, TAU); };
  function shadow(c, s, y = 1.0, w = 0.9) { c.fillStyle = "rgba(0,0,0,0.35)"; oval(c, 0, s * y, s * w, s * 0.22); c.fill(); }
  function eye(c, x, y, r, pupil = "#10131f", lx = 0.25, ly = 0) {
    c.fillStyle = "#ffffff"; circle(c, x, y, r); c.fill();
    c.fillStyle = pupil; circle(c, x + r * lx, y + r * ly, r * 0.52); c.fill();
    c.fillStyle = "#ffffff"; circle(c, x + r * lx - r * 0.18, y + r * ly - r * 0.2, r * 0.16); c.fill();
  }
  const G = "#5dff9b", Y = "#ffe35d", P = "#ff8bd0", B = "#7ab8ff", O = "#ff8f5d", R = "#ff5d7a";
  const list = [
    { id: "blip", name: "Blip", color: G, fit: 1, desc: "One-eyed blob that bounces along, antennae bobbing.",
      draw(c, t, s, hit = 0) {
        const b = Math.sin(t * 8); c.translate(0, s * 0.1); c.scale(1 - 0.06 * b, 1 + 0.08 * b);
        c.fillStyle = shade(G, -0.4); oval(c, -s * 0.4, s * 0.75, s * 0.25, s * 0.13); c.fill(); oval(c, s * 0.4, s * 0.75, s * 0.25, s * 0.13); c.fill();
        c.strokeStyle = shade(G, -0.2); c.lineWidth = s * 0.08; c.lineCap = "round";
        for (const sd of [-1, 1]) { const tx = sd * s * (0.5 + 0.06 * Math.sin(t * 5 + sd));
          c.beginPath(); c.moveTo(sd * s * 0.25, -s * 0.7); c.quadraticCurveTo(sd * s * 0.35, -s * 1.05, tx, -s * 1.2); c.stroke();
          c.fillStyle = "#fff7a0"; circle(c, tx, -s * 1.2, s * 0.1); c.fill(); }
        c.fillStyle = G; c.beginPath(); c.moveTo(-s * 0.85, s * 0.7);
        c.bezierCurveTo(-s * 1.0, -s * 0.3, -s * 0.5, -s * 0.85, 0, -s * 0.85); c.bezierCurveTo(s * 0.5, -s * 0.85, s * 1.0, -s * 0.3, s * 0.85, s * 0.7); c.closePath(); c.fill();
        c.fillStyle = shade(G, 0.4); oval(c, -s * 0.4, -s * 0.38, s * 0.18, s * 0.09, -0.6); c.fill();

        c.fillStyle = "#2e3550"; rr(c, 0, -s * 0.04, s * 0.28, s * 0.08, s * 0.03); c.fill(); c.restore();
        c.fillStyle = "#7d88a8"; circle(c, tx * s, -s * (tx === 0 ? 0.48 : 0.32), s * 0.1); c.fill();
      }
      glow(c, R, 0.4 * p + 0.2); c.fillStyle = R; oval(c, 0, -s * 0.2, s * 0.22, s * 0.1); c.fill(); noGlow(c);
      c.fillStyle = "#ffe3e8"; oval(c, 0, -s * 0.2, s * 0.08, s * 0.04); c.fill();
    } },
] },
];
  const roster = STAGES.flatMap(s => s.designs);
  const byName = Object.fromEntries(roster.map(d => [d.name, d]));
  return { draw(name, c, t, s, hit = 0) { const d = byName[name]; if (!d) return; PX = s * 2.2; c.save(); c.lineCap = "round"; d.draw(c, t, s, hit); c.restore(); }, has: n => !!byName[n] };
})();

    <div class="arcade-footer">${ARCADE_LINK}</div>`);
}
function worldMenu(w) {
  const a = SAVE.alien, W = WORLDS[w], nextOpen = SAVE.prog[a].findIndex((p, i) => !p.m && unlocked(a, i));
  showMenu(`<p class="kicker">${alienName(a)} · ${DIFF[a].label} · ${worldStars(a, w)}/${LEVELS_PER_WORLD * 3} ★</p><h2>${w + 1} · ${W.name}${w === 0 ? "" : ""}</h2>
    <p>${W.sub}. Level ${w + 1}-6 is a goo escape, and ${w + 1}-10 is the ${ATK_BOSS[w]}. Finish a level to unlock the next.</p>
    <div class="levels">${Array.from({ length: LEVELS_PER_WORLD }, (_, k) => {
      const i = w * LEVELS_PER_WORLD + k, open = unlocked(a, i), n = starsOf(SAVE.prog[a][i].m), boss = isBoss(i);
      return `<button data-act="level" data-id="${i}" class="${i === nextOpen ? "next" : ""} ${boss ? "boss" : ""}" ${open ? "" : "disabled"} aria-label="Level ${k + 1}${boss ? " boss" : ""}, ${open ? n + " stars" : "locked"}"><span>${open ? (boss ? "👾" : k + 1) : "🔒"}</span><small>${open ? (n ? "★".repeat(n) : "—") : ""}</small></button>`;
    }).join("")}</div>
    <div class="arcade-footer"><button data-act="main">Back</button>${ARCADE_LINK}</div>`);
}
function pauseMenu() {
  if (phase !== "play") return;
  showMenu(`<p class="kicker">${WORLDS[L.world].name} · Level ${levelName(level)} · ${alienName(alien)}</p><h2>Paused</h2>
    <button class="primary" data-act="resume">Resume</button>
    <div class="actions"><button data-act="again">Restart level</button><button data-act="levels">All levels</button><button data-act="help">How to Play</button>${soundBtns()}<button data-act="main">Back</button></div>
    <div class="arcade-footer">${ARCADE_LINK}</div>`);
}
function gameOverMenu() {
  showMenu(`<p class="kicker">${WORLDS[L.world].name} · Level ${levelName(level)} · ${alienName(alien)}</p><h2>Out of lives!</h2>
    <p>The level starts over from the beginning. Grab gems for 1-UPs (every 50), and hit checkpoints to save your progress.</p>
    <button class="primary" data-act="again">Try again</button>
    <div class="actions"><button data-act="levels">All levels</button><button data-act="main">Back</button></div>
    <div class="arcade-footer">${ARCADE_LINK}</div>`);
}
function resultMenu(m, before) {
  const boss = L.boss, w = L.world, last = level + 1 >= TOTAL_LEVELS, nextWorld = isBoss(level) && !last, total = starsOf(SAVE.prog[alien][level].m);
  const goal = (ok, label, note) => `<div class="${ok ? "" : "miss"}"><span>${label}</span><b>${ok ? "★" : "☆"}${note ? ` ${note}` : ""}</b></div>`;
  const goals = boss
    ? goal(true, `Beat the ${boss.name}`) + goal(m & 2, "Finish with half your health") + goal((m & 28) === 28, "No damage taken")
    : goal(true, "Reach the portal") + goal(m & 2, "Rescue the caged buddy") + goal((m & 28) === 28, "Find all 3 Star Shards", `${shardsGot.filter(Boolean).length}/3`);
  const n = starsOf(m);
  showMenu(`<canvas class="hero" data-hero="win" width="640" height="220"></canvas>
    <p class="kicker">${WORLDS[w].name} · Level ${levelName(level)} · ${alienName(alien)}</p>
    <h2>${last ? "Earth is saved!" : boss ? `${boss.name} defeated!` : n === 3 ? "Perfect run!" : "Level clear!"}</h2>
    <p class="bigstars" aria-label="${n} of 3 stars this run">${"★".repeat(n)}<i>${"★".repeat(3 - n)}</i></p>
    <div class="goals">${goals}</div>
    <p>Time ${fmtTime(elapsed)} · ${gems} gems${deaths ? ` · ${deaths} retr${deaths > 1 ? "ies" : "y"}` : ""}${total > n ? ` · best for this level: ${total} ★` : ""}</p>
    ${last ? `<p>You beat the Mothership and saved Earth with ${alienName(alien)}! Collect every star, or try a harder alien.</p>` : `<button class="primary" data-act="next">${nextWorld ? `Next world: ${WORLDS[w + 1].name}` : "Next level"}</button>`}
    <div class="actions"><button data-act="again">Play again</button><button data-act="levels">All levels</button></div>
    <div class="arcade-footer"><button data-act="main">Back</button>${ARCADE_LINK}</div>`);
}
const HELP = [
  { title: "Run and jump", text: "◀ ▶ (or arrow keys / A D) to run. JUMP (Space, Z or ↑) to hop. Hold it to jump higher, tap for a short hop. You can still jump just after running off a ledge.", art: "jump" },
  { title: "Double jump and wall jump", text: "Press JUMP again in the air for a double jump. Slide down a wall and press JUMP to kick off it, then kick off the other side to climb.", art: "wall" },
  { title: "Dash and ground-pound", text: "DASH (X or Shift) zooms you forward and knocks out small aliens. Blue crystals refill your dash in mid-air. BASH (▼ or S on a keyboard) in the air ground-pounds: it smashes crates and flattens tough Chonk-type aliens.", art: "dash" },
  { title: "Lives, ? blocks and power-ups", text: "Enemies take a heart. Pits, spikes, lava, saws and the goo take a whole life, and so does losing every heart. Run out of lives and the level starts over. Every 50 gems is a 1-UP. Jump into ? blocks from below for gems or a power-up: Shield (blocks a hit), Jet Boots (triple jump) or Supernova (8 seconds of invincibility).", art: "q" },
  { title: "Three stars every level", text: "★ Reach the portal. ★ Free the caged buddy. ★ Find all 3 hidden Star Shards. Beacons are checkpoints: if you lose a life, you go back to the last one and anything you grabbed after it has to be found again.", art: "stars" },
  { title: "Bosses and escapes", text: "Level 6 of each world is a goo escape: keep moving! Level 10 is a boss. Dodge its attacks, and when it gets tired and glows, stomp it or BASH it.", art: "boss" },
];
let helpPage = 0, helpFrom = "main";
function helpMenu() {
  const p = HELP[helpPage], lastP = helpPage === HELP.length - 1;
  showMenu(`<p class="step">Step ${helpPage + 1} of ${HELP.length}</p><h2>${p.title}</h2>${helpArt(p.art)}<p>${p.text}</p>
    <div class="actions"><button data-act="helpback">Back</button><button class="primary" data-act="${lastP ? "helpdone" : "helpnext"}">${lastP ? "Done" : "Next"}</button></div>`);
}
function helpArt(kind) {
  const ground = `<rect x="0" y="96" width="360" height="24" fill="#4d5f93"/><rect x="0" y="96" width="360" height="5" fill="#d8f0ff"/>`, hero = (x, y) => `<circle cx="${x}" cy="${y}" r="11" fill="#5dff9b"/><circle cx="${x + 2}" cy="${y - 2}" r="4" fill="#fff"/><circle cx="${x + 3}" cy="${y - 2}" r="2" fill="#10261a"/>`;
  if (kind === "jump") return `<svg class="guide" viewBox="0 0 360 120">${ground}<path d="M60 85 Q120 10 180 85" fill="none" stroke="#5dff9b" stroke-width="3" stroke-dasharray="6 5"/><path d="M200 85 Q230 50 260 85" fill="none" stroke="#7ab8ff" stroke-width="3" stroke-dasharray="6 5"/>${hero(60, 85)}<text x="120" y="30" fill="#c9ffe0" font-size="12" font-weight="800" text-anchor="middle">hold = high</text><text x="230" y="44" fill="#bcd8ff" font-size="12" font-weight="800" text-anchor="middle">tap = hop</text></svg>`;
  if (kind === "wall") return `<svg class="guide" viewBox="0 0 360 120">${ground}<rect x="150" y="10" width="14" height="86" fill="#27335a"/><rect x="230" y="10" width="14" height="86" fill="#27335a"/><path d="M60 85 Q70 30 100 20" fill="none" stroke="#ffd25d" stroke-width="3" stroke-dasharray="6 5"/><path d="M168 80 L224 55 L168 30 L224 12" fill="none" stroke="#5dff9b" stroke-width="3" stroke-dasharray="6 5"/>${hero(60, 85)}<text x="90" y="40" fill="#ffe9a8" font-size="12" font-weight="800">double!</text></svg>`;
  if (kind === "dash") return `<svg class="guide" viewBox="0 0 360 120">${ground}<path d="M60 60 H180" stroke="#4fd1ff" stroke-width="6" stroke-linecap="round" opacity=".6"/>${hero(190, 60)}<rect x="270" y="72" width="24" height="24" fill="#a8743c" stroke="#6b4520" stroke-width="3"/><path d="M282 20 V60" stroke="#fff" stroke-width="3" stroke-dasharray="4 4"/><path d="M276 54 l6 10 l6 -10" fill="none" stroke="#fff" stroke-width="3"/><g transform="translate(120 30) rotate(45)"><rect x="-7" y="-7" width="14" height="14" fill="#7fe6ff"/></g></svg>`;
  if (kind === "q") return `<svg class="guide" viewBox="0 0 360 120">${ground}<rect x="110" y="20" width="30" height="30" fill="#ffb627" stroke="#a3600a" stroke-width="3"/><text x="125" y="43" fill="#fff6d8" font-size="20" font-weight="900" text-anchor="middle">?</text><path d="M125 85 V58" stroke="#fff" stroke-width="3" stroke-dasharray="4 4"/>${hero(125, 85)}<circle cx="220" cy="55" r="12" fill="#7fe6ff55" stroke="#7fe6ff" stroke-width="4"/><rect x="250" y="46" width="10" height="16" fill="#ff8f5d"/><rect x="250" y="56" width="18" height="6" fill="#ff8f5d"/><text x="305" y="66" fill="#ffd25d" font-size="30" text-anchor="middle">✦</text><text x="262" y="100" fill="#fff" font-size="11" font-weight="800" text-anchor="middle">shield · boots · supernova</text></svg>`;
  if (kind === "stars") return `<svg class="guide" viewBox="0 0 360 120">${ground}<ellipse cx="70" cy="60" rx="18" ry="30" fill="none" stroke="#c77dff" stroke-width="4"/><g stroke="#cfd6e8" stroke-width="3">${[160, 170, 180, 190, 200].map(x => `<line x1="${x}" y1="48" x2="${x}" y2="96"/>`).join("")}</g><circle cx="180" cy="78" r="10" fill="#7ab8ff"/><text x="290" y="70" fill="#ffd25d" font-size="40" text-anchor="middle">★</text><text x="70" y="114" fill="#fff" font-size="11" font-weight="800" text-anchor="middle">portal</text><text x="180" y="114" fill="#fff" font-size="11" font-weight="800" text-anchor="middle">buddy</text><text x="290" y="114" fill="#fff" font-size="11" font-weight="800" text-anchor="middle">3 shards</text></svg>`;
  return `<svg class="guide" viewBox="0 0 360 120">${ground}<ellipse cx="230" cy="70" rx="50" ry="26" fill="#ff5d7a"/><circle cx="215" cy="64" r="7" fill="#fff"/><circle cx="245" cy="64" r="7" fill="#fff"/><path d="M120 20 Q190 -10 225 38" fill="none" stroke="#ffd25d" stroke-width="3" stroke-dasharray="6 5"/>${hero(120, 30)}<text x="230" y="30" fill="#ffd25d" font-size="13" font-weight="900" text-anchor="middle">▼ STOMP!</text><path d="M0 60 Q20 40 0 20 Z" fill="#ff8bd0"/></svg>`;
}
panel.addEventListener("click", e => {
  const b = e.target.closest("button[data-act]"); if (!b) return;
  audio();
  const act = b.dataset.act, id = b.dataset.id;
  if (act === "alien") { SAVE.alien = id; persist(); mainMenu(); }
  else if (act === "world") worldMenu(+id);
  else if (act === "level") startLevel(+id);
  else if (act === "main") mainMenu();
  else if (act === "resume") { $("hud").hidden = false; resume(); }
  else if (act === "again") startLevel(level);
  else if (act === "next") startLevel(level + 1);
  else if (act === "levels") worldMenu(Math.floor(level / LEVELS_PER_WORLD));
  else if (act === "sound") { SAVE.sound = !SAVE.sound; persist(); b.textContent = `Sound: ${SAVE.sound ? "On" : "Off"}`; b.setAttribute("aria-pressed", SAVE.sound); }
  else if (act === "music") { SAVE.music = !SAVE.music; persist(); b.textContent = `Music: ${SAVE.music ? "On" : "Off"}`; b.setAttribute("aria-pressed", SAVE.music); }
  else if (act === "help") { helpFrom = panel.querySelector("h2")?.textContent === "Paused" ? "pause" : "main"; helpPage = 0; helpMenu(); }
  else if (act === "helpnext") { helpPage++; helpMenu(); }
  else if (act === "helpback") { if (helpPage) { helpPage--; helpMenu(); } else helpDone(); }
  else if (act === "helpdone") helpDone();
});
function helpDone() { if (helpFrom === "pause") { phase = "play"; pauseMenu(); } else mainMenu(); }
$("pauseBtn").addEventListener("click", () => { audio(); pauseMenu(); });
document.addEventListener("visibilitychange", () => { if (document.hidden && phase === "play") pauseMenu(); });

// ===================== MENU ART + MAIN LOOP =====================
function drawCharCanvas(cvs, id, t) { const c = cvs.getContext("2d"), w = cvs.width, h = cvs.height; c.clearRect(0, 0, w, h); c.save(); c.translate(w / 2, h * 0.58); CHARS.byId(id).draw(c, t, w * 0.3, 0); c.restore(); }
function drawHero(cvs, t) {
  const c = cvs.getContext("2d"), w = cvs.width, h = cvs.height, win = cvs.dataset.hero === "win";
  const g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, "#0b1240"); g.addColorStop(1, "#2a3a8a"); c.fillStyle = g; c.fillRect(0, 0, w, h);
  c.fillStyle = "#fff"; for (let i = 0; i < 40; i++) c.fillRect((i * 97) % w, (i * 53) % (h * 0.6), 2, 2);
  c.fillStyle = "#4d5f93"; c.fillRect(0, h - 40, w, 40); c.fillStyle = "#d8f0ff"; c.fillRect(0, h - 40, w, 6);
  for (const [x, y] of [[180, 150], [300, 110], [420, 150]]) { c.fillStyle = "#8fa9d8"; c.fillRect(x, y, 90, 10); }
  for (let k = 0; k < 5; k++) { const x = 120 + k * 90, y = 70 + Math.sin(t * 3 + k) * 6; c.fillStyle = "#8fe9dc"; c.beginPath(); c.moveTo(x, y - 9); c.lineTo(x + 6, y); c.lineTo(x, y + 9); c.lineTo(x - 6, y); c.fill(); }
  drawStar(c, w * 0.86, 60 + Math.sin(t * 2) * 5, 18, t, "#ffd25d");
  const ids = win ? [alien] : ALIENS;
  ids.forEach((id, k) => { const x = win ? w * 0.5 : w * (0.22 + k * 0.28), arc = Math.abs(Math.sin(t * 2.4 + k * 1.3)); c.save(); c.translate(x, h - 70 - arc * (win ? 60 : 70)); CHARS.byId(id).draw(c, t, 30, 0); c.restore(); });
}
let last = performance.now(), acc = 0, artT = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  const t = now / 1000;
  if (L && phase === "play") {
    acc += dt; let n = 0;
    while (acc >= DT && n < 12 && phase === "play") { step(DT); acc -= DT; n++; }
    if (n >= 12) acc = 0;
    musicTick();
    if (Math.floor(elapsed) !== Math.floor(elapsed - dt)) $("hudTime").textContent = fmtTime(elapsed);
  }
  if (L) { if (phase === "play" || phase === "done") { camera(dt); if (phase === "done") stepWorld(dt); } render(t, dt); }
  else { cx.setTransform(DPR, 0, 0, DPR, 0, 0); const g = cx.createLinearGradient(0, 0, 0, VH); g.addColorStop(0, "#050817"); g.addColorStop(1, "#14204f"); cx.fillStyle = g; cx.fillRect(0, 0, VW, VH); }
  artT += dt;
  if (artT > 1 / 30) {
    artT = 0;
    if (L) drawCharCanvas($("hudFace"), alien, t);
    if (!overlay.hidden) { panel.querySelectorAll("canvas[data-char]").forEach(c => drawCharCanvas(c, c.dataset.char, t)); panel.querySelectorAll("canvas[data-hero]").forEach(c => drawHero(c, t)); }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
mainMenu();

</script>
