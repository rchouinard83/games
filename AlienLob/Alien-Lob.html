<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#060c1c">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Alien Lob</title>
<style>
  :root { --bg: #060c1c; --panel: #0e1a30; --line: #2a3e66; --ink: #e6f0ff; --dim: #93a6c9; --good: #5dff9b; --bad: #ff5d7a; --accent: #4fd1ff; --gold: #ffd25d; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; overscroll-behavior: none;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #app { height: 100%; height: 100dvh; display: flex; flex-direction: column; align-items: center; padding: calc(6px + env(safe-area-inset-top)) 6px calc(8px + env(safe-area-inset-bottom)); gap: 6px; }
  #hud { width: 100%; max-width: 480px; display: flex; gap: 5px; align-items: stretch; }
  .chip { background: rgba(14,26,48,0.9); border: 1px solid var(--line); border-radius: 12px; padding: 4px 8px 5px; font-weight: 800; font-size: 15px; line-height: 1.15; white-space: nowrap; }
  .chip small { display: block; font-size: 9.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); font-weight: 700; }
  #hLives { color: var(--bad); letter-spacing: -1px; }
  .spacer { flex: 1; }
  .hudBtn { background: rgba(14,26,48,0.9); color: var(--ink); border: 1px solid var(--line); border-radius: 12px; font: inherit; font-weight: 900; font-size: 15px; padding: 0 10px; }
  #stage { flex: 1; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; }
  #cv { display: block; border-radius: 14px; touch-action: none; }
  /* Menu styles travel with this HTML when it is published on its own. */
  #overlay {
    position: fixed; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center;
    padding: 12px;
    padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right))
      max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
    background: rgba(5, 5, 16, .78);
  }
  #overlay.hidden { display: none; }
  #box {
    width: min(100%, 430px); max-height: 100%; overflow: auto; overscroll-behavior: contain;
    touch-action: pan-y; padding: 16px; border: 1px solid #33336e; border-radius: 18px;
    background: #141436; color: #eef0ff; text-align: center; box-shadow: 0 0 40px #7070ca26;
  }
  #box h1 {
    margin: 8px 0 5px; font-size: clamp(32px, 9vw, 46px); letter-spacing: -.04em; line-height: 1.04;
    background: linear-gradient(90deg, #ff8bd0, #ffd25d 40%, #5dff9b 70%, #4fd1ff);
    background-clip: text; -webkit-background-clip: text; color: transparent;
  }
  #box h2 { margin: 4px 0 6px; font-size: 26px; line-height: 1.14; }
  #box p { margin: 6px 0 10px; color: #dcdff7; font-size: 15px; line-height: 1.4; }
  #box .kicker { margin: 6px 0 4px; color: #8fe9dc; font-size: 11px; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; }
  #titleArt { width: 100%; height: 145px; display: block; border-radius: 12px; }
  .big {
    display: block; width: 100%; min-height: 48px; margin: 8px 0; padding: 10px 11px;
    border: 1px solid #33336e; border-radius: 12px; background: #22225a; color: #eef0ff;
    font: 800 16px/1.2 system-ui, sans-serif; text-align: center; text-decoration: none;
  }
  a.big { display: grid; place-items: center; }
  .big.main { background: #1d4a3a; border-color: #2f7a5c; color: #82f7b2; }
  #box :is(button, a):focus-visible { outline: 2px solid #a7f5e5; outline-offset: 2px; }
  .menuList { display: grid; gap: 8px; margin: 8px 0; }
  .menuList .big { margin: 0; }
  .menuFooter { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .menuFooter .big { width: auto; flex: 1 1 135px; margin: 0; }
  .big:disabled { opacity: .44; }
  .big small { display: block; font-size: 12px; font-weight: 650; color: var(--dim); margin-top: 2px; }
  .row { display: flex; gap: 8px; } .row .big { flex: 1; }
  .stageCard { display: flex; align-items: center; gap: 12px; text-align: left; }
  .stageCard canvas { width: 56px; height: 56px; flex: none; border-radius: 12px; }
  .stageCard span { flex: 1; min-width: 0; }
  .levels { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 10px 0; }
  .levels .big { margin: 0; padding: 10px 0 8px; font-size: 20px; }
  .levels .big small { font-size: 11px; color: var(--gold); }
  .levels .big small i, .bigStars i { color: #2a3e66; font-style: normal; }
  .stars { color: var(--gold); }
  .bigStars { font-size: 46px; letter-spacing: 0.1em; color: var(--gold); margin: 2px 0 6px; }
  .score { font-size: 15px; color: var(--dim); font-weight: 700; }
  .facts { display: flex; gap: 6px; justify-content: center; margin: 4px 0 8px; flex-wrap: wrap; }
  .facts span { background: #0a1428; border: 1px solid #2a3e66; border-radius: 999px; padding: 4px 10px; font-size: 13px; font-weight: 800; color: var(--accent); }
  .chars { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0; }
  .charBtn { background: #0a1428; border: 2px solid #2a3e66; border-radius: 14px; padding: 6px 4px 8px; color: var(--ink); font: inherit; font-weight: 800; font-size: 14px; }
  .charBtn.on { border-color: var(--good); background: #10301f; }
  .charBtn canvas { width: 100%; aspect-ratio: 1; display: block; }
  #howCv { width: 100%; height: 190px; display: block; border-radius: 12px; background: #0a1428; border: 1px solid #2a3e66; margin: 6px 0 4px; }
  .how { list-style: none; margin: 10px 0 8px; display: grid; gap: 6px; text-align: left; }
  .how li { font-size: 17px; font-weight: 650; line-height: 1.3; padding: 7px 12px; background: #0a1428; border: 1px solid #2a3e66; border-radius: 10px; }
  .how b { font-weight: 900; color: #fff; } .how b.c { color: var(--accent); } .how b.y { color: var(--gold); } .how b.g { color: var(--good); } .how b.r { color: var(--bad); }
  .dots { display: flex; justify-content: center; gap: 6px; margin: 4px 0 2px; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: #2a3e66; }
  .dots i.on { background: var(--accent); }
  @media (max-width: 520px), (max-height: 500px) and (pointer: coarse) {
    #overlay {
      bottom: auto; height: 100vh; height: 100dvh;
      background: radial-gradient(ellipse at 50% 18%, #20214a, #090c24 74%);
      -webkit-text-size-adjust: 100%;
    }
    #box { padding: clamp(12px, 4vw, 16px); }
    #box h1 { font-size: clamp(29px, 8vw, 39px); }
    #box h2 { font-size: clamp(23px, 6vw, 26px); }
    #box p { font-size: 14px; }
    #titleArt { height: clamp(100px, 19vh, 122px); }
    .big.main { min-height: 52px; background: #21744f; border-color: #429e70; color: #f3fff7; }
    .charBtn canvas { width: min(100%, 62px); margin: 0 auto; }
    #box:has(> .menuList) { display: flex; flex-direction: column; }
    #box:has(> .menuList) > :not(.menuList) { flex: 0 0 auto; }
    .menuList {
      min-height: min(112px, 32vh); overflow-y: auto; overscroll-behavior: contain;
      grid-auto-rows: max-content; padding: 2px;
    }
    .menuList canvas { width: 42px; height: 42px; }
  }
  @media (max-height: 500px) and (pointer: coarse) {
    #box { width: min(100%, 580px); padding: 12px; }
    #titleArt { height: min(90px, 27vh); }
    .menuList { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .chars { grid-template-columns: repeat(6, minmax(0, 1fr)); }
    .charBtn canvas { width: min(100%, 42px); }
    #howCv { height: min(100px, 28vh); }
  }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="chip"><small id="hStage">Oort</small><span id="hLevel">Level 1</span></div>
    <div class="chip"><small>Throws</small><span id="hThrows">0/2</span></div>
    <div class="chip"><small>Shields</small><span id="hLives">♥♥♥</span></div>
    <div class="chip"><small>Gravity</small><span id="hGrav">0.6g</span></div>
    <div class="spacer"></div>
    <button class="hudBtn" id="fsBtn" aria-label="Full screen" aria-pressed="false" hidden></button>
    <button class="hudBtn" id="helpBtn" aria-label="How to play">?</button>
    <button class="hudBtn" id="menuBtn">Pause</button>
  </div>
  <div id="stage"><canvas id="cv"></canvas></div>
</div>
<div id="overlay"><div id="box"></div></div>
<script>
"use strict";
// ============================================================
//  ALIEN LOB — a turn-based goo-throwing duel across alien skylines.
//  Pull back anywhere and let go to lob a goo bomb. Wind and each planet's gravity bend every throw.
//  Goo blows craters in the scenery; an alien whose ground is blown away falls.
//  The world is W x 640 units (W is wider than one screen and depends on the stage).
//  A camera fills the whole screen at one zoom and follows the action:
//    portrait shows the full height and pans sideways; landscape shows the full width and pans up and down.
// ============================================================
const $ = id => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d");
const TAU = Math.PI * 2, PI = Math.PI;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const LH = 640;
let W = 720;                  // world width for the current level
const MAX_SPEED = 540;        // fastest throw (units per second)
const DRAG_FULL_PX = 90;      // finger pull for a full-power throw, in real screen pixels (not world units), so it's the same short pull on any phone
const BLAST = 22;             // crater radius
const SPLASH = 30;            // a blast this close to an alien's middle hurts it
const ALIEN_R = 12;           // how big an alien is to hit directly
const PREVIEW_SECS = 0.28;    // the aim dots show only the start of the throw: wind and the rest of the arc are up to you
const EARTH_G = 340;          // "1g" on the gravity readout
const LEVELS = 8;
const HP_BY_LEVEL = [1, 1, 1, 2, 2, 2, 2, 3]; // hits to beat the enemy; level 8 of each stage is a boss
const MY_SHIELDS = 3;

// ============================================================
//  THE CAST: Stage 1 "First Contact" aliens from Alien Defense (attacker-design.html)
// ============================================================
const CHARS = (() => {
  function shade(hex, f) { const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255; const m = f < 0 ? 0 : 255, a = Math.abs(f);
    r = Math.round(r + (m - r) * a); g = Math.round(g + (m - g) * a); b = Math.round(b + (m - b) * a); return `rgb(${r},${g},${b})`; }
  const circle = (c, x, y, r) => { c.beginPath(); c.arc(x, y, r, 0, TAU); };
  const oval = (c, x, y, rx, ry, rot = 0) => { c.beginPath(); c.ellipse(x, y, rx, ry, rot, 0, TAU); };
  function shadow(c, s, y = 1.0, w = 0.9) { c.fillStyle = "rgba(0,0,0,0.35)"; oval(c, 0, s * y, s * w, s * 0.22); c.fill(); }
  function eye(c, x, y, r, pupil = "#10131f", lx = 0.25, ly = 0) {
    c.fillStyle = "#ffffff"; circle(c, x, y, r); c.fill();
    c.fillStyle = pupil; circle(c, x + r * lx, y + r * ly, r * 0.52); c.fill();
    c.fillStyle = "#ffffff"; circle(c, x + r * lx - r * 0.18, y + r * ly - r * 0.2, r * 0.16); c.fill();
  }
  const G = "#5dff9b", Y = "#ffe35d", P = "#ff8bd0", B = "#7ab8ff", O = "#ff8f5d", R = "#ff5d7a";
  const list = [
    { id: "blip", name: "Blip", color: G, fit: 1, desc: "One-eyed blob that bounces along, antennae bobbing.",
      draw(c, t, s, hit = 0) {
        const b = Math.sin(t * 8); c.translate(0, s * 0.1); c.scale(1 - 0.06 * b, 1 + 0.08 * b);
        c.fillStyle = shade(G, -0.4); oval(c, -s * 0.4, s * 0.75, s * 0.25, s * 0.13); c.fill(); oval(c, s * 0.4, s * 0.75, s * 0.25, s * 0.13); c.fill();
        c.strokeStyle = shade(G, -0.2); c.lineWidth = s * 0.08; c.lineCap = "round";
        for (const sd of [-1, 1]) { const tx = sd * s * (0.5 + 0.06 * Math.sin(t * 5 + sd));
          c.beginPath(); c.moveTo(sd * s * 0.25, -s * 0.7); c.quadraticCurveTo(sd * s * 0.35, -s * 1.05, tx, -s * 1.2); c.stroke();
          c.fillStyle = "#fff7a0"; circle(c, tx, -s * 1.2, s * 0.1); c.fill(); }
        c.fillStyle = G; c.beginPath(); c.moveTo(-s * 0.85, s * 0.7);
        c.bezierCurveTo(-s * 1.0, -s * 0.3, -s * 0.5, -s * 0.85, 0, -s * 0.85); c.bezierCurveTo(s * 0.5, -s * 0.85, s * 1.0, -s * 0.3, s * 0.85, s * 0.7); c.closePath(); c.fill();
        c.fillStyle = shade(G, 0.4); oval(c, -s * 0.4, -s * 0.38, s * 0.18, s * 0.09, -0.6); c.fill();
        if (hit > 0.15 || Math.sin(t * 1.3) > 0.97) { c.strokeStyle = "#10261a"; c.lineWidth = s * 0.07; c.beginPath(); c.moveTo(-s * 0.3, -s * 0.15); c.lineTo(s * 0.3, -s * 0.15); c.stroke(); }
        else eye(c, 0, -s * 0.15, s * 0.36, "#10261a", 0.25, 0.05);
        c.strokeStyle = "#10261a"; c.lineWidth = s * 0.06; c.beginPath(); c.arc(0, s * 0.3, s * 0.15, 0.2, Math.PI - 0.2); c.stroke();
      } },
    { id: "runner", name: "Runner", color: Y, fit: 1, desc: "Skinny legs, wobbly eye stalks, always in a hurry.",
      draw(c, t, s) {
        c.translate(0, -s * 0.1);
        c.strokeStyle = "rgba(255,227,93,0.35)"; c.lineWidth = s * 0.07; c.lineCap = "round";
        for (let k = 0; k < 3; k++) { const y = -s * 0.3 + k * s * 0.3; c.beginPath(); c.moveTo(-s * 0.7, y); c.lineTo(-s * (1.05 + 0.2 * Math.sin(t * 20 + k)), y); c.stroke(); }
        c.strokeStyle = shade(Y, -0.4); c.lineWidth = s * 0.12;
        for (const ph of [0, Math.PI]) { const a = t * 16 + ph, fx = Math.sin(a) * s * 0.5, fy = s * 1.0 - Math.max(0, Math.cos(a)) * s * 0.3;
          c.beginPath(); c.moveTo(0, s * 0.3); c.lineTo(fx * 0.5 + s * 0.1, s * 0.65); c.lineTo(fx, fy); c.stroke(); }
        c.fillStyle = Y; oval(c, s * 0.05, 0, s * 0.55, s * 0.48, 0.15); c.fill();
        c.fillStyle = shade(Y, 0.45); oval(c, -s * 0.15, -s * 0.2, s * 0.15, s * 0.08, -0.5); c.fill();
        c.strokeStyle = shade(Y, -0.2); c.lineWidth = s * 0.08;
        for (const [ex, ey, ph] of [[s * 0.1, -s * 0.95, 0], [s * 0.5, -s * 0.85, 1.5]]) { const w = Math.sin(t * 6 + ph) * s * 0.06;
          c.beginPath(); c.moveTo(s * 0.15, -s * 0.35); c.quadraticCurveTo(ex - s * 0.1, ey + s * 0.3, ex + w, ey); c.stroke();
          eye(c, ex + w, ey, s * 0.17, "#2a1a00", 0.4, 0.1); }
        c.strokeStyle = "#2a1a00"; c.lineWidth = s * 0.05; c.beginPath(); c.arc(s * 0.3, s * 0.1, s * 0.1, 0.2, Math.PI - 0.4); c.stroke();
      } },
    { id: "goo", name: "Goo", color: P, fit: 1.15, desc: "Little wobbling slime drop. Squishy and bouncy.",
      draw(c, t, s) {
        const w = Math.sin(t * 10); c.scale(1 + 0.1 * w, 1 - 0.1 * w);
        c.fillStyle = P; c.beginPath(); c.moveTo(0, -s * 1.0);
        c.bezierCurveTo(s * 0.5, -s * 0.4, s * 0.9, s * 0.1, s * 0.75, s * 0.55); c.quadraticCurveTo(0, s * 0.85, -s * 0.75, s * 0.55);
        c.bezierCurveTo(-s * 0.9, s * 0.1, -s * 0.5, -s * 0.4, 0, -s * 1.0); c.fill();
        c.fillStyle = shade(P, 0.45); oval(c, -s * 0.25, -s * 0.25, s * 0.12, s * 0.22, 0.4); c.fill();
        c.fillStyle = "#3a0a22"; circle(c, -s * 0.2, s * 0.15, s * 0.11); c.fill(); circle(c, s * 0.25, s * 0.15, s * 0.11); c.fill();
      } },
    { id: "jelly", name: "Jelly", color: B, fit: 1, desc: "Floating jellyfish that drifts along, tentacles waving.",
      draw(c, t, s, hit = 0) {
        shadow(c, s, 1.0, 0.7); c.translate(0, Math.sin(t * 2.5) * s * 0.12 - s * 0.25);
        c.strokeStyle = shade(B, 0.2); c.lineWidth = s * 0.08; c.lineCap = "round";
        for (let k = 0; k < 5; k++) { const x = -s * 0.5 + k * s * 0.25; c.beginPath(); c.moveTo(x, s * 0.1);
          c.quadraticCurveTo(x + Math.sin(t * 4 + k) * s * 0.2, s * (0.6 - hit * 0.27), x * (1 - hit * 0.4) + Math.sin(t * 4 + k + 1) * s * 0.15, s * (1 - hit * 0.57)); c.stroke(); }
        const pul = 1 + 0.06 * Math.sin(t * 5);
        const g = c.createRadialGradient(-s * 0.2, -s * 0.4, s * 0.1, 0, -s * 0.1, s * 0.8); g.addColorStop(0, shade(B, 0.55)); g.addColorStop(1, shade(B, -0.1));
        c.fillStyle = g; c.beginPath(); c.ellipse(0, 0, s * 0.75 * pul, s * 0.7 / pul, 0, Math.PI, TAU);
        c.quadraticCurveTo(s * 0.4, s * 0.25, 0, s * 0.12); c.quadraticCurveTo(-s * 0.4, s * 0.25, -s * 0.75 * pul, 0); c.fill();
        c.fillStyle = "#0d1830"; circle(c, -s * 0.2, -s * 0.25, s * 0.09); c.fill(); circle(c, s * 0.2, -s * 0.25, s * 0.09); c.fill();
      } },
    { id: "chonk", name: "Chonk", color: O, fit: 0.95, desc: "Big round three-eyed bruiser. Built like a bowling ball.",
      draw(c, t, s, hit = 0) {
        c.translate(0, -Math.abs(Math.sin(t * 3)) * s * 0.12 + s * 0.05);
        c.fillStyle = shade(O, -0.3);
        for (const sd of [-1, 1]) { oval(c, sd * s * 0.95, s * 0.05 + Math.sin(t * 3 + sd) * s * 0.08, s * 0.18, s * 0.28, sd * 0.4); c.fill(); }
        oval(c, -s * 0.45, s * 0.82, s * 0.28, s * 0.14); c.fill(); oval(c, s * 0.45, s * 0.82, s * 0.28, s * 0.14); c.fill();
        const g = c.createRadialGradient(-s * 0.3, -s * 0.4, s * 0.1, 0, 0, s); g.addColorStop(0, shade(O, 0.35)); g.addColorStop(1, shade(O, -0.15));
        c.fillStyle = g; oval(c, 0, 0, s * 0.92, s * 0.85); c.fill();
        c.fillStyle = shade(O, -0.2); circle(c, -s * 0.6, s * 0.35, s * 0.1); c.fill(); circle(c, s * 0.62, s * 0.3, s * 0.08); c.fill(); circle(c, s * 0.5, -s * 0.55, s * 0.07); c.fill();
        eye(c, -s * 0.35, -s * 0.2, s * 0.2, "#2a1205"); eye(c, s * 0.35, -s * 0.2, s * 0.2, "#2a1205"); eye(c, 0, -s * 0.52, s * 0.16, "#2a1205");
        if (hit > 0.15) { c.strokeStyle = "#3a1405"; c.lineWidth = s * 0.14; c.lineCap = "round"; c.beginPath(); c.moveTo(-s * 0.26, s * 0.38); c.quadraticCurveTo(0, s * 0.08, s * 0.26, s * 0.38); c.stroke(); }
        else { c.fillStyle = "#3a1405"; oval(c, 0, s * 0.3, s * 0.25, s * (0.1 + 0.05 * Math.sin(t * 3))); c.fill(); }
      } },
    { id: "mother", name: "Mother Blob", color: R, fit: 0.85, desc: "Huge blob covered in eyes that all look in different directions.",
      draw(c, t, s) {
        const w = Math.sin(t * 2); c.scale(1 + 0.04 * w, 1 - 0.04 * w);
        const g = c.createRadialGradient(-s * 0.3, -s * 0.35, s * 0.1, 0, 0, s * 1.05); g.addColorStop(0, shade(R, 0.35)); g.addColorStop(1, shade(R, -0.25));
        c.fillStyle = g; c.beginPath(); c.moveTo(-s * 1.05, s * 0.75);
        c.bezierCurveTo(-s * 1.2, -s * 0.4, -s * 0.6, -s * 1.0, 0, -s * 1.0); c.bezierCurveTo(s * 0.6, -s * 1.0, s * 1.2, -s * 0.4, s * 1.05, s * 0.75);
        c.quadraticCurveTo(0, s * 0.95, -s * 1.05, s * 0.75); c.fill();
        const eyes = [[0, -0.35, 0.24], [-0.5, -0.2, 0.16], [0.5, -0.2, 0.16], [-0.3, -0.7, 0.12], [0.3, -0.7, 0.12], [-0.62, 0.22, 0.1], [0.62, 0.22, 0.1]];
        eyes.forEach(([x, y, r], i) => {
          if (Math.sin(t * 1.7 + i * 1.9) > 0.95) { c.strokeStyle = "#3a0a12"; c.lineWidth = s * 0.05; c.beginPath(); c.moveTo((x - r) * s, y * s); c.lineTo((x + r) * s, y * s); c.stroke(); }
          else eye(c, x * s, y * s, r * s, "#3a0a12", Math.cos(t + i) * 0.3, Math.sin(t * 1.3 + i) * 0.3);
        });
        c.fillStyle = "#3a0a12"; oval(c, 0, s * 0.45, s * 0.35, s * 0.12); c.fill();

let AC = null;

  o.type = type; o.frequency.setValueAtTime(f, s); if (slideTo) o.frequency.exponentialRampToValueAtTime(f * slideTo, s + dur);
  g.gain.setValueAtTime(0.0001, s); g.gain.exponentialRampToValueAtTime(vol, s + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, s + dur); o.connect(g).connect(AC.destination); o.start(s); o.stop(s + dur + 0.05); }

function voice(id, kind, n = 3) { // squeaky alien gibberish
  const f = PITCH[id] || 500, type = id === "chonk" || id === "mother" ? "sawtooth" : "square";
  if (kind === "ouch") { tone(f * 1.5, 0.25, type, 0.06, 0.45); return; }
  if (kind === "yay") { tone(f, 0.1, type, 0.05, 1.4); tone(f * 1.3, 0.14, type, 0.05, 1.3, 0.12); return; }
  if (kind === "laugh") { for (let k = 0; k < 5; k++) tone(f * (1.3 - k * 0.09), 0.08, type, 0.05, 0.85, k * 0.11); return; }
  for (let k = 0; k < clamp(n, 2, 6); k++) tone(f * (0.8 + Math.random() * 0.6), 0.08, type, 0.045, Math.random() < 0.5 ? 0.8 : 1.25, k * 0.1);
}

    const st = starsFor(throws, L.par);
    if (st > SAVE.best[si][li]) { SAVE.best[si][li] = st; save(); }
    const next = li + 1 < LEVELS ? [si, li + 1] : si + 1 < STAGES.length && stageOpen(si + 1) ? [si + 1, 0] : null;
    openMenu(`<p class="kicker">${S.short} · Level ${li + 1}</p><h2>${throws <= L.hp ? "Perfect aim!" : "Splat!"}</h2>
      <div class="bigStars">${starStr(st)}</div>
      <p>You beat ${CHARS.byId(foe.id).name} in <b>${throws}</b> throw${throws === 1 ? "" : "s"}. Par is ${L.par}. ${st === 3 ? `${CHARS.byId(SAVE.char).name} is thrilled!` : `${st === 2 ? `Par or better for three stars.` : `Under ${L.par + 3} throws for two stars.`}`}</p>
      <p class="score">${S.short}: <span class="stars">${stageStars(si)}/24 ★</span></p>
      ${next ? `<button class="big main" data-act="play" data-arg="${next[0]}|${next[1]}">${next[0] !== si ? `Next stage: ${STAGES[next[0]].short} ▶` : `Level ${next[1] + 1} ▶`}</button>`
        : si + 1 === STAGES.length && li + 1 === LEVELS ? `<p><b>Mother Blob is beaten!</b> Go back for any missing stars.</p>` : ""}
      <button class="big" data-act="play" data-arg="${si}|${li}">Play again</button>
      <button class="big" data-act="stage" data-arg="${si}">All levels</button>`);
  } else {
    openMenu(`<p class="kicker">${S.short} · Level ${li + 1}</p><h2>Splatted!</h2>
      <p>${CHARS.byId(foe.id).name} got you. Check the <b>wind</b> before each throw, and use your <b>last throw's dots</b> to adjust.</p>
      <button class="big main" data-act="play" data-arg="${si}|${li}">Try again</button>
      <button class="big" data-act="stage" data-arg="${si}">All levels</button>`);
  }
}
function pauseMenu() {
  openMenu(`<p class="kicker">Paused</p><h2>${S.short} · Level ${li + 1}</h2>
    <p>Throws <b>${throws}</b> (par ${L.par}) · shields <b>${me.hp}</b></p>
    <button class="big main" data-act="resume">Resume</button>
    <button class="big" data-act="play" data-arg="${si}|${li}">Restart level</button>
    <button class="big" data-act="stage" data-arg="${si}">All levels</button>
    ${soundBtn()}
    <button class="big" data-act="title">Main menu</button>`);
}
// How to play: short pages with demos
const HOWTO = [
  { title: "Pull back to lob", lines: ["<b>Pull back</b> anywhere and <b>let go</b> to throw goo", "Longer pull = <b>harder</b> throw. The dots show the start of the arc"], demo: demoPull },
  { title: "Wind and gravity", lines: ["The <b class='c'>wind</b> gauge at the top: it changes every turn", "Each planet has its own <b class='y'>gravity</b>: low g floats, high g drops fast", "Faded dots show <b>your last throw</b>, to adjust from"], demo: demoWind },
  { title: "Blast the scenery", lines: ["Goo blows <b>craters</b> in towers and rock", "Blow away the ground under an alien and it <b class='r'>falls</b>", "Splash damage counts, even <b class='r'>on you</b>!"], demo: demoBlast },
  { title: "Stars", lines: ["Win in <b>par</b> throws or fewer = <b class='y'>★★★</b>", "Up to par + 2 = <b class='y'>★★</b> · any win = <b class='y'>★</b>", "You have <b class='r'>3 shields</b>. Lose them and try again"], demo: demoStars },
];
function helpMenu(back, page = 0) {
  const p = HOWTO[page], lastPage = page === HOWTO.length - 1, first = back === "first", done = first ? "start" : back === "game" ? "resume" : "title";
  openMenu(`<p class="kicker">How to play · ${page + 1} of ${HOWTO.length}</p><h2>${p.title}</h2>
    <canvas id="howCv"></canvas><ul class="how">${p.lines.map(l => `<li>${l}</li>`).join("")}</ul>
    <div class="dots">${HOWTO.map((_, k) => `<i class="${k === page ? "on" : ""}"></i>`).join("")}</div>
    <div class="row">${page ? `<button class="big" data-act="help" data-arg="${back}|${page - 1}">◀ Back</button>` : `<button class="big" data-act="${done}">${first ? "Skip" : "Close"}</button>`}
      ${lastPage ? `<button class="big main" data-act="${done}">${first ? "Let's go ▶" : "Done"}</button>` : `<button class="big main" data-act="help" data-arg="${back}|${page + 1}">Next ▶</button>`}</div>`,
    tt => { const cvs = $("howCv"); if (!cvs) return; const [c, w, h] = fitCanvas(cvs); c.fillStyle = "#0a1428"; c.fillRect(0, 0, w, h); p.demo(c, tt, w, h); });
}
function finger(c, x, y, down) { c.fillStyle = down ? "rgba(79,209,255,0.4)" : "rgba(255,255,255,0.25)"; c.beginPath(); c.arc(x, y, 15, 0, TAU); c.fill(); c.fillStyle = down ? "#4fd1ff" : "#fff"; c.beginPath(); c.arc(x, y, 6, 0, TAU); c.fill(); }
function label(c, text, x, y, col) { c.fillStyle = col; c.font = "800 13px system-ui"; c.textAlign = "center"; c.fillText(text, x, y); }
function towers(c, w, h, col = "#6c7f99") { c.fillStyle = col; c.fillRect(0, h * 0.72, w * 0.18, h); c.fillRect(w * 0.82, h * 0.7, w * 0.18, h); c.fillRect(w * 0.42, h * 0.5, w * 0.16, h); }
function demoPull(c, tt, w, h) {
  towers(c, w, h); const T = tt % 3.6, ax = w * 0.09, ay = h * 0.72, pull = clamp((T - 0.3) / 0.9, 0, 1);
  CHARS.draw(c, SAVE.char, ax, ay - 10, 11, tt * 2);
  if (T < 1.5) { c.fillStyle = "#ffd25d"; let x = ax, y = ay - 24, vx = 120 + pull * 90, vy = -(140 + pull * 110); for (let k = 0; k < 7; k++) { vy += 300 * 0.06; x += vx * 0.06; y += vy * 0.06; c.globalAlpha = 1 - k / 9; c.beginPath(); c.arc(x, y, 2.4, 0, TAU); c.fill(); } c.globalAlpha = 1;
    finger(c, w * 0.35 - pull * 40, h * 0.35 + pull * 40, T > 0.2); label(c, "pull back…", w * 0.5, h - 10, "#fff"); }
  else { const k = Math.min(1, (T - 1.5) / 1.3), x = ax + (w * 0.9 - ax) * k, y = ay - 24 + (h * 0.7 - 10 - ay + 24) * k - Math.sin(k * PI) * h * 0.6; drawGoo(c, x, y, CHARS.byId(SAVE.char).color, tt * 10); label(c, "…let go!", w * 0.5, h - 10, "#5dff9b"); }
  CHARS.draw(c, "runner", w * 0.91, h * 0.7 - 10, 11, tt * 2);
}
function demoWind(c, tt, w, h) {
  towers(c, w, h); const T = tt % 4, k = Math.min(1, T / 1.8), ax = w * 0.09, ay = h * 0.72 - 24;
  for (const [pushW, col, txt] of [[0, "rgba(255,255,255,0.35)", "no wind"], [-w * 0.32, "#4fd1ff", "headwind"]]) {
    c.fillStyle = col; for (let i = 1; i <= 24; i++) { const q = i / 24 * k; const x = ax + (w * 0.88 - ax) * q + pushW * q * q, y = ay - Math.sin(q * PI) * h * 0.6 + (h * 0.02) * q; c.beginPath(); c.arc(x, y, 2, 0, TAU); c.fill(); }
    if (k >= 1) { const x = ax + (w * 0.88 - ax) + pushW; label(c, txt, clamp(x, 30, w - 30), h * 0.62 + (pushW ? 18 : 0), col); } }
  c.strokeStyle = "#4fd1ff"; c.lineWidth = 3; c.beginPath(); c.moveTo(w * 0.62, 14); c.lineTo(w * 0.42, 14); c.stroke(); c.beginPath(); c.moveTo(w * 0.40, 14); c.lineTo(w * 0.44, 9); c.lineTo(w * 0.44, 19); c.closePath(); c.fillStyle = "#4fd1ff"; c.fill();
  label(c, "WIND", w * 0.72, 18, "#93a6c9");
  CHARS.draw(c, SAVE.char, w * 0.09, h * 0.72 - 10, 11, tt * 2);
}
function demoBlast(c, tt, w, h) {
  const T = tt % 4, hole = T > 1.2, fall = T > 1.5 ? Math.min(h * 0.4, (T - 1.5) ** 2 * 300) : 0;
  c.fillStyle = "#93a3b8"; c.fillRect(w * 0.55, h * 0.55, w * 0.22, h);
  if (hole) { c.fillStyle = "#0a1428"; c.beginPath(); c.arc(w * 0.66, h * 0.55, 26, 0, TAU); c.fill(); }
  CHARS.draw(c, "chonk", w * 0.66, h * 0.55 - 10 + fall, 11, tt * 2, 0, fall ? 0.4 : 0, hole ? 1 : 0);
  if (!hole) { const k = Math.min(1, T / 1.2); drawGoo(c, w * 0.1 + (w * 0.56) * k, h * 0.3 + Math.sin(k * PI - PI / 2) * 10 + k * h * 0.2, "#5dff9b", tt * 10); }
  else if (T < 1.6) { c.fillStyle = "#ffd25d"; for (let k = 0; k < 10; k++) { const a = k / 10 * TAU; c.beginPath(); c.arc(w * 0.66 + Math.cos(a) * (T - 1.2) * 90, h * 0.55 + Math.sin(a) * (T - 1.2) * 90, 3, 0, TAU); c.fill(); } }
  label(c, hole ? "the ground's gone!" : "aim for the ground…", w * 0.5, h - 10, hole ? "#ff8f9f" : "#fff");
}
function demoStars(c, tt, w, h) {
  [["1–2 throws", "★★★"], ["3–4 throws", "★★"], ["5+ throws", "★"]].forEach(([a, b], i) => { const y = h * (0.28 + i * 0.25);
    c.font = "800 16px system-ui"; c.textAlign = "left"; c.fillStyle = "#e6f0ff"; c.fillText(a, w * 0.16, y); c.fillStyle = "#ffd25d"; c.fillText(b, w * 0.62, y); });
  label(c, "for a par-2 level", w / 2, h - 10, "#93a6c9");
}

let pending;
const ACT = {
  title: () => titleMenu(),
  stage: s => stageMenu(+s),
  worlds: () => worldsMenu(),
  setup: a => setupMenu(...a.split("|").map(Number)),
  chars: a => charMenu(...a.split("|").map(Number)),
  pick: a => { const [w, l, id] = a.split("|"); SAVE.char = id; save(); charMenu(+w, +l); },
  play: a => { pending = a.split("|").map(Number); if (SAVE.seenHelp) ACT.start(); else helpMenu("first", 0); },
  start: () => { if (!SAVE.seenHelp) { SAVE.seenHelp = true; save(); } loadLevel(...pending); closeMenu(); },
  resume: () => closeMenu(),
  help: a => { const [back, page] = a.split("|"); helpMenu(back, +page || 0); },
  sound: () => { SAVE.sound = !SAVE.sound; save(); for (const b of $("box").querySelectorAll("[data-act='sound']")) b.textContent = SAVE.sound ? "🔊 Sound: On" : "🔇 Sound: Off"; tone(520, 0.1, "triangle", 0.07); },
};
// ---------- full screen (like Dr Alien). Hidden where the browser can't do it, such as iPhone Safari. ----------
(() => {
  const btn = $("fsBtn"), root = document.documentElement, req = root.requestFullscreen || root.webkitRequestFullscreen;
  const can = !!(req && (document.fullscreenEnabled || document.webkitFullscreenEnabled)); btn.hidden = !can; if (!can) return;
  const isFull = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
  const ICON = on => `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="${on ? "M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5" : "M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"}"/></svg>`;
  const sync = () => { const on = isFull(); btn.innerHTML = ICON(on); btn.setAttribute("aria-label", on ? "Exit full screen" : "Full screen"); btn.setAttribute("aria-pressed", String(on)); setTimeout(resize, 120); };
  btn.onclick = () => { audio(); const r = isFull() ? (document.exitFullscreen || document.webkitExitFullscreen).call(document) : req.call(root); if (r && r.catch) r.catch(() => {}); };
  document.addEventListener("fullscreenchange", sync); document.addEventListener("webkitfullscreenchange", sync); sync();
})();
$("menuBtn").onclick = () => { audio(); if (me && (state === "aim" || state === "fly" || state === "boom" || state === "foe") && !paused) pauseMenu(); else titleMenu(); };
$("helpBtn").onclick = () => { audio(); helpMenu(me && !paused ? "game" : "title", 0); };

// ============================================================
//  MAIN LOOP: fixed 1/60 s steps
// ============================================================
let last = performance.now(), acc = 0;
function frame(now) {
  const dt = clamp((now - last) / 1000, 0, 0.1);
  last = now;
  acc += dt; let n = 0;
  while (acc >= 1 / 60 && n < 6) { update(1 / 60); acc -= 1 / 60; n++; }
  if (n === 6) acc = 0;
  if (menuAnim) menuAnim(now / 1000);
  draw(now / 1000);
  requestAnimationFrame(frame);
}
resize();
loadLevel(0, 0); bubbles = [];
titleMenu();
requestAnimationFrame(frame);
</script>
</body>
</html>
