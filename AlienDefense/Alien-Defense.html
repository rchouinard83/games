    const col = COL.arc, seed = Math.floor(s.t * 24); plinth(c, 0, col, s.t);
    const spire = () => poly(c, [[47, 130], [61, 54], [89, 54], [103, 130]]);
    spire(); c.fillStyle = lg(c, 47, 54, 103, 130, "#c8ccd9", "#5a5e74"); c.fill();
    c.save(); spire(); c.clip(); c.strokeStyle = "rgba(55,58,78,0.55)"; c.lineWidth = 1.2;
    for (let y = 66, r = 0; y < 130; y += 11, r++) { c.beginPath(); c.moveTo(40, y); c.lineTo(110, y); c.stroke();
      for (let x = 46 + (r % 2 ? 7 : 14); x < 106; x += 14) { c.beginPath(); c.moveTo(x, y - 11); c.lineTo(x, y); c.stroke(); } }
    c.restore(); spire(); ink(c);
    for (const sd of [-1, 1]) { c.beginPath(); c.moveTo(75 + sd * 12, 58); c.quadraticCurveTo(75 + sd * 28, 42, 75 + sd * 19, 22); stroke2(c, 6.5, 3.5, "#8a8fa6"); }
    const g = 0.4 + 0.6 * Math.max(s.charge, s.fire);
    glowOn(c, col, 16 * g); poly(c, [[75, 12], [87, 35], [75, 58], [63, 35]]); fi(c, lg(c, 63, 12, 87, 58, "#f6ecff", col), 1.8); glowOff(c);
    c.fillStyle = "rgba(255,255,255,0.9)"; poly(c, [[75, 22], [79, 35], [75, 48], [71, 35]]); c.fill();
    if (Math.sin(s.t * 13) > 0.2 || s.charge > 0.7) { c.strokeStyle = ha(col, 0.95); c.lineWidth = 1.6; zig(c, 56, 22, 94, 22, 5, 6, seed); c.stroke(); }
    if (s.fire > 0.3) { c.fillStyle = ha("#ffffff", s.fire * 0.5); circ(c, 75, 35, 24); c.fill(); }
  }

  function mineBase(c, era, col, t) {
    const x = 75;
    if (era === 0) {
      c.fillStyle = "#4a3620"; rr(c, x - 36, 128, 72, 14, 4); c.fill();
      c.fillStyle = "#6b5233"; rr(c, x - 36, 128, 72, 6, 3); c.fill();
      c.strokeStyle = "#3a2a18"; c.lineWidth = 1;
      for (let i = 1; i < 4; i++) { c.beginPath(); c.moveTo(x - 36 + i * 18, 128); c.lineTo(x - 36 + i * 18, 142); c.stroke(); }
    } else if (era === 1) {
      c.fillStyle = "#232a40"; rr(c, x - 38, 128, 76, 14, 5); c.fill();
      c.fillStyle = "#3a4568"; rr(c, x - 38, 128, 76, 6, 3); c.fill();
      c.fillStyle = col; c.fillRect(x - 30, 136, 60, 2);
    } else {
      const p = 0.5 + 0.5 * Math.sin(t * 2.4);
      c.fillStyle = ha(col, 0.18 + 0.22 * p); c.beginPath(); c.ellipse(x, 138, 44, 10, 0, 0, TAU); c.fill();
      c.fillStyle = "#161c30"; rr(c, x - 34, 128, 68, 12, 5); c.fill();
      glowOn(c, col, 10); c.fillStyle = col; c.fillRect(x - 28, 131, 56, 3); glowOff(c);
    }
  }

  function mine(c, era, s) {
    const x = 75, col = COL.mine;
    mineBase(c, era, col, s.t);
    if (era === 0) { // Spike Pit: spikes twitch, then spring up when triggered
      c.fillStyle = "#2a1f12"; c.fillRect(x - 30, 100, 60, 28);
      c.strokeStyle = "#6b5233"; c.lineWidth = 5; c.strokeRect(x - 30, 100, 60, 28);
      const up = s.fire > 0 ? 26 * s.fire : 2 + Math.sin(s.t * 3) * 1.5;
      for (let i = 0; i < 5; i++) {
        const sx = x - 22 + i * 11;
        c.fillStyle = "#c9b98a"; c.beginPath(); c.moveTo(sx - 4, 112); c.lineTo(sx, 100 - up); c.lineTo(sx + 4, 112); c.closePath(); c.fill();
        c.fillStyle = col; c.beginPath(); c.moveTo(sx - 1.5, 104 - up); c.lineTo(sx, 100 - up); c.lineTo(sx + 1.5, 104 - up); c.closePath(); c.fill();
      }
    } else if (era === 1) { // Landmine: red light blinks, jumps and flashes when triggered
      const lift = s.fire * 10;
      c.strokeStyle = "#8a7350"; c.lineWidth = 1.5; c.beginPath(); c.moveTo(x + 34, 112); c.quadraticCurveTo(x + 46, 116, x + 42, 128); c.stroke();
      c.fillStyle = "rgba(0,0,0,0.35)"; c.beginPath(); c.ellipse(x, 120, 34, 8, 0, 0, TAU); c.fill();
      c.fillStyle = "#3a4568"; c.beginPath(); c.ellipse(x, 112 - lift, 35, 14, 0, 0, TAU); c.fill();
      c.strokeStyle = "#2a3350"; c.lineWidth = 2;
      for (let k = 0; k < 10; k++) { const a = k / 10 * TAU; c.beginPath(); c.moveTo(x + Math.cos(a) * 29, 112 - lift + Math.sin(a) * 11); c.lineTo(x + Math.cos(a) * 34, 112 - lift + Math.sin(a) * 13); c.stroke(); }
      c.fillStyle = "#2a3350"; c.beginPath(); c.ellipse(x, 108 - lift, 26, 9, 0, 0, TAU); c.fill();
      c.fillStyle = col; c.fillRect(x - 26, 108 - lift, 52, 2);
      const on = Math.sin(s.t * 5) > 0 || s.fire > 0;
      if (on) glowOn(c, col, 10);
      c.fillStyle = on ? col : "#5a2020"; circ(c, x, 105 - lift, 5); c.fill(); glowOff(c);
      if (s.fire > 0.4) { c.fillStyle = "#ffe08a"; star(c, x, 96 - lift, 16, 6, 8); c.fill(); }
    } else { // Energy Trap: dashes race around the ring, it bursts when triggered
      const p = 0.5 + 0.5 * Math.sin(s.t * 3);
      c.fillStyle = "#1f2740"; c.beginPath(); c.ellipse(x, 112, 37, 15, 0, 0, TAU); c.fill();
      c.save(); c.setLineDash([8, 6]); c.lineDashOffset = -s.t * 24; glowOn(c, col, 10);
      c.strokeStyle = ha(col, 0.65 + 0.3 * p); c.lineWidth = 3; c.beginPath(); c.ellipse(x, 112, 37, 15, 0, 0, TAU); c.stroke(); c.restore(); glowOff(c);
      c.fillStyle = ha(col, 0.55 + 0.35 * p); c.beginPath(); c.ellipse(x, 110, 15, 6, 0, 0, TAU); c.fill();
      c.fillStyle = "#ffd25d"; circ(c, x, 110, 3); c.fill();
      for (let i = 0; i < 6; i++) { const a = s.t * 2 + i * Math.PI / 3; c.fillStyle = ha(col, 0.6); circ(c, x + Math.cos(a) * 42, 112 + Math.sin(a) * 17, 2); c.fill(); }
      if (s.fire > 0) { c.strokeStyle = ha(col, s.fire); c.lineWidth = 3; c.beginPath(); c.ellipse(x, 112, 37 + (1 - s.fire) * 30, 15 + (1 - s.fire) * 12, 0, 0, TAU); c.stroke(); }
    }
  }

  // Upgrade flash: a ring and sparks burst out as a tower evolves (k: 0 → 1)
  function drawEvolve(c, k, col) {
    if (k <= 0 || k >= 1) return;
    const x = 75, y = 82;
    c.fillStyle = ha("#ffffff", (1 - k) * 0.55); c.fillRect(0, 0, 150, 150);
    c.strokeStyle = ha(col, 1 - k); c.lineWidth = 6 * (1 - k) + 1; circ(c, x, y, 20 + k * 70); c.stroke();
    for (let i = 0; i < 10; i++) { const a = i / 10 * TAU, d = 20 + k * 60; c.fillStyle = ha(i % 2 ? "#ffffff" : col, 1 - k); circ(c, x + Math.cos(a) * d, y + Math.sin(a) * d * 0.8, 3); c.fill(); }
    c.fillStyle = ha("#ffd25d", 1 - k); c.font = "800 16px system-ui, sans-serif"; c.textAlign = "center";
    c.fillText("▲ UPGRADE", x, 20 + (1 - k) * 10);
  }

  const DRAW = { people, bolt, frost, cannon, arc, mine };
  return {
    // Draws a tower inside a 1×1 cell, with the existing upgrade flash.
    draw(c, type, level, st, glowScale, evo = -1) {
      GL = glowScale;
      c.save(); c.beginPath(); c.rect(0, 0, 1, 1); c.clip();
      c.translate(0.5, 0.5); c.scale(1 / 138, 1 / 138); c.translate(-75, -80);
      DRAW[type](c, level, st);
      if (evo >= 0) drawEvolve(c, evo, COL[type]);
      c.restore(); c.shadowBlur = 0;
    },
  };
})();

// Render each tower with the in-game drawing code into a small image (used in the build bar and the Lab)
const ICONS = {}, LEVEL_ICONS = {}, ENEMY_ICONS = []; // LEVEL_ICONS[type][level], ENEMY_ICONS[stage][type]
function buildIcons() {
  const px = 72;
  for (const type of Object.keys(TOWERS)) {
    const c = document.createElement("canvas");
    c.width = c.height = px;
    const saved = ctx;
    ctx = c.getContext("2d");
    ctx.setTransform(px, 0, 0, px, 0, 0);
    LEVEL_ICONS[type] = [];
    for (let level = 0; level < 3; level++) {
      ctx.setTransform(px, 0, 0, px, 0, 0); ctx.clearRect(0, 0, 1, 1);
      const t = { type, x: 0, y: 0, level, cd: 0, angle: -Math.PI / 2, icon: true };
      (TOWERS[type].walkable ? drawMine : drawTower)(t, px / 150);
      LEVEL_ICONS[type][level] = c.toDataURL();
    }
    ctx = saved;
    ICONS[type] = LEVEL_ICONS[type][0];
  }
  for (const b of buildEl.children) b.querySelector(".ic").src = ICONS[b.dataset.type];
  for (let stage = 0; stage < 4; stage++) {
    ENEMY_ICONS[stage] = {};
    for (const [type, d] of Object.entries(ENEMIES)) {
      const c = document.createElement("canvas");
      c.width = c.height = 64;
      const ic = c.getContext("2d"), k = 64 * 0.27 / d.size;
      ic.setTransform(k, 0, 0, k, 32, 34);
      ALIENS.draw(ic, type, stage, 1.3, d.size, k, true);
      ENEMY_ICONS[stage][type] = c.toDataURL();
    }
  }
  updateWaveBar();
}

// ---- Stat helpers used by the build card, tower panel and Tower Guide
const fmt = n => n >= 100 ? String(Math.round(n)) : String(Math.round(n * 10) / 10);
function totalCost(type, level) {
  const d = TOWERS[type]; let c = d.cost;
  for (let i = 1; i <= level; i++) c += d.levels[i].cost;
  return c;
}
// Main damage number: HP removed per hit (per blast for mines)
function power(type, level) { return stats({ type, level }).dmg; }
const powerUnit = type => TOWERS[type].walkable ? "HP per blast" : "HP per hit";
// Time between shots or mine triggers.
function speedText(type, level) {
  const st = stats({ type, level });
  const seconds = Number(st.reload.toFixed(2));
  return TOWERS[type].walkable ? `Rearm ${seconds}s` : `Reload ${seconds}s`;
}
// Hits needed for the enemy's best counter tower (level 1) to destroy one enemy at wave n
function hitsToKill(enemyType, n) {
  const d = ENEMIES[enemyType], t = TOWERS[d.counter];
  const dmg = power(d.counter, 0) * (d.flying && t.airMul ? t.airMul : 1);
  return Math.max(1, Math.ceil(hpOf(enemyType, n) / dmg));
}
// "1 hit", "4 hits", "2 blasts"
function hitsLabel(enemyType, n) {
  const h = hitsToKill(enemyType, n), blast = TOWERS[ENEMIES[enemyType].counter].walkable;
  return `${h} ${blast ? "blast" : "hit"}${h === 1 ? "" : "s"}`;
}
// Value score: damage per second per 100 gold invested (mines: as if triggered every rearm)
function value(type, level) {
  const st = stats({ type, level });
  const dps = st.dmg / st.reload;
  return dps / totalCost(type, level) * 100;
}
// Value in the tower's best situation
function roleValue(type, level) {
  const v = value(type, level);
  return type === "cannon" ? v * 3 : type === "arc" ? v * 2 : v;
}
function valueText(type, level) {
  const v = value(type, level);
  switch (type) {
    case "cannon": return `${fmt(v)} (~${fmt(v * 3)} vs groups)`;
    case "arc": return `${fmt(v)} (${fmt(v * 2)} vs flyers)`;
    case "frost": return `${fmt(v)} + slows`;
    case "mine": return `${fmt(v)} if triggered often`;
    default: return fmt(v);
  }
}
function targetsText(def) { return def.air && def.ground ? "Ground + Air" : def.air ? "Air only" : "Ground only"; }
function specialText(type, level) {
  const st = stats({ type, level });
  switch (type) {
    case "frost": return `Slows everything within ${st.splash} cells to ${Math.round(st.slow * 100)}% speed for ${st.slowT}s`;
    case "cannon": return `Hits every ground enemy within ${st.splash} cell${st.splash === 1 ? "" : "s"}`;
    case "arc": return "Double damage vs air";
    case "mine": return `Blast ${st.splash} cell${st.splash === 1 ? "" : "s"}, rearms in ${st.rearm}s`;
    default: return "Single target";
  }
}

function guideMenu(back) {
  const blocks = Object.entries(TOWERS).map(([type, def]) => {
    const rows = def.levels.map((L, lv) => {
      const st = stats({ type, level: lv });
      const pw = power(type, lv), gain = lv ? pw - power(type, lv - 1) : 0;
      return `<tr><td><img src="${(LEVEL_ICONS[type] || [])[lv] || ""}" alt="" style="width:26px;height:26px;vertical-align:middle"> L${lv + 1}<br><span style="font-size:10px;color:var(--muted)">${def.levelNames[lv]}</span></td>
        <td>${lv ? "+" + L.cost : def.cost}◆</td>
        <td>${fmt(pw)}${lv ? ` <span class="up">+${fmt(gain)}</span>` : ""}</td>
        <td>${Number(st.reload.toFixed(2))}s</td>
        <td class="v">${fmt(value(type, lv))}</td></tr>`;
    }).join("");
    const airNote = def.airMul ? ` · vs flyers: ${fmt(power(type, 0) * def.airMul)}–${fmt(power(type, 2) * def.airMul)} HP per hit` : "";
    return `<div class="guide">
      <div class="hd"><img src="${ICONS[type]}" alt=""><span class="t">${def.name}</span></div>
      <div class="sub"><b style="color:var(--text)">Best for: ${def.best}</b> · ${targetsText(def)}<br>${specialText(type, 0)}${airNote}</div>
      <table><tr><th>Lvl</th><th>Cost</th><th>${def.walkable ? "HP/blast" : "HP/hit"}</th><th>${def.walkable ? "Rearm" : "Reload"}</th><th>Value</th></tr>${rows}</table>
    </div>`;
  }).join("");
  const summary = Object.entries(TOWERS).map(([type, def]) => `<tr>
      <td><img src="${ICONS[type]}" alt="" style="width:20px;height:20px;vertical-align:middle"> ${def.name}</td>
      <td>${def.cost}◆</td><td style="text-align:left">${def.best}</td>
      <td class="v">${type === "frost" ? "slows" : fmt(roleValue(type, 0))}</td></tr>`).join("");
  const nw = S.wave + 1, hpMul = waveHpMul(nw);
  const enemies = Object.entries(ENEMIES).map(([type, d]) => `<tr>
      <td><img src="${enemyIcon(type, nw)}" alt="" style="width:20px;height:20px;vertical-align:middle"> ${enemyName(type, nw)} <span style="color:var(--muted);font-size:11px">${d.name}</span></td>
      <td>${Math.round(d.hp * hpMul)}</td><td style="color:var(--bad)">−${d.leak || 1}♥</td><td>${d.speed}</td><td>${killGold(type)}◆</td>
      <td style="text-align:left;white-space:normal">${d.note}</td></tr>`).join("");
  openMenu(`<h2>Tower Guide</h2>
    <p><b>HP/hit</b> = how much enemy HP one hit removes. <b>Hits</b> = hits per second.
    <b style="color:var(--gold)">Value</b> = how much damage you get for your gold (higher is better), in the job each tower is best at.
</p>
    <div class="guide"><table><tr><th>Tower</th><th>Cost</th><th style="text-align:left">Best for</th><th>Value</th></tr>${summary}</table></div>
    ${blocks}
    <div class="guide"><div class="hd"><span class="t">Enemies at wave ${nw}</span></div>
      <table><tr><th>Enemy</th><th>HP</th><th>Base</th><th>Speed</th><th>Gold</th><th style="text-align:left">Notes</th></tr>${enemies}</table></div>
    <button class="big" data-act="${back || "main"}">Back</button>`);
}

// ============================================================
//  IN-GAME UI

const buildEl = $("build"), infoEl = $("info"), hintEl = $("hint");

function cellFromPoint(clientX, clientY) {
  const r = cv.getBoundingClientRect();
  return { x: Math.floor((clientX - r.left) / CELL), y: Math.floor((clientY - r.top) / CELL) };
}

// Tower buttons: tap to select, or drag straight onto the field.
let drag = null;
for (const [key, def] of Object.entries(TOWERS)) {
  const b = document.createElement("button");
  b.className = "tbtn"; b.dataset.type = key;
  b.innerHTML = `<img class="ic" alt=""><span class="nm">${def.name}</span><span class="dp"></span><span class="cs">◆${def.cost}</span>`;
  b.addEventListener("pointerdown", ev => {
    if (S.over || S.menu) return;
    drag = { type: key, moved: false, wasSel: S.buildType === key, touch: ev.pointerType !== "mouse" };
    b.setPointerCapture(ev.pointerId);
    selectBuild(key);
  });
  b.addEventListener("pointermove", ev => {
    if (!drag) return;
    // on touch, lift the ghost above the finger so you can see it
    const c = cellFromPoint(ev.clientX, ev.clientY - (drag.touch ? CELL * 1.2 : 0));
    if (inGrid(c.x, c.y)) { drag.moved = true; S.ghost = c; } else S.ghost = null;
  });
  b.addEventListener("pointerup", () => {
    if (!drag) return;
    const d = drag; drag = null;
    if (d.moved) { if (S.ghost) tryPlace(S.ghost); S.ghost = null; }
    else if (d.wasSel) selectBuild(null);
  });
  b.addEventListener("pointercancel", () => { drag = null; S.ghost = null; });
  buildEl.appendChild(b);
}

function enemyInfo(e) {
  const d = e.def, best = TOWERS[d.counter];
  return `<img src="${enemyIcon(e.type, e.wave)}" alt="" style="width:18px;height:18px;vertical-align:middle"> <b>${enemyName(e.type, e.wave)}${e.baby ? " baby" : ""}</b> <span style="color:var(--muted)">(${e.baby ? offspringSource(e.baby) : d.name})</span> · ` +
    `<span style="color:#ff9d6b;font-weight:700">${num(Math.max(0, e.hp))}/${num(e.maxHp)} HP</span> · ` +
    `<b style="color:var(--bad)">−${d.leak || 1}♥ to your base if it gets through</b><br>` +
    `Speed ${d.speed}${e.slowT > 0 ? " (slowed)" : ""} · ${d.flying ? "Flies over the maze · " : ""}${offspringReward(e.type, e.baby)}◆ when destroyed · ` +
    `Best: <img src="${ICONS[d.counter]}" alt="" style="width:14px;height:14px;vertical-align:middle"> ${best.name}`;
}

function selectBuild(type) {
  S.buildType = type; S.selected = null; S.ghost = null; S.selEnemy = null;
  refreshBar();
}

function refreshBar() {
  for (const b of buildEl.children) {
    b.classList.toggle("sel", b.dataset.type === S.buildType);
    b.classList.toggle("poor", TOWERS[b.dataset.type].cost > S.gold);
    const type = b.dataset.type; // damage shown on the button
    b.querySelector(".dp").innerHTML = `⚔${Math.round(power(type, 0))} <small>HP</small>`;
  }
  if (S.selEnemy && !S.enemies.includes(S.selEnemy)) S.selEnemy = null; // destroyed or escaped
  if (S.selected) {
    const t = S.selected, def = TOWERS[t.type], st = stats(t), next = def.levels[t.level + 1];
    const unit = powerUnit(t.type), pw = power(t.type, t.level);
    buildEl.style.display = "none"; infoEl.style.display = "flex";
    $("infoText").innerHTML = `<b>${def.name} L${t.level + 1}</b> · ${def.levelNames[t.level]}<br>${fmt(pw)} ${unit}`;
    const canUp = !!next && S.gold >= next.cost;
    $("upBtn").innerHTML = !next ? "Max<br>level" : canUp ? `Upgrade<br>−${next.cost}◆` : `Upgrade<br><span class="short">−${next.cost}◆</span>`;
    $("upBtn").disabled = !canUp;
    $("upBtn").classList.toggle("can", canUp); // highlight when affordable
    const full = refund(t) === t.spent;
    $("sellBtn").innerHTML = `Sell<br>+${refund(t)}◆`;
    $("sellBtn").classList.toggle("full", full);
    let up;
    if (next) {
      const npw = power(t.type, t.level + 1);
      up = `Upgrade to <b>${def.levelNames[t.level + 1]}</b> for ${next.cost}◆: <b>${fmt(npw)} ${unit}</b> <span class="up">(+${fmt(npw - pw)})</span> · ${speedText(t.type, t.level + 1)}`;
    } else up = "Fully upgraded.";
    hintEl.innerHTML = `Now: <b>${fmt(pw)} ${unit}</b>${def.airMul ? ` (${fmt(pw * def.airMul)} vs flyers)` : ""} · ${speedText(t.type, t.level)}` +
      `${def.walkable ? "" : ` · range ${fmt(st.range)}`}<br>${up}` +
      (full ? `<br><span class="val">Full refund until the next wave starts.</span>` : "");
  } else {
    buildEl.style.display = "grid"; infoEl.style.display = "none";
    if (S.buildType) {
      const type = S.buildType, def = TOWERS[type], st = stats({ type, level: 0 });
      hintEl.innerHTML = `<b>${def.name}</b> ◆${def.cost} · <b>${fmt(power(type, 0))} ${powerUnit(type)}</b>${def.airMul ? ` (${fmt(power(type, 0) * def.airMul)} vs flyers)` : ""} · ${speedText(type, 0)}` +
        `${def.walkable ? "" : ` · range ${fmt(st.range)}`} · ${targetsText(def)}<br>` +
        `<b>Best for: ${def.best}</b> · ${specialText(type, 0)} · <span class="val">Value ${valueText(type, 0)}</span> · <span class="link" data-guide="1">Compare all</span>`;
    }
    else if (S.wave === 0) hintEl.innerHTML = `Drag a tower onto the field, then press Start ▶<br><span class="link" data-guide="1">Tower Guide: cost vs damage</span>`;
    else if (S.selEnemy) hintEl.innerHTML = enemyInfo(S.selEnemy);
    else hintEl.innerHTML = `Tap a tower to upgrade or sell it, or an enemy to see its stats.<br><span class="link" data-guide="1">Tower Guide</span>`;
  }
  const bh = $("bar").offsetHeight; // bar height can change; keep the board fitted
  if (bh !== lastBarH) { lastBarH = bh; resize(); }
}
let lastBarH = 0;
hintEl.addEventListener("click", ev => {
  if (ev.target.closest("[data-guide]") && !S.menu && !S.over) guideMenu("resume");
});

let waveBarKey = "";
const hpOf = (type, n) => Math.round(ENEMIES[type].hp * waveHpMul(n));
const num = n => Math.round(n).toLocaleString();
function waveChips(n, withHits) {
  return waveGroups(n).map(g => {
    const d = ENEMIES[g.type];
    return `<span class="chip ${d.flying ? "air" : ""}" title="${g.n} ${enemyName(g.type, n)} (${d.name}), ${hpOf(g.type, n)} HP each, −${d.leak || 1} base health if one gets through. Best: ${TOWERS[d.counter].name}">` +
      `<img src="${enemyIcon(g.type, n)}" alt="">${g.n}×<span class="hp">${num(hpOf(g.type, n))}<small>hp</small></span>` +
      `<span class="lk">−${d.leak || 1}♥</span>` +
      `<span class="vs"><img src="${ICONS[d.counter] || ""}" alt="">${withHits ? ` ${hitsLabel(g.type, n)}` : ""}</span></span>`;
  }).join("");
}

function updateWaveBar() {
  if (!S) return;
  const idle = !S.enemies.length && !S.spawnQ.length;
  const left = S.enemies.length + S.spawnQ.length;
  const preview = S.wave === 0 && S.awaitingStart;
  const key = [S.map, S.diff, S.started, S.over, idle, left, S.wave, S.won, Object.keys(ENEMY_ICONS).length, Math.ceil(S.countdown), P.autoStart, preview].join("|");
  if (key === waveBarKey) return;
  waveBarKey = key;
  const of = n => S.won ? `${n}` : `${n}/${VICTORY_WAVE}`;
  const nw = S.wave + 1;
  $("waveWorld").textContent = `${S.map + 1} · ${WORLDS[S.map].name}`;
  $("waveNow").textContent = `Wave ${of(idle ? nw : S.wave)}${idle ? "" : ` · ${left} left`}`;
  $("nextEnemyChips").innerHTML = waveChips(nw);
  // Middle-of-board start card
  $("scChips").innerHTML = waveChips(nw, true);
  $("scHint").textContent = S.wave === 0
    ? `Press Start, then you have ${BUILD_TIME} seconds to build.`
    : waveGroups(nw).some(g => g.type === "boss") ? "Boss bursts include a Flyer."
    : tankSplits(nw) && waveGroups(nw).some(g => g.type === "tank") ? tankSplitText(nw) + "."
    : "Need more defense? Tap a tower below to build." + (P.autoStart ? "" : " Auto-start is off (Pause menu).");
  const nb = $("nextBtn");
  nb.hidden = preview;
  nb.disabled = !S.won && S.wave >= VICTORY_WAVE;
  nb.classList.toggle("busy", !idle);
  nb.textContent = nb.disabled ? "Final wave" : !idle ? "Early ▶" : S.wave === 0 ? "Send now ▶" : "Start ▶";
  const timer = $("hudCountdown"), seconds = Math.max(0, Math.ceil(S.countdown));
  timer.hidden = preview || !S.started || S.over || !idle;
  timer.textContent = S.wave === 0 ? `Starts in ${seconds}s` : P.autoStart ? `Auto-start in ${seconds}s` : "Auto-start off";
}

let startCardState = "";
let portraitStart;
function updateStartCard() {
  const idle = !S.enemies.length && !S.spawnQ.length;

  const building = S.wave === 0 || S.buildType || S.selected || drag;

  }

function drawStartCardPortraits(now) {
  if (!$("startCard").classList.contains("show")) return;
  portraitStart ??= now;
  const canvas = $("scPortraits"), width = canvas.clientWidth, height = canvas.clientHeight;
  if (!width || !height) return;
  const scale = Math.min(2, window.devicePixelRatio || 1);
  const w = Math.round(width * scale), h = Math.round(height * scale);
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  const c = canvas.getContext("2d");
  c.setTransform(scale, 0, 0, scale, 0, 0);
  c.clearRect(0, 0, width, height);
  const fit = Math.min(1, height / 114);
  c.scale(fit, fit);
  drawWavePortraits(c, S.wave + 1, (now - portraitStart) / 1000, width / fit, 0);
}

// ---- Current wave details ----

// Enemies of the wave(s) in progress, grouped by wave + type: on the field, still to spawn, HP left
const offspringSource = parent => parent === "tank" ? "from a tank" : "from the boss";
const babyHp = (type, wave, parent) => Math.max(1, Math.round(ENEMIES[type].hp * waveHpMul(wave) * offspringHpFraction(type, parent)));
const tankSplitText = wave => `Releases ${TANK_SPLIT.midCount}× ${enemyName("swarm", wave)} at half health and ${TANK_SPLIT.deathCount} more on defeat`;
function broodRow(type, wave) {
  const style = 'class="erow" style="color:#ff8bd0;font-weight:700"';
  if (type === "tank" && tankSplits(wave)) {
    return `<div ${style}>${tankSplitText(wave)} (${num(babyHp("swarm", wave, "tank"))} HP each)</div>`;
  }
  if (type !== "boss") return "";
  return `<div ${style}>Spawns ${broodCount(stageOf(wave)) - 1}× ${enemyName("swarm", wave)} (${num(babyHp("swarm", wave, "boss"))} HP) + ` +
    `1× ${enemyName("flying", wave)} (${num(babyHp("flying", wave, "boss"))} HP) at ${BROOD.at.map(f => f * 100).join("/")}% HP · shielded for ${BROOD.shieldTime}s</div>`;
}

// Steps the closest matching enemy still has to go before it reaches your base
function closestSteps(type, wave, baby) {
  let best = null;
  for (const e of S.enemies) {
    if (e.type !== type || e.wave !== wave || e.baby !== baby || !inBounds(e)) continue;
    const d = e.flying ? Math.ceil(Math.hypot(EXIT.x + 0.5 - e.x, EXIT.y + 0.5 - e.y))
                       : Math.max(0, S.dist[idx(e.tx, e.ty)]) + 1;
    if (best === null || d < best) best = d;
  }
  return best;
}

// Enemy details for the current wave. live = { alive, queued, hpLeft }.
function enemyCard(type, wave, n, baby, live) {
  const d = ENEMIES[type], tw = TOWERS[d.counter];
  const full = baby ? babyHp(type, wave, baby) : hpOf(type, wave);
  const hits = Math.max(1, Math.ceil(full / (power(d.counter, 0) * (d.flying && tw.airMul ? tw.airMul : 1))));
  const unit = tw.walkable ? "blast" : "hit", spd = d.speed < 1.1 ? "slow" : d.speed < 2 ? "normal" : "fast";
  let liveHtml = "";
  if (live) {
    const pct = Math.max(0, Math.min(100, 100 * live.hpLeft / (n * full)));
    const close = closestSteps(type, wave, baby);
    liveHtml = `<div class="erow">${live.alive} on the field${live.queued ? ` · ${live.queued} still coming` : ""}</div>
      <div class="gbar" title="Health left in this group"><i style="width:${pct}%"></i></div>
      ${close !== null ? `<div class="erow ${close <= 5 ? "warn" : ""}">Closest: ${close} step${close === 1 ? "" : "s"} from your base</div>` : ""}`;
  }
  return `<div class="ecard"><img class="ei" src="${enemyIcon(type, wave)}" alt="">
    <div class="ebody"><b>${n}× ${enemyName(type, wave)}${baby ? " babies" : ""}</b>
      <span class="role">${baby ? offspringSource(baby) : d.name}${live && wave !== S.wave ? ` · wave ${wave}` : ""}</span>
      ${liveHtml}
      <div class="erow"><span class="hp">${num(full)} HP</span> each · <span class="lk">−${d.leak || 1}♥</span> if one escapes</div>
      <div class="erow">Speed ${d.speed} (${spd}) · <span class="gd">+${offspringReward(type, baby)}◆</span> each</div>
      <div class="erow">Best: <img src="${ICONS[d.counter] || ""}" alt=""> ${tw.name} · ${hits} ${unit}${hits === 1 ? "" : "s"} each</div>
      ${d.flying ? `<div class="erow air">Flies over your maze</div>` : ""}${broodRow(type, wave)}</div></div>`;
}

function currentGroups() {
  const m = new Map();
  const get = (type, wave, baby) => {
    const k = wave + "|" + type + (baby ? "|" + baby : "");
    if (!m.has(k)) m.set(k, { type, wave, baby, alive: 0, queued: 0, hp: 0 });
    return m.get(k);
  };
  for (const e of S.enemies) { const g = get(e.type, e.wave, e.baby); g.alive++; g.hp += Math.max(0, e.hp); }
  for (const q of S.spawnQ) { const g = get(q.type, q.wave); g.queued++; g.hp += hpOf(q.type, q.wave); }
  return [...m.values()].sort((a, b) => a.wave - b.wave);
}

// Real-time countdown (not sped up by 2×/3×, frozen while a menu is open)
function tickCountdown(realDt) {
  if (!S.started || S.over || S.menu) return;
  if (S.wave === 0) { // the first build phase runs even if later auto-start is off
    if (S.awaitingStart) return;
    S.countdown -= realDt;
    if (S.countdown <= 0) startNextWave();
    return;
  }
  const idle = !S.enemies.length && !S.spawnQ.length;
  if (idle && !S.wasIdle) { S.countdown = S.countdownMax = P.autoStart; } // a wave just ended
  S.wasIdle = idle;
  if (!idle || !P.autoStart) return;
  S.countdown -= realDt;
  if (S.countdown <= 0) startNextWave();
}

$("scChips").onclick = ev => { ev.stopPropagation(); if (!S.menu && !S.over) waveInfoMenu("resume"); };
$("startPreview").onclick = () => {
  if (!S.started || S.menu || S.over || !S.awaitingStart || S.wave !== 0) return;
  S.awaitingStart = false;
  updateStartCard();
};

// Sum of tower damage if every tower is firing (mines: average over rearm time)
function yourDps() {
  let ground = 0, air = 0;
  for (const t of S.towers) {
    const def = TOWERS[t.type], st = stats(t);
    const dps = st.dmg / st.reload;
    if (def.ground) ground += dps;
    if (def.air) air += dps * (def.airMul || 1);
  }
  return { ground, air };
}

function waveTable(n, title) {
  const groups = waveGroups(n);
  let total = 0, gold = 0, airHp = 0, groundHp = 0, leakAll = 0;
  const rows = groups.map(g => {
    const d = ENEMIES[g.type], hp = hpOf(g.type, n);
    total += hp * g.n; gold += killGold(g.type) * g.n; leakAll += (d.leak || 1) * g.n;
    if (d.flying) airHp += hp * g.n; else groundHp += hp * g.n;
    return `<tr><td><img src="${enemyIcon(g.type, n)}" alt="" style="width:20px;height:20px;vertical-align:middle"> ${enemyName(g.type, n)} <span style="color:var(--muted);font-size:11px">${d.name}</span></td>
      <td>${g.n}</td><td class="v">${num(hp)}</td><td>${d.speed}</td><td>${killGold(g.type)}◆</td><td style="color:var(--bad)">−${d.leak || 1}♥</td></tr>
      <tr><td colspan="6" class="note">${d.note}${d.flying ? " · ignores your maze" : ""} · Best: <img src="${ICONS[d.counter]}" alt="" style="width:13px;height:13px;vertical-align:middle"> ${TOWERS[d.counter].name} (${hitsLabel(g.type, n)} each)${broodRow(g.type, n)}</td></tr>`;
  }).join("");
  const dps = yourDps();
  const secs = (hp, d) => d > 0 ? `≈${num(hp / d)}s of fire` : `<span style="color:var(--bad)">no towers can hit these!</span>`;
  return `<div class="guide"><div class="hd"><span class="t">${title}</span></div>
    <table><tr><th>Enemy</th><th>#</th><th>HP each</th><th>Speed</th><th>Gold</th><th>Base</th></tr>${rows}</table>
    <div class="sub" style="margin-top:6px">Total HP <b style="color:var(--text)">${num(total)}</b> · kills pay ${num(gold)}◆ + ${clearBonus(n)}◆ clear bonus<br>
    <span style="color:var(--bad)">If all escape: −${leakAll}♥</span> (your base has ${S.lives}♥)<br>
    ${groundHp ? `Ground: ${num(groundHp)} HP total. Your towers remove up to ${num(dps.ground)} HP per second: ${secs(groundHp, dps.ground)}<br>` : ""}
    ${airHp ? `Flyers: ${num(airHp)} HP total. Your towers remove up to ${num(dps.air)} HP per second: ${secs(airHp, dps.air)}` : ""}</div></div>`;
}

function waveInfoMenu(back, nextFirst = false) {
  const idle = !S.enemies.length && !S.spawnQ.length;
  const nw = S.wave + 1;
  const upcoming = [];
  for (let n = nw + 1; n <= nw + 5; n++) {
    const parts = waveGroups(n).map(g => `<span style="white-space:nowrap"><img src="${enemyIcon(g.type, n)}" alt="" style="width:18px;height:18px;vertical-align:middle">${g.n} × ${num(hpOf(g.type, n))}hp</span>`).join(" ");
    upcoming.push(`<tr><td>W${n}${n % 10 === 0 ? " ⚠" : ""}</td><td style="text-align:left">${parts}</td></tr>`);
  }
  const current = idle ? "" : `<div class="guide"><div class="hd"><span class="t">On the board</span></div>
    ${currentGroups().map(g => enemyCard(g.type, g.wave, g.alive + g.queued, g.baby,
      { alive: g.alive, queued: g.queued, hpLeft: g.hp })).join("")}</div>`;
  const next = waveTable(nw, `Next: Wave ${nw}`);

    ${nextFirst ? next + current : current + next}

}

cv.addEventListener("pointermove", ev => {
  if (ev.pointerType !== "mouse" || !S.buildType || drag) return;
  const c = cellFromPoint(ev.clientX, ev.clientY);
  S.ghost = inGrid(c.x, c.y) ? c : null;
});
cv.addEventListener("pointerleave", ev => { if (ev.pointerType === "mouse" && !drag) S.ghost = null; });

cv.addEventListener("pointerdown", ev => {
  if (S.over || S.menu) return;
  const c = cellFromPoint(ev.clientX, ev.clientY);
  if (!inGrid(c.x, c.y)) return;
  const existing = S.grid[idx(c.x, c.y)];
  if (existing) {
    S.buildType = null; S.ghost = null;
    S.selected = S.selected === existing ? null : existing;
    S.selEnemy = null;
    refreshBar(); return;
  }
  if (S.buildType) {
    // Mouse: click builds. Touch: first tap previews, second tap on the same cell builds.
    const confirm = ev.pointerType === "mouse" || (S.ghost && S.ghost.x === c.x && S.ghost.y === c.y);
    S.ghost = c;
    if (confirm && tryPlace(c) && ev.pointerType !== "mouse") S.ghost = null;
    return;
  }
  // tap near an enemy to inspect it
  const r = cv.getBoundingClientRect();
  const px = (ev.clientX - r.left) / CELL, py = (ev.clientY - r.top) / CELL;
  let best = null, bd = 0.7;
  for (const e of S.enemies) {
    const d = Math.hypot(ex(e) - px, ey(e) - py);
    if (d < bd) { bd = d; best = e; }
  }
  S.selected = null; S.selEnemy = best; refreshBar();
});

const CINE = { scenes: [], i: 0, t0: 0, raf: 0, onDone: null, stars: null, cuePending: null };
const TAU2 = Math.PI * 2;

function playCine(scenes, onDone) {
  CINE.scenes = scenes; CINE.i = 0; CINE.onDone = onDone;
  if (S) { S.menu = true; S.ghost = null; }
  $("overlay").style.display = "none";
  $("cine").style.display = "block";

  cancelAnimationFrame(CINE.raf);
  CINE.raf = requestAnimationFrame(cineFrame);
}
function showScene() {
  const sc = CINE.scenes[CINE.i], last = CINE.i === CINE.scenes.length - 1;
  CINE.t0 = performance.now();
  CINE.cuePending = P.sound ? sc.cue : null;
  CINE.nextTimedCue = 0;
  $("cineKicker").textContent = sc.kicker || "";
  $("cineTitle").textContent = sc.title || "";

function miniAlien(c, b, x, y, type, stage, t, face = 1) { c.save(); c.translate(b.ox + x * b.cs, b.oy + y * b.cs); c.scale(b.cs, b.cs); if (face < 0) c.scale(-1, 1); ALIENS.draw(c, type, stage, t, ENEMIES[type].size, b.cs, true); c.restore(); }

function drawWavePortraits(c, wave, elapsed, width, top) {
  const groups = waveGroups(wave), stage = stageOf(wave);
  const panelWidth = Math.min(width, 360);
  const left = (width - panelWidth) / 2;
  const slot = panelWidth / groups.length;
  const still = splashMotion?.matches;
  c.save();
  c.textAlign = "center";
  groups.forEach(({ type, n }, i) => {
    const def = ENEMIES[type], x = left + slot * (i + 0.5);
    const entry = still ? 1 : Math.max(0, Math.min(1, (elapsed - i * 0.15) / 0.35));
    const lift = (1 - entry) ** 2 * 10, radius = Math.min(30, slot * 0.29);
    const portraitY = top + 36 + lift;
    c.fillStyle = hexToRgba(def.color, 0.14);
    c.beginPath(); c.arc(x, portraitY, radius, 0, Math.PI * 2); c.fill();
    const board = { ox: x, oy: portraitY, cs: radius * 0.53 / def.size };
    miniAlien(c, board, 0, 0, type, stage, still ? 0 : elapsed);
    c.fillStyle = "#e6ecff"; c.font = "800 14px system-ui";
    c.fillText(enemyName(type, wave), x, top + 87, slot - 6);
    c.fillStyle = def.color; c.font = "700 12px system-ui";
    c.fillText(`${n}× · ${num(hpOf(type, wave))} HP each`, x, top + 105, slot - 6);
  });
  c.restore();
}
function miniTower(c, b, x, y, type, level, st, evo = -1) { c.save(); c.translate(b.ox + x * b.cs, b.oy + y * b.cs); c.scale(b.cs, b.cs); TOWER_ART.draw(c, type, level, st, b.cs / 150, evo); c.restore(); }
function miniBfs(cols, rows, blocked, exit) {
  const d = new Int32Array(cols * rows).fill(-1), q = [exit[1] * cols + exit[0]]; d[q[0]] = 0;
  for (let h = 0; h < q.length; h++) { const i = q[h], x = i % cols, y = (i / cols) | 0;
    for (const [dx, dy] of [[0, 1], [1, 0], [-1, 0], [0, -1]]) { const nx = x + dx, ny = y + dy, j = ny * cols + nx; if (nx < 0 || ny < 0 || nx >= cols || ny >= rows || d[j] !== -1 || blocked.has(j)) continue; d[j] = d[i] + 1; q.push(j); } }
  return d;
}
function miniPath(cols, rows, blocked, entry, exit) { // list of cells from entry to exit
  const d = miniBfs(cols, rows, blocked, exit), out = []; let [x, y] = entry, g = 0;
  if (d[y * cols + x] < 0) return out;
  while (!(x === exit[0] && y === exit[1]) && g++ < 200) { out.push([x, y]); const dd = d[y * cols + x];
    const n = [[0, 1], [1, 0], [-1, 0], [0, -1]].find(([dx, dy]) => { const nx = x + dx, ny = y + dy; return nx >= 0 && ny >= 0 && nx < cols && ny < rows && d[ny * cols + nx] === dd - 1; }); if (!n) break; x += n[0]; y += n[1]; }
  out.push(exit); return out;
}
const idleAnim = t => ({ t, fire: 0, arm: 0, charge: 0.6, aim: null });
// A "tap here" hint: a fingertip dot with a ripple (k: 0 → 1)
function tapHint(c, x, y, k) {
  c.strokeStyle = `rgba(255,255,255,${1 - k})`; c.lineWidth = 3; c.beginPath(); c.arc(x, y, 8 + k * 26, 0, TAU2); c.stroke();

  c.fillStyle = "rgba(4,6,12,0.9)"; c.font = "800 10px system-ui"; c.textAlign = "center"; c.fillText("tap", x, y + 3.5);
}

  dminus: () => { campaignDiff = Math.max(1, campaignDiff - 1); newGameMenu(); },

const BOOT_DURATION = 6.2;
let bootStart;
const bootState = { done: new Set() };
const bootCues = {
  pew: "bolt", pop: "blast",
  whoosh: "planetPass", boing: "build", plink: "build", tick: "frost",
};
const bootEffects = {
  once(key, play) {
    if (!bootState.done.has(key)) {
      bootState.done.add(key);
      play();
    }
  },
  sfx(name) {
    if (!document.hidden && !splashMotion?.matches && bootCues[name]) playSound(bootCues[name]);
  },
};
const menuBackdropState = {};
const silentBackdrop = { once() {}, sfx() {} };

function drawLoadingScene(now, menuBackdrop = false) {
  bootStart ??= now;
  const canvas = $("splashCv");
  const width = canvas.clientWidth, height = canvas.clientHeight;
  if (!width || !height) return;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const pixelWidth = Math.round(width * dpr), pixelHeight = Math.round(height * dpr);
  const resized = canvas.width !== pixelWidth || canvas.height !== pixelHeight;
  if (resized) { canvas.width = pixelWidth; canvas.height = pixelHeight; }
  const elapsed = (now - bootStart) / 1000;
  if (!menuBackdrop && (elapsed >= BOOT_DURATION || splashMotion?.matches)) {
    mainMenu();
    menuBackdrop = true;
  }
  const t = menuBackdrop ? 6 : elapsed * 5 / BOOT_DURATION;
  const state = menuBackdrop ? menuBackdropState : bootState;
  if (!resized && state.settled) return;
  const scale = Math.min(width / 344, height / 480);
  const c = canvas.getContext("2d");
  c.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  const effects = menuBackdrop ? silentBackdrop : bootEffects;
  drawCartoonLoading(c, width / scale, height / scale, t, Math.min(t / 5, 1), state, effects);
  state.settled = menuBackdrop;
}

let last = performance.now(), enemyInfoTick = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if ($("overlay").classList.contains("booting")) {
    syncSceneAudio(document.hidden ? null : "menu");
    drawLoadingScene(now);
    requestAnimationFrame(frame);
    return;
  }
  if (!S.menu && !S.over) for (let k = 0; k < S.speed; k++) update(dt);
  tickCountdown(dt);
  if (S.selEnemy && ++enemyInfoTick % 8 === 0) refreshBar(); // live HP readout
  updateStartCard();
  drawStartCardPortraits(now);
  const overlay = $("overlay");
  const splashVisible = overlay.style.display === "flex" && overlay.classList.contains("splash");
  const storyVisible = $("cine").style.display === "block" && CINE.scenes !== TUTORIAL;
  syncSceneAudio(document.hidden ? null : splashVisible ? "menu" : storyVisible ? "story" : null);
  if (splashVisible) drawLoadingScene(now, true);
  else draw();
  requestAnimationFrame(frame);
}

function initializeGame() {
  newGame(0, 1, false);
  buildIcons();
  resize();
  S.menu = true;
  const bootSound = $("bootSound");
  bootSound.textContent = soundLabel();
  bootSound.addEventListener("click", () => {
    toggleSound();
    bootSound.textContent = soundLabel();
  });
  $("bootButton").addEventListener("click", mainMenu);

  window.addEventListener("resize", resize);
  if (window.ResizeObserver) new ResizeObserver(() => resize()).observe($("stage"));
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) syncSceneAudio(null);
    if (document.hidden && S.started && !S.over && !S.menu) pauseMenu();
  });
  requestAnimationFrame(frame);
}

// Load without waiting for audio. If autoplay is blocked, the first interaction unlocks it.
document.addEventListener("pointerup", unlockAudioOnInteraction, true);
document.addEventListener("keydown", unlockAudioOnInteraction, true);
document.addEventListener("click", unlockAudioOnInteraction, true);
unlockAudio();
requestAnimationFrame(() => requestAnimationFrame(initializeGame));
</script>
