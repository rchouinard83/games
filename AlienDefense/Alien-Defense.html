function refreshBar() {
  for (const b of buildEl.children) {
    b.classList.toggle("sel", b.dataset.type === S.buildType);
    b.classList.toggle("poor", TOWERS[b.dataset.type].cost > S.gold);

  }
  if (S.selEnemy && !S.enemies.includes(S.selEnemy)) S.selEnemy = null; // destroyed or escaped
  if (S.selected) {
    const t = S.selected, def = TOWERS[t.type], st = stats(t), next = def.levels[t.level + 1];
    const unit = powerUnit(t.type), pw = power(t.type, t.level);
    buildEl.style.display = "none"; infoEl.style.display = "flex";
    $("infoText").innerHTML = `<b>${def.name} L${t.level + 1}</b> · ${def.levelNames[t.level]}<br>${fmt(pw)} ${unit}`;
    const canUp = !!next && S.gold >= next.cost;
    $("upBtn").innerHTML = !next ? "Max<br>level" : canUp ? `Upgrade<br>−${next.cost}◆` : `Upgrade<br><span class="short">−${next.cost}◆</span>`;
    $("upBtn").disabled = !canUp;
    $("upBtn").classList.toggle("can", canUp); // highlight when affordable
    const full = refund(t) === t.spent;
    $("sellBtn").innerHTML = `Sell<br>+${refund(t)}◆`;
    $("sellBtn").classList.toggle("full", full);
    let up;
    if (next) {
      const npw = power(t.type, t.level + 1);
      up = `Upgrade to <b>${def.levelNames[t.level + 1]}</b> for ${next.cost}◆: <b>${fmt(npw)} ${unit}</b> <span class="up">(+${fmt(npw - pw)})</span> · ${speedText(t.type, t.level + 1)}`;
    } else up = "Fully upgraded.";
    hintEl.innerHTML = `Now: <b>${fmt(pw)} ${unit}</b>${def.airMul ? ` (${fmt(pw * def.airMul)} vs flyers)` : ""} · ${speedText(t.type, t.level)}` +
      `${def.walkable ? "" : ` · range ${fmt(st.range)}`}<br>${up}` +

  }
  const bh = $("bar").offsetHeight; // bar height can change; keep the board fitted
  if (bh !== lastBarH) { lastBarH = bh; resize(); }
}

function updateWaveBar() {
  if (!S) return;
  const idle = !S.enemies.length && !S.spawnQ.length;
  const left = S.enemies.length + S.spawnQ.length;
  const preview = S.wave === 0 && S.awaitingStart;
  const key = [S.map, S.diff, S.started, S.over, idle, left, S.wave, S.won, Object.keys(ENEMY_ICONS).length, Math.ceil(S.countdown), P.autoStart, preview].join("|");
  if (key === waveBarKey) return;
  waveBarKey = key;
  const of = n => S.won ? `${n}` : `${n}/${VICTORY_WAVE}`;
  const nw = S.wave + 1;
  $("waveWorld").textContent = `${S.map + 1} · ${WORLDS[S.map].name}`;
  $("waveNow").textContent = `Wave ${of(idle ? nw : S.wave)}${idle ? "" : ` · ${left} left`}`;
  $("nextEnemyChips").innerHTML = waveChips(nw);
  // Middle-of-board start card
  $("scChips").innerHTML = waveChips(nw, true);
  $("scHint").textContent = S.wave === 0
    ? `Press Start for ${BUILD_TIME} seconds to build before the aliens arrive.`
    : "Need more defense? Tap a tower below to build." + (P.autoStart ? "" : " Auto-start is off (☰ menu).");
  const nb = $("nextBtn");
  nb.hidden = preview;
  nb.classList.toggle("busy", !idle);
  nb.textContent = !idle ? "Early ▶" : S.wave === 0 ? "Send now ▶" : "Start ▶";
  const timer = $("hudCountdown"), seconds = Math.max(0, Math.ceil(S.countdown));
  timer.hidden = preview || !S.started || S.over || !idle;
  timer.textContent = S.wave === 0 ? `Starts in ${seconds}s` : P.autoStart ? `Auto-start in ${seconds}s` : "Auto-start off";
}

// Show the wave preview between waves and clear the board while the player builds.
let startCardState = "";
let portraitStart;
function updateStartCard() {
  const idle = !S.enemies.length && !S.spawnQ.length;
  const preview = S.wave === 0 && S.awaitingStart;
  const building = S.wave === 0 || S.buildType || S.selected || drag;
  const show = S.started && idle && !S.over && !S.menu && (preview || !building);
  const secs = Math.ceil(S.countdown);
  const state = [show, secs, P.autoStart, S.wave, preview].join("|");
  if (state !== startCardState) {
    startCardState = state;
    const card = $("startCard");
    card.classList.toggle("show", show);
    if (!show) portraitStart = undefined;
    $("startPreview").hidden = !preview;
    const nw = S.wave + 1;
    if (nw > 1 && stageOf(nw) !== stageOf(nw - 1)) $("scTitle").textContent = `⚠ Wave ${nw}: ${ALIENS.stages[stageOf(nw)].title}`;
    else $("scTitle").textContent = S.wave === 0 ? "Wave 1 preview" : `Wave ${S.wave} cleared! Wave ${nw} next`;
    $("scCd").textContent = P.autoStart && S.wave > 0 ? `Auto-start in ${secs}s` : "";
    card.querySelector(".cd").style.display = P.autoStart && S.wave > 0 ? "" : "none";
  }
  if (show && P.autoStart) $("cdBar").style.width = `${Math.max(0, 100 * S.countdown / S.countdownMax)}%`;
  updateWaveBar();
}

function drawStartCardPortraits(now) {
  if (!$("startCard").classList.contains("show")) return;
  portraitStart ??= now;
  const canvas = $("scPortraits"), width = canvas.clientWidth, height = canvas.clientHeight;
  if (!width || !height) return;
  const scale = Math.min(2, window.devicePixelRatio || 1);
  const w = Math.round(width * scale), h = Math.round(height * scale);
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  const c = canvas.getContext("2d");
  c.setTransform(scale, 0, 0, scale, 0, 0);
  c.clearRect(0, 0, width, height);
  drawWavePortraits(c, S.wave + 1, (now - portraitStart) / 1000, width, 0);
}

// Enemies of the wave(s) in progress, grouped by wave + type: on the field, still to spawn, HP left
// "Spits out 4× Goo (13 HP) at 80/60/40/20% HP"
const babyHp = wave => Math.max(1, Math.round(ENEMIES.swarm.hp * waveHpMul(wave) * BROOD.hpFrac));
const broodRow = wave => `<div class="erow" style="color:#ff8bd0;font-weight:700">Spits out ${broodCount(stageOf(wave))}× ${enemyName("swarm", wave)} ` +
  `(${num(babyHp(wave))} HP) at ${BROOD.at.map(f => f * 100).join("/")}% HP · shielded for ${BROOD.shieldTime}s</div>`;

// Steps the closest matching enemy still has to go before it reaches your base
function closestSteps(type, wave, baby) {
  let best = null;
  for (const e of S.enemies) {
    if (e.type !== type || e.wave !== wave || !!e.baby !== !!baby || !inBounds(e)) continue;
    const d = e.flying ? Math.ceil(Math.hypot(EXIT.x + 0.5 - e.x, EXIT.y + 0.5 - e.y))
                       : Math.max(0, S.dist[idx(e.tx, e.ty)]) + 1;
    if (best === null || d < best) best = d;
  }
  return best;
}

// One enemy card for the right panel. live = { alive, queued, hpLeft } for the wave being fought.
function enemyCard(type, wave, n, baby, live) {
  const d = ENEMIES[type], tw = TOWERS[d.counter];
  const full = baby ? babyHp(wave) : hpOf(type, wave);
  const hits = Math.max(1, Math.ceil(full / (power(d.counter, 0) * (d.flying && tw.airMul ? tw.airMul : 1))));
  const unit = tw.walkable ? "blast" : "hit", spd = d.speed < 1.1 ? "slow" : d.speed < 2 ? "normal" : "fast";
  let liveHtml = "";
  if (live) {
    const pct = Math.max(0, Math.min(100, 100 * live.hpLeft / (n * full)));
    const close = closestSteps(type, wave, baby);
    liveHtml = `<div class="erow">${live.alive} on the field${live.queued ? ` · ${live.queued} still coming` : ""}</div>
      <div class="gbar" title="Health left in this group"><i style="width:${pct}%"></i></div>
      ${close !== null ? `<div class="erow ${close <= 5 ? "warn" : ""}">Closest: ${close} step${close === 1 ? "" : "s"} from your base</div>` : ""}`;
  }
  return `<div class="ecard"><img class="ei" src="${enemyIcon(type, wave)}" alt="">
    <div class="ebody"><b>${n}× ${enemyName(type, wave)}${baby ? " babies" : ""}</b>
      <span class="role">${baby ? "from the boss" : d.name}${live && wave !== S.wave ? ` · wave ${wave}` : ""}</span>
      ${liveHtml}
      <div class="erow"><span class="hp">${num(full)} HP</span> each · <span class="lk">−${d.leak || 1}♥</span> if one escapes</div>
      <div class="erow">Speed ${d.speed} (${spd}) · <span class="gd">+${killGold(type)}◆</span> each</div>
      <div class="erow">Best: <img src="${ICONS[d.counter] || ""}" alt=""> ${tw.name} · ${hits} ${unit}${hits === 1 ? "" : "s"} each</div>
      ${d.flying ? `<div class="erow air">Flies over your maze</div>` : ""}${type === "boss" ? broodRow(wave) : ""}</div></div>`;
}

function currentGroups() {
  const m = new Map();
  const get = (type, wave, baby) => {
    const k = wave + "|" + type + (baby ? "|baby" : "");
    if (!m.has(k)) m.set(k, { type, wave, baby: !!baby, alive: 0, queued: 0, hp: 0 });
    return m.get(k);
  };
  for (const e of S.enemies) { const g = get(e.type, e.wave, e.baby); g.alive++; g.hp += Math.max(0, e.hp); }
  for (const q of S.spawnQ) { const g = get(q.type, q.wave); g.queued++; g.hp += hpOf(q.type, q.wave); }
  return [...m.values()].sort((a, b) => a.wave - b.wave);
}

function updateSides() {
  if (!SIDE_W || !S) return;
  const idle = !S.enemies.length && !S.spawnQ.length, left = S.enemies.length + S.spawnQ.length;
  const nowT = performance.now();
  if (!idle && nowT - sideT < 100) return; // during waves, refresh at most 10×/sec
  sideT = nowT;
  let remHp = 0;
  for (const e of S.enemies) remHp += Math.max(0, e.hp);
  for (const q of S.spawnQ) remHp += hpOf(q.type, q.wave);
  const preview = S.wave === 0 && S.awaitingStart;
  const key = [S.lives, S.maxLives, S.gold, S.wave, left, idle, Math.ceil(S.countdown), P.autoStart, S.won, ENEMY_ICONS.length, S.map, Math.round(remHp), preview, idle ? 0 : Math.floor(S.time * 4)].join("|");
  if (key === sideKey) return;
  sideKey = key;
  const shown = idle ? S.wave + 1 : S.wave, st = stageOf(Math.max(1, shown)), stage = ALIENS.stages[st];
  const col = baseColor(), frac = Math.max(0, S.lives / S.maxLives);
  const pct = Math.max(0, Math.min(100, 100 * (1 - left / (S.waveSize || left || 1))));
  $("sideLInfo").innerHTML = `
    <div class="panel"><div class="cap">BASE</div>
      <div class="big" style="color:${col}">♥ ${S.lives}<small> / ${S.maxLives}</small></div>
      <div class="meter"><i style="width:${frac * 100}%;background:${col}"></i></div></div>
    <div class="panel"><div class="cap">GOLD</div><div class="big gold">◆ ${S.gold}</div></div>
    <div class="panel"><div class="cap">WORLD ${S.map + 1} / ${WORLDS.length}</div>
      <div class="mid">${WORLDS[S.map].name}</div><div class="sub">${WORLDS[S.map].where}</div>
      <div class="big"><small>Wave </small>${shown}${S.won ? "" : `<small> / ${VICTORY_WAVE}</small>`}</div>
      ${idle ? `<div class="sub go">${S.wave === 0 ? (preview ? "Review wave 1" : `Aliens arrive in ${Math.ceil(S.countdown)}s`)
              : P.autoStart ? `Starts in ${Math.ceil(S.countdown)}s` : "Ready: press Start"}</div>`
             : `<div class="meter"><i style="width:${pct}%"></i></div><div class="sub">${left} enemies left</div>`}
      <div class="icons">${Object.keys(ENEMIES).map(t => `<img src="${(ENEMY_ICONS[st] || {})[t] || ""}" alt="">`).join("")}</div></div>`;
  const nw = S.wave + 1, newStage = nw > 1 && stageOf(nw) !== stageOf(nw - 1);

  // NOW: the wave being fought
  let nowHtml = "";
  if (!idle) {
    let leakNow = 0, goldNow = 0;
    const cards = currentGroups().map(g => {
      const d = ENEMIES[g.type], n = g.alive + g.queued;
      leakNow += (d.leak || 1) * n; goldNow += killGold(g.type) * n;
      return enemyCard(g.type, g.wave, n, g.baby, { alive: g.alive, queued: g.queued, hpLeft: g.hp });
    }).join("");
    nowHtml = `<div class="panel" style="border-color:rgba(93,255,155,0.45)"><div class="cap" style="color:var(--good)">NOW: WAVE ${S.wave} · ${left} LEFT</div>
      ${cards}
      <div class="sub">Remaining <b style="color:var(--text)">${num(remHp)} HP</b> · <span class="gd" style="color:var(--gold)">${goldNow}◆</span> to earn
        · if all escape <span class="lk">−${leakNow}♥</span></div></div>`;
  }

  // NEXT: full cards between waves, one line per enemy type during a wave
  let total = 0, leak = 0, gold = 0;
  const groups = waveGroups(nw);
  for (const g of groups) { const d = ENEMIES[g.type]; total += hpOf(g.type, nw) * g.n; leak += (d.leak || 1) * g.n; gold += killGold(g.type) * g.n; }
  const nextBody = idle
    ? groups.map(g => enemyCard(g.type, nw, g.n, false, null)).join("")
    : groups.map(g => {
        const d = ENEMIES[g.type];
        return `<div class="then"><img src="${enemyIcon(g.type, nw)}" alt=""><b>${g.n}×</b> ${enemyName(g.type, nw)}
          <span style="color:#ff9d6b;font-weight:700">${num(hpOf(g.type, nw))}hp</span> <span class="lk">−${d.leak || 1}♥</span>
          <img src="${ICONS[d.counter] || ""}" alt="" title="Best: ${TOWERS[d.counter].name}"></div>`;
      }).join("");
  const later = [nw + 1, nw + 2, nw + 3].map(n => `<div class="then"><b>W${n}${n % 10 === 0 ? " ⚠" : ""}</b>
    ${waveGroups(n).map(g => `<img src="${enemyIcon(g.type, n)}" alt="">${g.n}× <span style="color:#ff9d6b">${num(hpOf(g.type, n))}hp</span>`).join(" ")}</div>`).join("");
  $("sideRInfo").innerHTML = nowHtml + `
    <div class="panel"><div class="cap">NEXT: WAVE ${nw}${newStage ? ` · <span style="color:var(--bad)">NEW STAGE: ${ALIENS.stages[stageOf(nw)].title.split(" · ")[1].toUpperCase()}</span>` : ""}</div>
      ${nextBody}
      <div class="sub">Total <b style="color:var(--text)">${num(total)} HP</b> · kills pay <span style="color:var(--gold);font-weight:700">${gold}◆</span>
        + ${clearBonus(nw)}◆ clear bonus · if all escape <span class="lk">−${leak}♥</span></div></div>
    <div class="panel"><div class="cap">COMING UP</div>${later}</div>
    <div class="hint">Tap for full wave info</div>`;
}

// Real-time countdown (not sped up by 2×/3×, frozen while a menu is open)
function tickCountdown(realDt) {
  if (!S.started || S.over || S.menu) return;
  if (S.wave === 0) { // the first build phase runs even if later auto-start is off
    if (S.awaitingStart) return;
    S.countdown -= realDt;
    if (S.countdown <= 0) startNextWave();
    return;
  }
  const idle = !S.enemies.length && !S.spawnQ.length;
  if (idle && !S.wasIdle) { S.countdown = S.countdownMax = P.autoStart; } // a wave just ended
  S.wasIdle = idle;
  if (!idle || !P.autoStart) return;
  S.countdown -= realDt;
  if (S.countdown <= 0) startNextWave();
}

// Sum of tower damage if every tower is firing (mines: average over rearm time)
function yourDps() {
  let ground = 0, air = 0;
  for (const t of S.towers) {
    const def = TOWERS[t.type], st = stats(t);
    const dps = st.dmg / st.reload;
    if (def.ground) ground += dps;
    if (def.air) air += dps * (def.airMul || 1);
  }
  return { ground, air };
}

function waveTable(n, title) {
  const groups = waveGroups(n);
  let total = 0, gold = 0, airHp = 0, groundHp = 0, leakAll = 0;
  const rows = groups.map(g => {
    const d = ENEMIES[g.type], hp = hpOf(g.type, n);
    total += hp * g.n; gold += killGold(g.type) * g.n; leakAll += (d.leak || 1) * g.n;
    if (d.flying) airHp += hp * g.n; else groundHp += hp * g.n;
    return `<tr><td><img src="${enemyIcon(g.type, n)}" alt="" style="width:20px;height:20px;vertical-align:middle"> ${enemyName(g.type, n)} <span style="color:var(--muted);font-size:11px">${d.name}</span></td>
      <td>${g.n}</td><td class="v">${num(hp)}</td><td>${d.speed}</td><td>${killGold(g.type)}◆</td><td style="color:var(--bad)">−${d.leak || 1}♥</td></tr>
      <tr><td colspan="6" class="note">${d.note}${d.flying ? " · ignores your maze" : ""} · Best: <img src="${ICONS[d.counter]}" alt="" style="width:13px;height:13px;vertical-align:middle"> ${TOWERS[d.counter].name} (${hitsLabel(g.type, n)} each)</td></tr>`;
  }).join("");
  const dps = yourDps();
  const secs = (hp, d) => d > 0 ? `≈${num(hp / d)}s of fire` : `<span style="color:var(--bad)">no towers can hit these!</span>`;
  return `<div class="guide"><div class="hd"><span class="t">${title}</span></div>
    <table><tr><th>Enemy</th><th>#</th><th>HP each</th><th>Speed</th><th>Gold</th><th>Base</th></tr>${rows}</table>
    <div class="sub" style="margin-top:6px">Total HP <b style="color:var(--text)">${num(total)}</b> · kills pay ${num(gold)}◆ + ${clearBonus(n)}◆ clear bonus<br>
    <span style="color:var(--bad)">If all escape: −${leakAll}♥</span> (your base has ${S.lives}♥)<br>
    ${groundHp ? `Ground: ${num(groundHp)} HP total. Your towers remove up to ${num(dps.ground)} HP per second: ${secs(groundHp, dps.ground)}<br>` : ""}
    ${airHp ? `Flyers: ${num(airHp)} HP total. Your towers remove up to ${num(dps.air)} HP per second: ${secs(airHp, dps.air)}` : ""}</div></div>`;
}

function waveInfoMenu(back, nextFirst = false) {

cv.addEventListener("pointermove", ev => {
  if (ev.pointerType !== "mouse" || !S.buildType || drag) return;
  const c = cellFromPoint(ev.clientX, ev.clientY);
  S.ghost = inGrid(c.x, c.y) ? c : null;
});
cv.addEventListener("pointerleave", ev => { if (ev.pointerType === "mouse" && !drag) S.ghost = null; });

cv.addEventListener("pointerdown", ev => {
  if (S.over || S.menu) return;
  const c = cellFromPoint(ev.clientX, ev.clientY);
  if (!inGrid(c.x, c.y)) return;
  const existing = S.grid[idx(c.x, c.y)];
  if (existing) {
    S.buildType = null; S.ghost = null;
    S.selected = S.selected === existing ? null : existing;
    S.selEnemy = null;
    refreshBar(); return;
  }
  if (S.buildType) {
    // Mouse: click builds. Touch: first tap previews, second tap on the same cell builds.
    const confirm = ev.pointerType === "mouse" || (S.ghost && S.ghost.x === c.x && S.ghost.y === c.y);
    S.ghost = c;
    if (confirm && tryPlace(c) && ev.pointerType !== "mouse") S.ghost = null;
    return;
  }
  // tap near an enemy to inspect it
  const r = cv.getBoundingClientRect();
  const px = (ev.clientX - r.left) / CELL, py = (ev.clientY - r.top) / CELL;
  let best = null, bd = 0.7;
  for (const e of S.enemies) {
    const d = Math.hypot(ex(e) - px, ey(e) - py);
    if (d < bd) { bd = d; best = e; }
  }
  S.selected = null; S.selEnemy = best; refreshBar();
});

const splashPatrol = [
  { type: "normal", stage: 0, lane: 0.84, pace: 0.08, offset: 0.22 },
  { type: "fast", stage: 1, lane: 0.93, pace: 0.19, offset: 0.48 },
  { type: "swarm", stage: 0, lane: 0.89, pace: 0.11, offset: 0.12 },
  { type: "flying", stage: 2, lane: 0.17, pace: 0.12, offset: 0.68 },
  { type: "tank", stage: 3, lane: 0.86, pace: 0.055, offset: 0.81 },
];
const splashMotion = window.matchMedia?.("(prefers-reduced-motion: reduce)");
function drawSplash(canvas, now) {
  const width = canvas.clientWidth, height = canvas.clientHeight;
  if (!width || !height) return;
  const scale = Math.min(2, window.devicePixelRatio || 1);
  const pixelWidth = Math.round(width * scale), pixelHeight = Math.round(height * scale);
  const resized = canvas.width !== pixelWidth || canvas.height !== pixelHeight;
  if (resized) { canvas.width = pixelWidth; canvas.height = pixelHeight; }
  if (splashMotion?.matches && canvas.dataset.painted && !resized) return;
  const t = splashMotion?.matches ? 0 : now / 1000;
  const c = canvas.getContext("2d");
  c.setTransform(scale, 0, 0, scale, 0, 0);
  starfield(c, t, width, height, 7);
  nebula(c, width * 0.23, height * 0.3, width * 0.45, "rgba(83,65,172,0.24)");
  planet(c, "earth", width * 0.84, height * 0.24, Math.min(width * 0.19, height * 0.23), t);
  c.fillStyle = "#121d32";
  c.beginPath(); c.moveTo(0, height * 0.82);
  for (let x = 0; x <= width; x += 12) {
    c.lineTo(x, height * 0.79 + Math.sin(x * 0.011) * 15 + Math.sin(x * 0.037) * 7);
  }
  c.lineTo(width, height); c.lineTo(0, height); c.closePath(); c.fill();
  c.strokeStyle = "#25354f"; c.lineWidth = 1;
  for (const lane of [0.88, 0.95]) {
    c.beginPath(); c.moveTo(0, height * lane); c.lineTo(width, height * lane); c.stroke();
  }
  const board = { ox: 0, oy: 0, cs: Math.max(36, Math.min(78, width * 0.13, height * 0.17)) };
  miniPortal(c, board, 0.12, height * 0.84 / board.cs - 0.5, t);
  for (const { type, stage, lane, pace, offset } of splashPatrol) {
    const x = ((t * pace + offset) % 1) * (width + board.cs) - board.cs * 0.5;
    const y = height * lane + (type === "flying" ? Math.sin(t * 2.5) * height * 0.07 : 0);
    miniAlien(c, board, x / board.cs, y / board.cs, type, stage, t, 1);
  }
  if (splashMotion?.matches) canvas.dataset.painted = "1";
  else delete canvas.dataset.painted;
}

const CINE = { scenes: [], i: 0, t0: 0, raf: 0, onDone: null, stars: null };
const TAU2 = Math.PI * 2;

function playCine(scenes, onDone) {
  CINE.scenes = scenes; CINE.i = 0; CINE.onDone = onDone;
  if (S) { S.menu = true; S.ghost = null; }
  $("overlay").style.display = "none";
  $("cine").style.display = "block";
  showScene();
  cancelAnimationFrame(CINE.raf);
  CINE.raf = requestAnimationFrame(cineFrame);
}
function showScene() {
  const sc = CINE.scenes[CINE.i], last = CINE.i === CINE.scenes.length - 1;
  CINE.t0 = performance.now();
  $("cineKicker").textContent = sc.kicker || "";
  $("cineTitle").textContent = sc.title || "";
  $("cineTitle").className = sc.bigTitle ? "big" : "";
  $("cine").classList.toggle("fieldGuide", !!sc.content);
  const body = $("cineBody");
  if (sc.content) body.tabIndex = 0;
  else body.removeAttribute("tabindex");
  body.innerHTML = (sc.body || []).map((p, k) => `<p style="animation-delay:${0.25 + k * 0.7}s">${p}</p>`).join("") + (sc.content ? sc.content() : "");
  body.scrollTop = 0;
  const btns = [...(sc.buttons || [{ label: last ? (sc.doneLabel || "Continue ▶") : "Next ▶", act: "next", main: true }])];
  if (CINE.scenes === TUTORIAL && CINE.i > 0) btns.unshift({ label: "◀ Previous", act: "previous" });
  $("cineBtns").innerHTML = btns.map((b, k) => `<button data-k="${k}" class="${b.main ? "main" : ""}">${b.label}</button>`).join("");
  [...$("cineBtns").children].forEach((el, k) => el.onclick = ev => {
    ev.stopPropagation();
    const { act } = btns[k];
    if (act === "previous") { CINE.i--; showScene(); }
    else if (act === "next") nextScene();
    else endCine(act);
  });
  $("cineSkip").textContent = sc.skipLabel || "Skip ▸▸";
  $("cineSkip").style.display = sc.noSkip ? "none" : "";
  $("cineDots").innerHTML = CINE.scenes.length > 1 ? CINE.scenes.map((_, k) => `<i class="${k === CINE.i ? "on" : ""}"></i>`).join("") : "";
}
function nextScene() { if (CINE.i < CINE.scenes.length - 1) { CINE.i++; showScene(); } else endCine("done"); }
function endCine(result) {
  $("cine").style.display = "none";
  cancelAnimationFrame(CINE.raf);
  const f = CINE.onDone; CINE.onDone = null;
  if (f) f(result); else if (S) S.menu = false;
}
function cineFrame() {
  const now = performance.now(); // same clock as the scene start (frame timestamps can differ)
  const cv = $("cineCv"), d = window.devicePixelRatio || 1, W = window.innerWidth, H = window.innerHeight;
  if (cv.width !== Math.round(W * d) || cv.height !== Math.round(H * d)) { cv.width = Math.round(W * d); cv.height = Math.round(H * d); }
  const c = cv.getContext("2d");
  c.setTransform(d, 0, 0, d, 0, 0);
  const sc = CINE.scenes[CINE.i];
  if (sc && sc.draw) sc.draw(c, Math.max(0, (now - CINE.t0) / 1000), W, H);
  CINE.raf = requestAnimationFrame(cineFrame);
}
$("cineSkip").onclick = ev => { ev.stopPropagation(); endCine("skip"); };
$("cine").addEventListener("click", ev => { if (!ev.target.closest("button")) nextSceneIfSimple(); });
function nextSceneIfSimple() { const sc = CINE.scenes[CINE.i]; if (!sc.buttons && !sc.content && CINE.i < CINE.scenes.length - 1) nextScene(); }

// ---------- shared scene pieces ----------
function starfield(c, t, W, H, drift = 6, alpha = 1) {
  if (!CINE.stars) CINE.stars = Array.from({ length: 320 }, (_, k) => ({ x: hash2(k, 1), y: hash2(k, 2), z: 0.2 + 0.8 * hash2(k, 3), tw: hash2(k, 4) * 6 }));
  c.fillStyle = "#04060c"; c.fillRect(0, 0, W, H);
  for (const s of CINE.stars) {
    const x = ((s.x * W - t * drift * s.z * 10) % W + W) % W, y = s.y * H;
    c.globalAlpha = alpha * (0.35 + 0.65 * s.z) * (0.75 + 0.25 * Math.sin(t * 2 + s.tw));
    c.fillStyle = "#dfe8ff"; c.fillRect(x, y, s.z * 1.8, s.z * 1.8);

}
function nebula(c, x, y, r, col) { const g = c.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, col); g.addColorStop(1, "rgba(0,0,0,0)"); c.fillStyle = g; c.fillRect(x - r, y - r, r * 2, r * 2); }
function enemyShip(c, x, y, s, t, k) { // small alien warship with a red engine
  c.save(); c.translate(x, y);
  c.fillStyle = "rgba(255,80,90,0.5)"; c.beginPath(); c.ellipse(s * 1.4, 0, s * (1 + 0.4 * Math.sin(t * 20 + k)), s * 0.25, 0, 0, TAU2); c.fill();
  c.fillStyle = "#59617d"; c.beginPath(); c.moveTo(-s * 1.2, 0); c.lineTo(s * 0.8, -s * 0.5); c.lineTo(s * 1.1, 0); c.lineTo(s * 0.8, s * 0.5); c.closePath(); c.fill();
  c.fillStyle = "#ff5d7a"; c.beginPath(); c.arc(-s * 0.2, 0, s * 0.18, 0, TAU2); c.fill();
  c.restore();
}
function planet(c, theme, x, y, r, t) {
  c.save();
  c.beginPath(); c.arc(x, y, r, 0, TAU2); c.clip();
  if (theme === "ice") {
    const g = c.createRadialGradient(x - r * 0.4, y - r * 0.4, r * 0.1, x, y, r); g.addColorStop(0, "#e2f2ff"); g.addColorStop(1, "#3d6c9c");
    c.fillStyle = g; c.fillRect(x - r, y - r, r * 2, r * 2);
    for (let k = 0; k < 12; k++) { c.fillStyle = "rgba(40,80,120,0.35)"; c.beginPath(); c.arc(x + (hash2(k, 9) - 0.5) * r * 1.6, y + (hash2(k, 8) - 0.5) * r * 1.6, r * (0.05 + 0.1 * hash2(k, 7)), 0, TAU2); c.fill(); }
  } else if (theme === "jupiter") {
    for (let k = -10; k <= 10; k++) {
      const yy = y + k * r / 10, cols = ["#c8925e", "#e6c79a", "#a96b44", "#f0d9b5", "#8c5636"];
      c.fillStyle = cols[(k + 20) % cols.length]; c.fillRect(x - r, yy + Math.sin(t * 0.6 + k) * 2, r * 2, r / 10 + 2);
    }
    c.fillStyle = "rgba(170,60,40,0.75)"; c.beginPath(); c.ellipse(x + r * 0.3 + Math.sin(t * 0.3) * r * 0.05, y + r * 0.25, r * 0.22, r * 0.12, 0, 0, TAU2); c.fill();
  } else if (theme === "mars") {
    const g = c.createRadialGradient(x - r * 0.4, y - r * 0.4, r * 0.1, x, y, r); g.addColorStop(0, "#f0915e"); g.addColorStop(1, "#6e2412");
    c.fillStyle = g; c.fillRect(x - r, y - r, r * 2, r * 2);
    c.strokeStyle = "rgba(80,20,10,0.6)"; c.lineWidth = r * 0.03;
    for (let k = 0; k < 4; k++) { c.beginPath(); c.moveTo(x - r, y - r * 0.2 + k * r * 0.15); c.bezierCurveTo(x - r * 0.3, y + k * r * 0.1, x + r * 0.2, y - r * 0.3 + k * r * 0.1, x + r, y + k * r * 0.12); c.stroke(); }
    c.fillStyle = "rgba(230,170,120,0.35)"; c.fillRect(x - r, y - r * 0.05 + Math.sin(t * 0.4) * r * 0.2, r * 2, r * 0.2); // dust storm
  } else { // earth
    const g = c.createRadialGradient(x - r * 0.4, y - r * 0.4, r * 0.1, x, y, r); g.addColorStop(0, "#5aa9ff"); g.addColorStop(1, "#0a2a66");
    c.fillStyle = g; c.fillRect(x - r, y - r, r * 2, r * 2);
    c.fillStyle = "#2e7d4f";
    for (let k = 0; k < 7; k++) { c.beginPath(); c.ellipse(x + (hash2(k, 3) - 0.5) * r * 1.4 + Math.sin(t * 0.1) * r * 0.05, y + (hash2(k, 4) - 0.5) * r * 1.4, r * (0.15 + 0.2 * hash2(k, 5)), r * (0.1 + 0.15 * hash2(k, 6)), hash2(k, 7) * 3, 0, TAU2); c.fill(); }
    c.fillStyle = "rgba(255,210,120,0.8)"; // city lights on the night side
    for (let k = 0; k < 60; k++) { const a = hash2(k, 11) * TAU2, d = Math.sqrt(hash2(k, 12)) * r; const px = x + Math.cos(a) * d, py = y + Math.sin(a) * d; if (px - x > r * 0.15) c.fillRect(px, py, 1.6, 1.6); }
    if (Math.sin(t * 3) > 0.7) { c.fillStyle = "rgba(255,120,60,0.8)"; c.beginPath(); c.arc(x + r * 0.45, y + r * 0.1, r * 0.06, 0, TAU2); c.fill(); }
  }

  c.fillStyle = shade; c.fillRect(x - r, y - r, r * 2, r * 2);

}
function iceField(c, t, W, H) { // drifting ice asteroids
  for (let k = 0; k < 26; k++) {
    const z = 0.3 + 0.7 * hash2(k, 21), x = ((hash2(k, 22) * W * 1.3 - t * 14 * z) % (W * 1.3) + W * 1.3) % (W * 1.3) - W * 0.15, y = hash2(k, 23) * H * 0.7;
    const r = (6 + 22 * hash2(k, 24)) * z;
    c.save(); c.translate(x, y); c.rotate(t * 0.2 * (hash2(k, 25) - 0.5));
    const g = c.createLinearGradient(-r, -r, r, r); g.addColorStop(0, "#d9ecff"); g.addColorStop(1, "#4d6f99");
    c.fillStyle = g; c.globalAlpha = 0.45 + 0.55 * z; c.beginPath();

}
function fleet(c, t, W, H, n, speed, y0, spread) {
  for (let k = 0; k < n; k++) {
    const z = 0.35 + 0.65 * hash2(k, 31);
    const x = W + 40 - ((t * speed * z + hash2(k, 32) * W * 1.4) % (W * 1.6));
    const y = y0 + (hash2(k, 33) - 0.5) * spread + Math.sin(t + k) * 4;

// Big warship silhouettes in three hull shapes (cruiser, carrier, lancer)
function warship(c, x, y, s, t, k) {
  c.save(); c.translate(x, y);
  c.fillStyle = "rgba(255,110,70,0.45)"; c.beginPath(); c.ellipse(s * 1.7, 0, s * (0.9 + 0.3 * Math.sin(t * 18 + k)), s * 0.22, 0, 0, TAU2); c.fill();

  c.restore();
}
// A mixed alien fleet using the game's own craft art (they face left, flying toward Earth)
const FLEET_MIX = [["flying", 2], ["flying", 3], ["fast", 2], ["fast", 3], ["tank", 2], ["tank", 3], ["swarm", 2], ["swarm", 3], ["normal", 2], ["war", 0], ["war", 1], ["war", 2]];
function fleetVaried(c, t, W, H, n, speed, y0, spread) {
  // a Command Ship drifting slowly far behind the fleet
  { const k = 70, x = W + 120 - ((t * speed * 0.18) % (W + 300)), y = y0 - spread * 0.25;
    c.save(); c.globalAlpha = 0.85; c.translate(x, y); c.scale(-k, k); ALIENS.draw(c, "boss", 2, t, ENEMIES.boss.size, k, false); c.restore(); c.globalAlpha = 1; }
  for (let k = 0; k < n; k++) {
    const z = 0.35 + 0.65 * hash2(k, 31);
    const x = W + 60 - ((t * speed * z + hash2(k, 32) * W * 1.4) % (W * 1.7));
    const y = y0 + (hash2(k, 33) - 0.5) * spread + Math.sin(t + k) * 4;

function boom(c, x, y, k, t) { // looping explosion
  const p = (t * 0.8 + hash2(k, 41)) % 1;
  const g = c.createRadialGradient(x, y, 0, x, y, 30 * p + 4);
  g.addColorStop(0, `rgba(255,240,200,${1 - p})`); g.addColorStop(0.5, `rgba(255,140,60,${0.8 * (1 - p)})`); g.addColorStop(1, "rgba(255,60,30,0)");
  c.fillStyle = g; c.beginPath(); c.arc(x, y, 30 * p + 4, 0, TAU2); c.fill();

function miniBoard(c, W, H, cols, rows) { // returns cell size + origin, draws the board
  const cs = Math.min(W * 0.8 / cols, H * 0.5 / rows), ox = (W - cols * cs) / 2, oy = H * 0.05;
  c.fillStyle = "#04060c"; c.fillRect(0, 0, W, H);
  c.fillStyle = "#0f1424"; c.fillRect(ox, oy, cols * cs, rows * cs);
  c.strokeStyle = "rgba(120,140,200,0.12)"; c.lineWidth = 1; c.beginPath();
  for (let x = 1; x < cols; x++) { c.moveTo(ox + x * cs, oy); c.lineTo(ox + x * cs, oy + rows * cs); }
  for (let y = 1; y < rows; y++) { c.moveTo(ox, oy + y * cs); c.lineTo(ox + cols * cs, oy + y * cs); }
  c.stroke();
  return { cs, ox, oy };
}
function miniPortal(c, b, x, y, t) { const cx = b.ox + (x + 0.5) * b.cs, cy = b.oy + (y + 0.5) * b.cs; const g = c.createRadialGradient(cx, cy, 0, cx, cy, b.cs * 0.5); g.addColorStop(0, "#e9d4ff"); g.addColorStop(0.5, "#9b5cff"); g.addColorStop(1, "rgba(155,92,255,0)"); c.fillStyle = g; c.beginPath(); c.arc(cx, cy, b.cs * 0.5, 0, TAU2); c.fill(); c.strokeStyle = "#d0b0ff"; c.lineWidth = 2; c.beginPath(); c.arc(cx, cy, b.cs * 0.25, t * 3, t * 3 + 4); c.stroke(); }
function miniBase(c, b, x, y, hit) { const cx = b.ox + (x + 0.5) * b.cs, cy = b.oy + (y + 0.5) * b.cs, s = b.cs; c.fillStyle = hit ? "#ffffff" : "#5dff9b"; c.beginPath(); c.moveTo(cx, cy - s * 0.34); c.lineTo(cx + s * 0.3, cy - s * 0.22); c.lineTo(cx + s * 0.26, cy + s * 0.1); c.quadraticCurveTo(cx + s * 0.14, cy + s * 0.3, cx, cy + s * 0.38); c.quadraticCurveTo(cx - s * 0.14, cy + s * 0.3, cx - s * 0.26, cy + s * 0.1); c.lineTo(cx - s * 0.3, cy - s * 0.22); c.closePath(); c.fill(); }

function drawWavePortraits(c, wave, elapsed, width, top) {
  const groups = waveGroups(wave), stage = stageOf(wave);
  const panelWidth = Math.min(width, 360);
  const left = (width - panelWidth) / 2;
  const slot = panelWidth / groups.length;
  const still = splashMotion?.matches;
  c.save();
  c.textAlign = "center";
  groups.forEach(({ type, n }, i) => {
    const def = ENEMIES[type], x = left + slot * (i + 0.5);
    const entry = still ? 1 : Math.max(0, Math.min(1, (elapsed - i * 0.15) / 0.35));
    const lift = (1 - entry) ** 2 * 10, radius = Math.min(30, slot * 0.29);
    const portraitY = top + 36 + lift;
    c.fillStyle = hexToRgba(def.color, 0.14);
    c.beginPath(); c.arc(x, portraitY, radius, 0, Math.PI * 2); c.fill();
    const board = { ox: x, oy: portraitY, cs: radius * 0.53 / def.size };

    c.fillStyle = "#e6ecff"; c.font = "800 14px system-ui";

}
function miniTower(c, b, x, y, type, level, st, evo = -1) { c.save(); c.translate(b.ox + x * b.cs, b.oy + y * b.cs); c.scale(b.cs, b.cs); TOWER_ART.draw(c, type, level, st, b.cs / 150, evo); c.restore(); }
function miniBfs(cols, rows, blocked, exit) {
  const d = new Int32Array(cols * rows).fill(-1), q = [exit[1] * cols + exit[0]]; d[q[0]] = 0;
  for (let h = 0; h < q.length; h++) { const i = q[h], x = i % cols, y = (i / cols) | 0;
    for (const [dx, dy] of [[0, 1], [1, 0], [-1, 0], [0, -1]]) { const nx = x + dx, ny = y + dy, j = ny * cols + nx; if (nx < 0 || ny < 0 || nx >= cols || ny >= rows || d[j] !== -1 || blocked.has(j)) continue; d[j] = d[i] + 1; q.push(j); } }
  return d;
}
function miniPath(cols, rows, blocked, entry, exit) { // list of cells from entry to exit
  const d = miniBfs(cols, rows, blocked, exit), out = []; let [x, y] = entry, g = 0;
  if (d[y * cols + x] < 0) return out;
  while (!(x === exit[0] && y === exit[1]) && g++ < 200) { out.push([x, y]); const dd = d[y * cols + x];
    const n = [[0, 1], [1, 0], [-1, 0], [0, -1]].find(([dx, dy]) => { const nx = x + dx, ny = y + dy; return nx >= 0 && ny >= 0 && nx < cols && ny < rows && d[ny * cols + nx] === dd - 1; }); if (!n) break; x += n[0]; y += n[1]; }
  out.push(exit); return out;
}

}

  },
  map: a => { if (!campaignComplete() || !WORLDS[+a]) return; mSel.map = +a; mSel.diff = maxDiff(mSel.map); newGameMenu(); },
  dminus: () => { mSel.diff = Math.max(1, mSel.diff - 1); newGameMenu(); },
  dplus: () => { mSel.diff = Math.min(maxDiff(mSel.map), mSel.diff + 1); newGameMenu(); },
  start: () => {
    const map = campaignComplete() ? mSel.map : campaignWorld();
    const diff = Math.min(mSel.diff, maxDiff(map));
    autoFullscreen();
    lsDel(KEY_RUN);
    newGame(map, diff, true);
    const briefing = briefingScene(map);
    const scenes = map === 0 ? [...INTRO, ...briefing] : briefing;
    playCine(scenes, () => {
      if (map === 0) { P.seenIntro = true; saveProfile(); }
      closeMenu();
    });
  },
  nextworld: () => {
    const n = Math.min(WORLDS.length - 1, S.map + 1);
    mSel.map = n; mSel.diff = Math.min(S.diff, maxDiff(n));
    lsDel(KEY_RUN); newGame(n, mSel.diff, true); playCine(briefingScene(n), () => closeMenu());
  },
  howto: () => playTutorial(() => mainMenu()),
  howtoPause: () => playTutorial(() => pauseMenu()),
  story: () => playIntro(() => mainMenu()),
  cont: () => { autoFullscreen(); if (loadRun()) closeMenu(); else mainMenu(); },
  fs: () => { if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); else enterFullscreen(); setTimeout(pauseMenu, 150); },
  resume: () => closeMenu(),
  quit: () => { S.started = false; mainMenu(); }, // last autosave (start of this wave) is kept
  retry: () => { autoFullscreen(); newGame(S.map, S.diff, true); closeMenu(); },
};
$("ovBox").addEventListener("click", ev => {
  const b = ev.target.closest("[data-act]");
  if (b && !b.disabled && ACT[b.dataset.act]) ACT[b.dataset.act](b.dataset.arg);
});

// ============================================================
//  LOOP
// ============================================================
let last = performance.now(), enemyInfoTick = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!S.menu && !S.over) for (let k = 0; k < S.speed; k++) update(dt);
  tickCountdown(dt);
  if (S.selEnemy && ++enemyInfoTick % 8 === 0) refreshBar(); // live HP readout
  updateStartCard();
  drawStartCardPortraits(now);
  updateSides();
  const overlay = $("overlay");
  if (overlay.style.display === "flex" && overlay.classList.contains("splash")) drawSplash($("splashCv"), now);
  else draw();
  requestAnimationFrame(frame);
}

function initializeGame() {
  newGame(0, 1, false);
  buildIcons();
  resize();
  mainMenu();
  $("overlay").classList.remove("booting");

  window.addEventListener("resize", resize);
  if (window.ResizeObserver) new ResizeObserver(() => resize()).observe($("stage"));
  document.addEventListener("visibilitychange", () => {
    if (document.hidden && S.started && !S.over && !S.menu) pauseMenu();
  });
  requestAnimationFrame(frame);
}

// Let the browser paint the loading screen before building the game assets.
requestAnimationFrame(() => requestAnimationFrame(initializeGame));
</script>
