<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0f1a">
<title>Alien Defense</title>
<style>
  :root {
    --bg: #0b0f1a;
    --panel: #141a2b;
    --panel-2: #1c2440;
    --line: #2c3760;
    --text: #e6ecff;
    --muted: #8a94b8;
    --accent: #4fd1ff;
    --good: #5dff9b;
    --bad: #ff5d7a;
    --gold: #ffd25d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden; user-select: none; -webkit-user-select: none;
  }
  #app { display: flex; flex-direction: column; width: 100%; max-width: 600px; margin-inline: auto; height: 100%; height: 100dvh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  #hud { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
    align-items: center; gap: 6px; padding: 8px 8px; background: var(--panel); flex: none; }
  #hud .hudGroup { display: flex; align-items: center; gap: inherit; }
  #hud .hudControls { display: grid; justify-items: end; gap: 2px; }
  #hud #nextEnemies { display: flex; align-items: center; gap: 3px; padding: 1px 4px; font-size: 9px; color: var(--muted); }
  #nextEnemies .chips { display: flex; flex-wrap: nowrap; gap: 4px; }
  #nextEnemies .chip { background: none; border: 0; padding: 0; font-size: 10px; }
  #nextEnemies .chip img { width: 13px; height: 13px; }
  #nextEnemies .hp, #nextEnemies .lk, #nextEnemies .vs { display: none; }
  #hud .hudLaunch { display: grid; justify-items: center; gap: 3px; }
  #hudCountdown { color: var(--good); font-size: 10px; font-weight: 700; white-space: nowrap; }
  .stat { font-weight: 800; font-size: 16px; white-space: nowrap; }
  .pill { border-radius: 999px; padding: 4px 11px; border: 1px solid; display: inline-block; }
  .stat.lives { color: var(--bad); background: rgba(255,93,122,0.10); border-color: rgba(255,93,122,0.45); }
  .stat.gold { color: var(--gold); background: rgba(255,210,93,0.14); border-color: rgba(255,210,93,0.6);
    font-size: 21px; padding: 3px 13px; transition: transform .12s, background .2s; }
  .pill { text-align: center; line-height: 1.05; }
  .pill small { display: block; font-size: 8.5px; letter-spacing: 0.1em; font-weight: 800; opacity: 0.85; }
  .stat.lives.low { animation: lowhp 0.9s ease-in-out infinite; }
  @keyframes lowhp { 50% { background: rgba(255,93,122,0.4); } }
  .stat.gold.up { transform: scale(1.15); background: rgba(255,210,93,0.32); }
  .stat.gold.down { transform: scale(0.92); background: rgba(255,93,122,0.25); }
  .stat.wave { color: var(--muted); font-weight: 600; font-size: 14px; }
  #hud button { white-space: nowrap; padding: 8px 9px; }
  button {
    font: inherit; color: var(--text); background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 10px; padding: 8px 10px; font-weight: 700; touch-action: manipulation; cursor: pointer;
  }
  button:active { transform: scale(0.96); }
  button:disabled { opacity: 0.4; }
  @media (max-width: 400px) {
    #hud { gap: 4px; padding: 8px 6px; }
    #hud button { padding: 7px 6px; }
    .stat.gold { font-size: 18px; padding: 3px 9px; }
    .stat.lives { padding: 4px 8px; font-size: 15px; }
    .stat.wave { font-size: 12px; }
  }
  #nextBtn { background: #1d4a3a; border-color: #2f7a5c; color: var(--good); }
  #hud .hudStatus { display: grid; justify-items: start; gap: 2px; min-width: 0; }
  #hud .hudStatus .hudGroup { flex-wrap: wrap; gap: 3px; }
  #hud .hudStatus .pill { font-size: 14px; padding: 3px 5px; }
  #hud .hudStatus .pill small { display: block; margin-bottom: 1px; font-size: 10px; }
  #hud #waveBar { max-width: 100%; padding: 2px 5px; text-align: left; font-size: 10px; line-height: 1.2; white-space: normal; }
  #waveWorld { display: block; color: var(--accent); }
  #waveNow { color: var(--text); }
  #scChips { cursor: pointer; }
  .chips { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
  .chip { display: inline-flex; align-items: center; gap: 2px; background: #1a2140; border: 1px solid var(--line);
    border-radius: 8px; padding: 2px 5px; color: var(--text); font-weight: 800; font-size: 12px; white-space: nowrap; }
  .chip.air { border-color: rgba(122,184,255,0.6); }
  .chip img { width: 16px; height: 16px; }
  .chip .hp { color: #ff9d6b; }
  .chip .hp small { font-size: 9px; color: var(--muted); }
  .chip .lk { color: var(--bad); font-size: 11px; margin-left: 3px; }
  .chip .vs { display: inline-flex; align-items: center; margin-left: 2px; padding-left: 3px; border-left: 1px solid var(--line); }
  .ecard { display: flex; gap: 8px; padding: 8px 0; border-top: 1px solid var(--line); }
  .ecard:first-of-type { border-top: none; }
  .ecard .ei { width: 44px; height: 44px; flex: none; }
  .ecard b { font-size: 15px; }
  .ecard .role { font-size: 11px; color: var(--muted); }
  .ecard .erow { font-size: 12px; color: var(--muted); margin-top: 2px; line-height: 1.35; }
  .ecard .erow img { width: 14px; height: 14px; vertical-align: middle; }
  .ecard .hp { color: #ff9d6b; font-weight: 800; }
  .ecard .erow.air { color: #7ab8ff; font-weight: 700; }
  .ecard .ebody { flex: 1; min-width: 0; }
  .ecard .erow.warn, .ecard .lk { color: var(--bad); font-weight: 800; }
  .ecard .gd { color: var(--gold); font-weight: 700; }
  .gbar { height: 6px; background: #232b48; border-radius: 3px; overflow: hidden; margin: 4px 0 2px; }
  .gbar i { display: block; height: 100%; background: #ff9d6b; }
  #startCard { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 3; display: none;
    background: rgba(20,26,43,0.94); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px;
    text-align: center; width: min(350px, calc(100% - 20px)); max-height: calc(100% - 8px); overflow-y: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  #startCard .sc-title { font-weight: 800; font-size: 18px; margin-bottom: 8px; }
  #scPortraits { display: block; width: min(300px, 100%); height: 114px; height: clamp(68px, 18dvh, 114px);
    margin: 0 auto 6px; touch-action: pan-y; }
  #startCard .chips { justify-content: center; margin-bottom: 4px; }
  #startCard .chip { font-size: 14px; padding: 4px 7px; }
  #startCard .chip img { width: 20px; height: 20px; }
  #startCard .sc-sub { font-size: 11px; color: var(--muted); margin-bottom: 10px; }
  #startPreview { background: #1d4a3a; border-color: #2f7a5c; color: var(--good); }
  #startCard .sc-hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
  #startCard.show { display: block; }
  #startCard .cd { height: 6px; background: #232b48; border-radius: 3px; overflow: hidden; margin: 10px auto 4px; width: 80%; }
  #startCard .cd i { display: block; height: 100%; width: 100%; background: var(--good); }
  #startCard .sc-cd { font-size: 13px; font-weight: 700; color: var(--good); }
  .guide td.note { border-top: none; color: var(--muted); font-size: 11px; text-align: left; padding-top: 0; }
  #nextBtn.busy { background: var(--panel-2); border-color: var(--line); color: var(--muted); }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(93,255,155,0.7); }
    50% { box-shadow: 0 0 0 7px rgba(93,255,155,0); }
  }
  #stage { position: relative; flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }
  canvas { display: block; touch-action: none; border-radius: 6px; }
  #bar { flex: none; background: var(--panel); padding: 8px; min-height: 76px; }
  #build { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 5px; }
  .tbtn { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; touch-action: none; }
  .tbtn .ic { width: 30px; height: 30px; }
  .tbtn .nm { font-size: 13px; }
  .tbtn .cs { font-size: 12px; color: var(--gold); }
  .tbtn .dp { font-size: 12px; font-weight: 800; color: #ff9d6b; line-height: 1.1; white-space: nowrap; }
  .tbtn .dp small { font-size: 9px; font-weight: 700; color: var(--muted); }
  .tbtn.sel { outline: 2px solid var(--accent); background: #243058; }
  .tbtn.poor { opacity: 0.45; }
  .tbtn.poor .cs { color: var(--bad); }
  #upBtn.can { background: #1d4a3a; border-color: var(--good); color: var(--good); animation: pulse 1.1s ease-in-out infinite; }
  #upBtn .short { color: var(--bad); }
  #sellBtn { color: var(--gold); border-color: rgba(255,210,93,0.5); }
  #sellBtn.full { background: #3a3415; }
  #info { display: none; align-items: center; gap: 6px; }
  #info .desc { flex: 1; font-size: 13px; line-height: 1.3; min-width: 0; }
  #info .desc b { font-size: 15px; }
  #hint { font-size: 12px; color: var(--muted); text-align: center; margin-top: 6px; min-height: 32px; line-height: 1.35; }
  @media (max-width: 340px) {
    #hud { gap: 3px; padding-inline: 4px; }
    #hud button { font-size: 13px; padding-inline: 4px; }
    #hud #nextEnemies { padding-inline: 2px; gap: 2px; }
    #bar { padding-inline: 4px; }
    #build { gap: 3px; }
    .tbtn .nm { font-size: 11px; }
  }
  @media (max-height: 500px) {
    #hud, #bar { padding-block: 4px; }
    #bar { min-height: 0; }
    .tbtn { padding-block: 3px; }
    .tbtn .ic { width: 20px; height: 20px; }
    #hint { min-height: 0; margin-top: 3px; font-size: 11px; }
    #startCard { padding: 8px 10px; }
  }
  #hint b { color: var(--text); }
  #hint .up { color: var(--good); font-weight: 700; }
  #hint .val { color: var(--gold); font-weight: 700; }
  #hint .link { color: var(--accent); text-decoration: underline; cursor: pointer; padding: 2px; }
  .guide { text-align: left; margin: 10px 0 14px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
  .guide .hd { display: flex; align-items: center; gap: 8px; }
  .guide .hd img { width: 30px; height: 30px; }
  .guide .hd .t { font-weight: 800; font-size: 16px; }
  .guide .sub { font-size: 12px; color: var(--muted); margin: 3px 0 6px; }
  .guide table { width: 100%; border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .guide th { color: var(--muted); font-weight: 600; text-align: right; padding: 3px 4px; }
  .guide td { text-align: right; padding: 3px 4px; border-top: 1px solid rgba(44,55,96,0.6); }
  .guide th:first-child, .guide td:first-child { text-align: left; }
  .guide td.v { color: var(--gold); font-weight: 700; }
  .guide td.up { color: var(--good); }

  #overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(5, 8, 15, 0.85); z-index: 10; padding: 16px; }
  #ovBox { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 20px;
    width: 100%; max-width: 360px; max-height: 100%; overflow-y: auto; text-align: center; }
  #ovBox h1 { margin: 0 0 6px; font-size: 28px; }
  #ovBox h2 { margin: 0 0 10px; font-size: 22px; }
  #ovBox p { color: var(--muted); margin: 0 0 14px; line-height: 1.4; font-size: 14px; }
  #ovBox .big { display: block; width: 100%; margin: 8px 0; padding: 12px; font-size: 17px; }
  #ovBox .big small { font-weight: 500; color: var(--muted); font-size: 12px; }
  #ovBox .sel { outline: 2px solid var(--accent); background: #243058; }
  #overlay.splash {
    background:
      radial-gradient(circle at 16% 24%, #c9dcff 0 1px, transparent 2px) 0 0 / 139px 151px,
      radial-gradient(circle at 76% 62%, #8399ca 0 1px, transparent 2px) 0 0 / 193px 131px,
      radial-gradient(ellipse at 50% 90%, #192648 0%, #0b1225 42%, #050810 76%);
  }
  #overlay.splash #ovBox { position: relative; max-width: 360px; background: #10182be8; box-shadow: 0 16px 60px #0009; }
  #overlay.splash h1 { font-size: clamp(32px, 8vw, 48px); line-height: 1; text-transform: uppercase; }
  #overlay.booting { display: flex; }
  #overlay.booting #ovBox { position: absolute; top: 0; right: 0; width: auto; padding: 12px; border: 0; background: none; box-shadow: none; }
  #bootButton { min-width: 104px; }
  #bootStatus { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  #splashCv { display: none; position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 0; pointer-events: none; }
  #overlay.splash #splashCv { display: block; }
  #ovBox .splashLinks { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 8px; }
  #ovBox .splashLinks button { min-width: 0; font-size: 14px; }
  @media (min-height: 620px) {
    #overlay.splash:not(.booting) #ovBox { margin-bottom: 10vh; }
  }
  #ovBox .campaignBtn { background: #1d4a3a; border-color: #2f7a5c; color: var(--good); }
  .diff { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 12px 0 4px; font-size: 18px; }
  .diff button { width: 44px; font-size: 20px; }
  #toast { position: fixed; left: 50%; top: 120px; transform: translateX(-50%); background: var(--panel-2);
    padding: 8px 14px; border-radius: 10px; font-weight: 700; opacity: 0; transition: opacity .3s;
    pointer-events: none; z-index: 5; white-space: nowrap; }
  /* ---- story / tutorial cinematics ---- */
  #cine { position: fixed; inset: 0; z-index: 30; display: none; background: #04060c; overflow: hidden; }
  #cineCv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #cine .cineText { position: absolute; left: 0; right: 0; bottom: 0; padding: 40px 20px calc(16px + env(safe-area-inset-bottom));
    background: linear-gradient(rgba(4,6,12,0), rgba(4,6,12,0.94) 28%); text-align: center; }
  #cine.fieldGuide #cineCv { display: none; }
  #cine.fieldGuide .cineText { inset: 0; display: flex; flex-direction: column; padding: 48px 12px calc(12px + env(safe-area-inset-bottom)); background: var(--bg); }
  #cine.fieldGuide #cineBody { min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
  #cine.fieldGuide #cineBody p { opacity: 1; animation: none; }
  .alienGuide { max-width: 840px; margin: auto; padding: 8px; text-align: left; }
  .alienGuide h3 { margin: 16px 0 8px; }
  .alienGrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 210px), 1fr)); gap: 8px; }
  .alienCard { padding: 10px; background: #141a2b; border: 1px solid #2c3760; border-radius: 8px; font-size: 13px; }
  .alienCard header { display: flex; align-items: center; gap: 8px; }
  .alienCard img { width: 34px; height: 34px; object-fit: contain; }
  .alienCard small { display: block; color: #aebbe0; }
  #cineBody .alienCard p { font-size: 13px; margin: 6px 0; }
  .alienGuide details { margin-top: 16px; overflow-x: auto; }
  #cineKicker { color: #8a94b8; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 800; }
  #cineTitle { margin: 6px 0 10px; font-size: 28px; }
  #cineTitle.big { font-size: 46px; letter-spacing: 0.12em; color: #4fd1ff; text-shadow: 0 0 24px rgba(79,209,255,0.6); }
  #cineBody p { margin: 0 auto 8px; max-width: 640px; font-size: 16px; line-height: 1.5; color: #d5dcf2; opacity: 0; animation: cineIn 0.7s forwards; }
  #cineBody .tag { display: inline-block; font-size: 11px; font-weight: 800; letter-spacing: 0.06em; padding: 2px 7px; border-radius: 6px; background: #243058; color: #4fd1ff; margin-right: 4px; }
  @keyframes cineIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .cineBtns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 12px; }
  .cineBtns button { font-size: 16px; padding: 11px 18px; }
  .cineBtns button.main { background: #1d4a3a; border-color: #2f7a5c; color: var(--good); }
  #cineSkip { position: absolute; top: calc(12px + env(safe-area-inset-top)); right: 12px; z-index: 2; background: rgba(28,36,64,0.85); }
  #cineDots { display: flex; gap: 6px; justify-content: center; margin-top: 10px; }
  #cineDots i { width: 7px; height: 7px; border-radius: 50%; background: #2c3760; }
  #cineDots i.on { background: #4fd1ff; }
  @media (max-height: 640px) { #cineBody p { font-size: 14px; } #cineTitle { font-size: 22px; } #cineTitle.big { font-size: 34px; } }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="hudStatus">
      <div class="hudGroup">
        <span class="stat lives pill" id="lives" title="Base health: you lose when it hits 0">♥ 20</span>
        <span class="stat gold pill" id="gold">◆ 60</span>
      </div>
      <button id="waveBar" title="Open Wave Info"><span id="waveWorld"></span><span id="waveNow"></span> ›</button>
    </div>
    <div class="hudLaunch">
      <button id="nextBtn">Start ▶</button>
      <span id="hudCountdown" hidden></span>
    </div>
    <div class="hudControls">
      <div class="hudGroup">
        <button id="speedBtn" title="Game speed">1×</button>
        <button id="menuBtn" title="Pause game">Pause</button>
      </div>
      <button id="nextEnemies" title="Open next-wave enemy details" aria-label="Open next-wave enemy details">
        Next <span id="nextEnemyChips" class="chips"></span> ›
      </button>
    </div>
  </div>
  <div id="stage"><canvas id="cv"></canvas>
    <div id="startCard">
      <div class="sc-title" id="scTitle"></div>
      <canvas id="scPortraits" aria-hidden="true"></canvas>
      <div class="chips" id="scChips"></div>
      <div class="sc-sub">enemy HP · base damage if one gets through · hits to destroy it · <b style="color:var(--accent)">tap for details ›</b></div>
      <button id="startPreview" hidden>Start ▶</button>
      <div class="cd"><i id="cdBar"></i></div>
      <div class="sc-cd" id="scCd"></div>
      <div class="sc-hint" id="scHint"></div>
    </div>
  </div>
  <div id="bar">
    <div id="build"></div>
    <div id="info">
      <div class="desc" id="infoText"></div>
      <button id="upBtn">Upgrade</button>
      <button id="sellBtn">Sell</button>
      <button id="closeBtn">✕</button>
    </div>
    <div id="hint"></div>
  </div>
</div>
<div id="overlay" class="splash booting">
  <canvas id="splashCv" aria-hidden="true"></canvas>
  <div id="ovBox">
    <p id="bootStatus" role="status">Loading Alien Defense…</p>
    <button id="bootSound">Sound: On</button>
    <button id="bootButton">Skip intro</button>
  </div>
</div>
<div id="toast"></div>
<div id="cine">
  <canvas id="cineCv"></canvas>
  <button id="cineSkip">Skip ▸▸</button>
  <div class="cineText">
    <div id="cineKicker"></div><h2 id="cineTitle"></h2><div id="cineBody"></div>
    <div class="cineBtns" id="cineBtns"></div><div id="cineDots"></div>
  </div>
</div>

<script>
const ATTACKER_STATS = {
  Walker: { hp: 30, speed: 1.6 },
  Runner: { hp: 20, speed: 2.8 },
  Swarm: { hp: 10, speed: 2.0 },
  Flyer: { hp: 26, speed: 1.5 },
  Tank: { hp: 130, speed: 1.0 },
  Boss: { hp: 900, speed: 0.8 },
};
</script>
<script>
"use strict";

const COLS = 10, ROWS = 15;

// ============================================================
//  CAMPAIGN: the four worlds from the backstory (backstory.html)
//  '.' open · '+' buildable scenery · '#' obstacle · '~' hazard · 'S' portal · 'E' base
// ============================================================
const WORLDS = [
  { name: "The Oort Gate", where: "Oort Cloud · 50,000 AU from the Sun", theme: "ice", stage: 0, hpOffset: 0, startGold: 70, goldMul: 1.0,
    desc: "Ice asteroids and debris at the edge of the solar system.",
    story: ["The fleet enters the solar system through the Oort Cloud, a vast frozen shell of ice and rock.",
      "You're the first wall. Your defenses are salvaged from dead stations, cobbled together from debris. But the fleet is spread thin out here, and the cold is your ally.",
      "Buy time. Learn. Survive."],
    obstacles: "Ice asteroids and debris you can build around", enemy: "Their scouts: soft, strange creatures bred for the cold",
    win: "The first attack shatters on the ice. But the fleet is already moving inward, toward the gas giants.",
    rows: ["....S.....", "..........", ".##.......", ".##...##..", "......##..", "..........", "...##.....", "...##.....",
           ".......##.", ".......##.", ".##.......", ".##..##...", ".....##...", "..........", "....E....."] },
  { name: "Jupiter Storm", where: "Jupiter's orbit · 5.2 AU from the Sun", theme: "jupiter", stage: 1, hpOffset: 3, startGold: 108, goldMul: 1.2,
    desc: "Radiation belts and an asteroid ring.",
    story: ["The fleet pushes past the outer worlds. Jupiter looms behind you.",
      "You can't build in the radiation belts. Ground troops have to use the gaps, but flyers cross straight over them.",
      "The hunters are tougher than the Oort scouts. Cover the gaps with ground defenses and keep something that can hit flyers."],
    obstacles: "Radiation belts funnel ground troops · ring asteroids block building", enemy: "Their hunters: fanged, armored and many-eyed",

function variantMap(world, variant) {
  if (variant === 0) return MAPS[world]; // preserve the original layout for older saves
  if (variant >= FIRST_LEGACY_CAMPAIGN_VARIANT) {
    const current = firstCurrentVariant(world);
    let layout;
    if (variant >= current) layout = CAMPAIGN_LAYOUTS[world][variant - current];
    else if (variant >= firstPreviousVariant(world)) {
      const index = variant - firstPreviousVariant(world);
      const previous = CAMPAIGN_LAYOUTS[world][index];
      layout = { ...previous, e: PREVIOUS_BASE_COLUMNS[world][index] ?? previous.e };
    } else if (variant >= FIRST_CURRENT_VARIANT) layout = PREVIOUS_JUPITER_LAYOUTS[variant - FIRST_CURRENT_VARIANT];
    else layout = LEGACY_CAMPAIGN_LAYOUTS[world][variant - FIRST_LEGACY_CAMPAIGN_VARIANT];
    const rows = Array(ROWS).fill(".".repeat(COLS));
    for (const [row, tiles] of Object.entries(layout.rows)) rows[row] = tiles;
    rows[0] = WORLDS[world].rows[0];
    rows[ROWS - 1] = WORLDS[world].rows[ROWS - 1];
    // each layout can move the portal (top row) and base (bottom row) to its own column
    const mark = (ch, col) => ".".repeat(col) + ch + ".".repeat(COLS - col - 1);
    if (layout.s != null) rows[0] = mark("S", layout.s);
    if (layout.e != null) rows[ROWS - 1] = mark("E", layout.e);
    return parseWorld({ ...WORLDS[world], rows });
  }
  const rows = WORLDS[world].rows.slice();
  let seed = Math.imul(world * MAP_VARIANTS + variant, 0x9e3779b9);
  const pick = size => {
    seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
    return Math.floor(seed / 4294967296 * size);
  };
  let beltSide;
  for (let start = 0; start < rows.length; start++) {
    const row = rows[start];
    if (row.includes("~")) {
      // Alternate Jupiter's openings across the board to keep the belts from lining up.
      beltSide ??= pick(2);
      const gap = beltSide * (COLS - 4) + pick(3);
      beltSide = 1 - beltSide;
      rows[start] = "~".repeat(gap) + ".." + "~".repeat(COLS - gap - 2);
      continue;
    }
    if (!row.includes("#")) continue;
    let end = start + 1;
    while (end < rows.length && rows[end].includes("#")) end++;
    // Move whole bands so asteroid clusters, canyon walls and city blocks stay recognizable.
    const mirror = pick(2) === 1;
    const band = rows.slice(start, end).map(line => mirror ? [...line].reverse().join("") : line);
    const left = Math.min(...band.map(line => line.indexOf("#")));
    const right = Math.max(...band.map(line => line.lastIndexOf("#")));
    const offset = pick(COLS - (right - left));
    for (let y = start; y < end; y++) {
      rows[y] = (".".repeat(offset) + band[y - start].slice(left, right + 1)).padEnd(COLS, ".");
    }
    start = end - 1;
  }
  return parseWorld({ ...WORLDS[world], rows });
}

      const filter = audio.createBiquadFilter();
      filter.type = filterType;
      filter.frequency.setValueAtTime(from, start);
      filter.frequency.exponentialRampToValueAtTime(to, end);
      source.connect(filter); filter.connect(envelope);
      source.onended = () => { source.disconnect(); filter.disconnect(); envelope.disconnect(); };
    } else {
      source = audio.createOscillator();
      source.type = wave;
      source.frequency.setValueAtTime(from, start);
      source.frequency.exponentialRampToValueAtTime(to, end);
      source.connect(envelope);
      source.onended = () => { source.disconnect(); envelope.disconnect(); };
    }
    source.start(start);
    source.stop(end);
  }
}

function syncSound() {
  if (audioGain) audioGain.gain.setTargetAtTime(P.sound ? 0.38 : 0, audio.currentTime, 0.02);
}

const soundLabel = () => P.sound ? "Sound: On" : "Sound: Off";
function toggleSound() {

  saveProfile();

// Rocket Hop, the soundtrack from loading screen option 9.
const ROCKET_HOP = { bpm: 126, lead: "sawtooth", bass: [43, null, 43, 50, null, 50, 47, null, 48, null, 48, 55, null, 55, 50, null, 43, null, 43, 50, null, 50, 47, null, 45, null, 47, null, 48, null, 50, null],
    melody: [79, null, 83, null, 86, null, 83, 81, 79, null, null, 76, 78, null, 79, null, 81, null, 83, null, 86, null, 88, 86, 83, null, 81, null, 79, null, null, null], kick: [0, 8, 10, 16, 24, 26], snare: [4, 12, 20, 28], hat: 2 };
const midiFrequency = note => 440 * Math.pow(2, (note - 69) / 12);
function scheduleRocketHop(track, now) {
  const { bpm, lead, bass, melody, kick, snare, hat } = ROCKET_HOP;
  const stepTime = 60 / bpm / 4;
  // Skip missed notes if rendering stalls or the tab resumes.
  if (track.next < now - stepTime) {
    const missed = Math.floor((now - track.next) / stepTime);
    track.step += missed;
    track.next += missed * stepTime;
  }
  while (track.next < now + 0.12) {
    const k = track.step % bass.length;
    const notes = [];
    if (bass[k] != null) {
      const f = midiFrequency(bass[k]);
      notes.push(["triangle", f, f, stepTime * 1.8, 0.28]);
    }
    if (melody[k] != null) {
      const f = midiFrequency(melody[k]);
      notes.push([lead, f, f, stepTime * 1.5, 0.05], ["sine", 2 * f, 2 * f, stepTime, 0.03]);
    }
    if (kick.includes(k)) notes.push(["sine", 150, 45, 0.18, 0.5]);
    if (snare.includes(k)) notes.push(["noise", 1500, 1200, 0.12, 0.22, 0, "highpass"]);
    if (k % hat === 0) notes.push(["noise", 7000, 7000, 0.03, 0.08, 0, "highpass"]);
    playNotes(notes, track.bus, Math.max(now, track.next));
    track.step++;
    track.next += stepTime;
  }
}

let sceneAudio;
function syncSceneAudio(scene) {
  if (!P.sound || audio?.state !== "running" || !audioGain) scene = null;
  if (sceneAudio && sceneAudio.scene !== scene) {
    const { bus, voices } = sceneAudio;
    const now = audio.currentTime;
    bus.gain.cancelScheduledValues(now);
    bus.gain.setTargetAtTime(0, now, 0.035);
    if (voices.length) {
      voices[0].onended = () => {
        for (const voice of voices) voice.disconnect();
        bus.disconnect();
      };
      for (const voice of voices) voice.stop(now + 0.2);
    } else {
      setTimeout(() => bus.disconnect(), 200);
    }
    sceneAudio = null;
  }
  if (!scene) return;
  const now = audio.currentTime;
  if (scene === "menu") {
    if (!sceneAudio) {
      const bus = audio.createGain();
      bus.gain.value = 0.42;
      bus.connect(audioGain);
      sceneAudio = { scene, bus, voices: [], step: 0, next: now + 0.05 };
    }
    scheduleRocketHop(sceneAudio, now);
    return;
  }
  if (!sceneAudio) {
    const bus = audio.createGain();
    bus.gain.setValueAtTime(0, now);
    bus.gain.linearRampToValueAtTime(0.25, now + 0.7);
    bus.connect(audioGain);
    const voices = [98, 146.83].map((frequency, i) => {
      const voice = audio.createOscillator();
      voice.type = i ? "sine" : "triangle";
      voice.frequency.value = frequency;
      voice.connect(bus);
      voice.start(now);
      return voice;
    });
    sceneAudio = { scene, bus, voices, nextPulse: now + 0.35 };
  }
  if (now >= sceneAudio.nextPulse) {
    playSound("storyPulse", sceneAudio.bus);
    sceneAudio.nextPulse = now + 4.4;
  }
}

function saveRun() {
  if (!S.started || S.over) return;
  lsSet(KEY_RUN, {
    map: S.map, variant: S.variant, diff: S.diff, gold: S.gold, lives: S.lives, wave: S.wave, won: S.won,
    endless: S.endless, endlessCleared: S.endlessCleared,
    towers: S.towers.map(t => ({ type: t.type, x: t.x, y: t.y, level: t.level, spent: t.spent, fresh: t.fresh || 0 })),
  });
}
const isClearedRun = run => run?.won && !run.endless && run.wave <= VICTORY_WAVE;
const nextSavedWorld = run => isClearedRun(run) && WORLDS[run.map + 1] ? run.map + 1 : null;
function loadRun() {
  const r = lsGet(KEY_RUN);
  if (!r || !MAPS[r.map]) return false;
  const variant = Number.isInteger(r.variant) && r.variant >= 1 &&
    r.variant < firstCurrentVariant(r.map) + MAP_VARIANTS ? r.variant : 0;
  newGame(r.map, r.diff, false, variant); // avoid autosaving the empty board over the run
  S.countdown = S.countdownMax = r.wave === 0 ? BUILD_TIME : P.autoStart;
  Object.assign(S, { maxLives: Math.max(r.lives, S.maxLives), gold: r.gold, lives: r.lives, wave: r.wave,
    won: r.won, endless: r.endless || r.wave > VICTORY_WAVE, endlessCleared: r.endlessCleared ?? 0, started: true });
  for (const t of r.towers) {
    if (!TOWERS[t.type]) continue;
    const tw = { ...t, cd: 0, angle: -Math.PI / 2 };
    S.grid[idx(t.x, t.y)] = tw; S.towers.push(tw);
  }
  S.dist = computeDist(-1);
  updateHud();

// ============================================================
//  MAP & STATE
// ============================================================
const DIRS = [[0, 1], [1, 0], [-1, 0], [0, -1]];
const idx = (x, y) => y * COLS + x;
const inGrid = (x, y) => x >= 0 && y >= 0 && x < COLS && y < ROWS;
const inBounds = e => e.x > 0 && e.y > 0 && e.x < COLS && e.y < ROWS;

let ENTRY, EXIT, SPAWN, SDIR, ROCKS, SCENERY;
function setMap(i, variant) {
  const m = variantMap(i, variant);
  ENTRY = m.entry; EXIT = m.exit;
  SCENERY = m.scenery;
  SDIR = ENTRY.y === 0 ? [0, -1] : ENTRY.y === ROWS - 1 ? [0, 1] : ENTRY.x === 0 ? [-1, 0] : [1, 0];
  SPAWN = { x: ENTRY.x + 0.5 + SDIR[0], y: ENTRY.y + 0.5 + SDIR[1] };
  ROCKS = new Uint8Array(COLS * ROWS);
  for (const [x, y] of m.rocks) ROCKS[idx(x, y)] = 1;
  for (const [x, y] of m.hazards || []) ROCKS[idx(x, y)] = 2; // radiation belts etc.
  groundCache.key = "";
}

// Starting salvage for the two Oort layouts with the toughest openings.
const OORT_STARTING_SALVAGE = { "Ice Shelf": 8, "Comet Trail": 12 };

let S; // game state
function newGame(map, diff, started, variant = started ? firstCurrentVariant(map) + Math.floor(Math.random() * MAP_VARIANTS) : 0) {
  setMap(map, variant);
  const layout = CAMPAIGN_LAYOUTS[map][variant - firstCurrentVariant(map)];
  const startingSalvage = map === 0 ? OORT_STARTING_SALVAGE[layout?.name] ?? 0 : 0;
  S = {
    map, variant, diff, started: !!started,
    gold: WORLDS[map].startGold + startingSalvage, lives: START_LIVES, wave: 0,
    maxLives: START_LIVES, baseHit: 0, leaked: false,
    countdown: BUILD_TIME, countdownMax: BUILD_TIME, wasIdle: true,
    awaitingStart: true,
    grid: new Array(COLS * ROWS).fill(null),
    towers: [], enemies: [], shots: [], fx: [], spawnQ: [], pendingClear: [],
    dist: null, speed: 1, over: false, won: false, endless: false, endlessCleared: 0, menu: false,
    buildType: null, selected: null, ghost: null, time: 0,
  };
  S.dist = computeDist(-1);
  waveBarKey = "";
  $("speedBtn").textContent = "1×";
  updateHud();
}

const blocks = j => ROCKS[j] || (S.grid[j] && !TOWERS[S.grid[j].type].walkable);

// BFS from exit over open cells. extraBlock = cell index to treat as blocked (for placement test).
function computeDist(extraBlock) {
  const d = new Int32Array(COLS * ROWS).fill(-1);
  const start = idx(EXIT.x, EXIT.y);
  const q = [start]; d[start] = 0;
  for (let h = 0; h < q.length; h++) {
    const i = q[h], x = i % COLS, y = (i / COLS) | 0;
    for (const [dx, dy] of DIRS) {
      const nx = x + dx, ny = y + dy;
      if (!inGrid(nx, ny)) continue;
      const j = idx(nx, ny);
      if (d[j] !== -1 || blocks(j) || j === extraBlock) continue;
      d[j] = d[i] + 1; q.push(j);
    }
  }
  return d;
}

function canPlace(type, x, y) {
  if (!inGrid(x, y)) return false;
  if ((x === ENTRY.x && y === ENTRY.y) || (x === EXIT.x && y === EXIT.y)) return false;
  const i = idx(x, y);
  if (ROCKS[i] || S.grid[i]) return false;
  // Every piece, Mines included, must leave enemies another way through.
  for (const e of S.enemies) {
    if (e.flying) continue;
    if (idx(e.tx, e.ty) === i) return false;
    if (inBounds(e) && Math.floor(e.x) === x && Math.floor(e.y) === y) return false;
  }
  const d = computeDist(i);
  if (d[idx(ENTRY.x, ENTRY.y)] === -1) return false;
  for (const e of S.enemies) if (!e.flying && d[idx(e.tx, e.ty)] === -1) return false;
  return true;
}

function placeTower(type, x, y) {
  const def = TOWERS[type];
  if (S.gold < def.cost || !canPlace(type, x, y)) return false;
  const t = { type, x, y, level: 0, cd: 0, spent: def.cost, fresh: def.cost, angle: -Math.PI / 2 };
  S.grid[idx(x, y)] = t;
  S.towers.push(t);
  S.gold -= def.cost;
  S.dist = computeDist(-1);
  floatText(x + 0.5, y + 0.3, `−${def.cost}`, "#ff8b9e");
  playSound("build");
  updateHud();
  return true;
}

function tryPlace(c) {
  if (S.gold < TOWERS[S.buildType].cost) { toast("Not enough gold"); return false; }
  if (!placeTower(S.buildType, c.x, c.y)) { toast(S.grid[idx(c.x, c.y)] || ROCKS[idx(c.x, c.y)] ? "Cell taken"
    : TOWERS[S.buildType].walkable ? "Mines can't go on the only route" : "Can't block the path"); return false; }
  return true;
}

// Gold spent since the last wave started comes back in full; older spending at the normal rate.
const refund = t => {
  const fresh = t.fresh || 0;
  return fresh + Math.floor((t.spent - fresh) * BASE_REFUND);
};
function sellTower(t) {
  S.grid[idx(t.x, t.y)] = null;
  S.towers.splice(S.towers.indexOf(t), 1);
  const back = refund(t);
  S.gold += back;
  floatText(t.x + 0.5, t.y + 0.4, `+${back}`, "#ffd25d", true);
  S.dist = computeDist(-1);
  S.selected = null;
  playSound("sell");
  updateHud();
}

function upgradeTower(t) {
  const next = TOWERS[t.type].levels[t.level + 1];
  if (!next || S.gold < next.cost) return;
  S.gold -= next.cost; t.spent += next.cost; t.fresh = (t.fresh || 0) + next.cost; t.level++;
  t.evolveAt = S.time; // plays the upgrade flash
  floatText(t.x + 0.5, t.y + 0.3, `−${next.cost}`, "#ff8b9e");
  playSound("upgrade");
  updateHud();
}

// Tower stats for its current level
function stats(t) {
  const L = TOWERS[t.type].levels[t.level];
  return { ...L, range: L.range || 0, reload: L.reload ?? L.rearm };
}

// ============================================================
//  WAVES
// ============================================================
const OPENING_WAVES = [
  [["normal", 8, 0.85]],
  [["normal", 8, 0.85], ["fast", 3, 1.1]],
  [["tank", 1, 2.4], ["swarm", 14, 0.36], ["fast", 5, 0.75]],
];
const CAMPAIGN_FINALE = [
  ["boss", 1, 1],
  ["tank", 2, 2.8],
  ["normal", 10, 0.72],
  ["flying", 7, 0.75],
  ["swarm", 12, 0.42],
  ["fast", 6, 0.65],
];
const OORT_WAVES = {
  1: { groups: [["normal", 15, 0.85]] },
  2: { groups: [["normal", 10, 0.85], ["fast", 5, 1.1]] },
  5: { hp: 1.12, groups: [["flying", 10, 0.65], ["swarm", 16, 0.35]] },
  6: { hp: 1.45, groups: [["tank", 5, 2.4], ["fast", 11, 0.68]] },
  7: { hp: 1.30, groups: [["normal", 10, 0.65], ["flying", 10, 0.55], ["swarm", 16, 0.34], ["tank", 3, 2.8]] },
  8: { hp: 1.30, groups: [["tank", 2, 2.8], ["swarm", 26, 0.3], ["flying", 12, 0.6], ["fast", 8, 0.55]] },
  9: { hp: 1.30, groups: [["fast", 18, 0.36], ["flying", 13, 0.5], ["normal", 12, 0.5], ["swarm", 16, 0.32]] },
};

const LATER_WORLD_WAVE_SIX = [["tank", 3, 2.4], ["fast", 8, 0.55], ["flying", 4, 0.85]];
const INNER_WORLD_WAVES = {
  7: [["tank", 5, 2.2], ["swarm", 12, 0.36], ["flying", 4, 0.82]],
  8: [["swarm", 20, 0.3], ["flying", 9, 0.7], ["fast", 4, 0.7]],
  9: [["fast", 15, 0.48], ["flying", 10, 0.65], ["tank", 1, 2.8]],
};

// What wave n contains: [{type, n, gap}]
function waveGroups(n) {
  const scale = 1 + Math.floor((n - 1) / 10) * 0.25;
  const oort = S.map === 0 ? OORT_WAVES[n] : undefined;
  const worldLineup = S.map > 0 && n === 6 ? LATER_WORLD_WAVE_SIX : S.map >= 2 ? INNER_WORLD_WAVES[n] : undefined;
  const lineup = n === VICTORY_WAVE
    ? CAMPAIGN_FINALE
    : oort?.groups ?? worldLineup ?? OPENING_WAVES[n - 1] ?? WAVE_CYCLE[(n - 1) % WAVE_CYCLE.length];
  return lineup.map(([type, count, gap]) => ({
    type,
    n: Math.round(count * scale) + (S.map === 1 && n >= 4 && n < VICTORY_WAVE && type === "flying" ? 3 : 0),
    gap,
  }));
}
// Later worlds are tougher: their waves count as if further into the war.
// To match, they start with more salvaged supplies and pay more gold per kill and per wave.
const killGold = type => Math.round(ENEMIES[type].gold * WORLDS[S.map].goldMul);
function clearBonus(w) {
  // Move the gold from the removed opening enemies into the clear bonus.
  const missingOpeningEnemies = S.map === 0 ? 0 : w === 1 ? 2 : w === 2 ? 3 : 0;
  const openingGold = missingOpeningEnemies * killGold("normal");
  return 8 + 2 * (w + WORLDS[S.map].hpOffset) + openingGold;
}
const MID_CAMPAIGN_HP = [1, 1.15, 1.12, 1.12];
const FINALE_HP = [0.95, 0.86, 0.83, 0.80];
function waveHpMul(n) {
  let pressure = 1;
  if (n === VICTORY_WAVE) pressure = FINALE_HP[S.map];
  else if (S.map === 0) pressure = OORT_WAVES[n]?.hp ?? 1;
  else if (S.map === 1 && n === 3) pressure = 1.15;
  else if (n >= 3 && n < VICTORY_WAVE) pressure = MID_CAMPAIGN_HP[S.map];
  if (S.map >= 2 && n >= 4 && n <= 8) pressure *= 1.08;
  return Math.pow(HP_GROWTH, n - 1 + WORLDS[S.map].hpOffset) * (1 + DIFF_HP * (S.diff - 1)) * pressure;
}

function startNextWave() {
  if (S.over || S.menu || (S.wave === 0 && S.awaitingStart) || (!S.won && S.wave >= VICTORY_WAVE)) return;
  if (S.enemies.length || S.spawnQ.length) S.gold += 5 + S.wave; // early-call bonus
  S.wave++;
  if (S.wave > 1 && stageOf(S.wave) !== stageOf(S.wave - 1)) {
    const st = ALIENS.stages[stageOf(S.wave)];
    toast(`${st.title}: ${st.sub.split(" · ")[0]}`);
  }
  for (const t of S.towers) t.fresh = 0; // towers are now committed: normal sell rate
  const hpMul = waveHpMul(S.wave);
  waveGroups(S.wave).forEach((group, i) => {
    // Stagger the groups so the lead units arrive before their support.
    const start = S.time + 0.5 + i * 1.25;
    for (let k = 0; k < group.n; k++) {
      S.spawnQ.push({ at: start + k * group.gap, type: group.type, hpMul, wave: S.wave });
    }
  });
  S.waveSize = S.enemies.length + S.spawnQ.length;
  S.spawnQ.sort((a, b) => a.at - b.at);
  S.pendingClear.push(S.wave);
  playSound("wave");
  updateHud();
}

function makeEnemy(type, wave, hpMul) {
  const def = ENEMIES[type];
  const hp = Math.max(1, Math.round(def.hp * hpMul));
  const speed = S.map === 0 && wave === 1 && type === "normal" ? def.speed * 1.05 : def.speed;
  return {
    type, def, hp, maxHp: hp, speed, flying: !!def.flying,
    x: SPAWN.x, y: SPAWN.y, tx: ENTRY.x, ty: ENTRY.y, slowT: 0, slowF: 1, wave,
    stage: stageOf(wave), seed: Math.random() * 10, face: SDIR[0] > 0 ? -1 : 1,
    lane: (Math.random() * 2 - 1) * (def.flying ? 0.3 : 0.07), ox: 0, oy: 0, mx: 0, my: 1, // small visual offset only
  };
}

// Boss spits out babies as it loses HP
const hasBroodShield = e => S.time < (e.shieldUntil ?? 0);
const broodCount = stage => stage === WORLDS[WORLDS.length - 1].stage ? BROOD.mothershipCount : BROOD.count;

const tankSplits = wave => wave >= TANK_SPLIT.firstWave;
const offspringHpFraction = (type, parent) => parent === "tank" ? TANK_SPLIT.hpFrac
  : type === "flying" ? BROOD.flyerHpFrac : BROOD.hpFrac;
const offspringReward = (type, parent) => parent === "tank" ? 0 : killGold(parent === "boss" ? "swarm" : type);

function releaseOffspring(parent, count) {
  for (let k = 0; k < count; k++) {
    const type = parent.type === "boss" && k === count - 1 ? "flying" : "swarm";
    const hpMul = waveHpMul(parent.wave) * offspringHpFraction(type, parent.type);
    const baby = makeEnemy(type, parent.wave, hpMul);
    baby.x = parent.x + (Math.random() - 0.5) * 0.5;
    baby.y = parent.y + (Math.random() - 0.5) * 0.5;
    baby.tx = parent.tx;
    baby.ty = parent.ty;
    baby.face = parent.face;
    baby.baby = parent.type;
    if (parent.type === "boss") baby.shieldUntil = S.time + BROOD.shieldTime;
    S.enemies.push(baby);
  }
  S.waveSize = (S.waveSize || 0) + count;
  playSound("brood");
  for (let k = 0; k < 14; k++) {
    const a = Math.random() * Math.PI * 2, v = 1.5 + Math.random() * 2.5;
    S.fx.push({ kind: "spark", x: parent.x, y: parent.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.5, max: 0.5, color: "#ff8bd0" });
  }
  floatText(parent.x, parent.y - 0.7, `+${count} offspring!`, "#ff8bd0", true);
}

function bossBrood(boss) {
  boss.brood = boss.brood || 0;
  while (boss.brood < BROOD.at.length && boss.hp / boss.maxHp <= BROOD.at[boss.brood]) {
    boss.brood++;
    releaseOffspring(boss, broodCount(boss.stage));
    if (!S.broodSeen) { S.broodSeen = true; toast(`${enemyName("boss", boss.wave)} is spitting out babies!`); }
  }
}

function spawnEnemy(s) {
  const e = makeEnemy(s.type, s.wave, s.hpMul);
  S.enemies.push(e);
  if (s.type === "boss") playSound("boss");
  updateWaveBar();
}

// ============================================================
//  UPDATE
// ============================================================
const TANK_GAP = 1.35;

function update(dt) {
  S.time += dt;
  if (S.baseHit > 0) S.baseHit -= dt;
  const delayedTanks = [];
  while (S.spawnQ.length && S.spawnQ[0].at <= S.time) {
    const spawn = S.spawnQ.shift();
    if (spawn.type === "tank" && S.enemies.some(e =>
      e.type === "tank" && Math.hypot(e.x - SPAWN.x, e.y - SPAWN.y) < TANK_GAP)) {
      spawn.at = S.time + 0.15;
      delayedTanks.push(spawn);
    } else spawnEnemy(spawn);
  }
  if (delayedTanks.length) {
    S.spawnQ.push(...delayedTanks);
    S.spawnQ.sort((a, b) => a.at - b.at);
  }

  // enemies
  for (let i = S.enemies.length - 1; i >= 0; i--) {
    const e = S.enemies[i];
    if (e.slowT > 0) { e.slowT -= dt; if (e.slowT <= 0) e.slowF = 1; }
    let step = e.speed * e.slowF * dt;
    if (e.type === "tank") step = tankStep(e, i, step);
    if (e.flying) {
      const dx = EXIT.x + 0.5 - e.x, dy = EXIT.y + 0.5 - e.y, L = Math.hypot(dx, dy);
      if (L <= step) { leak(i); continue; }
      e.x += dx / L * step; e.y += dy / L * step; if (Math.abs(dx) > 0.01 * L) e.face = dx > 0 ? 1 : -1;
      e.mx = dx / L; e.my = dy / L; easeLane(e, dt);
      continue;
    }
    while (step > 0) {
      const dx = e.tx + 0.5 - e.x, dy = e.ty + 0.5 - e.y, L = Math.hypot(dx, dy);
      if (L > step) { e.x += dx / L * step; e.y += dy / L * step; if (Math.abs(dx) > 0.01 * L) e.face = dx > 0 ? 1 : -1; if (L > 0.001) { e.mx = dx / L; e.my = dy / L; } break; }
      e.x = e.tx + 0.5; e.y = e.ty + 0.5; step -= L;
      if (e.tx === EXIT.x && e.ty === EXIT.y) { leak(i); break; }
      chooseNext(e, dx, dy);
    }
    easeLane(e, dt);
  }

  // towers
  for (const t of S.towers) {
    const def = TOWERS[t.type], st = stats(t);
    t.cd -= dt;
    if (def.walkable) { // mine
      if (t.cd > 0) continue;
      const cx = t.x + 0.5, cy = t.y + 0.5;
      for (const e of S.enemies) {
        if (!e.flying && !hasBroodShield(e) && Math.abs(e.x - cx) < 0.45 && Math.abs(e.y - cy) < 0.45) {
          explode(cx, cy, st.splash, st.dmg, def.color, ["spikes", "fire", "plasma"][t.level]); t.cd = st.reload; t.lastShot = S.time; break;
        }
      }
      continue;
    }
    const target = findTarget(t, def, st);
    if (target) t.angle = Math.atan2(target.y - (t.y + 0.5), target.x - (t.x + 0.5));
    if (t.cd > 0 || !target) continue;
    t.cd = st.reload; t.lastShot = S.time;
    fire(t, def, st, target);
  }

  // projectiles
  for (let i = S.shots.length - 1; i >= 0; i--) {
    const p = S.shots[i];
    if (p.kind === "beam") { p.life -= dt; if (p.life <= 0) S.shots.splice(i, 1); continue; }
    if (p.target && S.enemies.includes(p.target)) { p.tx = ex(p.target); p.ty = ey(p.target); }
    else p.target = null;
    const dx = p.tx - p.x, dy = p.ty - p.y, L = Math.hypot(dx, dy), step = p.speed * dt;
    if (L > 0.001) { p.vx = dx / L; p.vy = dy / L; }
    p.left = L;
    p.trail.push({ x: p.x, y: p.y }); if (p.trail.length > 6) p.trail.shift();
    if (p.kind === "cannon" && p.level === 1 && (p.puff -= dt) <= 0) { // howitzer shell smoke
      p.puff = 0.04; S.fx.push({ kind: "smoke", x: p.x, y: p.y, r: 0.12, life: 0.45, max: 0.45 });
    }
    if (L <= step) { S.shots.splice(i, 1); impact(p); }
    else { p.x += dx / L * step; p.y += dy / L * step; }
  }

  // effects
  for (let i = S.fx.length - 1; i >= 0; i--) {
    const f = S.fx[i]; f.life -= dt;
    if (f.vx !== undefined) { f.x += f.vx * dt; f.y += f.vy * dt; f.vx *= 0.92; f.vy *= 0.92; }
    if (f.life <= 0) S.fx.splice(i, 1);
  }

  checkWaveClear();
}

// Visual-only sideways offset so groups walk as a loose band instead of one stack.
// It eases toward the side of the current heading, so turning a corner doesn't make it jump.
function easeLane(e, dt) {
  const k = Math.min(1, dt * 6), lane = e.lane || 0;
  e.ox = (e.ox || 0) + (-e.my * lane - (e.ox || 0)) * k;
  e.oy = (e.oy || 0) + (e.mx * lane - (e.oy || 0)) * k;
}
const ex = e => e.x + (e.ox || 0), ey = e => e.y + (e.oy || 0); // where an enemy is drawn

// The next cell on the route from (x, y), arriving with heading (pdx, pdy).
// Creatures and the dotted route line both use this, so they always agree.
function nextStep(x, y, pdx, pdy) {
  let best = null, bestScore = Infinity;
  for (const [dx, dy] of DIRS) {
    const nx = x + dx, ny = y + dy;
    if (!inGrid(nx, ny)) continue;
    const d = S.dist[idx(nx, ny)];
    if (d === -1) continue;
    // lowest distance wins; ties prefer continuing straight
    const score = d + ((Math.sign(pdx) === dx && Math.sign(pdy) === dy) ? 0 : 0.1);
    if (score < bestScore) { bestScore = score; best = [nx, ny]; }
  }
  return best;
}
function chooseNext(e, pdx, pdy) {
  const best = nextStep(e.tx, e.ty, pdx, pdy);
  if (best) { e.tx = best[0]; e.ty = best[1]; }
}

function progress(e) { // lower = closer to exit
  if (e.flying) return Math.hypot(EXIT.x + 0.5 - e.x, EXIT.y + 0.5 - e.y);
  const d = S.dist[idx(e.tx, e.ty)];
  return (d < 0 ? 999 : d) + Math.hypot(e.tx + 0.5 - e.x, e.ty + 0.5 - e.y);
}

function tankStep(tank, index, step) {
  const remaining = progress(tank);
  const reach = TANK_GAP + step;
  for (let i = 0; i < S.enemies.length; i++) {
    const other = S.enemies[i];
    if (i === index || other.type !== "tank" ||
        Math.hypot(tank.x - other.x, tank.y - other.y) > reach) continue;
    const gap = remaining - progress(other);
    // On a tie, the earlier arrival gets to move first.
    if (gap > 0 || (gap === 0 && i < index)) step = Math.min(step, Math.max(0, gap - TANK_GAP));
  }
  return step;
}

function findTarget(t, def, st) {
  const cx = t.x + 0.5, cy = t.y + 0.5, r2 = st.range * st.range;
  let best = null, bp = Infinity;
  for (const e of S.enemies) {
    if (hasBroodShield(e)) continue;
    if (e.flying ? !def.air : !def.ground) continue;
    if (!inBounds(e)) continue;
    const dx = e.x - cx, dy = e.y - cy;
    if (dx * dx + dy * dy > r2) continue;
    const p = progress(e);
    if (p < bp) { bp = p; best = e; }
  }
  return best;
}

function fire(t, def, st, target) {
  playSound(t.type);
  const sx = t.x + 0.5, sy = t.y + 0.5;
  if (t.type === "arc") {
    S.shots.push({ kind: "beam", level: t.level, x: sx, y: sy, tx: ex(target), ty: ey(target), life: t.level === 2 ? 0.1 : 0.08, max: t.level === 2 ? 0.1 : 0.08, color: def.color, seed: Math.random() * 100 });
    damage(target, st.dmg * (target.flying ? def.airMul : 1));
    return;
  }
  S.shots.push({
    kind: t.type, x: sx, y: sy, tx: ex(target), ty: ey(target),
    target: t.type === "cannon" ? null : target, // cannon shells land where the target was
    speed: t.type === "cannon" ? 6 : 10, dmg: st.dmg, st, color: def.color,
    level: t.level, vx: 0, vy: -1, trail: [], total: Math.hypot(target.x - sx, target.y - sy), left: 0, puff: 0,
  });
}

function impact(p) {
  if (p.kind === "cannon") { explode(p.tx, p.ty, p.st.splash, p.dmg, p.color, ["dust", "fire", "plasma"][p.level || 0]); return; }
  if (!p.target) return;
  if (p.kind === "frost") { // slow everything near the target, ground and air
    const r2 = p.st.splash * p.st.splash;
    for (const e of S.enemies) {
      const dx = e.x - p.tx, dy = e.y - p.ty;
      if (dx * dx + dy * dy > r2) continue;
      if (p.st.slow <= e.slowF) e.slowF = p.st.slow;
      e.slowT = Math.max(e.slowT, p.st.slowT);
    }
    S.fx.push({ kind: "ring", x: p.tx, y: p.ty, r: p.st.splash, life: 0.25, max: 0.25, color: p.color });
  }
  damage(p.target, p.dmg);
}

function explode(x, y, r, dmg, color, look = "ring") {
  playSound("blast");
  const r2 = r * r;
  for (const e of S.enemies.slice()) {
    if (e.flying) continue;
    const dx = e.x - x, dy = e.y - y;
    if (dx * dx + dy * dy <= r2) damage(e, dmg);
  }
  if (look === "ring") S.fx.push({ kind: "ring", x, y, r, life: 0.3, max: 0.3, color });
  else S.fx.push({ kind: look, x, y, r, life: 0.45, max: 0.45, color, seed: Math.random() * 10 });
  if (look === "plasma") S.fx.push({ kind: "ring", x, y, r: r * 1.15, life: 0.35, max: 0.35, color: "#ffffff" });
}

function damage(e, amt) {
  if (hasBroodShield(e)) return;
  e.hp -= amt;
  if (e.type === "boss" && S.enemies.includes(e)) bossBrood(e);
  const splits = e.type === "tank" && tankSplits(e.wave);
  if (splits && !e.releasedMidBrood && e.hp <= e.maxHp / 2 && S.enemies.includes(e)) {
    e.releasedMidBrood = true;
    releaseOffspring(e, TANK_SPLIT.midCount);
  }
  if (e.hp > 0) return;
  const i = S.enemies.indexOf(e);
  if (i < 0) return;
  S.enemies.splice(i, 1);
  const g = offspringReward(e.type, e.baby);
  S.gold += g;
  if (g) floatText(e.x, e.y - 0.2, `+${g}`, "#ffd25d");
  if (splits) releaseOffspring(e, TANK_SPLIT.deathCount);
  for (let k = 0; k < 8; k++) {
    const a = Math.random() * Math.PI * 2, v = 1 + Math.random() * 2;
    S.fx.push({ kind: "spark", x: e.x, y: e.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.4, max: 0.4, color: e.def.color });
  }
  updateHud();
}

function floatText(x, y, text, color, big) {
  S.fx.push({ kind: "text", x, y, vx: 0, vy: -1.4, text, color, big, life: 0.9, max: 0.9 });
}

function leak(i) {
  const e = S.enemies[i];
  S.enemies.splice(i, 1);
  const lost = e.def.leak || 1;
  S.lives -= lost;
  S.baseHit = 0.4;
  floatText(EXIT.x + 0.5, EXIT.y + 0.2, `−${lost}♥`, "#ff5d7a", true);
  if (!S.leaked) { S.leaked = true; toast("An enemy reached your base! −" + lost + "♥"); }
  S.fx.push({ kind: "flash", life: 0.25, max: 0.25 });
  if (S.lives <= 0) { S.lives = 0; gameOver(); }
  else playSound("leak");
  updateHud();
}

function checkWaveClear() {
  if (!S.pendingClear.length || S.over) return;
  const alive = new Set();
  for (const e of S.enemies) alive.add(e.wave);
  for (const s of S.spawnQ) alive.add(s.wave);
  S.pendingClear = S.pendingClear.filter(w => {
    if (alive.has(w)) return true;
    const bonus = clearBonus(w);
    S.gold += bonus;
    if (S.endless && w > VICTORY_WAVE) recordEndlessClear(w);
    toast(`Wave ${w} cleared  +${bonus}◆`);
    return false;
  });
  if (S.wave >= VICTORY_WAVE && !S.won && !S.pendingClear.length) victory();
  updateHud();
}

function recordEndlessClear(wave) {
  S.endlessCleared = Math.max(S.endlessCleared, wave);
  const records = P.endlessBest[S.map] ??= {};
  if (wave <= (records[S.diff] ?? 0)) return;
  records[S.diff] = wave;
  saveProfile();
}

function victory() {
  S.won = true;
  const i = S.map, unlockedNow = maxDiff(i) <= S.diff, hasNext = i + 1 < WORLDS.length;
  if (unlockedNow) P.unlocked[i] = S.diff + 1;
  if (hasNext) P.campaignCheckpoint = { map: i + 1, diff: S.diff };
  else delete P.campaignCheckpoint;
  saveProfile();
  saveRun();
  const btns = [];
  if (hasNext) btns.push({ label: `Next: ${WORLDS[i + 1].name} ▶`, act: "nextworld", main: true });
  btns.push({ label: "Keep going (endless)", act: "endless", main: !hasNext }, { label: "Main menu", act: "menu" });
  const scenes = debriefScene(i, btns);
  if (!hasNext) scenes[0].body.push("Campaign complete.");
  if (unlockedNow) scenes[0].body.push(`Difficulty ${S.diff + 1} unlocked for ${WORLDS[i].name}.`);
  const debrief = () => playCine(scenes, r => {
    if (r === "nextworld") ACT.nextworld();
    else if (r === "endless") { S.endless = true; saveRun(); closeMenu(); }
    else {
      if (!hasNext) lsDel(KEY_RUN);
      S.started = false;
      mainMenu();
    }
  });
  if (!hasNext) playCine(ENDING, debrief); else debrief();
}

function gameOver() {
  S.over = true;
  playSound("defeat");
  lsDel(KEY_RUN);
  openMenu(`<h2>Relay Lost</h2>
    ${S.endless
      ? `<p>${MAPS[S.map].name} · D${S.diff} · Defeated on Wave ${S.wave}<br>
        Endless cleared this run: ${S.endlessCleared || "—"} · Best: ${P.endlessBest[S.map]?.[S.diff] || "—"}</p>`
      : `<p>You survived ${Math.max(0, S.wave - 1)} wave${S.wave - 1 === 1 ? "" : "s"} on ${MAPS[S.map].name} (D${S.diff}).</p>`}
    <button class="big" data-act="retry">Try again</button>
    <button class="big" data-act="main">Main menu</button>`);
}

// ============================================================
//  RENDER
// ============================================================
const $ = id => document.getElementById(id);
const cv = $("cv");
let ctx = cv.getContext("2d"); // swapped temporarily when drawing icons
let CELL = 30, DPR = 1;

function resize() {
  const stage = $("stage");
  CELL = Math.max(1, Math.floor(Math.min((stage.clientWidth - 4) / COLS, (stage.clientHeight - 4) / ROWS)));
  DPR = window.devicePixelRatio || 1;
  const width = COLS * CELL, height = ROWS * CELL;
  cv.style.width = width + "px";
  cv.style.height = height + "px";
  const pixelWidth = Math.round(width * DPR), pixelHeight = Math.round(height * DPR);
  if (cv.width !== pixelWidth || cv.height !== pixelHeight) {
    cv.width = pixelWidth;
    cv.height = pixelHeight;
  }
}

function draw() {
  ctx.setTransform(CELL * DPR, 0, 0, CELL * DPR, 0, 0);
  drawGround(); // world's ground, obstacles and hazards (cached)

  ctx.fillStyle = "rgba(93,255,155,0.18)"; ctx.fillRect(ENTRY.x, ENTRY.y, 1, 1);
  ctx.fillStyle = "rgba(255,93,122,0.22)"; ctx.fillRect(EXIT.x, EXIT.y, 1, 1);
  drawBaseIcon();

  drawPath();

  if (S.selected) {
    const st = stats(S.selected);
    drawRange(S.selected.x, S.selected.y, TOWERS[S.selected.type].walkable ? st.splash : st.range, "rgba(79,209,255,0.10)");
  }
  if (S.ghost && S.buildType) {
    const def = TOWERS[S.buildType];
    const ok = canPlace(S.buildType, S.ghost.x, S.ghost.y) && S.gold >= def.cost;
    const st = stats({ type: S.buildType, level: 0 });
    drawRange(S.ghost.x, S.ghost.y, def.walkable ? st.splash : st.range, ok ? "rgba(93,255,155,0.10)" : "rgba(255,93,122,0.10)");
    ctx.fillStyle = ok ? "rgba(93,255,155,0.35)" : "rgba(255,93,122,0.35)";
    ctx.fillRect(S.ghost.x + 0.05, S.ghost.y + 0.05, 0.9, 0.9);
  }

  for (const t of S.towers) if (TOWERS[t.type].walkable) drawMine(t);
  for (const t of S.towers) if (!TOWERS[t.type].walkable) drawTower(t);
  // lower on screen = in front; flyers above everything on the ground
  const byDepth = (a, b) => ey(a) - ey(b);
  for (const e of S.enemies.filter(e => !e.flying).sort(byDepth)) drawEnemy(e);
  for (const e of S.enemies.filter(e => e.flying).sort(byDepth)) drawEnemy(e);
  if (S.selEnemy) {
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 0.05;
    ctx.beginPath(); ctx.arc(ex(S.selEnemy), ey(S.selEnemy), S.selEnemy.def.size + 0.14, 0, Math.PI * 2); ctx.stroke();
  }

  for (const p of S.shots) drawShot(p);

  drawBaseBar();

  for (const f of S.fx) {
    const a = f.life / f.max;
    if (f.kind === "ring") {
      ctx.strokeStyle = f.color; ctx.globalAlpha = a; ctx.lineWidth = 0.08;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r * (1.2 - a * 0.6), 0, Math.PI * 2); ctx.stroke();
    } else if (f.kind === "dust") { // boulder impact
      ctx.globalAlpha = a * 0.6; ctx.fillStyle = "#8a7a62";
      for (let k = 0; k < 6; k++) { const ang = k / 6 * Math.PI * 2 + f.seed, d = f.r * (1 - a) * 0.8;
        ctx.beginPath(); ctx.arc(f.x + Math.cos(ang) * d, f.y + Math.sin(ang) * d, f.r * (0.25 + 0.35 * (1 - a)), 0, Math.PI * 2); ctx.fill(); }
    } else if (f.kind === "fire") { // shell / landmine explosion
      const r = f.r * (1.15 - a * 0.55);
      const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, r);
      g.addColorStop(0, `rgba(255,246,208,${a})`); g.addColorStop(0.4, `rgba(255,164,60,${a * 0.9})`); g.addColorStop(1, "rgba(255,80,40,0)");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(f.x, f.y, r, 0, Math.PI * 2); ctx.fill();
    } else if (f.kind === "plasma") { // energy shockwave
      ctx.globalAlpha = a; ctx.fillStyle = "rgba(255,164,93,0.25)"; ctx.beginPath(); ctx.arc(f.x, f.y, f.r * (1.2 - a * 0.6), 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = f.color; ctx.lineWidth = 0.1; ctx.stroke();
    } else if (f.kind === "spikes") { // spike pit springs
      ctx.globalAlpha = a; ctx.strokeStyle = "#c9b98a"; ctx.lineWidth = 0.05; ctx.lineCap = "round";
      for (let k = 0; k < 8; k++) { const ang = k / 8 * Math.PI * 2 + f.seed, r0 = f.r * 0.2, r1 = f.r * (0.5 + 0.5 * (1 - a));
        ctx.beginPath(); ctx.moveTo(f.x + Math.cos(ang) * r0, f.y + Math.sin(ang) * r0); ctx.lineTo(f.x + Math.cos(ang) * r1, f.y + Math.sin(ang) * r1); ctx.stroke(); }
      ctx.lineCap = "butt";
    } else if (f.kind === "smoke") {
      ctx.globalAlpha = a * 0.35; ctx.fillStyle = "#9aa3b8"; ctx.beginPath(); ctx.arc(f.x, f.y, f.r * (1.6 - a), 0, Math.PI * 2); ctx.fill();
    } else if (f.kind === "spark") {
      ctx.fillStyle = f.color; ctx.globalAlpha = a;
      ctx.fillRect(f.x - 0.05, f.y - 0.05, 0.1, 0.1);
    } else if (f.kind === "text") {
      ctx.save();
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0); // draw text in screen pixels
      ctx.globalAlpha = Math.min(1, a * 2);
      ctx.font = `800 ${f.big ? 20 : 14}px system-ui, sans-serif`;
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.lineWidth = 3; ctx.strokeStyle = "rgba(5,8,15,0.9)";
      ctx.strokeText(f.text, f.x * CELL, f.y * CELL);
      ctx.fillStyle = f.color; ctx.fillText(f.text, f.x * CELL, f.y * CELL);
      ctx.restore();
    } else if (f.kind === "flash") {
      ctx.fillStyle = "#ff5d7a"; ctx.globalAlpha = a * 0.35; ctx.fillRect(0, 0, COLS, ROWS);
    }
    ctx.globalAlpha = 1;
  }
}

const baseColor = () => { const f = S.lives / S.maxLives; return f > 0.6 ? "#5dff9b" : f > 0.3 ? "#ffd25d" : "#ff5d7a"; };
const baseShake = () => S.baseHit > 0 ? (Math.random() - 0.5) * 0.18 : 0;

// Shield at the finish line: this is what enemies are attacking
// ---- Projectiles: each tower level fires its own kind of shot ----
function jagged(x0, y0, x1, y1, segs, amp, seed) { // lightning polyline
  const dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy) || 1, nx = -dy / L, ny = dx / L;
  ctx.beginPath(); ctx.moveTo(x0, y0);
  for (let k = 1; k < segs; k++) {
    const f = k / segs, o = (Math.sin(seed * 12.9898 + k * 78.233) * 43758.5453 % 1) * amp;
    ctx.lineTo(x0 + dx * f + nx * o, y0 + dy * f + ny * o);
  }
  ctx.lineTo(x1, y1);
}
function drawShot(p) {
  const lv = p.level || 0;
  if (p.kind === "beam") { // Arc
    const a = Math.max(0, p.life / p.max);
    ctx.globalAlpha = a; ctx.lineCap = "round"; ctx.lineJoin = "round";
    const seed = p.seed + Math.floor(S.time * 30);
    if (lv === 0) { // lightning strike
      ctx.strokeStyle = "#c78bff"; ctx.lineWidth = 0.09; jagged(p.x, p.y, p.tx, p.ty, 7, 0.22, seed); ctx.stroke();
      ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 0.035; jagged(p.x, p.y, p.tx, p.ty, 7, 0.22, seed); ctx.stroke();
    } else if (lv === 1) { // tesla zap with forks
      for (let k = 0; k < 2; k++) { ctx.strokeStyle = k ? "#ffffff" : "#c78bff"; ctx.lineWidth = k ? 0.03 : 0.07; jagged(p.x, p.y, p.tx, p.ty, 9, 0.3, seed + k); ctx.stroke(); }
      ctx.strokeStyle = "#c78bff"; ctx.lineWidth = 0.03;
      for (let k = 0; k < 2; k++) { const f = 0.35 + 0.3 * k, mx = p.x + (p.tx - p.x) * f, my = p.y + (p.ty - p.y) * f;
        jagged(mx, my, mx + Math.cos(seed + k * 2) * 0.45, my + Math.sin(seed + k * 2) * 0.45, 3, 0.12, seed + k + 5); ctx.stroke(); }
    } else { // crystal laser
      ctx.strokeStyle = "rgba(199,139,255,0.45)"; ctx.lineWidth = 0.22; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.tx, p.ty); ctx.stroke();
      ctx.strokeStyle = "#c78bff"; ctx.lineWidth = 0.11; ctx.stroke();
      ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 0.04; ctx.stroke();
      ctx.fillStyle = "#ffffff"; ctx.beginPath(); ctx.arc(p.tx, p.ty, 0.1 * a + 0.04, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1; ctx.lineCap = "butt"; ctx.lineJoin = "miter";
    return;
  }
  const ang = Math.atan2(p.vy, p.vx);
  const trail = (col, r0) => { p.trail.forEach((q, k) => { ctx.globalAlpha = (k + 1) / (p.trail.length + 1) * 0.5; ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(q.x, q.y, r0 * (0.4 + 0.6 * (k + 1) / p.trail.length), 0, Math.PI * 2); ctx.fill(); }); ctx.globalAlpha = 1; };
  if (p.kind === "bolt") {
    if (lv === 2) { trail("#4fd1ff", 0.07); }
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(ang);
    if (lv === 0) { // crossbow bolt
      ctx.strokeStyle = "#c9b98a"; ctx.lineWidth = 0.04; ctx.beginPath(); ctx.moveTo(-0.24, 0); ctx.lineTo(0.12, 0); ctx.stroke();
      ctx.fillStyle = "#d8dde8"; ctx.beginPath(); ctx.moveTo(0.22, 0); ctx.lineTo(0.1, -0.05); ctx.lineTo(0.1, 0.05); ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#ff8b8b"; ctx.beginPath(); ctx.moveTo(-0.24, 0); ctx.lineTo(-0.16, -0.07); ctx.lineTo(-0.13, 0); ctx.lineTo(-0.16, 0.07); ctx.closePath(); ctx.fill();
    } else if (lv === 1) { // tracer round
      const g = ctx.createLinearGradient(-0.35, 0, 0.06, 0); g.addColorStop(0, "rgba(255,210,93,0)"); g.addColorStop(1, "#ffd25d");
      ctx.strokeStyle = g; ctx.lineWidth = 0.06; ctx.lineCap = "round"; ctx.beginPath(); ctx.moveTo(-0.35, 0); ctx.lineTo(0.06, 0); ctx.stroke(); ctx.lineCap = "butt";
      ctx.fillStyle = "#fff6d0"; ctx.beginPath(); ctx.arc(0.06, 0, 0.035, 0, Math.PI * 2); ctx.fill();
    } else { // energy pulse
      ctx.fillStyle = "rgba(79,209,255,0.35)"; ctx.beginPath(); ctx.ellipse(0, 0, 0.17, 0.11, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#4fd1ff"; ctx.beginPath(); ctx.ellipse(0, 0, 0.1, 0.07, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#ffffff"; ctx.beginPath(); ctx.arc(0.02, 0, 0.035, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  } else if (p.kind === "people") {
    if (lv === 2) trail("#7ee8a0", 0.06);
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(ang);
    if (lv === 0) { // thrown javelin
      ctx.strokeStyle = "#8a7350"; ctx.lineWidth = 0.035; ctx.beginPath(); ctx.moveTo(-0.2, 0); ctx.lineTo(0.1, 0); ctx.stroke();
      ctx.fillStyle = "#d8dde8"; ctx.beginPath(); ctx.moveTo(0.18, 0); ctx.lineTo(0.08, -0.04); ctx.lineTo(0.08, 0.04); ctx.closePath(); ctx.fill();
    } else if (lv === 1) { // rifle tracer
      ctx.strokeStyle = "#ffe08a"; ctx.lineWidth = 0.04; ctx.lineCap = "round"; ctx.beginPath(); ctx.moveTo(-0.22, 0); ctx.lineTo(0.04, 0); ctx.stroke(); ctx.lineCap = "butt";
    } else { // energy bolt
      ctx.fillStyle = "rgba(126,232,160,0.4)"; ctx.beginPath(); ctx.ellipse(0, 0, 0.14, 0.08, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#7ee8a0"; ctx.beginPath(); ctx.ellipse(0, 0, 0.08, 0.05, 0, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  } else if (p.kind === "frost") {
    if (lv === 2) trail("#9be7ff", 0.07);
    ctx.save(); ctx.translate(p.x, p.y);
    if (lv === 0) { // spinning ice shard
      ctx.rotate(S.time * 14);
      ctx.fillStyle = "#c9f3ff"; ctx.beginPath(); ctx.moveTo(0, -0.13); ctx.lineTo(0.06, 0); ctx.lineTo(0, 0.13); ctx.lineTo(-0.06, 0); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 0.02; ctx.stroke();
    } else if (lv === 1) { // cryo mist puff
      for (let k = 0; k < 3; k++) { const a = S.time * 6 + k * 2.1;
        ctx.fillStyle = `rgba(200,240,255,${0.45 - k * 0.1})`; ctx.beginPath(); ctx.arc(Math.cos(a) * 0.05, Math.sin(a) * 0.05, 0.11 - k * 0.02, 0, Math.PI * 2); ctx.fill(); }
    } else { // freeze orb with hex ring
      ctx.fillStyle = "#9be7ff"; ctx.beginPath(); ctx.arc(0, 0, 0.08, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#ffffff"; ctx.beginPath(); ctx.arc(0, 0, 0.035, 0, Math.PI * 2); ctx.fill();

      ctx.save(); ctx.translate(p.x, p.y - h); ctx.rotate(S.time * 8);

      for (let k = 0; k < 7; k++) { const a = k / 7 * Math.PI * 2, r = 0.11 + 0.025 * Math.sin(k * 2.7); ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
      ctx.closePath(); ctx.fill(); ctx.fillStyle = "#a59b88"; ctx.beginPath(); ctx.arc(-0.03, -0.03, 0.04, 0, Math.PI * 2); ctx.fill();

      ctx.fillStyle = "#3a3f52"; ctx.beginPath(); ctx.ellipse(0, 0, 0.13, 0.065, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#ffa45d"; ctx.fillRect(-0.06, -0.065, 0.03, 0.13);
      ctx.fillStyle = "#9aa3b8"; ctx.beginPath(); ctx.ellipse(0.07, -0.02, 0.04, 0.02, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    } else { // plasma ball

      ctx.fillStyle = "rgba(255,164,93,0.35)"; ctx.beginPath(); ctx.arc(p.x, p.y, 0.2 * f, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#ffa45d"; ctx.beginPath(); ctx.arc(p.x, p.y, 0.12 * f, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#fff0d8"; ctx.beginPath(); ctx.arc(p.x, p.y, 0.05, 0, Math.PI * 2); ctx.fill();

}

function drawBaseIcon() {
  ctx.save();

  ctx.fillStyle = S.baseHit > 0 ? "#ffffff" : baseColor();
  ctx.beginPath();
  ctx.moveTo(0, -0.34); ctx.lineTo(0.3, -0.22); ctx.lineTo(0.26, 0.1);
  ctx.quadraticCurveTo(0.14, 0.3, 0, 0.38); ctx.quadraticCurveTo(-0.14, 0.3, -0.26, 0.1);
  ctx.lineTo(-0.3, -0.22); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#0f1424";
  ctx.beginPath(); ctx.arc(0, -0.02, 0.1, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

// Health bar + "♥ 18/20" next to the base, in screen pixels
function drawBaseBar() {
  ctx.save();
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const frac = Math.max(0, S.lives / S.maxLives);
  const w = Math.max(64, CELL * 2.2), h = 7;
  const bx = Math.max(2, Math.min(COLS * CELL - w - 2, (EXIT.x + 0.5) * CELL - w / 2));
  const above = EXIT.y > 0;
  const by = above ? EXIT.y * CELL - h - 3 : (EXIT.y + 1) * CELL + 17;
  ctx.fillStyle = "rgba(5,8,15,0.85)"; ctx.fillRect(bx - 1, by - 1, w + 2, h + 2);
  ctx.fillStyle = baseColor(); ctx.fillRect(bx, by, w * frac, h);
  ctx.font = "800 12px system-ui, sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "bottom";
  const text = `BASE ♥ ${S.lives}/${S.maxLives}`;
  ctx.lineWidth = 3; ctx.strokeStyle = "rgba(5,8,15,0.95)";
  ctx.strokeText(text, bx + w / 2, by - 2);
  ctx.fillStyle = baseColor(); ctx.fillText(text, bx + w / 2, by - 2);
  ctx.restore();
}

function drawRock(x, y) {
  ctx.fillStyle = "#2a3048";
  roundRect(x + 0.04, y + 0.04, 0.92, 0.92, 0.25); ctx.fill();
  ctx.fillStyle = "#353c58";
  roundRect(x + 0.18, y + 0.14, 0.45, 0.35, 0.15); ctx.fill();
}

// Dotted line = the exact route ground creatures walk (same rule as nextStep)
function drawPath() {
  let x = ENTRY.x, y = ENTRY.y, pdx = -SDIR[0], pdy = -SDIR[1], guard = 0;
  if (S.dist[idx(x, y)] < 0) return;
  ctx.fillStyle = "rgba(93,255,155,0.3)";
  while (!(x === EXIT.x && y === EXIT.y) && guard++ < COLS * ROWS) {
    ctx.beginPath(); ctx.arc(x + 0.5, y + 0.5, 0.07, 0, Math.PI * 2); ctx.fill();
    const n = nextStep(x, y, pdx, pdy);
    if (!n) break;
    pdx = n[0] - x; pdy = n[1] - y; x = n[0]; y = n[1];
  }
  drawFlightPath();
}

// Flyers ignore the maze and fly straight from the portal to your base, along this dashed line
function drawFlightPath() {
  const idle = !S.enemies.length && !S.spawnQ.length;
  const soon = S.enemies.some(e => e.flying) || S.spawnQ.some(q => ENEMIES[q.type].flying) ||
    (idle && waveGroups(S.wave + 1).some(g => ENEMIES[g.type].flying));
  ctx.save();
  ctx.strokeStyle = soon ? "rgba(122,184,255,0.6)" : "rgba(122,184,255,0.16)";
  ctx.lineWidth = soon ? 0.07 : 0.05; ctx.setLineDash([0.25, 0.2]); ctx.lineDashOffset = -S.time * 0.8;
  ctx.beginPath(); ctx.moveTo(SPAWN.x, SPAWN.y); ctx.lineTo(EXIT.x + 0.5, EXIT.y + 0.5); ctx.stroke();
  ctx.restore();
}

function drawRange(x, y, r, fill) {
  ctx.fillStyle = fill;
  ctx.strokeStyle = "rgba(200,220,255,0.25)"; ctx.lineWidth = 0.03;
  ctx.beginPath(); ctx.arc(x + 0.5, y + 0.5, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
}

function drawPips(t) {
  if (t.icon) return;
  ctx.fillStyle = "#ffd25d";
  for (let k = 0; k <= t.level; k++) {
    ctx.beginPath(); ctx.arc(t.x + 0.13 + k * 0.13, t.y + 0.13, 0.045, 0, Math.PI * 2); ctx.fill();
  }
}

// t.icon: drawing into an icon canvas (glow on); glowPx = icon pixels per art unit
// Animation state for a tower: recoil after a shot, trebuchet arm, charge-up, aim
function towerAnim(t) {
  const since = t.icon ? 9 : S.time - (t.lastShot === undefined ? -9 : t.lastShot);
  const { reload } = stats(t);
  const charge = t.icon ? 0.7 : Math.max(0, Math.min(1, 1 - Math.max(0, t.cd) / reload));
  return {
    t: (t.icon ? 1.3 : S.time) + t.x * 0.7 + t.y * 1.3,
    fire: Math.max(0, 1 - since / 0.3), arm: Math.max(0, 1 - since / 0.75), charge,
    aim: t.icon ? null : t.angle + Math.PI / 2,
  };
}
// Upgrade flash: shows the old look briefly, then flashes into the new one
function evolveState(t) {
  if (t.icon || t.evolveAt === undefined) return { level: t.level, k: -1 };
  const lt = S.time - t.evolveAt;
  if (lt < 0 || lt >= 0.9) return { level: t.level, k: -1 };
  return { level: lt < 0.3 ? Math.max(0, t.level - 1) : t.level, k: lt / 0.9 };
}

// glowPx: glow strength (icons only; off on the battlefield to keep phones smooth)
function drawMine(t, glowPx = 0) {
  const armed = t.cd <= 0, ev = evolveState(t);
  ctx.save(); ctx.translate(t.x, t.y);
  if (!armed && !t.icon && ev.k < 0) ctx.globalAlpha = 0.6; // a little dimmer while rearming
  TOWER_ART.draw(ctx, "mine", ev.level, towerAnim(t), glowPx, ev.k);
  ctx.restore();
  if (S.selected === t) { ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 0.05; ctx.beginPath(); ctx.arc(t.x + 0.5, t.y + 0.6, 0.42, 0, Math.PI * 2); ctx.stroke(); }
  drawPips(t);
}

function drawTower(t, glowPx = 0) {
  const def = TOWERS[t.type], ev = evolveState(t);
  if (!t.icon) {
    ctx.fillStyle = "rgba(20,26,43,0.75)";
    roundRect(t.x + 0.04, t.y + 0.04, 0.92, 0.92, 0.14); ctx.fill();
    ctx.strokeStyle = S.selected === t ? "#ffffff" : def.color; ctx.lineWidth = S.selected === t ? 0.06 : 0.035; ctx.stroke();
  }
  ctx.save(); ctx.translate(t.x, t.y);
  TOWER_ART.draw(ctx, t.type, ev.level, towerAnim(t), glowPx, ev.k);
  ctx.restore();
  drawPips(t);
}

function drawBroodShield(c, x, y, size) {
  c.beginPath(); c.arc(x, y, size * 1.4, 0, Math.PI * 2);
  c.fillStyle = "rgba(79,209,255,0.16)"; c.fill();
  c.strokeStyle = "#4fd1ff"; c.lineWidth = size * 0.175; c.stroke();
}

function drawEnemy(e) {
  const s = e.def.size, x = ex(e), y = ey(e);
  // type-colored marker under every enemy, so you can tell what's what in a crowd
  ctx.fillStyle = hexToRgba(e.def.color, e.flying ? 0.28 : 0.4);
  ctx.beginPath(); ctx.ellipse(x, y + s * (e.flying ? 1.05 : 0.8), s * 1.05, s * 0.32, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = hexToRgba(e.def.color, 0.85); ctx.lineWidth = 0.025; ctx.stroke();
  ctx.save(); ctx.translate(x, y);
  if (e.face < 0) ctx.scale(-1, 1);
  ALIENS.draw(ctx, e.type, e.stage || 0, S.time + (e.seed || 0), s, CELL * DPR, false);
  ctx.restore();
  if (hasBroodShield(e)) drawBroodShield(ctx, x, y, s);
  if (e.slowT > 0) { // frost ring at its feet
    ctx.strokeStyle = "rgba(155,231,255,0.9)"; ctx.lineWidth = 0.05; ctx.setLineDash([0.12, 0.08]);
    ctx.beginPath(); ctx.ellipse(x, y + s * 0.75, s * 1.15, s * 0.38, 0, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
  }
  if (e.hp < e.maxHp) {
    const w = Math.max(0.5, s * 2.2), by = y - s * 1.3 - 0.12;
    ctx.fillStyle = "rgba(0,0,0,0.6)"; ctx.fillRect(x - w / 2, by, w, 0.08);
    ctx.fillStyle = e.hp / e.maxHp > 0.4 ? "#5dff9b" : "#ff5d7a";
    ctx.fillRect(x - w / 2, by, w * Math.max(0, e.hp / e.maxHp), 0.08);
  }
}
function hexToRgba(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }

// ============================================================
//  ALIEN ART (copied from attacker-design.html; edit there, then re-copy)
//  4 stages: Scouts (waves 1-5), Hunters (6-10), Craft Mk I (11-15), Craft Mk II (16+)
// ============================================================
const ALIENS = (() => {
  const TAU = Math.PI * 2;
  let PX = 1, GLOW = true; // glow is off on the battlefield (expensive on phones), on for icons
  // ---------------- helpers ----------------
  function shade(hex, f) {
    const n = parseInt(hex.slice(1), 16);
    let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
    const m = f < 0 ? 0 : 255, a = Math.abs(f);

    return `rgb(${r},${g},${b})`;
  }
  const glow = (c, color, amt) => { if (!GLOW) return; c.shadowColor = color; c.shadowBlur = amt * PX; };
  const noGlow = c => { c.shadowBlur = 0; };
  const circle = (c, x, y, r) => { c.beginPath(); c.arc(x, y, r, 0, TAU); };
  const oval = (c, x, y, rx, ry, rot = 0) => { c.beginPath(); c.ellipse(x, y, rx, ry, rot, 0, TAU); };
  function poly(c, pts) { c.beginPath(); pts.forEach(([x, y], i) => i ? c.lineTo(x, y) : c.moveTo(x, y)); c.closePath(); }
  function rr(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y); c.lineTo(x + w - r, y); c.quadraticCurveTo(x + w, y, x + w, y + r);
    c.lineTo(x + w, y + h - r); c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    c.lineTo(x + r, y + h); c.quadraticCurveTo(x, y + h, x, y + h - r);
    c.lineTo(x, y + r); c.quadraticCurveTo(x, y, x + r, y); c.closePath();
  }
  function hexPath(c, r, x = 0, y = 0) { c.beginPath(); for (let k = 0; k < 6; k++) { const a = k * TAU / 6; c.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r); } c.closePath(); }
  function shadow(c, s, y = 1.0, w = 0.9) { c.fillStyle = "rgba(0,0,0,0.35)"; oval(c, 0, s * y, s * w, s * 0.22); c.fill(); }
  function eye(c, x, y, r, pupil = "#10131f", lx = 0.25, ly = 0) {
    c.fillStyle = "#ffffff"; circle(c, x, y, r); c.fill();
    c.fillStyle = pupil; circle(c, x + r * lx, y + r * ly, r * 0.52); c.fill();
    c.fillStyle = "#ffffff"; circle(c, x + r * lx - r * 0.18, y + r * ly - r * 0.2, r * 0.16); c.fill();
  }
  function redEye(c, x, y, r) {

    c.fillStyle = "#ffd0d0"; circle(c, x - r * 0.3, y - r * 0.3, r * 0.3); c.fill();
  }
  const METAL = ["#dfe5f1", "#8e97ad", "#4a5068"];
  function metalGrad(c, y0, y1) {
    const g = c.createLinearGradient(0, y0, 0, y1);
    g.addColorStop(0, METAL[0]); g.addColorStop(0.55, METAL[1]); g.addColorStop(1, METAL[2]);
    return g;
  }
  // Classic saucer: half-width w, height h, role-colored lights & underglow
  function saucer(c, t, w, h, accent, o = {}) {
    glow(c, accent, 0.3); c.globalAlpha = 0.55; c.fillStyle = accent; oval(c, 0, h * 0.5, w * 0.55, h * 0.3); c.fill(); c.globalAlpha = 1; noGlow(c);
    c.fillStyle = metalGrad(c, -h * 0.5, h * 0.5); oval(c, 0, 0, w, h * 0.5); c.fill();
    c.strokeStyle = "#3a4058"; c.lineWidth = h * 0.05; c.beginPath(); c.ellipse(0, h * 0.06, w * 0.97, h * 0.3, 0, 0.05, Math.PI - 0.05); c.stroke();
    const n = o.lights || 7, step = Math.floor(t * 8);
    for (let k = 0; k < n; k++) {
      const th = Math.PI * (k + 0.5) / n, x = Math.cos(th) * w * 0.82, y = Math.sin(th) * h * 0.26 + h * 0.06;
      const on = (k + step) % 3 === 0;
      if (on) glow(c, accent, 0.12);

    }
    // glass dome with an optional pilot
    const dr = o.dome || 0.42;
    c.save(); c.beginPath(); c.ellipse(0, -h * 0.2, w * dr, h * 0.62, 0, Math.PI, TAU); c.closePath(); c.clip();
    const gg = c.createLinearGradient(0, -h * 0.85, 0, -h * 0.2); gg.addColorStop(0, "rgba(190,240,255,0.95)"); gg.addColorStop(1, "rgba(80,150,200,0.85)");
    c.fillStyle = gg; c.fillRect(-w, -h, w * 2, h);
    if (o.pilot) {

      c.fillStyle = "#0d1a14"; oval(c, -w * 0.07, -h * 0.4, w * 0.05, h * 0.07, 0.4); c.fill(); oval(c, w * 0.07, -h * 0.4, w * 0.05, h * 0.07, -0.4); c.fill();
    }

    return g;
  }
  const G = "#5dff9b", Y = "#ffe35d", P = "#ff8bd0", B = "#7ab8ff", O = "#ff8f5d", R = "#ff5d7a";
  const SIZE = { Walker: 0.28, Runner: 0.24, Swarm: 0.16, Flyer: 0.26, Tank: 0.36, Boss: 0.44 };
  const COLOR = { Walker: G, Runner: Y, Swarm: P, Flyer: B, Tank: O, Boss: R };

  // Every design is drawn upright (front or side view) at the origin; s = body radius in cells, t = seconds.
  const STAGES = [
  // ============================ STAGE 1 ============================
  { title: "Stage 1 · First Contact", sub: "Curious little visitors… or are they? · waves 1–5", meta: "Friendly-looking first contact: bright, round and easy to read.", designs: [
    { role: "Walker", name: "Blip", desc: "One-eyed blob that bounces along, antennae bobbing.",
