<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0a0618">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Alien Pachinko</title>
<style>
  :root { --bg: #0a0618; --panel: #160f30; --line: #3a2c6a; --ink: #f0eaff; --dim: #a698cc; --good: #5dff9b; --bad: #ff5d7a; --accent: #ff9a3c; --gold: #ffd25d; --blue: #4fd1ff; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; touch-action: none; overscroll-behavior: none;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #app { height: 100%; height: 100dvh; display: flex; flex-direction: column; padding: calc(4px + env(safe-area-inset-top)) calc(4px + env(safe-area-inset-right)) calc(4px + env(safe-area-inset-bottom)) calc(4px + env(safe-area-inset-left)); gap: 4px; }
  #hud { display: flex; gap: 5px; align-items: stretch; width: 100%; max-width: 760px; margin: 0 auto; }
  .chip { background: rgba(24,16,52,0.92); border: 1px solid var(--line); border-radius: 11px; padding: 3px 8px 4px; font-weight: 800; font-size: 14px; line-height: 1.15; white-space: nowrap; }
  .chip small { display: block; font-size: 9px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--dim); font-weight: 700; }
  #hBalls { color: var(--blue); } #hFreed { color: var(--accent); }
  .spacer { flex: 1; }
  .hudBtn { background: rgba(24,16,52,0.92); color: var(--ink); border: 1px solid var(--line); border-radius: 11px; font: inherit; font-weight: 900; font-size: 15px; padding: 0 10px; min-width: 40px; }
  @media (max-width: 420px) { #scoreChip { display: none; } .chip { padding: 3px 6px 4px; } .hudBtn { padding: 0 8px; min-width: 36px; } }
  #stage { flex: 1; min-height: 0; width: 100%; position: relative; }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #overlay { position: fixed; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center; padding: 14px; background: rgba(6,3,14,0.78); }
  #overlay.hidden { display: none; }
  #box { width: 100%; max-width: 430px; max-height: calc(100% - 16px); overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 18px 16px; text-align: center; box-shadow: 0 0 40px rgba(255,154,60,0.12); }
  #box h1 { font-size: 40px; line-height: 1.02; background: linear-gradient(90deg, #ff9a3c, #ffd25d 45%, #c77dff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #box h2 { font-size: 26px; margin-bottom: 4px; }
  #box p { color: #ddd4f5; font-size: 15px; line-height: 1.4; margin: 6px 0 10px; }
  #box .kicker { font-size: 11px; letter-spacing: 0.13em; text-transform: uppercase; color: var(--accent); font-weight: 800; }
  #titleArt { width: 100%; height: 170px; display: block; border-radius: 12px; }
  .big { display: block; width: 100%; margin: 8px 0; padding: 13px 12px; border-radius: 12px; border: 1px solid var(--line); background: #241a4e; color: var(--ink); font: inherit; font-size: 17px; font-weight: 800; text-decoration: none; }
  .big.main { background: #1d4a3a; border-color: #2f7a5c; color: var(--good); }
  .big:disabled { opacity: 0.4; }
  .big small { display: block; font-size: 12px; font-weight: 650; color: var(--dim); margin-top: 2px; }
  .row { display: flex; gap: 8px; } .row .big { flex: 1; }
  .stageCard { display: flex; align-items: center; gap: 12px; text-align: left; }
  .stageCard canvas { width: 56px; height: 56px; flex: none; border-radius: 12px; }
  .stageCard span { flex: 1; min-width: 0; }
  .levels { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 10px 0; }
  .levels .big { margin: 0; padding: 10px 0 8px; font-size: 20px; }
  .levels .big small { font-size: 11px; color: var(--gold); }
  .levels .big small i, .bigStars i { color: #3a2c6a; font-style: normal; }
  .stars { color: var(--gold); }
  .bigStars { font-size: 46px; letter-spacing: 0.1em; color: var(--gold); margin: 2px 0 6px; }
  .score { font-size: 15px; color: var(--dim); font-weight: 700; }
  .facts { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin: 4px 0 8px; }
  .facts span { background: #100a24; border: 1px solid #3a2c6a; border-radius: 999px; padding: 4px 10px; font-size: 13px; font-weight: 800; color: var(--accent); }
  .chars { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0; }
  .charBtn { background: #100a24; border: 2px solid #3a2c6a; border-radius: 14px; padding: 6px 4px 8px; color: var(--ink); font: inherit; font-weight: 800; font-size: 14px; }
  .charBtn.on { border-color: var(--good); background: #10301f; }
  .charBtn canvas { width: 100%; aspect-ratio: 1; display: block; }
  .charBtn small { display: block; font-size: 11px; color: #7ff0b0; font-weight: 800; }
  .powerDesc { min-height: 44px; background: #100a24; border: 1px solid #3a2c6a; border-radius: 10px; padding: 8px 10px; font-size: 14px !important; }
  #howCv { width: 100%; height: 190px; display: block; border-radius: 12px; background: #100a24; border: 1px solid #3a2c6a; margin: 6px 0 4px; }
  .how { list-style: none; margin: 10px 0 8px; display: grid; gap: 6px; text-align: left; }
  .how li { font-size: 17px; font-weight: 650; line-height: 1.3; padding: 7px 12px; background: #100a24; border: 1px solid #3a2c6a; border-radius: 10px; }
  .how b { font-weight: 900; color: #fff; } .how b.o { color: var(--accent); } .how b.c { color: var(--blue); } .how b.y { color: var(--gold); } .how b.g { color: var(--good); } .how b.p { color: #c77dff; } .how b.r { color: var(--bad); }
  .dots { display: flex; justify-content: center; gap: 6px; margin: 4px 0 2px; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: #3a2c6a; }
  .dots i.on { background: var(--accent); }
  #fsSheet { position: fixed; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center; background: rgba(6,3,14,0.6); padding: 12px; }
  #fsSheet .sheet { width: 100%; max-width: 420px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px 14px calc(14px + env(safe-area-inset-bottom)); text-align: left; }
  #fsSheet h3 { font-size: 19px; margin-bottom: 6px; } #fsSheet p { font-size: 14px; color: #ddd4f5; line-height: 1.4; margin: 4px 0 8px; }
  #fsSheet ol { list-style: none; display: grid; gap: 8px; margin: 0 0 10px; } #fsSheet li { background: #100a24; border-radius: 10px; padding: 8px 10px; font-size: 14px; line-height: 1.35; } #fsSheet li b { color: var(--accent); }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="chip"><small id="hStage">Oort</small><span id="hLevel">Level 1</span></div>
    <div class="chip"><small>Balls</small><span id="hBalls">10</span></div>
    <div class="chip"><small>Freed</small><span id="hFreed">0/0</span></div>
    <div class="chip" id="scoreChip"><small>Score</small><span id="hScore">0</span></div>
    <div class="spacer"></div>
    <button class="hudBtn" id="fsBtn" aria-label="Full screen" aria-pressed="false"></button>
    <button class="hudBtn" id="helpBtn" aria-label="How to play">?</button>
    <button class="hudBtn" id="menuBtn">Menu</button>
  </div>
  <div id="stage"><canvas id="cv"></canvas></div>
</div>
<div id="overlay"><div id="box"></div></div>
<script>
"use strict";
// ============================================================
//  ALIEN PACHINKO — aim the saucer cannon, fire a ball down through the pegs.
//  Orange pegs are pods with aliens trapped inside: hit every one to free them all.
//  Pegs you hit light up and vanish when the ball leaves. Catch the ball in the sliding saucer for a free ball.
//  Green pegs fire your alien's special power. The board is 360 x 640 units, scaled to fit the screen.
// ============================================================
const $ = id => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d");
const TAU = Math.PI * 2, PI = Math.PI;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const BW = 360, BH = 640, LEVELS = 8;
const GUN = { x: 180, y: 42 }, BALL_R = 6, PEG_R = 7, SHOT_SPEED = 470, GRAVITY = 560;
const BOUNCE_PEG = 0.78, BOUNCE_WALL = 0.85, BUMPER_KICK = 1.25;
const PEG_GAP = 2 * PEG_R + 2 * BALL_R + 4; // 30: the closest two pegs may be, so the ball always fits between them
const START_BALLS = 10, BUCKET = { w: 58, y: 616, speed: 0.55 };
const SCORE = { blue: 10, orange: 100, green: 10, purple: 500 };

// ============================================================
//  THE CAST: Stage 1 "First Contact" aliens from Alien Defense (attacker-design.html), each with a power
// ============================================================
const CHARS = (() => {
  function shade(hex, f) { const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255; const m = f < 0 ? 0 : 255, a = Math.abs(f);
    r = Math.round(r + (m - r) * a); g = Math.round(g + (m - g) * a); b = Math.round(b + (m - b) * a); return `rgb(${r},${g},${b})`; }
  const circle = (c, x, y, r) => { c.beginPath(); c.arc(x, y, r, 0, TAU); };
  const oval = (c, x, y, rx, ry, rot = 0) => { c.beginPath(); c.ellipse(x, y, rx, ry, rot, 0, TAU); };
  function shadow(c, s, y = 1.0, w = 0.9) { c.fillStyle = "rgba(0,0,0,0.35)"; oval(c, 0, s * y, s * w, s * 0.22); c.fill(); }
  function eye(c, x, y, r, pupil = "#10131f", lx = 0.25, ly = 0) {
    c.fillStyle = "#ffffff"; circle(c, x, y, r); c.fill();
    c.fillStyle = pupil; circle(c, x + r * lx, y + r * ly, r * 0.52); c.fill();
    c.fillStyle = "#ffffff"; circle(c, x + r * lx - r * 0.18, y + r * ly - r * 0.2, r * 0.16); c.fill();
  }
  const G = "#5dff9b", Y = "#ffe35d", P = "#ff8bd0", B = "#7ab8ff", O = "#ff8f5d", R = "#ff5d7a";
  const list = [
    { id: "blip", name: "Blip", color: G, fit: 1, desc: "One-eyed blob that bounces along, antennae bobbing.",
      draw(c, t, s, hit = 0) {
        const b = Math.sin(t * 8); c.translate(0, s * 0.1); c.scale(1 - 0.06 * b, 1 + 0.08 * b);
        c.fillStyle = shade(G, -0.4); oval(c, -s * 0.4, s * 0.75, s * 0.25, s * 0.13); c.fill(); oval(c, s * 0.4, s * 0.75, s * 0.25, s * 0.13); c.fill();
        c.strokeStyle = shade(G, -0.2); c.lineWidth = s * 0.08; c.lineCap = "round";
        for (const sd of [-1, 1]) { const tx = sd * s * (0.5 + 0.06 * Math.sin(t * 5 + sd));
          c.beginPath(); c.moveTo(sd * s * 0.25, -s * 0.7); c.quadraticCurveTo(sd * s * 0.35, -s * 1.05, tx, -s * 1.2); c.stroke();
          c.fillStyle = "#fff7a0"; circle(c, tx, -s * 1.2, s * 0.1); c.fill(); }
        c.fillStyle = G; c.beginPath(); c.moveTo(-s * 0.85, s * 0.7);
        c.bezierCurveTo(-s * 1.0, -s * 0.3, -s * 0.5, -s * 0.85, 0, -s * 0.85); c.bezierCurveTo(s * 0.5, -s * 0.85, s * 1.0, -s * 0.3, s * 0.85, s * 0.7); c.closePath(); c.fill();
        c.fillStyle = shade(G, 0.4); oval(c, -s * 0.4, -s * 0.38, s * 0.18, s * 0.09, -0.6); c.fill();
        if (hit > 0.15 || Math.sin(t * 1.3) > 0.97) { c.strokeStyle = "#10261a"; c.lineWidth = s * 0.07; c.beginPath(); c.moveTo(-s * 0.3, -s * 0.15); c.lineTo(s * 0.3, -s * 0.15); c.stroke(); }
        else eye(c, 0, -s * 0.15, s * 0.36, "#10261a", 0.25, 0.05);
        c.strokeStyle = "#10261a"; c.lineWidth = s * 0.06; c.beginPath(); c.arc(0, s * 0.3, s * 0.15, 0.2, Math.PI - 0.2); c.stroke();
      } },
    { id: "runner", name: "Runner", color: Y, fit: 1, desc: "Skinny legs, wobbly eye stalks, always in a hurry.",
      draw(c, t, s) {
        c.translate(0, -s * 0.1);
        c.strokeStyle = "rgba(255,227,93,0.35)"; c.lineWidth = s * 0.07; c.lineCap = "round";
        for (let k = 0; k < 3; k++) { const y = -s * 0.3 + k * s * 0.3; c.beginPath(); c.moveTo(-s * 0.7, y); c.lineTo(-s * (1.05 + 0.2 * Math.sin(t * 20 + k)), y); c.stroke(); }
        c.strokeStyle = shade(Y, -0.4); c.lineWidth = s * 0.12;
        for (const ph of [0, Math.PI]) { const a = t * 16 + ph, fx = Math.sin(a) * s * 0.5, fy = s * 1.0 - Math.max(0, Math.cos(a)) * s * 0.3;
          c.beginPath(); c.moveTo(0, s * 0.3); c.lineTo(fx * 0.5 + s * 0.1, s * 0.65); c.lineTo(fx, fy); c.stroke(); }
        c.fillStyle = Y; oval(c, s * 0.05, 0, s * 0.55, s * 0.48, 0.15); c.fill();
        c.fillStyle = shade(Y, 0.45); oval(c, -s * 0.15, -s * 0.2, s * 0.15, s * 0.08, -0.5); c.fill();
        c.strokeStyle = shade(Y, -0.2); c.lineWidth = s * 0.08;
        for (const [ex, ey, ph] of [[s * 0.1, -s * 0.95, 0], [s * 0.5, -s * 0.85, 1.5]]) { const w = Math.sin(t * 6 + ph) * s * 0.06;
          c.beginPath(); c.moveTo(s * 0.15, -s * 0.35); c.quadraticCurveTo(ex - s * 0.1, ey + s * 0.3, ex + w, ey); c.stroke();
          eye(c, ex + w, ey, s * 0.17, "#2a1a00", 0.4, 0.1); }
        c.strokeStyle = "#2a1a00"; c.lineWidth = s * 0.05; c.beginPath(); c.arc(s * 0.3, s * 0.1, s * 0.1, 0.2, Math.PI - 0.4); c.stroke();
      } },
    { id: "goo", name: "Goo", color: P, fit: 1.15, desc: "Little wobbling slime drop. Squishy and bouncy.",
      draw(c, t, s) {
        const w = Math.sin(t * 10); c.scale(1 + 0.1 * w, 1 - 0.1 * w);
        c.fillStyle = P; c.beginPath(); c.moveTo(0, -s * 1.0);
        c.bezierCurveTo(s * 0.5, -s * 0.4, s * 0.9, s * 0.1, s * 0.75, s * 0.55); c.quadraticCurveTo(0, s * 0.85, -s * 0.75, s * 0.55);
        c.bezierCurveTo(-s * 0.9, s * 0.1, -s * 0.5, -s * 0.4, 0, -s * 1.0); c.fill();
        c.fillStyle = shade(P, 0.45); oval(c, -s * 0.25, -s * 0.25, s * 0.12, s * 0.22, 0.4); c.fill();
        c.fillStyle = "#3a0a22"; circle(c, -s * 0.2, s * 0.15, s * 0.11); c.fill(); circle(c, s * 0.25, s * 0.15, s * 0.11); c.fill();
      } },
    { id: "jelly", name: "Jelly", color: B, fit: 1, desc: "Floating jellyfish that drifts along, tentacles waving.",
      draw(c, t, s, hit = 0) {
        shadow(c, s, 1.0, 0.7); c.translate(0, Math.sin(t * 2.5) * s * 0.12 - s * 0.25);
        c.strokeStyle = shade(B, 0.2); c.lineWidth = s * 0.08; c.lineCap = "round";
        for (let k = 0; k < 5; k++) { const x = -s * 0.5 + k * s * 0.25; c.beginPath(); c.moveTo(x, s * 0.1);
          c.quadraticCurveTo(x + Math.sin(t * 4 + k) * s * 0.2, s * (0.6 - hit * 0.27), x * (1 - hit * 0.4) + Math.sin(t * 4 + k + 1) * s * 0.15, s * (1 - hit * 0.57)); c.stroke(); }
        const pul = 1 + 0.06 * Math.sin(t * 5);
        const g = c.createRadialGradient(-s * 0.2, -s * 0.4, s * 0.1, 0, -s * 0.1, s * 0.8); g.addColorStop(0, shade(B, 0.55)); g.addColorStop(1, shade(B, -0.1));
        c.fillStyle = g; c.beginPath(); c.ellipse(0, 0, s * 0.75 * pul, s * 0.7 / pul, 0, Math.PI, TAU);
        c.quadraticCurveTo(s * 0.4, s * 0.25, 0, s * 0.12); c.quadraticCurveTo(-s * 0.4, s * 0.25, -s * 0.75 * pul, 0); c.fill();
        c.fillStyle = "#0d1830"; circle(c, -s * 0.2, -s * 0.25, s * 0.09); c.fill(); circle(c, s * 0.2, -s * 0.25, s * 0.09); c.fill();
      } },
    { id: "chonk", name: "Chonk", color: O, fit: 0.95, desc: "Big round three-eyed bruiser. Built like a bowling ball.",
      draw(c, t, s, hit = 0) {
        c.translate(0, -Math.abs(Math.sin(t * 3)) * s * 0.12 + s * 0.05);
        c.fillStyle = shade(O, -0.3);
        for (const sd of [-1, 1]) { oval(c, sd * s * 0.95, s * 0.05 + Math.sin(t * 3 + sd) * s * 0.08, s * 0.18, s * 0.28, sd * 0.4); c.fill(); }
        oval(c, -s * 0.45, s * 0.82, s * 0.28, s * 0.14); c.fill(); oval(c, s * 0.45, s * 0.82, s * 0.28, s * 0.14); c.fill();
        const g = c.createRadialGradient(-s * 0.3, -s * 0.4, s * 0.1, 0, 0, s); g.addColorStop(0, shade(O, 0.35)); g.addColorStop(1, shade(O, -0.15));
        c.fillStyle = g; oval(c, 0, 0, s * 0.92, s * 0.85); c.fill();
        c.fillStyle = shade(O, -0.2); circle(c, -s * 0.6, s * 0.35, s * 0.1); c.fill(); circle(c, s * 0.62, s * 0.3, s * 0.08); c.fill(); circle(c, s * 0.5, -s * 0.55, s * 0.07); c.fill();
        eye(c, -s * 0.35, -s * 0.2, s * 0.2, "#2a1205"); eye(c, s * 0.35, -s * 0.2, s * 0.2, "#2a1205"); eye(c, 0, -s * 0.52, s * 0.16, "#2a1205");
        if (hit > 0.15) { c.strokeStyle = "#3a1405"; c.lineWidth = s * 0.14; c.lineCap = "round"; c.beginPath(); c.moveTo(-s * 0.26, s * 0.38); c.quadraticCurveTo(0, s * 0.08, s * 0.26, s * 0.38); c.stroke(); }
        else { c.fillStyle = "#3a1405"; oval(c, 0, s * 0.3, s * 0.25, s * (0.1 + 0.05 * Math.sin(t * 3))); c.fill(); }
      } },
    { id: "mother", name: "Mother Blob", color: R, fit: 0.85, desc: "Huge blob covered in eyes that all look in different directions.",
      draw(c, t, s) {
        const w = Math.sin(t * 2); c.scale(1 + 0.04 * w, 1 - 0.04 * w);
        const g = c.createRadialGradient(-s * 0.3, -s * 0.35, s * 0.1, 0, 0, s * 1.05); g.addColorStop(0, shade(R, 0.35)); g.addColorStop(1, shade(R, -0.25));
        c.fillStyle = g; c.beginPath(); c.moveTo(-s * 1.05, s * 0.75);
        c.bezierCurveTo(-s * 1.2, -s * 0.4, -s * 0.6, -s * 1.0, 0, -s * 1.0); c.bezierCurveTo(s * 0.6, -s * 1.0, s * 1.2, -s * 0.4, s * 1.05, s * 0.75);
        c.quadraticCurveTo(0, s * 0.95, -s * 1.05, s * 0.75); c.fill();
        const eyes = [[0, -0.35, 0.24], [-0.5, -0.2, 0.16], [0.5, -0.2, 0.16], [-0.3, -0.7, 0.12], [0.3, -0.7, 0.12], [-0.62, 0.22, 0.1], [0.62, 0.22, 0.1]];
        eyes.forEach(([x, y, r], i) => {
          if (Math.sin(t * 1.7 + i * 1.9) > 0.95) { c.strokeStyle = "#3a0a12"; c.lineWidth = s * 0.05; c.beginPath(); c.moveTo((x - r) * s, y * s); c.lineTo((x + r) * s, y * s); c.stroke(); }
          else eye(c, x * s, y * s, r * s, "#3a0a12", Math.cos(t + i) * 0.3, Math.sin(t * 1.3 + i) * 0.3);
        });
        c.fillStyle = "#3a0a12"; oval(c, 0, s * 0.45, s * 0.35, s * 0.12); c.fill();
      } },
  ];
  return { list, shade, byId: id => list.find(ch => ch.id === id) || list[0],
    draw(c, id, x, y, s, t, hop = 0, tilt = 0, hit = 0) { const ch = this.byId(id); c.save(); c.translate(x, y - hop); c.rotate(tilt); c.scale(ch.fit, ch.fit); c.lineCap = "round"; ch.draw(c, t, s, hit); c.restore(); } };
})();
// what a green peg does, depending on which alien you picked
const POWERS = {
  blip:   { name: "Far Sight", text: "Your aim guide shows the whole path through the first 3 bounces, for 3 shots." },
  runner: { name: "Wide Catch", text: "The catcher saucer grows extra wide for 3 shots: easier free balls." },
  goo:    { name: "Split", text: "Your ball splits in two, right where it is." },
  jelly:  { name: "Float", text: "Low gravity for this shot: the ball drifts gently through the pegs." },
  chonk:  { name: "Smash", text: "For a few seconds the ball is huge and crashes straight through pegs." },
  mother: { name: "Call Home", text: "Lights up 3 random alien pods for you." },
};

// ============================================================
//  STAGES: each world adds a twist. Every level has its own peg pattern.
// ============================================================
const STAGES = [

      <p>Balls left <b>${ballsLeft}</b> · Score <b>${score.toLocaleString()}</b>${newBest ? " · <b>New best!</b>" : ""}<br>${st === 3 ? "Brilliant shooting!" : st === 2 ? "Finish with 4 or more balls left for three stars." : "Keep 2 or more balls for two stars."}</p>
      <p class="score">${S.short}: <span class="stars">${stageStars(si)}/24 ★</span></p>
      ${next ? `<button class="big main" data-act="play" data-arg="${next[0]}|${next[1]}">${next[0] !== si ? `Next stage: ${STAGES[next[0]].short} ▶` : `Board ${next[1] + 1} ▶`}</button>`
        : si + 1 === STAGES.length && li + 1 === LEVELS ? `<p><b>Every alien is free!</b> Go back for any missing stars.</p>` : ""}
      <button class="big" data-act="play" data-arg="${si}|${li}">Play again</button>
      <button class="big" data-act="stage" data-arg="${si}">All boards</button>`, null, "result");
  } else {
    openMenu(`<p class="kicker">${S.short} · Board ${li + 1}</p><h2>Out of balls</h2>
      <p>You freed <b>${freed}</b> of ${podsTotal} aliens. Tip: aim for <b>clusters</b> of orange pods, and try to land in the <b style="color:#4fd1ff">catcher saucer</b> for free balls.</p>
      <button class="big main" data-act="play" data-arg="${si}|${li}">Try again</button>
      <button class="big" data-act="stage" data-arg="${si}">All boards</button>`, null, "result");
  }
}
function pauseMenu() {
  openMenu(`<p class="kicker">Paused</p><h2>${S.short} · Board ${li + 1}</h2>
    <p>Freed <b>${freed}/${podsTotal}</b> · Balls <b>${ballsLeft}</b> · Score <b>${score.toLocaleString()}</b></p>
    <button class="big main" data-act="resume">Resume ▶</button>
    <button class="big" data-act="play" data-arg="${si}|${li}">Restart board</button>
    <button class="big" data-act="help" data-arg="game|0">How to play</button>
    <button class="big" data-act="stage" data-arg="${si}">All boards</button>
    ${soundBtn()}
    <button class="big" data-act="title">Main menu</button>`, null, "pause");
}
// How to play
const HOWTO = [
  { title: "Aim and fire", lines: ["<b>Touch</b> the board to point the cannon", "<b>Drag</b> to fine-tune, <b>let go</b> to fire", "The dots show where the ball heads first"], demo: demoAim },
  { title: "Free the aliens", lines: ["<b class='o'>Orange pods</b> have aliens trapped inside", "Hit them <b>all</b> to clear the board", "Pegs you hit <b>light up</b>, then vanish when the ball's gone"], demo: demoFree },
  { title: "Free balls", lines: ["You get <b>10 balls</b> a board", "Land the ball in the sliding <b class='c'>catcher saucer</b> = <b>free ball</b>", "<b class='p'>Purple</b> peg = big bonus (it moves every shot)"], demo: demoBucket },
  { title: "Powers", lines: ["<b class='g'>Green pegs ⚡</b> fire your alien's power", "Blip: <b>Far Sight</b> · Runner: <b>Wide Catch</b> · Goo: <b>Split</b>", "Jelly: <b>Float</b> · Chonk: <b>Smash</b> · Mother Blob: <b>Call Home</b>"], demo: demoPower },
  { title: "Stars", lines: ["4+ balls left = <b class='y'>★★★</b> · 2+ = <b class='y'>★★</b> · clear it = <b class='y'>★</b>", "Each world has a twist: <b>low gravity</b>, <b>wind</b>, <b>moving pegs</b>, <b>bumpers</b>", "More hits in one shot = <b>more points</b> per peg"], demo: demoStars },
];
function helpMenu(back, page = 0) {
  const p = HOWTO[page], lastPage = page === HOWTO.length - 1, first = back === "first", done = first ? "start" : back === "game" ? "resume" : "title";
  openMenu(`<p class="kicker">How to play · ${page + 1} of ${HOWTO.length}</p><h2>${p.title}</h2>
    <canvas id="howCv"></canvas><ul class="how">${p.lines.map(l => `<li>${l}</li>`).join("")}</ul>
    <div class="dots">${HOWTO.map((_, k) => `<i class="${k === page ? "on" : ""}"></i>`).join("")}</div>
    <div class="row">${page ? `<button class="big" data-act="help" data-arg="${back}|${page - 1}">◀ Back</button>` : `<button class="big" data-act="${done}">${first ? "Skip" : "Close"}</button>`}
      ${lastPage ? `<button class="big main" data-act="${done}">${first ? "Let's go ▶" : "Done"}</button>` : `<button class="big main" data-act="help" data-arg="${back}|${page + 1}">Next ▶</button>`}</div>`,
    tt => { const cvs = $("howCv"); if (!cvs) return; const [c, w, h] = fitCanvas(cvs); const g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, "#1a0e3a"); g.addColorStop(1, "#06030e"); c.fillStyle = g; c.fillRect(0, 0, w, h); p.demo(c, tt, w, h); }, "help");
}
function label(c, text, x, y, col) { c.fillStyle = col; c.font = "800 13px system-ui"; c.textAlign = "center"; c.fillText(text, x, y); }
function finger(c, x, y, down) { c.fillStyle = down ? "rgba(255,154,60,0.35)" : "rgba(255,255,255,0.22)"; c.beginPath(); c.arc(x, y, 15, 0, TAU); c.fill(); c.fillStyle = down ? "#ff9a3c" : "#fff"; c.beginPath(); c.arc(x, y, 6, 0, TAU); c.fill(); }
function miniGun(c, x, y, a, tt) { c.save(); c.translate(x, y); c.save(); c.rotate(a); c.fillStyle = "#3a3a5a"; c.fillRect(4, -5, 22, 10); c.fillStyle = "#ffd25d"; c.fillRect(22, -5, 4, 10); c.restore();
  c.fillStyle = "#e2e8f6"; c.beginPath(); c.ellipse(0, 0, 24, 7, 0, 0, TAU); c.fill(); CHARS.draw(c, SAVE.char, 0, -9, 6, tt); c.restore(); }
function demoAim(c, tt, w, h) {
  const a = PI / 2 + Math.sin(tt * 1.2) * 0.7, gx = w / 2, gy = 22; miniGun(c, gx, gy, a, tt);
  c.fillStyle = "rgba(255,255,255,0.85)"; let x = gx, y = gy, vx = Math.cos(a) * 200, vy = Math.sin(a) * 200; for (let i = 0; i < 12; i++) { vy += 300 * 0.03; x += vx * 0.03; y += vy * 0.03; c.globalAlpha = 1 - i / 12; c.beginPath(); c.arc(x, y, 2, 0, TAU); c.fill(); } c.globalAlpha = 1;
  for (let i = 0; i < 6; i++) miniPeg(c, w * 0.15 + i * w * 0.14, h * 0.75, 7, "#4fd1ff");
  finger(c, gx + Math.cos(a) * 110, gy + Math.sin(a) * 110, true);
}
function demoFree(c, tt, w, h) {
  const T = tt % 3, lit = T > 1, ids = ["blip", "goo", "chonk"];
  ids.forEach((id, i) => { const x = w * (0.28 + i * 0.22), y = h * 0.5; if (T < 2.2 || !lit) miniPeg(c, x, y, 12, "#ff9a3c", lit && T > 1 + i * 0.25, id, tt);
    if (T > 2.2) { const k = (T - 2.2) / 0.8; c.globalAlpha = 1 - k; CHARS.draw(c, id, x + Math.sin(T * 6) * 5, y - k * 60, 10, tt * 2); c.globalAlpha = 1; } });
  if (T < 1.6) { const x = w * 0.2 + T / 1.6 * w * 0.6, y = h * 0.3 + Math.abs(Math.sin(T * 6)) * 22; c.fillStyle = "#fff"; c.beginPath(); c.arc(x, y, 5, 0, TAU); c.fill(); }
  label(c, T > 2.2 ? "free!" : "hit the pods", w / 2, h - 10, T > 2.2 ? "#5dff9b" : "#ff9a3c");
}
function demoBucket(c, tt, w, h) {
  const bx = w / 2 + Math.sin(tt * 1.2) * w * 0.3, by = h * 0.82; c.fillStyle = "#1a2a4a"; c.beginPath(); c.ellipse(bx, by, 30, 8, 0, 0, TAU); c.fill(); c.strokeStyle = "#4fd1ff"; c.lineWidth = 2; c.stroke();
  const T = tt % 2.6, y = h * 0.1 + T / 2.6 * (by - h * 0.1), x = w / 2 + Math.sin((tt - T + 2.6) * 1.2) * w * 0.3; c.fillStyle = "#fff"; c.beginPath(); c.arc(x, y, 5, 0, TAU); c.fill();
  if (T > 2.3) label(c, "FREE BALL!", bx, by - 24, "#4fd1ff");
  miniPeg(c, w * 0.18, h * 0.35, 9, "#c77dff"); label(c, "bonus", w * 0.18, h * 0.35 + 24, "#c77dff");
}
function demoPower(c, tt, w, h) {
  CHARS.list.forEach((ch, i) => { const x = w * (0.1 + i * 0.16), on = ch.id === SAVE.char; CHARS.draw(c, ch.id, x, h * 0.42 - (on ? Math.abs(Math.sin(tt * 5)) * 6 : 0), 11, tt + i); label(c, POWERS[ch.id].name, x, h * 0.75, on ? "#5dff9b" : "#a698cc"); });
  miniPeg(c, w / 2, h * 0.12 + 4, 8, "#5dff9b", Math.floor(tt * 2) % 2 === 0);
}
function demoStars(c, tt, w, h) {
  [["●●●●", "★★★"], ["●●", "★★"], ["●", "★"]].forEach(([a, b], i) => { const y = h * (0.28 + i * 0.25);
    c.font = "800 18px system-ui"; c.textAlign = "left"; c.fillStyle = "#b8c4e6"; c.fillText(a, w * 0.2, y); c.fillStyle = "#ffd25d"; c.fillText(b, w * 0.6, y); });
  label(c, "balls left when the last pod pops → stars", w / 2, h - 10, "#a698cc");
}

const ACT = {
  title: () => titleMenu(),
  stage: s => stageMenu(+s),
  chars: () => charMenu(),
  pick: id => { SAVE.char = id; save(); charMenu(); },
  play: a => { const [s, l] = a.split("|").map(Number); loadLevel(s, l); closeMenu(); },
  start: () => { SAVE.seenHelp = true; save(); loadLevel(0, 0); closeMenu(); },
  resume: () => closeMenu(),
  help: a => { const [back, page] = a.split("|"); helpMenu(back, +page || 0); },
  sound: () => { SAVE.sound = !SAVE.sound; save(); if (!SAVE.sound && keepAlive) keepAlive.pause(); else audio();
    for (const b of $("box").querySelectorAll("[data-act='sound']")) b.textContent = SAVE.sound ? "🔊 Sound: On" : "🔇 Sound: Off"; tone(520, 0.1, "triangle", 0.07); },
};
const playing = () => state === "aim" || state === "shot" || state === "clearing";
$("menuBtn").onclick = () => { audio(); if (playing() && !paused) pauseMenu(); else if (paused && menuName === "pause") closeMenu(); else titleMenu(); };
$("helpBtn").onclick = () => { audio(); helpMenu(playing() && !paused ? "game" : "title", 0); };

// ---------- full screen (like Dr Alien). iPhones can't, so there the button explains Add to Home Screen. ----------
(() => {
  const btn = $("fsBtn"), root = document.documentElement, req = root.requestFullscreen || root.webkitRequestFullscreen;
  const can = !!(req && (document.fullscreenEnabled || document.webkitFullscreenEnabled));
  const ICON = on => `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="${on ? "M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5" : "M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"}"/></svg>`;
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  if (!can) {
    if (standalone) { btn.hidden = true; return; }
    btn.innerHTML = ICON(false);
    btn.onclick = () => {
      const chrome = /CriOS/.test(navigator.userAgent), other = /FxiOS|EdgiOS|OPiOS/.test(navigator.userAgent), el = document.createElement("div"); el.id = "fsSheet";
      el.innerHTML = `<div class="sheet"><h3>Full screen on iPhone</h3><p>Apple doesn't let iPhone browsers fill the screen with a web page. This works:</p><ol>
        ${other ? `<li>Open this page in <b>Safari</b>, tap <b>Share</b> (□↑), then <b>Add to Home Screen</b>.</li>` : `<li>Tap <b>Share</b> (□↑)${chrome ? " at the right of the address bar" : ""}, then <b>Add to Home Screen</b>.</li>`}
        <li>Open <b>Alien Pachinko</b> from its new icon: it fills the whole screen like an app.</li>
        ${!chrome && !other ? `<li>Quick option: tap <b>aA</b> in the address bar, then <b>Hide Toolbar</b>.</li>` : ""}</ol>
        <button class="big main" type="button">Got it</button></div>`;
      el.addEventListener("click", e => { if (e.target === el || e.target.tagName === "BUTTON") el.remove(); }); document.body.appendChild(el);
    };
    return;
  }
  const isFull = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
  const sync = () => { const on = isFull(); btn.innerHTML = ICON(on); btn.setAttribute("aria-label", on ? "Exit full screen" : "Full screen"); btn.setAttribute("aria-pressed", String(on)); setTimeout(resize, 120); };
  btn.onclick = () => { audio(); const r = isFull() ? (document.exitFullscreen || document.webkitExitFullscreen).call(document) : req.call(root); if (r && r.catch) r.catch(() => {}); };
  document.addEventListener("fullscreenchange", sync); document.addEventListener("webkitfullscreenchange", sync); sync();
})();

// ============================================================
//  MAIN LOOP: fixed 1/60 s steps
// ============================================================
let last = performance.now(), acc = 0;
function frame(now) {
  const dt = clamp((now - last) / 1000, 0, 0.1);
  last = now;
  acc += dt; let n = 0;
  while (acc >= 1 / 60 && n < 6) { update(1 / 60); acc -= 1 / 60; n++; }
  if (n === 6) acc = 0;
  if (menuAnim) menuAnim(now / 1000);
  draw(now / 1000);
  requestAnimationFrame(frame);
}
resize();
loadLevel(0, 0); banner = null;
if (SAVE.seenHelp) titleMenu(); else helpMenu("first", 0);
requestAnimationFrame(frame);
</script>
</body>
