<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101229">
<title>Alien Bowling · Alien Arcade</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#101229;color:#f9f6ec;--accent:#e8ff83}
*{box-sizing:border-box}
/* the whole game fits one screen: header, lane, scorecard and buttons, with no scrolling */
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{margin:0;padding:calc(8px + env(safe-area-inset-top)) 10px calc(8px + env(safe-area-inset-bottom));background:radial-gradient(ellipse at top,#332449,#101229 70%);height:100dvh}
main{max-width:580px;height:100%;margin:auto;display:flex;flex-direction:column;gap:5px}.top{display:flex;justify-content:space-between;align-items:end;gap:10px;flex:none}
.kicker{font-size:.65rem;letter-spacing:.17em;font-weight:900;text-transform:uppercase;color:#bbb4dc}h1{font-size:clamp(1.5rem,min(7vw,5dvh),3rem);line-height:.9;letter-spacing:-.075em;margin:3px 0}h1 span{color:var(--accent)}
button,a.button{font:inherit;font-weight:850;background:#262841;color:white;border:1px solid #575673;border-radius:9px;min-height:44px;padding:7px 11px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;text-align:center}
button.primary{background:var(--accent);border-color:var(--accent);color:#1d2131}button:disabled{opacity:.52;cursor:default}button:focus-visible,a:focus-visible{outline:2px solid #fff;outline-offset:2px}
/* the lane area takes whatever height is left; the canvas inside keeps a fixed shape and is centred */
.arena{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#lane{display:block;border:1px solid #646385;border-radius:15px;background:#221a38;touch-action:none;user-select:none}
.status{flex:none;min-height:1.5em;margin:0 1px;font-size:.81rem;color:#ebe2ff;font-weight:750}.stage{font-weight:850;color:var(--accent);font-size:.75rem;text-align:right}
.controls{display:grid;grid-template-columns:48px 1fr 48px;gap:6px}.controls button{touch-action:manipulation}.controls .primary{font-size:1.04rem}
#rollOptions{margin-top:0}#rollOptions button[aria-pressed="true"]{background:#343d42;border-color:var(--accent);color:var(--accent)}
.score{flex:none;display:grid;grid-template-columns:repeat(9,minmax(0,1fr)) minmax(0,1.5fr);gap:2px;margin:0;text-align:center}
.controls,#rollOptions{flex:none}
.frame{background:#242439;border:1px solid #424464;border-radius:5px;padding:3px 1px;min-width:0}
.frame.now{border-color:var(--accent);background:#32394b}.frame small,.frame strong{display:block}.frame small{font-size:.62rem;color:#c9bfdc}.frame strong{font-size:.69rem;white-space:nowrap;min-height:1.2em}.frame .total{color:var(--accent);font-size:.68rem}
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#14142ad9;padding:10px}
.panel{width:min(100%,410px);max-height:100%;overflow:auto;background:#25233e;border:1px solid #6d658a;border-radius:13px;padding:13px}
h2{margin:3px 0;font-size:1.55rem;letter-spacing:-.04em}.panel p{font-size:.88rem;line-height:1.35;margin:6px 0 10px;color:#dfd9f1}
.worlds{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:9px 0}.worlds button{display:grid;justify-items:start;align-content:center;text-align:left;min-height:50px}
.worlds small{font-size:.67rem;color:#d2c9e8}.actions{display:flex;flex-wrap:wrap;gap:6px}.actions>*{flex:1;font-size:.76rem}
.help{display:grid;gap:6px;margin:8px 0}.help div{background:#171832;border-radius:8px;padding:7px 9px;font-size:.83rem}.help b{color:var(--accent)}
.balls{display:grid;gap:6px;margin:9px 0}.balls button{justify-content:flex-start;gap:11px;text-align:left;padding:8px 10px}
.balls button.on{border-color:var(--accent);background:#343d42}.balls i{width:40px;height:40px;border-radius:50%;flex:none;box-shadow:inset -4px -5px 8px #0006}
.balls b{display:block}.balls small{display:block;font-size:.68rem;color:#d2c9e8;font-weight:700}.balls .stats{color:var(--accent);letter-spacing:.02em}
#howCv{width:100%;height:130px;display:block;border-radius:10px;background:#171832;border:1px solid #424464;margin:6px 0}
.how{list-style:none;padding:0;margin:6px 0;display:grid;gap:5px;text-align:left}.how li{font-size:.86rem;line-height:1.3;padding:6px 9px;background:#171832;border-radius:8px}
.how b{color:var(--accent)}.how b.r{color:#ff8f9f}.how b.y{color:#ffd25d}
.dots{display:flex;justify-content:center;gap:6px;margin:6px 0 8px}.dots i{width:7px;height:7px;border-radius:50%;background:#424464}.dots i.on{background:var(--accent)}
[hidden]{display:none!important}
@media(max-width:360px){body{padding:7px}.panel{padding:9px}.frame strong{font-size:.62rem}}
</style>
</head>
<body><main>
<header class="top"><div><div class="kicker">Alien Arcade · Ten-pin</div><h1>Alien <span>Bowling</span></h1></div><span class="stage" id="stage"></span></header>
<div class="arena"><canvas id="lane" aria-label="Bowling lane and alien pins"></canvas>
<section class="overlay" id="overlay" aria-label="Game menu"><div class="panel" id="panel"></div></section></div>
<div class="score" id="score" aria-label="Ten-frame scorecard"></div>
<p class="status" id="status" role="status"></p>
<div class="controls" id="controls" hidden><button data-act="left" aria-label="Move ball left">◀</button><button class="primary" data-act="roll">ROLL · SPACE</button><button data-act="right" aria-label="Move ball right">▶</button></div>
<div class="actions" id="rollOptions" hidden>
  <button data-act="hookLeft" aria-pressed="false">↶ Hook left</button>
  <button data-act="straight" aria-pressed="true">↑ Straight</button>
  <button data-act="hookRight" aria-pressed="false">↷ Hook right</button>
  <button data-act="pause">Pause</button>
</div>
</main><script>
"use strict";
const $=id=>document.getElementById(id), cv=$("lane"), ctx=cv.getContext("2d");
const PI=Math.PI, TAU=2*PI, clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const CHARS = (() => {

    { id: "goo", name: "Goo", color: P, fit: 1.15, desc: "Little wobbling slime drop. Squishy and bouncy.",

    { id: "jelly", name: "Jelly", color: B, fit: 1, desc: "Floating jellyfish that drifts along, tentacles waving.",
      draw(c, t, s, hit = 0) {

    { id: "chonk", name: "Chonk", color: O, fit: 0.95, desc: "Big round three-eyed bruiser. Built like a bowling ball.",
      draw(c, t, s, hit = 0) {

        if (hit > 0.15) { c.strokeStyle = "#3a1405"; c.lineWidth = s * 0.14; c.lineCap = "round"; c.beginPath(); c.moveTo(-s * 0.26, s * 0.38); c.quadraticCurveTo(0, s * 0.08, s * 0.26, s * 0.38); c.stroke(); }
        else { c.fillStyle = "#3a1405"; oval(c, 0, s * 0.3, s * 0.25, s * (0.1 + 0.05 * Math.sin(t * 3))); c.fill(); }

      draw(c, t, s) {

})();
const WORLDS=[
  {name:"Oort Gate",caption:"Ice drift",sky:"#192c58",ground:"#335888",trim:"#9df4ff",event:"Ice shear",hint:"The ice nudges your ball sideways.",kind:"ice",beat:1.7,unlock:65,stars:[65,105,150]},
  {name:"Jupiter",caption:"Storm gusts",sky:"#341b43",ground:"#79435b",trim:"#ffe086",event:"Storm gust",hint:"Read the arrows and aim into the gust.",kind:"wind",beat:2,unlock:75,stars:[75,115,160]},
  {name:"Mars",caption:"Crystal blockers",sky:"#41233d",ground:"#883f48",trim:"#ffad8f",event:"Crystal crossing",hint:"Wait for a gap or bowl around the crystal.",kind:"crystal",beat:2.23,unlock:85,stars:[85,125,165]},
  {name:"Earth",caption:"Saucer traffic",sky:"#16244a",ground:"#24536b",trim:"#a8ff91",event:"Saucer traffic",hint:"Time your roll between the saucers.",kind:"saucer",beat:2.5,unlock:0,stars:[90,135,175]},

const STORAGE="alienArcade.bowling.v1", FINISH_Y=17.5, HALF_LANE=1.13, PIN_R=.153, BALL_R=.185;
const BALL_SPEED=7.5, BALL_MASS=1.6, PIN_TIP_SPEED=1.32;
// ---------- the ball rack: each ball rolls differently ----------
// speed = how fast it rolls, mass = how hard it hits pins, hook = how much a hook bends it, wobble = how far the aim marker swings
const BALLS=[
  {name:"Comet",desc:"All-rounder. Good at everything.",colors:["#eaffc7","#7db84f","#233f49"],speed:1,mass:1,hook:1,wobble:1,stats:[3,3,3,3]},
  {name:"Ice Moon",desc:"Light and steady. Easiest to aim.",colors:["#ffffff","#9fe8ff","#1a5a90"],speed:.88,mass:.8,hook:.7,wobble:.7,stats:[2,2,2,5]},
  {name:"Plasma",desc:"Bends like crazy on a hook.",colors:["#ffe0ff","#c77dff","#3a1460"],speed:1,mass:.95,hook:1.75,wobble:1.05,stats:[3,5,3,2]},
  {name:"Meteor",desc:"Fast and heavy, but the aim jumps around.",colors:["#fff0c0","#ff8f5d","#5a1a10"],speed:1.3,mass:1.35,hook:.8,wobble:1.3,stats:[5,2,4,1]},

];
const BALL_KEY="alienArcade.bowling.ball";
let ballPick=0;
try{ballPick=clamp(+localStorage.getItem(BALL_KEY)||0,0,BALLS.length-1);}catch{}
const myBall=()=>BALLS[ballPick];
let records=[];

}catch{}
let worldIndex=0, frames=[], frame=0, pins=[], ball=null, position=0, time=0, rollTime=0;
let state="menu", resumeState="aim", last=0, carry=0, width=0,height=0,ratio=1, hitMessage="", hitCount=0;
let audioCtx,gesture=null,hook=0;

function playSound(hz,seconds=.12,type="sine",end=hz*.65){

function frameTotals(card){
  let total=0;
  return card.map((r,i)=>{
    if(!r.length)return null;
    const later=card.slice(i+1).flat();
    if(i===9){
      if(r.length<2||((r[0]===10||r[0]+r[1]===10)&&r.length<3))return null;
      total+=r.reduce((a,b)=>a+b,0);
    }else if(r[0]===10){
      if(later.length<2)return null;
      total+=10+later[0]+later[1];
    }else{
      if(r.length<2)return null;

  });
}

  for(let i=0;i<syllables;i++){
    const len=kind==="laugh"?.09:kind==="ouch"?.24:kind==="scared"?.16:.07+Math.random()*.08;
    const f=v.f*(kind==="laugh"?1.3-i*.09:kind==="scared"?1.7:kind==="ouch"?1.5:.8+Math.random()*.6);

let rackAfterRoll=false, endAfterRoll=false;

  enableSound();poked();
  if(state!=="aim"||gesture||e.button!==0)return;
  gesture={id:e.pointerId,x:e.clientX,y:e.clientY,position};
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener("pointermove",e=>{
  if(state!=="aim"||gesture?.id!==e.pointerId)return;
  const dx=e.clientX-gesture.x,dy=e.clientY-gesture.y;
  if(dy< -12&&-dy>Math.abs(dx)*.65){
    gesture.preview=hookFromSwipe(dx,-dy)??hook;
    position=gesture.position;
  }else{
    gesture.preview=null;
    if(Math.abs(dx)>6&&Math.abs(dx)>=Math.abs(dy)*.65){
      position=clamp(gesture.position+dx/(width*.38),-.72,.72);
    }
  }
});
cv.addEventListener("pointerup",e=>{
  if(gesture?.id!==e.pointerId)return;
  const dx=e.clientX-gesture.x,up=gesture.y-e.clientY,startPosition=gesture.position;
  gesture=null;
  if(state==="aim"&&up>=18&&up>Math.abs(dx)*.65){
    position=startPosition;
    enableSound();
    launch(hookFromSwipe(dx,up)??hook);
  }
});
for(const event of ["pointercancel","lostpointercapture"]){
  cv.addEventListener(event,e=>{if(gesture?.id===e.pointerId)gesture=null;});
}
document.addEventListener("click",e=>{
  const button=e.target.closest("button[data-act]");
  if(button)act(button.dataset.act,Number(button.dataset.index));
});
document.addEventListener("keydown",e=>{
  poked();
  if(e.code==="Escape"){
    if(state==="pause")act("resume");else if(state==="help")title();else pause();
    return;
  }
  if(state!=="aim")return;
  const action={ArrowLeft:"left",ArrowRight:"right",Space:"roll",KeyQ:"hookLeft",KeyE:"hookRight",Digit0:"straight"}[e.code];
  if(!action)return;
  e.preventDefault();if(action!=="roll"||!e.repeat)act(action);
});
window.addEventListener("blur",pause);
window.addEventListener("resize",resize);
function animate(now){
  const dt=last?clamp((now-last)/1000,0,.06):0;last=now;
  carry+=dt;
  while(carry>=1/120){update(1/120);carry-=1/120;}
  draw();if(helpAnim)helpAnim(now/1000);requestAnimationFrame(animate);
}
resize();title();requestAnimationFrame(animate);
</script></body></html>
