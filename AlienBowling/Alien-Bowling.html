<title>Alien Bowling · Alien Arcade</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#101229;color:#f9f6ec;--accent:#e8ff83}
*{box-sizing:border-box}
/* the whole game fits one screen: header, lane, scorecard and buttons, with no scrolling */
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{margin:0;padding:calc(8px + env(safe-area-inset-top)) 10px calc(8px + env(safe-area-inset-bottom));background:radial-gradient(ellipse at top,#332449,#101229 70%);height:100dvh}
main{max-width:580px;height:100%;margin:auto;display:flex;flex-direction:column;gap:5px}.top{display:flex;justify-content:space-between;align-items:end;gap:10px;flex:none}
.kicker{font-size:.65rem;letter-spacing:.17em;font-weight:900;text-transform:uppercase;color:#bbb4dc}h1{font-size:clamp(1.5rem,min(7vw,5dvh),3rem);line-height:.9;letter-spacing:-.075em;margin:3px 0}h1 span{color:var(--accent)}
button,a.button{font:inherit;font-weight:850;background:#262841;color:white;border:1px solid #575673;border-radius:9px;min-height:44px;padding:7px 11px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;text-align:center}
button.primary{background:var(--accent);border-color:var(--accent);color:#1d2131}button:disabled{opacity:.52;cursor:default}button:focus-visible,a:focus-visible{outline:2px solid #fff;outline-offset:2px}
/* the lane area takes whatever height is left; the canvas inside keeps a fixed shape and is centred */
.arena{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#lane{display:block;border:1px solid #646385;border-radius:15px;background:#221a38;touch-action:none;user-select:none}
.status{flex:none;min-height:1.5em;margin:0 1px;font-size:.81rem;color:#ebe2ff;font-weight:750}.stage{font-weight:850;color:var(--accent);font-size:.75rem;text-align:right}
.controls{display:grid;grid-template-columns:48px 1fr 48px;gap:6px}.controls button{touch-action:manipulation}.controls .primary{font-size:1.04rem}
#rollOptions{margin-top:0}#rollOptions button[aria-pressed="true"]{background:#343d42;border-color:var(--accent);color:var(--accent)}
.score{flex:none;display:grid;grid-template-columns:repeat(9,minmax(0,1fr)) minmax(0,1.5fr);gap:2px;margin:0;text-align:center}
.controls,#rollOptions{flex:none}
.frame{background:#242439;border:1px solid #424464;border-radius:5px;padding:3px 1px;min-width:0}
.frame.now{border-color:var(--accent);background:#32394b}.frame small,.frame strong{display:block}.frame small{font-size:.62rem;color:#c9bfdc}.frame strong{font-size:.69rem;white-space:nowrap;min-height:1.2em}.frame .total{color:var(--accent);font-size:.68rem}.frame .bank-bonus{color:#ffd25d}
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#14142ad9;padding:10px}
.panel{width:min(100%,410px);max-height:100%;overflow:auto;background:#25233e;border:1px solid #6d658a;border-radius:13px;padding:13px}
h2{margin:3px 0;font-size:1.55rem;letter-spacing:-.04em}.panel p{font-size:.88rem;line-height:1.35;margin:6px 0 10px;color:#dfd9f1}
.worlds{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:9px 0}.worlds button{display:grid;justify-items:start;align-content:center;text-align:left;min-height:50px}
.worlds small{font-size:.67rem;color:#d2c9e8}.actions{display:flex;flex-wrap:wrap;gap:6px}.actions>*{flex:1;font-size:.76rem}
.help{display:grid;gap:6px;margin:8px 0}.help div{background:#171832;border-radius:8px;padding:7px 9px;font-size:.83rem}.help b{color:var(--accent)}
#howCv{width:100%;height:130px;display:block;border-radius:10px;background:#171832;border:1px solid #424464;margin:6px 0}
.how{list-style:none;padding:0;margin:6px 0;display:grid;gap:5px;text-align:left}.how li{font-size:.86rem;line-height:1.3;padding:6px 9px;background:#171832;border-radius:8px}
.how b{color:var(--accent)}.how b.r{color:#ff8f9f}.how b.y{color:#ffd25d}
.dots{display:flex;justify-content:center;gap:6px;margin:6px 0 8px}.dots i{width:7px;height:7px;border-radius:50%;background:#424464}.dots i.on{background:var(--accent)}
.topRight{display:flex;align-items:center;gap:8px}#fsBtn{min-width:44px;padding:4px 8px}
#fsSheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:#04071099;padding:12px}
#fsSheet .box{width:100%;max-width:420px;background:#25233e;border:1px solid #6d658a;border-radius:16px;padding:16px 14px calc(14px + env(safe-area-inset-bottom))}
#fsSheet h3{font-size:1.2rem;margin:0 0 4px}#fsSheet p{font-size:.86rem;line-height:1.4;color:#dfd9f1;margin:4px 0 8px}
#fsSheet ol{margin:0 0 10px;padding:0;list-style:none;display:grid;gap:8px}
#fsSheet li{background:#171832;border-radius:10px;padding:8px 10px;font-size:.88rem;line-height:1.35}#fsSheet li b{color:var(--accent)}
#fsSheet button{width:100%}
/* big view (phones that can't go full screen): drop the title so the lane gets the room */
body.bigView .top>div:first-child{display:none}body.bigView .top{justify-content:flex-end}body.bigView main{gap:4px}
[hidden]{display:none!important}
@media(max-width:360px){body{padding:7px}.panel{padding:9px}.frame strong{font-size:.62rem}}

<style id="arcade-menu-styles">

#panel.arcade-panel button small {

}
#panel.arcade-panel > :is(button, a) { margin: 8px 0 0; }
#panel.arcade-panel :is(.actions, .choices, .menu-actions, .stage-list, .worlds) { gap: 8px; margin: 8px 0; }
#panel.arcade-panel :is(.actions, .choices, .menu-actions, .stage-list, .worlds) {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
}
#panel.arcade-panel :is(.choices, .stage-list) button:not(.arcade-stage) { display: block; }
#panel.arcade-panel :is(.choices, .stage-list, .worlds).arcade-stages { grid-template-columns: 1fr; }

  gap: 12px;
  text-align: left;
}
.arcade-stage > span:last-child { min-width: 0; }
.arcade-planet {
  --planet: #90e4ff;
  --shade: #23436e;
  position: relative;
  display: grid;
  place-items: center;
  width: 50px;
  height: 50px;
  flex: 0 0 50px;
  border-radius: 10px;

    radial-gradient(circle at 85% 72%, #acb6dc 0 1px, transparent 2px), #0d1331;
}

  content: "";

  height: 29px;
  border-radius: 50%;

    radial-gradient(circle at 32% 34%, var(--planet), var(--shade) 76%);

}
.arcade-planet[data-world="1"] { --planet: #f6cc9d; --shade: #874265; }
.arcade-planet[data-world="2"] { --planet: #ff9276; --shade: #70283d; }
.arcade-planet[data-world="3"] { --planet: #92efb3; --shade: #2552a0; }

  display: block;

  height: clamp(75px, 22dvh, 145px);
  border-radius: 12px;
  background: radial-gradient(ellipse at 50% 80%, #272759, #0b1231 70%);
}
#panel .match-options { text-align: left; margin: 10px 0; }

#panel .match-options button[data-act="bowl"] { margin-top: 8px; }

#panel.arcade-panel .lane-options button[aria-pressed="true"] { background: #1d4a3a; border-color: #62c594; }
#panel #ballSelect {
  display: block; width: 100%; min-height: 48px; padding: 8px 11px; border: 1px solid #33336e;
  border-radius: 12px; background: #22225a; color: #eef0ff; font: 800 16px system-ui, sans-serif;
}
#panel :is(#ballDetails, #laneDetails) { margin: 5px 0 0; font-size: 13px; }

#panel > .arcade-footer { margin-top: 8px; }

  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
#panel.arcade-panel .arcade-footer > * {

  flex: 1 1 135px;
  margin: 0;

/* The phone menu has its own backdrop and keeps its actions outside scrolling lists. */
@media (max-width: 520px), (max-height: 500px) and (pointer: coarse) {
  .arcade-menu {
    box-sizing: border-box;
    bottom: auto;
    height: 100vh;
    height: 100dvh;
    padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right))
      max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
    background: radial-gradient(ellipse at 50% 18%, #20214a, #090c24 74%);
    -webkit-text-size-adjust: 100%;
  }

  #panel.arcade-panel p { font-size: 14px; }
  #panel.arcade-panel button,

}
@media (max-height: 500px) and (pointer: coarse) {
  #panel.arcade-panel { width: min(100%, 580px); padding: 12px; }

    display: grid;

    align-items: center;
    column-gap: 14px;
  }
  #panel.arcade-panel > .arcade-hero {
    grid-row: 1 / 7;

  }
  #panel.arcade-panel:has(> .arcade-hero) > :not(.arcade-hero) { grid-column: 2; }
  #panel.arcade-panel h1 { font-size: clamp(26px, 6dvh + 12px, 36px); }
  #panel.arcade-panel p { margin: 4px 0 7px; }
  #panel.arcade-panel > :is(button, a) { margin-top: 6px; }
  #panel.arcade-panel :is(.actions, .choices, .menu-actions) { margin: 6px 0; }
  #panel.arcade-panel .arcade-stages { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  #panel.arcade-panel button.arcade-stage { gap: 9px; padding: 7px 10px; }

  #panel.arcade-panel .arcade-planet::after { width: 25px; height: 25px; }

  #panel #laneDetails { font-size: 12px; }
}
</style>

<body><main>
<header class="top"><div><div class="kicker">Alien Arcade · Ten-pin</div><h1>Alien <span>Bowling</span></h1></div><div class="topRight"><span class="stage" id="stage"></span><button id="fsBtn" type="button" aria-label="Full screen" aria-pressed="false" hidden></button></div></header>
<div class="arena"><canvas id="lane" aria-label="Bowling lane and alien pins"></canvas>
<section class="overlay arcade-menu" id="overlay" aria-label="Game menu"><div class="panel arcade-panel" id="panel" style="--menu-accent:#e8ff83"></div></section></div>
<div class="score" id="score" aria-label="Ten-frame scorecard"></div>
<p class="status" id="status" role="status"></p>
<div class="controls" id="controls" hidden><button data-act="left" aria-label="Move ball left">◀</button><button class="primary" data-act="roll">ROLL · SPACE</button><button data-act="right" aria-label="Move ball right">▶</button></div>
<div class="actions" id="rollOptions" hidden>
  <button data-act="hookLeft" aria-pressed="false">↶ Hook left</button>
  <button data-act="straight" aria-pressed="true">↑ Straight</button>
  <button data-act="hookRight" aria-pressed="false">↷ Hook right</button>
  <button data-act="pause">Pause</button>
</div>
</main><script>
"use strict";
const $=id=>document.getElementById(id), cv=$("lane"), ctx=cv.getContext("2d");
const PI=Math.PI, TAU=2*PI, clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

  function shade(hex, f) { const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255; const m = f < 0 ? 0 : 255, a = Math.abs(f);
    r = Math.round(r + (m - r) * a); g = Math.round(g + (m - g) * a); b = Math.round(b + (m - b) * a); return `rgb(${r},${g},${b})`; }
  const circle = (c, x, y, r) => { c.beginPath(); c.arc(x, y, r, 0, TAU); };
  const oval = (c, x, y, rx, ry, rot = 0) => { c.beginPath(); c.ellipse(x, y, rx, ry, rot, 0, TAU); };
  function shadow(c, s, y = 1.0, w = 0.9) { c.fillStyle = "rgba(0,0,0,0.35)"; oval(c, 0, s * y, s * w, s * 0.22); c.fill(); }
  function eye(c, x, y, r, pupil = "#10131f", lx = 0.25, ly = 0) {
    c.fillStyle = "#ffffff"; circle(c, x, y, r); c.fill();
    c.fillStyle = pupil; circle(c, x + r * lx, y + r * ly, r * 0.52); c.fill();
    c.fillStyle = "#ffffff"; circle(c, x + r * lx - r * 0.18, y + r * ly - r * 0.2, r * 0.16); c.fill();
  }
  const G = "#5dff9b", Y = "#ffe35d", P = "#ff8bd0", B = "#7ab8ff", O = "#ff8f5d", R = "#ff5d7a";
  const list = [
    { id: "blip", name: "Blip", color: G, fit: 1, desc: "One-eyed blob that bounces along, antennae bobbing.",
      draw(c, t, s, hit = 0) {
        const b = Math.sin(t * 8); c.translate(0, s * 0.1); c.scale(1 - 0.06 * b, 1 + 0.08 * b);
        c.fillStyle = shade(G, -0.4); oval(c, -s * 0.4, s * 0.75, s * 0.25, s * 0.13); c.fill(); oval(c, s * 0.4, s * 0.75, s * 0.25, s * 0.13); c.fill();
        c.strokeStyle = shade(G, -0.2); c.lineWidth = s * 0.08; c.lineCap = "round";
        for (const sd of [-1, 1]) { const tx = sd * s * (0.5 + 0.06 * Math.sin(t * 5 + sd));
          c.beginPath(); c.moveTo(sd * s * 0.25, -s * 0.7); c.quadraticCurveTo(sd * s * 0.35, -s * 1.05, tx, -s * 1.2); c.stroke();
          c.fillStyle = "#fff7a0"; circle(c, tx, -s * 1.2, s * 0.1); c.fill(); }
        c.fillStyle = G; c.beginPath(); c.moveTo(-s * 0.85, s * 0.7);
        c.bezierCurveTo(-s * 1.0, -s * 0.3, -s * 0.5, -s * 0.85, 0, -s * 0.85); c.bezierCurveTo(s * 0.5, -s * 0.85, s * 1.0, -s * 0.3, s * 0.85, s * 0.7); c.closePath(); c.fill();
        c.fillStyle = shade(G, 0.4); oval(c, -s * 0.4, -s * 0.38, s * 0.18, s * 0.09, -0.6); c.fill();
        if (hit > 0.15 || Math.sin(t * 1.3) > 0.97) { c.strokeStyle = "#10261a"; c.lineWidth = s * 0.07; c.beginPath(); c.moveTo(-s * 0.3, -s * 0.15); c.lineTo(s * 0.3, -s * 0.15); c.stroke(); }
        else eye(c, 0, -s * 0.15, s * 0.36, "#10261a", 0.25, 0.05);
        c.strokeStyle = "#10261a"; c.lineWidth = s * 0.06; c.beginPath(); c.arc(0, s * 0.3, s * 0.15, 0.2, Math.PI - 0.2); c.stroke();
      } },
    { id: "runner", name: "Runner", color: Y, fit: 1, desc: "Skinny legs, wobbly eye stalks, always in a hurry.",
      draw(c, t, s) {
        c.translate(0, -s * 0.1);
        c.strokeStyle = "rgba(255,227,93,0.35)"; c.lineWidth = s * 0.07; c.lineCap = "round";
        for (let k = 0; k < 3; k++) { const y = -s * 0.3 + k * s * 0.3; c.beginPath(); c.moveTo(-s * 0.7, y); c.lineTo(-s * (1.05 + 0.2 * Math.sin(t * 20 + k)), y); c.stroke(); }
        c.strokeStyle = shade(Y, -0.4); c.lineWidth = s * 0.12;
        for (const ph of [0, Math.PI]) { const a = t * 16 + ph, fx = Math.sin(a) * s * 0.5, fy = s * 1.0 - Math.max(0, Math.cos(a)) * s * 0.3;

        c.strokeStyle = shade(Y, -0.2); c.lineWidth = s * 0.08;
        for (const [ex, ey, ph] of [[s * 0.1, -s * 0.95, 0], [s * 0.5, -s * 0.85, 1.5]]) { const w = Math.sin(t * 6 + ph) * s * 0.06;
          c.beginPath(); c.moveTo(s * 0.15, -s * 0.35); c.quadraticCurveTo(ex - s * 0.1, ey + s * 0.3, ex + w, ey); c.stroke();

  p.down=true;p.fall=0;p.act=null;p.spin=p.vx*2.2+(p.homeX<=0?-1:1)*3;hitCount++;
  if(hitCount<=3&&Math.random()<.55)speak(p,nextLine(OUCH),1.4,"ouch");else if(hitCount<=6)voice(p.id,"ouch",1);
  if(hitCount<6)playSound(185+hitCount*45,.08,"triangle");
}
function collide(a,b,ra,rb,ma,mb){
  const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy), min=ra+rb;
  if(d>=min||d<1e-6)return;
  if(a===ball)ball.touchedPin=true;
  const nx=dx/d,ny=dy/d, over=min-d, mass=ma+mb;
  a.x-=nx*over*mb/mass;a.y-=ny*over*mb/mass;b.x+=nx*over*ma/mass;b.y+=ny*over*ma/mass;
  const toward=(a.vx-b.vx)*nx+(a.vy-b.vy)*ny;
  if(toward<=0)return;
  const impact=toward*1.74/mass;
  a.vx-=impact*nx*mb;a.vy-=impact*ny*mb;b.vx+=impact*nx*ma;b.vy+=impact*ny*ma;
  if(a!==ball&&Math.hypot(a.vx,a.vy)>PIN_TIP_SPEED)knock(a);
  if(Math.hypot(b.vx,b.vy)>PIN_TIP_SPEED)knock(b);
}
const gravityWellX=()=>frame%2?-.68:.68;
function update(dt){
  if(state==="pause"||state==="result")return;
  time+=dt;
  reactions(dt);
  if(state==="aim")moveHecklers();
  if(state==="settle"){
    if((rollTime+=dt)>1.6)advance(); // long enough to hear them gloat (or groan)
    return;
  }
  if(state!=="roll")return;
  rollTime+=dt;
  const kind=lane().kind;
  if(!ball.gutter&&ball.y<13.65){
    if(ball.y>5&&ball.y<11){
      if(kind==="gravity"){
        const pull=Math.sin((ball.y-5)/6*Math.PI);
        ball.vx+=dt*3.5*pull*clamp(gravityWellX()-ball.x,-1,1);
      }else if(obstacleOn()){
        if(kind==="ice")ball.vx+=dt*(frame%2?-.52:.52);
        if(kind==="wind")ball.vx+=dt*1.5*Math.sin(time*2.1);
      }
    }
    laneEvents().forEach((o,i)=>{
      if(ball.bumped.has(i)||Math.hypot(ball.x-o.x,ball.y-o.y)>o.r+BALL_R)return;
      ball.bumped.add(i);ball.vx+=(ball.x<o.x?-1:1)*1.35;ball.vy*=.89;
      hitMessage=kind==="crystal"?"Crystal ricochet!":"Saucer deflection!";setStatus(hitMessage);playSound(410,.17,"triangle");
    });
  }
  if(!ball.gutter&&ball.y<HOOK_START+HOOK_DISTANCE&&ball.hook){
    const bend=2*ball.hook*hookProgress(ball.y)*ball.vy/HOOK_DISTANCE;
    ball.vx+=bend-ball.hookVelocity;
    ball.hookVelocity=bend;
  }
  ball.spin=(ball.spin+Math.hypot(ball.vx,ball.vy)*dt/BALL_R)%TAU;
  ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;
  if(kind==="rails"&&!ball.gutter&&Math.abs(ball.x)>HALF_LANE&&ball.y<FINISH_Y){
    const side=Math.sign(ball.x);
    ball.x=side*Math.max(0,2*HALF_LANE-Math.abs(ball.x));
    ball.vx=-side*Math.abs(ball.vx)*1.7;
    if(!ball.touchedPin)ball.banked=true;
    setStatus("Bumper bank!");playSound(330,.09,"triangle");
  }else if(!ball.gutter&&Math.abs(ball.x)>HALF_LANE&&ball.y<FINISH_Y){
    ball.gutter=true;ball.x=Math.sign(ball.x)*1.27;ball.vx=0;
    // The ball can leave the lane behind the pins or after a ricochet.
    ball.earlyGutter=!ball.touchedPin&&ball.y<DECK;
    if(ball.earlyGutter){
      hitMessage="Gutter ball";setStatus(hitMessage);playSound(95,.19,"triangle");
      bubbles=[];laughAt(GUTTER_LINES);
    }
  }
  if(ball.gutter)ball.x=Math.sign(ball.x)*1.27; // a gutter ball stays in its gutter
  for(const p of pins)if(!ball.gutter&&ball.y<FINISH_Y)collide(ball,p,BALL_R,PIN_R,BALL_MASS*myBall().mass,1);
  for(let i=0;i<pins.length;i++){
    const p=pins[i];
    p.x+=p.vx*dt;p.y+=p.vy*dt;
    // pins can tumble into the gutters but bounce off the side walls beyond them, and drop into the pit at the back
    const edge=1.34-PIN_R;
    if(Math.abs(p.x)>edge){p.x=Math.sign(p.x)*edge;p.vx=-p.vx*.45;}
    if(p.y>17.25){p.y=17.25;p.vy=0;p.vx*=.5;}
    if(p.y<13.6){p.y=13.6;p.vy=Math.abs(p.vy)*.3;}
    p.vx*=Math.exp(-dt*2.5);p.vy*=Math.exp(-dt*2.5);p.angle+=p.spin*dt;p.spin*=Math.exp(-dt*3);
    if(!p.down&&(Math.abs(p.x-p.homeX)>.22||Math.abs(p.y-p.homeY)>.25))knock(p);
    for(let j=i+1;j<pins.length;j++)collide(p,pins[j],PIN_R,PIN_R,1,1);
  }
  const ballDone=ball.y>FINISH_Y||(rollTime>2&&Math.hypot(ball.vx,ball.vy)<.24);
  if(rollTime>3.65||(ballDone&&pins.every(p=>Math.hypot(p.vx,p.vy)<.23)))finishRoll();
}
let rackAfterRoll=false, endAfterRoll=false;
function finishRoll(){
  if(spareLane()){
    const cleared=pins.every(p=>p.down);
    rolls().push(Number(cleared));
    rackAfterRoll=endAfterRoll=true;
    hitMessage=cleared?"SPARE RESCUED!":hitCount?"Not quite cleared":"Missed the spare";
    setStatus(hitMessage);
    if(cleared)playSound(550,.27,"sine",820);
    state="settle";rollTime=0;paintScore();
    return;
  }
  const r=rolls();r.push(hitCount);
  const sum=r[0]+(r[1]??0);
  if(frame<9){
    endAfterRoll=r[0]===10||r.length===2;rackAfterRoll=endAfterRoll;
  }else{
    endAfterRoll=r.length===3||(r.length===2&&r[0]!==10&&sum<10);
    rackAfterRoll=r.length===1&&r[0]===10||r.length===2&&((r[0]===10&&r[1]===10)||(r[0]!==10&&sum===10));
  }
  const strike=hitCount===10, spare=r.length===2&&r[0]!==10&&sum===10;
  const bankStrike=strike&&ball.banked;
  if(bankStrike)bankBonuses[frame]+=BANK_BONUS;
  hitMessage=bankStrike?`BANK STRIKE! +${BANK_BONUS}`:strike?"STRIKE!":spare?"SPARE!":hitCount?`${hitCount} DOWN`:ball.earlyGutter?"GUTTER BALL":"MISS!";
  setStatus(hitMessage);if(strike||spare)playSound(strike?630:500,.27,"sine",820);
  const up=pins.filter(p=>!p.down),downs=pins.filter(p=>p.down);
  if(!ball.earlyGutter||hitCount>0){
    bubbles=[];
    if(strike||spare){
      if(downs.length)speak(pick(downs),nextLine(strike?STRIKE_LINES:SPARE_LINES),2);
    }else if(hitCount===0)laughAt(MISS);
    else if(up.length===1)speak(up[0],nextLine(LONE_PIN),2);
    else if(up.length)speak(pick(up),nextLine(hitCount<=3?LIGHT_HIT:hitCount<=7?SOLID_HIT:CLOSE_HIT),2);
  }
  state="settle";rollTime=0;paintScore();
}
function advance(){
  if(endAfterRoll&&frame===9){result();return;}
  if(endAfterRoll)frame++;
  if(rackAfterRoll)rack(true);
  else{ // the knocked-down aliens are swept away; the ones still up shuffle back to their spots
    pins=pins.filter(p=>!p.down);
    for(const p of pins)Object.assign(p,{vx:0,vy:0,angle:0,spin:0,walk:{x0:p.x,y0:p.y,t:0}});
  }
  ready();
}
function result(){
  state="result";paintScore();
  const score=matchTotals()[9], old=laneBest(worldIndex,laneIndex), medal=stars(worldIndex,score,laneIndex);
  const bankBonus=bankBonuses.reduce((total,value)=>total+value,0);
  if(score>old){
    if(laneIndex===0){
      records[worldIndex]=score;
      try{localStorage.setItem(STORAGE,JSON.stringify(records));}catch{}
    }else{
      laneRecords[worldIndex][laneIndex]=score;
      try{localStorage.setItem(LANE_STORAGE,JSON.stringify(laneRecords));}catch{}
    }
  }
  const next=worldIndex+1, canAdvance=next<WORLDS.length&&isOpen(next);
  showMenu(`<div class="kicker">${world().name} · ${LANES[laneIndex].name}</div><h2>${spareLane()?`${score}/10 spares rescued`:`${score} points`}</h2>
    ${bankBonus?`<p>Includes +${bankBonus} from bank strikes.</p>`:""}
    <p><span class="stars">${starText(medal)}</span> · ${score>old?"New lane best!":`Lane best ${old}${spareLane()?"/10":""}`}</p>
    <p>${canAdvance?`${WORLDS[next].name} is open.`:next<WORLDS.length?`Score ${world().unlock} on the Original lane to unlock ${WORLDS[next].name}.`:"You reached the Earth finals."}</p>
    <div class="actions">${canAdvance?`<button class="primary" data-act="world" data-index="${next}">Next world</button>`:""}<button ${canAdvance ? "" : 'class="primary"'} data-act="retry">Bowl again</button>
    <button data-act="setup">Change lane or ball</button><button data-act="worlds">All worlds</button></div>`);

}
function pause(){
  if(!["aim","roll","settle"].includes(state))return;
  resumeState=state;state="pause";gesture=null;
  showMenu('<div class="kicker">Alien Bowling</div><h2>Paused</h2><div class="actions"><button class="primary" data-act="resume">Resume</button><button data-act="retry">Restart</button><button data-act="worlds">All worlds</button>'+soundButton()+'</div>');
}
// The camera: the long approach is squeezed and the pin deck (past DECK) is stretched out,
// so the lane feels shorter and the aliens at the end are big enough to see what they're up to.
// A real lane is long and skinny (about 17 times longer than wide), so it's drawn narrow and tapering hard into the distance.
const DECK=13.5, DECK_STRETCH=1.7, LANE_END=DECK+(17.8-DECK)*DECK_STRETCH;
function project(x,y){
  const d=y<DECK?y:DECK+(y-DECK)*DECK_STRETCH, u=clamp(d/LANE_END,-.05,1.2);
  return {x:width/2+x*width*(.27-.13*u),y:height*(.95-.62*u),scale:1-.13/.27*u}; // things shrink exactly as fast as the lane narrows

function polygon(points,color){

function strip(left,right,near,far,color){polygon([[left,near],[right,near],[right,far],[left,far]],color);}
function circle(x,y,r,color){

function paintLane(){

    ctx.fillStyle=i%5?"#f6eeff7a":"#fff5dc";ctx.fillRect((i*107+29)%width,(i*39+11)%(height*.34),i%5?1:2,1);
  }

  moon.addColorStop(0,"#fff9c4");moon.addColorStop(1,w.ground);
  circle(width*.81,height*.14,height*.084,moon);

    const x=i*width/8, y=height*(.31+.036*Math.sin(i*4));
    ctx.fillStyle=w.sky;ctx.beginPath();ctx.moveTo(x-width*.12,height*.46);ctx.lineTo(x,y);
    ctx.lineTo(x+width*.13,height*.46);ctx.fill();

  strip(-1.35,1.35,16.75,17.48,"#121729");
  strip(-HALF_LANE,HALF_LANE,.18,.28,"#f9e8d2");

const pinSize=p=>clamp(width*.058,15,30)*project(p.homeX,p.homeY).scale; // body radius of an alien pin on screen
function paintStar(x,y,r){
  ctx.fillStyle="#ffd25d";ctx.beginPath();

// each pin is a whole alien standing on the deck: it bobs, taunts, panics, laughs, and falls over when hit
function paintAlien(p){

  ctx.fillStyle="#1a12286b";ctx.beginPath();ctx.ellipse(pt.x,pt.y,s*.85,s*.26,0,0,TAU);ctx.fill();

    ctx.translate(pt.x,pt.y-s*.4);ctx.rotate(side*PI/2*p.fall+p.angle*.15);
    CHARS.draw(ctx,p.id,0,0,s,t,0,0,1);

  else if(p.act==="wave"){tilt=Math.sin(k*8)*.25;dx=Math.sin(k*8)*s*.15;}

function paintBubbles(){
  ctx.font="800 12px system-ui";ctx.textAlign="center";ctx.textBaseline="middle";

    if(!pins.includes(b.pin))continue;

    const hx=pt.x,hy=pt.y-(p.down?s*1.5:s*2.3);
    const bx=clamp(hx-w/2,4,width-w-4);let by=Math.max(4,hy-h-10);
    for(const q of placed)if(bx<q.x+q.w&&bx+w>q.x&&by<q.y+h+4&&by+h+4>q.y)by=Math.max(4,q.y-h-6); // don't cover another bubble

    ctx.fillStyle="#fffbe8";ctx.beginPath();ctx.roundRect(bx,by,w,h,9);ctx.fill();

function paintObstacle(o){

    polygon([[o.x-.20,o.y],[o.x,o.y+.58],[o.x+.20,o.y],[o.x,o.y-.25]],"#ffe0a1");
    polygon([[o.x,o.y+.58],[o.x+.20,o.y],[o.x,o.y-.25]],"#ea6175");

    ctx.fillStyle="#82eeec";ctx.beginPath();ctx.ellipse(p.x,p.y,r,r*.43,0,0,TAU);ctx.fill();

function paintBall(x,y,spin=0){

// The lane is always drawn at the same shape (LANE_ASPECT = width / height) so it looks right on every screen:
// the canvas is made as big as fits in the space left over, and centred.
const LANE_ASPECT=.72;
function resize(){

  let w=box.width,h=box.height;

  width=Math.floor(w);height=Math.floor(h);ratio=Math.min(2,window.devicePixelRatio||1);
  cv.style.width=width+"px";cv.style.height=height+"px";
  cv.width=Math.round(width*ratio);cv.height=Math.round(height*ratio);
}
if(window.ResizeObserver)new ResizeObserver(resize).observe(cv.parentElement); // also refits when the buttons show or hide
function act(name,i){
  enableSound();poked();
  switch(name){
    case "worlds":worldsMenu();break;
    case "world":matchMenu(i);break;
    case "lane":
      if(state!=="setup"||!LANES[i])break;
      pendingLane=i;
      $("laneDetails").textContent=i===0?WORLDS[pendingWorld].hint:LANES[i].hint;
      for(const b of $("panel").querySelectorAll("[data-act='lane']"))b.setAttribute("aria-pressed",String(Number(b.dataset.index)===i));
      break;
    case "bowl":if(state==="setup"&&i===pendingWorld)start(i,pendingLane);break;
    case "retry":start(worldIndex,laneIndex);break;
    case "setup":matchMenu(worldIndex,laneIndex);break;
    case "help":help(clamp(i||0,0,HOWTO.length-1));break;
    case "sound":toggleSound();break;
    case "menu":title();break;
    case "left":case "right":
      if(state==="aim")position=clamp(position+(name==="left"?-.18:.18),-.72,.72);
      break;
    case "hookLeft":case "straight":case "hookRight":
      if(state==="aim"){
        hook=name==="hookLeft"?-MAX_HOOK:name==="hookRight"?MAX_HOOK:0;
        showHook();
      }
      break;
    case "roll":launch();break;
    case "pause":pause();break;
    case "resume":state=resumeState;$("overlay").hidden=true;showControls(true);break;
  }
}
cv.addEventListener("pointerdown",e=>{
  enableSound();poked();
  if(state!=="aim"||gesture||e.button!==0)return;
  gesture={id:e.pointerId,x:e.clientX,y:e.clientY,position};
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener("pointermove",e=>{
  if(state!=="aim"||gesture?.id!==e.pointerId)return;
  const dx=e.clientX-gesture.x,dy=e.clientY-gesture.y;
  if(dy< -12&&-dy>Math.abs(dx)*.65){
    gesture.preview=hookFromSwipe(dx,-dy)??hook;
    position=gesture.position;
  }else{
    gesture.preview=null;
    if(Math.abs(dx)>6&&Math.abs(dx)>=Math.abs(dy)*.65){
      position=clamp(gesture.position+dx/(width*.38),-.72,.72);
    }
  }
});
cv.addEventListener("pointerup",e=>{
  if(gesture?.id!==e.pointerId)return;
  const dx=e.clientX-gesture.x,up=gesture.y-e.clientY,startPosition=gesture.position;
  gesture=null;
  if(state==="aim"&&up>=18&&up>Math.abs(dx)*.65){
    position=startPosition;
    enableSound();
    launch(hookFromSwipe(dx,up)??hook);
  }
});
for(const event of ["pointercancel","lostpointercapture"]){
  cv.addEventListener(event,e=>{if(gesture?.id===e.pointerId)gesture=null;});
}
document.addEventListener("click",e=>{
  const button=e.target.closest("button[data-act]");
  if(button)act(button.dataset.act,Number(button.dataset.index));
});
document.addEventListener("keydown",e=>{
  poked();
  if(e.code==="Escape"){
    if(state==="pause")act("resume");else if(state==="setup")worldsMenu();else if(state==="help")title();else pause();
    return;
  }
  if(state!=="aim")return;
  const action={ArrowLeft:"left",ArrowRight:"right",Space:"roll",KeyQ:"hookLeft",KeyE:"hookRight",Digit0:"straight"}[e.code];
  if(!action)return;
  e.preventDefault();if(action!=="roll"||!e.repeat)act(action);
});
window.addEventListener("blur",pause);
window.addEventListener("resize",resize);
function animate(now){
  const dt=last?clamp((now-last)/1000,0,.06):0;last=now;
  carry+=dt;
  while(carry>=1/120){update(1/120);carry-=1/120;}
  draw();if(helpAnim)helpAnim(now/1000);requestAnimationFrame(animate);
}
// ---------- full screen (like Dr Alien). Hidden where the browser can't do it, such as iPhone Safari. ----------
(()=>{
  const btn=$("fsBtn"),root=document.documentElement,req=root.requestFullscreen||root.webkitRequestFullscreen;
  const can=!!(req&&(document.fullscreenEnabled||document.webkitFullscreenEnabled));
  const ICON=on=>`<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="${on?"M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5":"M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"}"/></svg>`;
  btn.hidden=false;
  if(!can){ // iPhone Safari can't go full screen, so the button switches to a big view instead: the title hides and the lane grows
    const standalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
    let tipShown=standalone;
    const set=on=>{document.body.classList.toggle("bigView",on);btn.innerHTML=ICON(on);btn.setAttribute("aria-label",on?"Normal view":"Big view");btn.setAttribute("aria-pressed",String(on));
      try{localStorage.setItem("alienArcade.bowling.bigView",on?"1":"0");}catch{}setTimeout(resize,60);};
    // the sheet explaining the two real ways to lose Safari's bars on an iPhone
    const sheet=()=>{
      const el=document.createElement("div");el.id="fsSheet";el.setAttribute("role","dialog");el.setAttribute("aria-modal","true");
      // every iPhone browser runs on Safari's engine, so none of them can fill the screen; the steps differ per browser
      const ua=navigator.userAgent,chrome=/CriOS/.test(ua),otherApp=/FxiOS|EdgiOS|OPiOS/.test(ua);
      const steps=chrome
        ?`<li><b>Best:</b> tap <b>Share</b> (□↑) at the right of Chrome's address bar, then <b>Add to Home Screen</b> (scroll the list down if you don't see it). Open Alien Bowling from its new icon: no bars at all.</li>
          <li>Chrome can't hide its own bars. If <b>Add to Home Screen</b> isn't in the list, update Chrome, or open this page in <b>Safari</b> and add it from there.</li>`
        :otherApp
        ?`<li><b>Best:</b> open this page in <b>Safari</b>, tap <b>Share</b> (□↑), then <b>Add to Home Screen</b>. Open Alien Bowling from its new icon: no bars at all.</li>`
        :`<li><b>Quick:</b> tap the <b>aA</b> (or ☰ page menu) at the left of the address bar, then <b>Hide Toolbar</b>. Tap the top of the screen to bring it back.</li>
          <li><b>Best:</b> tap <b>Share</b> (□↑), then <b>Add to Home Screen</b>, then open Alien Bowling from its new icon. It runs like an app with no bars at all.</li>`;
      el.innerHTML=`<div class="box"><h3>Full screen on iPhone</h3>
        <p>Apple doesn't let any iPhone browser (Safari, Chrome or others) fill the screen with a web page. Here's what works:</p>
        <ol>${steps}</ol>
        <p>I've also hidden the title so the lane gets more room. Tap the corners button again to bring it back.</p>
        <button class="primary" type="button">Got it</button></div>`;
      el.addEventListener("click",e=>{if(e.target===el||e.target.tagName==="BUTTON")el.remove();});
      document.body.appendChild(el);
    };
    btn.addEventListener("click",()=>{enableSound();const on=!document.body.classList.contains("bigView");set(on);
      if(on&&!tipShown){tipShown=true;sheet();}});
    let saved=false;try{saved=localStorage.getItem("alienArcade.bowling.bigView")==="1";}catch{}
    set(saved||standalone);return;
  }
  const isFull=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
  const sync=()=>{const on=isFull();btn.innerHTML=ICON(on);btn.setAttribute("aria-label",on?"Exit full screen":"Full screen");btn.setAttribute("aria-pressed",String(on));setTimeout(resize,120);};
  btn.addEventListener("click",()=>{enableSound();const r=isFull()?(document.exitFullscreen||document.webkitExitFullscreen).call(document):req.call(root);if(r&&r.catch)r.catch(()=>{});});
  document.addEventListener("fullscreenchange",sync);document.addEventListener("webkitfullscreenchange",sync);sync();
})();
resize();showSound();title();requestAnimationFrame(animate);
</script></body></html>
