<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#060c1c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Alien Crossing</title>
<style>
  :root { --bg: #060c1c; --panel: #0e1a30; --line: #2a3e66; --ink: #e6f0ff; --dim: #93a6c9; --good: #5dff9b; --bad: #ff5d7a; --accent: #4fd1ff; --gold: #ffd25d; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; touch-action: none; overscroll-behavior: none;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #app { height: 100%; height: 100dvh; display: flex; flex-direction: column; padding: calc(4px + env(safe-area-inset-top)) calc(4px + env(safe-area-inset-right)) calc(4px + env(safe-area-inset-bottom)) calc(4px + env(safe-area-inset-left)); gap: 4px; }
  #hud { display: flex; gap: 5px; align-items: stretch; width: 100%; max-width: 760px; margin: 0 auto; }
  .chip { background: rgba(14,26,48,0.9); border: 1px solid var(--line); border-radius: 11px; padding: 3px 8px 4px; font-weight: 800; font-size: 14px; line-height: 1.15; white-space: nowrap; }
  .chip small { display: block; font-size: 9px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--dim); font-weight: 700; }
  #hHearts { color: var(--bad); letter-spacing: -1px; } #hHearts i { color: #2a3556; font-style: normal; }
  .meter { width: 58px; height: 7px; margin-top: 4px; border-radius: 4px; background: #1a2546; overflow: hidden; }
  .meter i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #5dff9b, #ffd25d); border-radius: 4px; }
  .spacer { flex: 1; }
  .hudBtn { background: rgba(14,26,48,0.9); color: var(--ink); border: 1px solid var(--line); border-radius: 11px; font: inherit; font-weight: 900; font-size: 15px; padding: 0 10px; min-width: 40px; }
  @media (max-width: 420px) { #gemChip { display: none; } .chip { padding: 3px 6px 4px; } .meter { width: 46px; } .hudBtn { padding: 0 8px; min-width: 36px; } }
  #stage { flex: 1; min-height: 0; width: 100%; position: relative; }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; border-radius: 12px; touch-action: none; }
  #overlay { position: fixed; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center; padding: 14px; background: rgba(3,6,14,0.78); }
  #overlay.hidden { display: none; }
  #box { width: 100%; max-width: 430px; max-height: calc(100% - 16px); overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 18px 16px; text-align: center; }
  #box h1 { font-size: 42px; line-height: 1.02; background: linear-gradient(90deg, #5dff9b, #ffd25d 50%, #4fd1ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #box h2 { font-size: 26px; margin-bottom: 4px; }
  #box p { color: #d6e2f5; font-size: 15px; line-height: 1.4; margin: 6px 0 10px; }
  #box .kicker { font-size: 11px; letter-spacing: 0.13em; text-transform: uppercase; color: var(--accent); font-weight: 800; }
  #titleArt { width: 100%; height: 160px; display: block; border-radius: 12px; }
  .big { display: block; width: 100%; margin: 8px 0; padding: 13px 12px; border-radius: 12px; border: 1px solid var(--line); background: #17284a; color: var(--ink); font: inherit; font-size: 17px; font-weight: 800; text-decoration: none; }
  .big.main { background: #1d4a3a; border-color: #2f7a5c; color: var(--good); }
  .big:disabled { opacity: 0.4; }
  .big small { display: block; font-size: 12px; font-weight: 650; color: var(--dim); margin-top: 2px; }
  .row { display: flex; gap: 8px; } .row .big { flex: 1; }
  .stageCard { display: flex; align-items: center; gap: 12px; text-align: left; }
  .stageCard canvas { width: 56px; height: 56px; flex: none; border-radius: 12px; }
  .stageCard span { flex: 1; min-width: 0; }
  .levels { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 10px 0; }
  .levels .big { margin: 0; padding: 10px 0 8px; font-size: 20px; }
  .levels .big small { font-size: 11px; color: var(--gold); }
  .levels .big small i, .bigStars i { color: #2a3e66; font-style: normal; }
  .stars { color: var(--gold); }
  .bigStars { font-size: 46px; letter-spacing: 0.1em; color: var(--gold); margin: 2px 0 6px; }
  .score { font-size: 15px; color: var(--dim); font-weight: 700; }
  .facts { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin: 4px 0 8px; }
  .facts span { background: #0a1428; border: 1px solid #2a3e66; border-radius: 999px; padding: 4px 10px; font-size: 13px; font-weight: 800; color: var(--accent); }
  .chars { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0; }
  .charBtn { background: #0a1428; border: 2px solid #2a3e66; border-radius: 14px; padding: 6px 4px 8px; color: var(--ink); font: inherit; font-weight: 800; font-size: 14px; }
  .charBtn.on { border-color: var(--good); background: #10301f; }
  .charBtn canvas { width: 100%; aspect-ratio: 1; display: block; }
  #howCv { width: 100%; height: 190px; display: block; border-radius: 12px; background: #0a1428; border: 1px solid #2a3e66; margin: 6px 0 4px; }
  .how { list-style: none; margin: 10px 0 8px; display: grid; gap: 6px; text-align: left; }
  .how li { font-size: 17px; font-weight: 650; line-height: 1.3; padding: 7px 12px; background: #0a1428; border: 1px solid #2a3e66; border-radius: 10px; }
  .how b { font-weight: 900; color: #fff; } .how b.c { color: var(--accent); } .how b.y { color: var(--gold); } .how b.g { color: var(--good); } .how b.r { color: var(--bad); } .how b.p { color: #ff8bd0; }
  .dots { display: flex; justify-content: center; gap: 6px; margin: 4px 0 2px; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: #2a3e66; }
  .dots i.on { background: var(--accent); }
  #fsSheet { position: fixed; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center; background: rgba(3,6,14,0.6); padding: 12px; }
  #fsSheet .sheet { width: 100%; max-width: 420px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px 14px calc(14px + env(safe-area-inset-bottom)); text-align: left; }
  #fsSheet h3 { font-size: 19px; margin-bottom: 6px; } #fsSheet p { font-size: 14px; color: #d6e2f5; line-height: 1.4; margin: 4px 0 8px; }
  #fsSheet ol { list-style: none; display: grid; gap: 8px; margin: 0 0 10px; } #fsSheet li { background: #0a1428; border-radius: 10px; padding: 8px 10px; font-size: 14px; line-height: 1.35; } #fsSheet li b { color: var(--accent); }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="chip"><small id="hStage">Oort</small><span id="hLevel">Level 1</span></div>
    <div class="chip"><small>Shields</small><span id="hHearts">♥♥♥</span></div>
    <div class="chip"><small>Distance</small><div class="meter"><i id="hProg"></i></div></div>
    <div class="chip" id="gemChip"><small>Gems</small><span id="hGems">0</span></div>
    <div class="spacer"></div>
    <button class="hudBtn" id="fsBtn" aria-label="Full screen" aria-pressed="false"></button>
    <button class="hudBtn" id="helpBtn" aria-label="How to play">?</button>
    <button class="hudBtn" id="menuBtn">Menu</button>
  </div>
  <div id="stage"><canvas id="cv"></canvas></div>
</div>
<div id="overlay"><div id="box"></div></div>
<script>
"use strict";
// ============================================================
//  ALIEN CROSSING — hop your alien across busy space lanes to the landing pad at the top.
//  The playfield is 9 tiles wide (40 units each). Rows go upward from row 0 (start) to row N (the pad).
//  Swipe to hop (tap = hop forward). Traffic hurts, hazard rivers must be crossed on drifting platforms.
//  The view always fills the screen at the same zoom: wider screens just show more of the lanes at the sides.
// ============================================================
const $ = id => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d");
const TAU = Math.PI * 2, PI = Math.PI;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const T = 40, COLS = 9, PW = COLS * T, VIEW_H = 640;
const HOP_TIME = 0.13, MAX_HEARTS = 3, INVULN = 1.2, LEVELS = 8;
const CYCLE_MIN = 1700; // every lane's traffic loops over at least this many units, wider than any screen

// ============================================================
//  THE CAST: Stage 1 "First Contact" aliens from Alien Defense (attacker-design.html)
// ============================================================
const CHARS = (() => {
  function shade(hex, f) { const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255; const m = f < 0 ? 0 : 255, a = Math.abs(f);
    r = Math.round(r + (m - r) * a); g = Math.round(g + (m - g) * a); b = Math.round(b + (m - b) * a); return `rgb(${r},${g},${b})`; }
  const circle = (c, x, y, r) => { c.beginPath(); c.arc(x, y, r, 0, TAU); };
  const oval = (c, x, y, rx, ry, rot = 0) => { c.beginPath(); c.ellipse(x, y, rx, ry, rot, 0, TAU); };
  function shadow(c, s, y = 1.0, w = 0.9) { c.fillStyle = "rgba(0,0,0,0.35)"; oval(c, 0, s * y, s * w, s * 0.22); c.fill(); }
  function eye(c, x, y, r, pupil = "#10131f", lx = 0.25, ly = 0) {
    c.fillStyle = "#ffffff"; circle(c, x, y, r); c.fill();
    c.fillStyle = pupil; circle(c, x + r * lx, y + r * ly, r * 0.52); c.fill();
    c.fillStyle = "#ffffff"; circle(c, x + r * lx - r * 0.18, y + r * ly - r * 0.2, r * 0.16); c.fill();
  }
  const G = "#5dff9b", Y = "#ffe35d", P = "#ff8bd0", B = "#7ab8ff", O = "#ff8f5d", R = "#ff5d7a";
  const list = [
    { id: "blip", name: "Blip", color: G, fit: 1, desc: "One-eyed blob that bounces along, antennae bobbing.",
      draw(c, t, s, hit = 0) {
        const b = Math.sin(t * 8); c.translate(0, s * 0.1); c.scale(1 - 0.06 * b, 1 + 0.08 * b);
        c.fillStyle = shade(G, -0.4); oval(c, -s * 0.4, s * 0.75, s * 0.25, s * 0.13); c.fill(); oval(c, s * 0.4, s * 0.75, s * 0.25, s * 0.13); c.fill();
        c.strokeStyle = shade(G, -0.2); c.lineWidth = s * 0.08; c.lineCap = "round";
        for (const sd of [-1, 1]) { const tx = sd * s * (0.5 + 0.06 * Math.sin(t * 5 + sd));
          c.beginPath(); c.moveTo(sd * s * 0.25, -s * 0.7); c.quadraticCurveTo(sd * s * 0.35, -s * 1.05, tx, -s * 1.2); c.stroke();
          c.fillStyle = "#fff7a0"; circle(c, tx, -s * 1.2, s * 0.1); c.fill(); }
        c.fillStyle = G; c.beginPath(); c.moveTo(-s * 0.85, s * 0.7);
        c.bezierCurveTo(-s * 1.0, -s * 0.3, -s * 0.5, -s * 0.85, 0, -s * 0.85); c.bezierCurveTo(s * 0.5, -s * 0.85, s * 1.0, -s * 0.3, s * 0.85, s * 0.7); c.closePath(); c.fill();
        c.fillStyle = shade(G, 0.4); oval(c, -s * 0.4, -s * 0.38, s * 0.18, s * 0.09, -0.6); c.fill();
        if (hit > 0.15 || Math.sin(t * 1.3) > 0.97) { c.strokeStyle = "#10261a"; c.lineWidth = s * 0.07; c.beginPath(); c.moveTo(-s * 0.3, -s * 0.15); c.lineTo(s * 0.3, -s * 0.15); c.stroke(); }
        else eye(c, 0, -s * 0.15, s * 0.36, "#10261a", 0.25, 0.05);
        c.strokeStyle = "#10261a"; c.lineWidth = s * 0.06; c.beginPath(); c.arc(0, s * 0.3, s * 0.15, 0.2, Math.PI - 0.2); c.stroke();
      } },
    { id: "runner", name: "Runner", color: Y, fit: 1, desc: "Skinny legs, wobbly eye stalks, always in a hurry.",
      draw(c, t, s) {
        c.translate(0, -s * 0.1);
        c.strokeStyle = "rgba(255,227,93,0.35)"; c.lineWidth = s * 0.07; c.lineCap = "round";
        for (let k = 0; k < 3; k++) { const y = -s * 0.3 + k * s * 0.3; c.beginPath(); c.moveTo(-s * 0.7, y); c.lineTo(-s * (1.05 + 0.2 * Math.sin(t * 20 + k)), y); c.stroke(); }
        c.strokeStyle = shade(Y, -0.4); c.lineWidth = s * 0.12;
        for (const ph of [0, Math.PI]) { const a = t * 16 + ph, fx = Math.sin(a) * s * 0.5, fy = s * 1.0 - Math.max(0, Math.cos(a)) * s * 0.3;
          c.beginPath(); c.moveTo(0, s * 0.3); c.lineTo(fx * 0.5 + s * 0.1, s * 0.65); c.lineTo(fx, fy); c.stroke(); }
        c.fillStyle = Y; oval(c, s * 0.05, 0, s * 0.55, s * 0.48, 0.15); c.fill();
        c.fillStyle = shade(Y, 0.45); oval(c, -s * 0.15, -s * 0.2, s * 0.15, s * 0.08, -0.5); c.fill();
        c.strokeStyle = shade(Y, -0.2); c.lineWidth = s * 0.08;
        for (const [ex, ey, ph] of [[s * 0.1, -s * 0.95, 0], [s * 0.5, -s * 0.85, 1.5]]) { const w = Math.sin(t * 6 + ph) * s * 0.06;
          c.beginPath(); c.moveTo(s * 0.15, -s * 0.35); c.quadraticCurveTo(ex - s * 0.1, ey + s * 0.3, ex + w, ey); c.stroke();
          eye(c, ex + w, ey, s * 0.17, "#2a1a00", 0.4, 0.1); }
        c.strokeStyle = "#2a1a00"; c.lineWidth = s * 0.05; c.beginPath(); c.arc(s * 0.3, s * 0.1, s * 0.1, 0.2, Math.PI - 0.4); c.stroke();
      } },
    { id: "goo", name: "Goo", color: P, fit: 1.15, desc: "Little wobbling slime drop. Squishy and bouncy.",
      draw(c, t, s) {
        const w = Math.sin(t * 10); c.scale(1 + 0.1 * w, 1 - 0.1 * w);
        c.fillStyle = P; c.beginPath(); c.moveTo(0, -s * 1.0);
        c.bezierCurveTo(s * 0.5, -s * 0.4, s * 0.9, s * 0.1, s * 0.75, s * 0.55); c.quadraticCurveTo(0, s * 0.85, -s * 0.75, s * 0.55);
        c.bezierCurveTo(-s * 0.9, s * 0.1, -s * 0.5, -s * 0.4, 0, -s * 1.0); c.fill();
        c.fillStyle = shade(P, 0.45); oval(c, -s * 0.25, -s * 0.25, s * 0.12, s * 0.22, 0.4); c.fill();
        c.fillStyle = "#3a0a22"; circle(c, -s * 0.2, s * 0.15, s * 0.11); c.fill(); circle(c, s * 0.25, s * 0.15, s * 0.11); c.fill();
      } },
    { id: "jelly", name: "Jelly", color: B, fit: 1, desc: "Floating jellyfish that drifts along, tentacles waving.",
      draw(c, t, s, hit = 0) {
        shadow(c, s, 1.0, 0.7); c.translate(0, Math.sin(t * 2.5) * s * 0.12 - s * 0.25);
        c.strokeStyle = shade(B, 0.2); c.lineWidth = s * 0.08; c.lineCap = "round";
        for (let k = 0; k < 5; k++) { const x = -s * 0.5 + k * s * 0.25; c.beginPath(); c.moveTo(x, s * 0.1);
          c.quadraticCurveTo(x + Math.sin(t * 4 + k) * s * 0.2, s * (0.6 - hit * 0.27), x * (1 - hit * 0.4) + Math.sin(t * 4 + k + 1) * s * 0.15, s * (1 - hit * 0.57)); c.stroke(); }
        const pul = 1 + 0.06 * Math.sin(t * 5);
        const g = c.createRadialGradient(-s * 0.2, -s * 0.4, s * 0.1, 0, -s * 0.1, s * 0.8); g.addColorStop(0, shade(B, 0.55)); g.addColorStop(1, shade(B, -0.1));
        c.fillStyle = g; c.beginPath(); c.ellipse(0, 0, s * 0.75 * pul, s * 0.7 / pul, 0, Math.PI, TAU);
        c.quadraticCurveTo(s * 0.4, s * 0.25, 0, s * 0.12); c.quadraticCurveTo(-s * 0.4, s * 0.25, -s * 0.75 * pul, 0); c.fill();
        c.fillStyle = "#0d1830"; circle(c, -s * 0.2, -s * 0.25, s * 0.09); c.fill(); circle(c, s * 0.2, -s * 0.25, s * 0.09); c.fill();
      } },
    { id: "chonk", name: "Chonk", color: O, fit: 0.95, desc: "Big round three-eyed bruiser. Built like a bowling ball.",
      draw(c, t, s, hit = 0) {
        c.translate(0, -Math.abs(Math.sin(t * 3)) * s * 0.12 + s * 0.05);
        c.fillStyle = shade(O, -0.3);
        for (const sd of [-1, 1]) { oval(c, sd * s * 0.95, s * 0.05 + Math.sin(t * 3 + sd) * s * 0.08, s * 0.18, s * 0.28, sd * 0.4); c.fill(); }
        oval(c, -s * 0.45, s * 0.82, s * 0.28, s * 0.14); c.fill(); oval(c, s * 0.45, s * 0.82, s * 0.28, s * 0.14); c.fill();
        const g = c.createRadialGradient(-s * 0.3, -s * 0.4, s * 0.1, 0, 0, s); g.addColorStop(0, shade(O, 0.35)); g.addColorStop(1, shade(O, -0.15));
        c.fillStyle = g; oval(c, 0, 0, s * 0.92, s * 0.85); c.fill();
        c.fillStyle = shade(O, -0.2); circle(c, -s * 0.6, s * 0.35, s * 0.1); c.fill(); circle(c, s * 0.62, s * 0.3, s * 0.08); c.fill(); circle(c, s * 0.5, -s * 0.55, s * 0.07); c.fill();
        eye(c, -s * 0.35, -s * 0.2, s * 0.2, "#2a1205"); eye(c, s * 0.35, -s * 0.2, s * 0.2, "#2a1205"); eye(c, 0, -s * 0.52, s * 0.16, "#2a1205");
        if (hit > 0.15) { c.strokeStyle = "#3a1405"; c.lineWidth = s * 0.14; c.lineCap = "round"; c.beginPath(); c.moveTo(-s * 0.26, s * 0.38); c.quadraticCurveTo(0, s * 0.08, s * 0.26, s * 0.38); c.stroke(); }
        else { c.fillStyle = "#3a1405"; oval(c, 0, s * 0.3, s * 0.25, s * (0.1 + 0.05 * Math.sin(t * 3))); c.fill(); }
      } },
    { id: "mother", name: "Mother Blob", color: R, fit: 0.85, desc: "Huge blob covered in eyes that all look in different directions.",
      draw(c, t, s) {
        const w = Math.sin(t * 2); c.scale(1 + 0.04 * w, 1 - 0.04 * w);
        const g = c.createRadialGradient(-s * 0.3, -s * 0.35, s * 0.1, 0, 0, s * 1.05); g.addColorStop(0, shade(R, 0.35)); g.addColorStop(1, shade(R, -0.25));
        c.fillStyle = g; c.beginPath(); c.moveTo(-s * 1.05, s * 0.75);
        c.bezierCurveTo(-s * 1.2, -s * 0.4, -s * 0.6, -s * 1.0, 0, -s * 1.0); c.bezierCurveTo(s * 0.6, -s * 1.0, s * 1.2, -s * 0.4, s * 1.05, s * 0.75);
        c.quadraticCurveTo(0, s * 0.95, -s * 1.05, s * 0.75); c.fill();
        const eyes = [[0, -0.35, 0.24], [-0.5, -0.2, 0.16], [0.5, -0.2, 0.16], [-0.3, -0.7, 0.12], [0.3, -0.7, 0.12], [-0.62, 0.22, 0.1], [0.62, 0.22, 0.1]];
        eyes.forEach(([x, y, r], i) => {
          if (Math.sin(t * 1.7 + i * 1.9) > 0.95) { c.strokeStyle = "#3a0a12"; c.lineWidth = s * 0.05; c.beginPath(); c.moveTo((x - r) * s, y * s); c.lineTo((x + r) * s, y * s); c.stroke(); }
          else eye(c, x * s, y * s, r * s, "#3a0a12", Math.cos(t + i) * 0.3, Math.sin(t * 1.3 + i) * 0.3);
        });
        c.fillStyle = "#3a0a12"; oval(c, 0, s * 0.45, s * 0.35, s * 0.12); c.fill();
      } },
  ];
  return { list, shade, byId: id => list.find(ch => ch.id === id) || list[0],
    draw(c, id, x, y, s, t, hop = 0, tilt = 0, hit = 0) { const ch = this.byId(id); c.save(); c.translate(x, y - hop); c.rotate(tilt); c.scale(ch.fit, ch.fit); c.lineCap = "round"; ch.draw(c, t, s, hit); c.restore(); } };
})();

// ============================================================
//  STAGES: each world has its own kinds of lanes, and one special twist.
//  mix = how often each lane type turns up. Lane types:
//   road  = traffic (touch it and you lose a shield)       river = hazard you cross on drifting platforms
//   rail  = one very fast thing, with a warning light first ice = slippery: you slide one more tile (Oort)
//   wind  = gusts push you sideways (Jupiter)
// ============================================================
const STAGES = [
  { name: "The Oort Gate", short: "Oort", color: "#7fb8ff", sky: "#081a36", mix: { road: 0.34, river: 0.3, ice: 0.22, rail: 0.14 },
    ground: ["#3c6e94", "#33607f"], road: "#14233f", river: "#03060f", twist: "Slippery ice",
    names: { road: "comets", river: "ice floes over a space crack", rail: "meteor streaks", ice: "slippery ice" },
    intro: "Dodge <b>comets</b>, ride <b>ice floes</b> over the space crack, and watch out: <b>ice</b> makes you slide." },
  { name: "Jupiter Storm", short: "Jupiter", color: "#ffb84d", sky: "#2a1306", mix: { road: 0.3, river: 0.3, wind: 0.28, rail: 0.12 },

function closeMenu() { paused = false; menuAnim = null; menuName = ""; $("overlay").classList.add("hidden"); last = performance.now(); }
const starStr = n => "★".repeat(n) + `<i>${"★".repeat(3 - n)}</i>`;
const soundBtn = () => `<button class="big" data-act="sound">${SAVE.sound ? "🔊 Sound: On" : "🔇 Sound: Off"}</button>`;
function fitCanvas(cvs) { const w = cvs.clientWidth, h = cvs.clientHeight, d = Math.min(2, devicePixelRatio || 1);
  if (cvs.width !== Math.round(w * d)) { cvs.width = Math.round(w * d); cvs.height = Math.round(h * d); } const c = cvs.getContext("2d"); c.setTransform(d, 0, 0, d, 0, 0); return [c, w, h]; }
// a little scene for menus and demos: lanes drawn with the real lane art, in a sandbox stage
function miniScene(c, w, h, tt, stageIdx, rows, playerAt) {
  const keep = S; S = STAGES[stageIdx]; const sc = h / (rows.length * T); c.save(); c.scale(sc, sc); c.translate(w / sc / 2 - PW / 2, rows.length * T);

const demoLane = (type, speed, objs, extra = {}) => Object.assign({ type, speed, objs: objs.map(([x0, len]) => ({ x0, len, kind: 0 })), cycle: 900, t: 0, blocks: new Set(), gem: -1, rest: type === "safe" }, extra);

  if (!stageOpen(s)) { c.fillStyle = "rgba(3,6,14,0.65)"; c.fillRect(0, 0, n, n); c.font = "900 38px system-ui"; c.textAlign = "center"; c.fillText("🔒", n / 2, n / 2 + 13); }

const TITLE_ROWS = [demoLane("safe", 0, []), demoLane("road", 70, [[100, 1], [380, 2], [640, 1]]), demoLane("road", -95, [[200, 1], [520, 1]]), demoLane("safe", 0, []), demoLane("river", 45, [[150, 3], [450, 2], [700, 3]]), demoLane("goal", 0, [])];
function titleMenu() {

    <p><b>Hop</b> across busy space lanes, ride drifting platforms over hazards, and reach the <b>landing pad</b> to fly home.</p>
    ${STAGES.map((st, i) => `<button class="big stageCard" data-act="stage" data-arg="${i}" ${stageOpen(i) ? "" : "disabled"}><canvas data-stage="${i}"></canvas>
      <span>${i + 1} · ${st.name}<small>${stageOpen(i) ? `8 levels · <span class="stars">${stageStars(i)}/24 ★</span>` : `Clear ${STAGES[i - 1].short} to unlock`}</small></span></button>`).join("")}
    <button class="big" data-act="chars">Your alien: <b>${ch.name}</b> ›</button>
    <button class="big" data-act="help" data-arg="title|0">How to play</button>
    ${soundBtn()}
    <a class="big" href="../AlienGameLauncher/AlienGameLauncher.html">← Back to Alien Arcade</a>`, tt => {
      const cvs = $("titleArt"); if (!cvs) return; const [c, w, h] = fitCanvas(cvs); for (const r of TITLE_ROWS) r.t = tt;
      const k = (tt % 6) / 6, row = Math.min(5, Math.floor(k * 7)); miniScene(c, w, h, tt, 3, TITLE_ROWS, [PW / 2, row === 4 ? 4 : row === 5 ? 5 : row, Math.abs(Math.sin(tt * 7)) * 6]); }, "title");
}
function charMenu() {
  openMenu(`<p class="kicker">Choose your alien</p><h2>Who's crossing?</h2>
    <p>The First Contact crew from Alien Defense.</p>
    <div class="chars">${CHARS.list.map(ch => `<button class="charBtn ${ch.id === SAVE.char ? "on" : ""}" data-act="pick" data-arg="${ch.id}"><canvas data-char="${ch.id}"></canvas>${ch.name}</button>`).join("")}</div>
    <button class="big main" data-act="title">Done</button>`,
    tt => { for (const cvs of $("box").querySelectorAll("canvas[data-char]")) { const [c, w, h] = fitCanvas(cvs); c.clearRect(0, 0, w, h); const on = cvs.dataset.char === SAVE.char;
      CHARS.draw(c, cvs.dataset.char, w / 2, h * 0.55, w * 0.24, tt + w, on ? Math.abs(Math.sin(tt * 7)) * 8 : 0); } }, "chars");
}
function stageMenu(s) {
  const st = STAGES[s];
  openMenu(`<p class="kicker">Stage ${s + 1} of ${STAGES.length}</p><h2>${st.name}</h2>
    <p>${st.intro}</p>
    <div class="facts"><span>${st.twist}</span><span>${Object.values(st.names).slice(0, 2).join(" · ")}</span></div>
    <p class="score"><span class="stars">${stageStars(s)}/24 ★</span></p>
    <div class="levels">${Array.from({ length: LEVELS }, (_, i) => `<button class="big ${levelOpen(s, i) && !SAVE.best[s][i] ? "main" : ""}" data-act="play" data-arg="${s}|${i}" ${levelOpen(s, i) ? "" : "disabled"}>${levelOpen(s, i) ? i + 1 : "🔒"}<small>${starStr(SAVE.best[s][i])}</small></button>`).join("")}</div>
    <button class="big" data-act="title">Back</button>`, null, "stage");
}
function resultMenu() {
  if (state === "won") {
    const st = clamp(me.hearts, 1, 3);
    if (st > SAVE.best[si][li]) SAVE.best[si][li] = st; if (gems > SAVE.gems[si][li]) SAVE.gems[si][li] = gems; save();
    const next = li + 1 < LEVELS ? [si, li + 1] : si + 1 < STAGES.length && stageOpen(si + 1) ? [si + 1, 0] : null;
    openMenu(`<p class="kicker">${S.short} · Level ${li + 1}</p><h2>Made it home!</h2>
      <div class="bigStars">${starStr(st)}</div>
      <p>Shields left <b>${me.hearts}/${MAX_HEARTS}</b> · Gems <b>${gems}/${gemsTotal}</b><br>${st === 3 ? `${CHARS.byId(SAVE.char).name} didn't get a scratch!` : st === 2 ? "Cross without getting hit for three stars." : "Lose only one shield for two stars."}</p>
      <p class="score">${S.short}: <span class="stars">${stageStars(si)}/24 ★</span></p>
      ${next ? `<button class="big main" data-act="play" data-arg="${next[0]}|${next[1]}">${next[0] !== si ? `Next stage: ${STAGES[next[0]].short} ▶` : `Level ${next[1] + 1} ▶`}</button>`
        : si + 1 === STAGES.length && li + 1 === LEVELS ? `<p><b>Every crossing done!</b> Go back for any missing stars.</p>` : ""}
      <button class="big" data-act="play" data-arg="${si}|${li}">Play again</button>
      <button class="big" data-act="stage" data-arg="${si}">All levels</button>`, null, "result");
  } else {
    openMenu(`<p class="kicker">${S.short} · Level ${li + 1}</p><h2>Out of shields!</h2>
      <p>You got ${Math.round(me.best / N * 100)}% of the way. Tip: wait on a <b>safe strip</b> and watch the traffic pattern before you go.</p>
      <button class="big main" data-act="play" data-arg="${si}|${li}">Try again</button>
      <button class="big" data-act="stage" data-arg="${si}">All levels</button>`, null, "result");
  }
}
function pauseMenu() {
  openMenu(`<p class="kicker">Paused</p><h2>${S.short} · Level ${li + 1}</h2>
    <p>Shields <b>${me.hearts}/${MAX_HEARTS}</b> · Gems <b>${gems}/${gemsTotal}</b> · ${Math.round(me.best / N * 100)}% across</p>
    <button class="big main" data-act="resume">Resume ▶</button>
    <button class="big" data-act="play" data-arg="${si}|${li}">Restart level</button>
    <button class="big" data-act="help" data-arg="game|0">How to play</button>
    <button class="big" data-act="stage" data-arg="${si}">All levels</button>
    ${soundBtn()}
    <button class="big" data-act="title">Main menu</button>`, null, "pause");

// How to play: short pages with live demos
const HOWTO = [
  { title: "Hop", lines: ["<b>Swipe</b> up, down, left or right to hop one tile", "<b>Tap</b> anywhere = hop forward", "Reach the <b class='g'>landing pad</b> at the top"], demo: demoHop },
  { title: "Traffic", lines: ["Anything driving along a lane <b class='r'>hurts</b>", "Watch for gaps, then <b>go</b>", "<b class='r'>Red lights</b> flash before a super-fast one"], demo: demoTraffic },
  { title: "Hazard rivers", lines: ["You can't stand in the hazard", "<b>Ride the platforms</b>: they carry you along", "Don't get carried off the edge!"], demo: demoRiver },
  { title: "World twists", lines: ["<b class='c'>Oort ice</b>: you slide one more tile", "<b class='y'>Jupiter gusts</b>: arrows speed up, then you're blown sideways", "<b>Mars</b> sand worms · <b>Earth</b> maglev trains"], demo: demoTwists },
  { title: "Shields and stars", lines: ["You have <b class='r'>3 shields ♥</b>. Get hit = back to the last <b>safe strip</b>", "Grab <b class='y'>gems</b> and the odd <b class='r'>♥</b> on the way", "No hits = <b class='y'>★★★</b> · one hit = <b class='y'>★★</b> · made it = <b class='y'>★</b>"], demo: demoStars },
];
function helpMenu(back, page = 0) {

  openMenu(`<p class="kicker">How to play · ${page + 1} of ${HOWTO.length}</p><h2>${p.title}</h2>
    <canvas id="howCv"></canvas><ul class="how">${p.lines.map(l => `<li>${l}</li>`).join("")}</ul>
    <div class="dots">${HOWTO.map((_, k) => `<i class="${k === page ? "on" : ""}"></i>`).join("")}</div>
    <div class="row">${page ? `<button class="big" data-act="help" data-arg="${back}|${page - 1}">◀ Back</button>` : `<button class="big" data-act="${done}">${first ? "Skip" : "Close"}</button>`}
      ${lastPage ? `<button class="big main" data-act="${done}">${first ? "Let's go ▶" : "Done"}</button>` : `<button class="big main" data-act="help" data-arg="${back}|${page + 1}">Next ▶</button>`}</div>`,
    tt => { const cvs = $("howCv"); if (!cvs) return; const [c, w, h] = fitCanvas(cvs); c.fillStyle = "#0a1428"; c.fillRect(0, 0, w, h); p.demo(c, tt, w, h); }, "help");

function label(c, text, x, y, col) { c.fillStyle = col; c.font = "800 13px system-ui"; c.textAlign = "center"; c.fillText(text, x, y); c.lineWidth = 3; }

const TRAFFIC_ROWS = [demoLane("safe", 0, []), demoLane("road", 90, [[100, 1], [420, 2], [700, 1]]), demoLane("rail", 300, [], { len: 6, period: 4.5, phase: 0 }), demoLane("safe", 0, [])];
function demoTraffic(c, tt, w, h) { for (const r of TRAFFIC_ROWS) r.t = tt; miniScene(c, w, h, tt, 3, TRAFFIC_ROWS, [PW / 2, 0]); if (railWarn(TRAFFIC_ROWS[2])) label(c, "warning lights!", w / 2, 16, "#ff5d7a"); }
const RIVER_ROWS = [demoLane("safe", 0, []), demoLane("river", 40, [[300, 3], [560, 3], [820, 2]]), demoLane("river", -50, [[250, 2], [520, 3], [780, 2]]), demoLane("safe", 0, [])];
function demoRiver(c, tt, w, h) {

const ACT = {
  title: () => titleMenu(),
  stage: s => stageMenu(+s),
  chars: () => charMenu(),
  pick: id => { SAVE.char = id; save(); charMenu(); },
  play: a => { const [s, l] = a.split("|").map(Number); loadLevel(s, l); closeMenu(); },
  start: () => { SAVE.seenHelp = true; save(); loadLevel(0, 0); closeMenu(); },
  resume: () => closeMenu(),
  help: a => { const [back, page] = a.split("|"); helpMenu(back, +page || 0); },
  sound: () => { SAVE.sound = !SAVE.sound; save(); if (!SAVE.sound && keepAlive) keepAlive.pause(); else audio();
    for (const b of $("box").querySelectorAll("[data-act='sound']")) b.textContent = SAVE.sound ? "🔊 Sound: On" : "🔇 Sound: Off"; tone(520, 0.1, "triangle", 0.07); },
};
$("menuBtn").onclick = () => { audio(); if (state === "play" && !paused) pauseMenu(); else if (paused && menuName === "pause") closeMenu(); else titleMenu(); };
$("helpBtn").onclick = () => { audio(); helpMenu(state === "play" && !paused ? "game" : "title", 0); };

// ---------- full screen (like Dr Alien). iPhones can't, so there the button explains Add to Home Screen. ----------
(() => {
  const btn = $("fsBtn"), root = document.documentElement, req = root.requestFullscreen || root.webkitRequestFullscreen;
  const can = !!(req && (document.fullscreenEnabled || document.webkitFullscreenEnabled));
  const ICON = on => `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="${on ? "M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5" : "M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"}"/></svg>`;
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  if (!can) {
    if (standalone) { btn.hidden = true; return; }
    btn.innerHTML = ICON(false);
    btn.onclick = () => {
      const chrome = /CriOS/.test(navigator.userAgent), other = /FxiOS|EdgiOS|OPiOS/.test(navigator.userAgent), el = document.createElement("div"); el.id = "fsSheet";
      el.innerHTML = `<div class="sheet"><h3>Full screen on iPhone</h3><p>Apple doesn't let iPhone browsers fill the screen with a web page. This works:</p><ol>
        ${other ? `<li>Open this page in <b>Safari</b>, tap <b>Share</b> (□↑), then <b>Add to Home Screen</b>.</li>` : `<li>Tap <b>Share</b> (□↑)${chrome ? " at the right of the address bar" : ""}, then <b>Add to Home Screen</b>.</li>`}
        <li>Open <b>Alien Crossing</b> from its new icon: it fills the whole screen like an app.</li>
        ${!chrome && !other ? `<li>Quick option: tap <b>aA</b> in the address bar, then <b>Hide Toolbar</b>.</li>` : ""}</ol>
        <button class="big main" type="button">Got it</button></div>`;
      el.addEventListener("click", e => { if (e.target === el || e.target.tagName === "BUTTON") el.remove(); }); document.body.appendChild(el);
    };
    return;
  }
  const isFull = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
  const sync = () => { const on = isFull(); btn.innerHTML = ICON(on); btn.setAttribute("aria-label", on ? "Exit full screen" : "Full screen"); btn.setAttribute("aria-pressed", String(on)); setTimeout(resize, 120); };
  btn.onclick = () => { audio(); const r = isFull() ? (document.exitFullscreen || document.webkitExitFullscreen).call(document) : req.call(root); if (r && r.catch) r.catch(() => {}); };
  document.addEventListener("fullscreenchange", sync); document.addEventListener("webkitfullscreenchange", sync); sync();
})();

// ============================================================
//  MAIN LOOP: fixed 1/60 s steps
// ============================================================
let last = performance.now(), acc = 0;
function frame(now) {
  const dt = clamp((now - last) / 1000, 0, 0.1);
  last = now;
  acc += dt; let n = 0;
  while (acc >= 1 / 60 && n < 6) { update(1 / 60); acc -= 1 / 60; n++; }
  if (n === 6) acc = 0;
  if (menuAnim) menuAnim(now / 1000);
  draw(now / 1000);
  requestAnimationFrame(frame);
}
resize();
loadLevel(0, 0); banner = null;
if (SAVE.seenHelp) titleMenu(); else helpMenu("first", 0);
requestAnimationFrame(frame);
</script>
