<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Alien Arcade</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-title" content="Alien Arcade">
<meta name="mobile-web-app-capable" content="yes">
<style>
  :root { --bg: #070b16; --panel: #0e1530; --line: #2a3a66; --ink: #e6ecff; --dim: #8f9cc4; --good: #5dff9b; --accent: #4fd1ff; --gold: #ffd25d; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { background: var(--bg); }
  body { min-height: 100vh; color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent;
    padding: calc(18px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom)); }
  #stars { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -1; display: block; }
  main { max-width: 1040px; margin: 0 auto; }
  header { display: flex; align-items: center; gap: 14px; margin: 6px 0 22px; }
  #zib { width: 72px; height: 72px; flex: none; border-radius: 18px; background: #0d1a2c; border: 1px solid var(--line); }
  h1 { font-size: clamp(34px, 8vw, 54px); line-height: 1; letter-spacing: -0.01em;
    background: linear-gradient(90deg, #5dff9b, #4fd1ff 55%, #c77dff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  header p { color: var(--dim); font-size: 15px; margin-top: 6px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 14px; }
  .card { display: flex; flex-direction: column; background: rgba(14, 21, 48, 0.88); border: 1px solid var(--line); border-radius: 18px; overflow: hidden;
    color: inherit; text-decoration: none; transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s; }
  .card:hover, .card:focus-visible { transform: translateY(-3px); border-color: var(--c); box-shadow: 0 10px 30px -10px var(--c); outline: none; }
  .card canvas { width: 100%; height: 170px; display: block; background: #0a1024; object-fit: cover; }
  .info { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .info h2 { font-size: 21px; display: flex; align-items: center; gap: 8px; }
  .info h2 .tag { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 800; color: var(--c); border: 1px solid var(--c); border-radius: 999px; padding: 2px 7px; }
  .info p { color: #c9d3f0; font-size: 14px; line-height: 1.4; flex: 1; }
  .play { align-self: flex-start; margin-top: 4px; padding: 9px 18px; border-radius: 12px; font-weight: 800; font-size: 15px; color: #06120c; background: var(--c); }
  /* Add to Home Screen button and the how-to sheet */
  header { position: relative; }
  #install { margin-left: auto; align-self: flex-start; display: none; align-items: center; gap: 7px; padding: 9px 13px; border-radius: 12px;
    border: 1px solid #2f7a5c; background: #1d4a3a; color: var(--good); font: inherit; font-weight: 800; font-size: 14px; cursor: pointer; white-space: nowrap; }
  #install.show { display: inline-flex; }
  #install svg { width: 18px; height: 18px; }
  @media (max-width: 520px) { #install .long { display: none; } }
  #sheet { position: fixed; inset: 0; z-index: 10; display: none; align-items: flex-end; justify-content: center; background: rgba(4,7,16,0.7); padding: 12px; }
  #sheet.open { display: flex; }
  #sheet .box { width: 100%; max-width: 420px; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 18px 16px calc(16px + env(safe-area-inset-bottom)); }
  #sheet h3 { font-size: 20px; margin-bottom: 4px; }
  #sheet p { color: #c9d3f0; font-size: 14px; line-height: 1.45; }
  #sheet ol { margin: 12px 0 14px 0; padding: 0; list-style: none; display: grid; gap: 10px; }
  #sheet li { display: flex; align-items: center; gap: 12px; font-size: 15px; color: var(--ink); }
  #sheet li .n { flex: none; width: 34px; height: 34px; border-radius: 10px; background: #17224a; border: 1px solid var(--line); display: grid; place-items: center; }
  #sheet li .n svg { width: 20px; height: 20px; }
  #sheet button { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: #17224a; color: var(--ink); font: inherit; font-weight: 800; font-size: 16px; }
  footer { color: var(--dim); font-size: 13px; text-align: center; margin-top: 22px; line-height: 1.5; }
</style>
</head>
<body>
<canvas id="stars"></canvas>
<main>
  <header>
    <canvas id="zib" width="144" height="144" aria-hidden="true"></canvas>
    <div><h1>Alien Arcade</h1><p>Five games from the same galaxy. Pick one and play.</p></div>
    <button id="install" type="button" aria-label="Add Alien Arcade to your home screen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M12 7v7m-3-3 3 3 3-3"/></svg>
      <span>Add<span class="long"> to Home Screen</span></span></button>
  </header>
  <div class="grid" id="grid"></div>
  <footer id="installTip">Choose a game to play in your browser.</footer>
  <div id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="box" id="sheetBox"></div></div>
</main>
<script>
"use strict";
const TAU = Math.PI * 2, PI = Math.PI;
// All the games live in the root games folder. The launcher sits in its own AlienGameLauncher folder,
// so build each link from this page's address with everything from "/AlienGameLauncher" onward removed.
const ROOT = (() => {
  const here = location.href.split(/[?#]/)[0], cut = here.search(/\/AlienGameLauncher(\/|\.html|$)/i);
  return cut >= 0 ? here.slice(0, cut + 1) : here.slice(0, here.lastIndexOf("/") + 1); // if the launcher is in the root itself, use its folder
})();
// Bump the ?v= number on a clip after re-recording it, so browsers fetch the new file.
// The games, in the order players usually meet them. href = folder/file inside the root games folder.
const GAMES = [
  { name: "Alien Defense", tag: "Tower defense", color: "#5dff9b", href: "AlienDefense/Alien-Defense.html", film: { src: "previews/defense-sheet.jpg?v=4", n: 40, cols: 8, fw: 400, fh: 227, ms: [93,99,100,101,99,101,99,100,99,103,99,102,97,100,101,99,101,100,102,98,101,100,100,101,99,101,98,101,101,99,100,100,99,100,100,100,101,100,100,100] }, art: artDefense,
    desc: "Build a maze of towers across four worlds and stop the invading aliens before they reach your base." },
  { name: "Alien Launch", tag: "Flight", color: "#ffb84d", href: "AlienLaunch/Alien-Launch.html", art: artLaunch,
    desc: "Blast off, weave through obstacles and tunnels, grab fuel, then land softly. Every planet pulls harder." },
  { name: "Alien Landing", tag: "Traffic control", color: "#4fd1ff", href: "AlienLanding/Alien-Landing.html", film: { src: "previews/landing-sheet.jpg?v=4", n: 60, cols: 8, fw: 400, fh: 227, ms: [76,82,85,83,84,82,83,85,82,83,84,83,83,87,81,82,83,67,84,84,83,84,83,82,84,68,82,84,83,84,86,80,83,83,83,67,69,84,82,85,80,83,84,84,82,85,82,84,83,85,82,82,88,81,83,82,84,83,83,83] }, art: artLanding,
    desc: "Draw flight paths to land saucers, haulers and carrier ships on the right pads without a crash." },
  { name: "Alien Snake", tag: "Arcade", color: "#c77dff", href: "AlienSnake/Alien-Snake.html", film: { src: "previews/snake-sheet.jpg?v=4", n: 56, cols: 8, fw: 400, fh: 227, ms: [62,49,67,49,67,67,50,66,50,68,67,50,66,50,67,66,51,66,51,68,66,51,65,51,68,66,50,67,50,66,66,51,66,50,67,67,50,66,67,49,67,50,67,50,66,67,51,66,50,66,67,50,67,51,66,66] }, art: artSnake,
    desc: "Fly the rescue saucer, pick up stranded aliens and tow them home. Don't hit your own pods." },
  { name: "Dr Alien", tag: "Puzzle", color: "#ff8bd0", href: "DrAlien/Dr-Alien.html", film: { src: "previews/dralien-sheet.jpg?v=4", n: 40, cols: 8, fw: 400, fh: 227, ms: [80,101,100,100,100,106,94,100,100,100,106,95,99,101,100,100,100,100,100,100,100,101,105,95,99,101,100,104,95,99,101,100,100,100,100,101,99,100,101,101] }, art: artDrAlien,
    desc: "Drop capsules with Dr. Hive Queen and match colours to clear every spore before the lab jams." },
];

// ---------- shared little drawings ----------
function eyeAlien(c, x, y, r, col, t) { // a one-eyed alien, the series mascot
  c.fillStyle = col; c.beginPath(); c.arc(x, y, r, PI, 0); c.lineTo(x + r, y + r * 0.6); c.quadraticCurveTo(x, y + r, x - r, y + r * 0.6); c.closePath(); c.fill();
  c.strokeStyle = col; c.lineWidth = r * 0.16; c.beginPath(); c.moveTo(x, y - r * 0.9); c.lineTo(x, y - r * 1.5); c.stroke();
  c.fillStyle = "#ffd25d"; c.beginPath(); c.arc(x, y - r * 1.55, r * 0.2, 0, TAU); c.fill();
  const blink = (t + x * 0.01) % 3.2 < 0.12;
  c.fillStyle = "#fff"; c.beginPath(); c.ellipse(x, y - r * 0.1, r * 0.48, blink ? r * 0.06 : r * 0.48, 0, 0, TAU); c.fill();
  if (!blink) { c.fillStyle = "#10162c"; c.beginPath(); c.arc(x + Math.sin(t) * r * 0.12, y - r * 0.1, r * 0.22, 0, TAU); c.fill(); }
}
function saucer(c, x, y, r, t, col = "#4fd1ff") { // top-down saucer with chasing rim lights
  c.fillStyle = "rgba(0,0,0,0.3)"; c.beginPath(); c.arc(x + r * 0.15, y + r * 0.2, r, 0, TAU); c.fill();
  const g = c.createRadialGradient(x - r * 0.3, y - r * 0.3, r * 0.1, x, y, r); g.addColorStop(0, "#e8f8ff"); g.addColorStop(0.55, col); g.addColorStop(1, "#1b3a66");
  c.fillStyle = g; c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill();
  for (let k = 0; k < 8; k++) { const a = k / 8 * TAU + t * 2; c.fillStyle = (Math.floor(t * 8) + k) % 2 ? "#fff7b0" : "#ffb84d"; c.beginPath(); c.arc(x + Math.cos(a) * r * 0.78, y + Math.sin(a) * r * 0.78, r * 0.1, 0, TAU); c.fill(); }
  c.fillStyle = "#5dff9b"; c.beginPath(); c.arc(x, y, r * 0.38, 0, TAU); c.fill();
  c.fillStyle = "#fff"; c.beginPath(); c.arc(x, y, r * 0.22, 0, TAU); c.fill();
  c.fillStyle = "#10162c"; c.beginPath(); c.arc(x + r * 0.06, y, r * 0.1, 0, TAU); c.fill();
}
function sky(c, w, h, a, b, seed) {
  const g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, a); g.addColorStop(1, b); c.fillStyle = g; c.fillRect(0, 0, w, h);
  let s = seed; const R = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 40; i++) { c.fillStyle = `rgba(255,255,255,${0.2 + R() * 0.5})`; c.fillRect(R() * w, R() * h, 1.5, 1.5); }
}

// ---------- one animated preview per game ----------
function artDefense(c, w, h, t) { // a maze of towers with aliens walking the path
  sky(c, w, h, "#16263a", "#0e1828", 3);
  const cs = h / 6, cols = Math.ceil(w / cs);
  c.strokeStyle = "rgba(255,255,255,0.05)"; for (let i = 0; i <= cols; i++) { c.beginPath(); c.moveTo(i * cs, 0); c.lineTo(i * cs, h); c.stroke(); }
  for (let j = 0; j <= 6; j++) { c.beginPath(); c.moveTo(0, j * cs); c.lineTo(w, j * cs); c.stroke(); }
  const path = [[0, 1.5], [cols - 2.5, 1.5], [cols - 2.5, 4.5], [0, 4.5]].map(([x, y]) => [x * cs, y * cs]);
  c.strokeStyle = "rgba(93,255,155,0.35)"; c.lineWidth = 3; c.setLineDash([3, 7]); c.beginPath(); path.forEach(([x, y], i) => i ? c.lineTo(x, y) : c.moveTo(x, y)); c.stroke(); c.setLineDash([]);
  for (let i = 0; i < cols - 3; i += 2) for (const row of [3]) { // towers between the lanes
    const x = (i + 0.5) * cs, y = row * cs; c.fillStyle = "rgba(0,0,0,0.35)"; c.beginPath(); c.ellipse(x + 3, y + cs * 0.3, cs * 0.35, cs * 0.14, 0, 0, TAU); c.fill();
    c.fillStyle = i % 4 ? "#7a8aa8" : "#4fd1ff"; c.fillRect(x - cs * 0.22, y - cs * 0.35, cs * 0.44, cs * 0.6);
    c.fillStyle = "#c9d3e6"; c.fillRect(x - cs * 0.3, y - cs * 0.42, cs * 0.6, cs * 0.12); }
  const len = (cols - 2.5) * 2 + 3, segs = [[cols - 2.5, 0], [3, 1], [cols - 2.5, 2]];
  for (let k = 0; k < 4; k++) { // aliens marching along the path
    let d = ((t * 1.2 + k * 1.6) % len); let x, y;
    if (d < segs[0][0]) { x = d; y = 1.5; } else if ((d -= segs[0][0]) < 3) { x = cols - 2.5; y = 1.5 + d; } else { d -= 3; x = cols - 2.5 - d; y = 4.5; }
    eyeAlien(c, x * cs, y * cs + cs * 0.1, cs * 0.28, ["#5dff9b", "#ff8bd0", "#ffd25d", "#7ab8ff"][k], t + k);
  }
  c.fillStyle = "#5dff9b"; c.beginPath(); c.arc(cs * 0.3, 4.5 * cs, cs * 0.3, 0, TAU); c.fill(); // the base
}
function launchLander(c, x, y, r, ang, t, thrusting) {
  c.save(); c.translate(x, y); c.rotate(ang);
  if (thrusting) { const fl = 0.7 + 0.3 * Math.sin(t * 40); // flame
    const g = c.createLinearGradient(0, r * 0.6, 0, r * 2); g.addColorStop(0, "#fff6c0"); g.addColorStop(0.4, "#ffb84d"); g.addColorStop(1, "rgba(255,90,40,0)");
    c.fillStyle = g; c.beginPath(); c.moveTo(-r * 0.35, r * 0.6); c.quadraticCurveTo(0, r * (1.6 + fl * 0.8), r * 0.35, r * 0.6); c.fill(); }
  c.strokeStyle = "#9aa6c0"; c.lineWidth = r * 0.12; c.lineCap = "round"; // legs
  c.beginPath(); c.moveTo(-r * 0.55, r * 0.35); c.lineTo(-r * 0.95, r * 0.95); c.moveTo(r * 0.55, r * 0.35); c.lineTo(r * 0.95, r * 0.95); c.stroke();
  c.beginPath(); c.moveTo(-r * 1.15, r * 0.95); c.lineTo(-r * 0.75, r * 0.95); c.moveTo(r * 0.75, r * 0.95); c.lineTo(r * 1.15, r * 0.95); c.stroke();
  const b = c.createLinearGradient(0, -r, 0, r); b.addColorStop(0, "#e8f0ff"); b.addColorStop(0.5, "#9aa6c0"); b.addColorStop(1, "#4a5578"); // body
  c.fillStyle = b; c.beginPath(); c.ellipse(0, r * 0.25, r, r * 0.45, 0, 0, TAU); c.fill(); c.strokeStyle = "#2a3350"; c.lineWidth = r * 0.07; c.stroke();
  for (let k = -2; k <= 2; k++) { c.fillStyle = (Math.floor(t * 6) + k) % 2 ? "#ffd25d" : "#4fd1ff"; c.beginPath(); c.arc(k * r * 0.38, r * 0.32, r * 0.07, 0, TAU); c.fill(); }
  c.fillStyle = "rgba(190,235,255,0.35)"; c.beginPath(); c.arc(0, -r * 0.05, r * 0.6, PI, 0); c.fill(); // glass dome
  c.strokeStyle = "rgba(220,245,255,0.7)"; c.lineWidth = r * 0.05; c.stroke();
  c.fillStyle = "#5dff9b"; c.beginPath(); c.arc(0, r * 0.1, r * 0.4, PI, 0); c.fill(); // Zib
  c.fillStyle = "#fff"; c.beginPath(); c.arc(0, -r * 0.12, r * 0.2, 0, TAU); c.fill();
  c.fillStyle = "#10162c"; c.beginPath(); c.arc(r * 0.05, -r * 0.1 + (thrusting ? -r * 0.04 : r * 0.03), r * 0.09, 0, TAU); c.fill();
  c.strokeStyle = "#5dff9b"; c.lineWidth = r * 0.06; c.beginPath(); c.moveTo(0, -r * 0.3); c.lineTo(0, -r * 0.5); c.stroke();
  c.fillStyle = "#ffd25d"; c.beginPath(); c.arc(0, -r * 0.52, r * 0.06, 0, TAU); c.fill();
  c.restore();
}

function launchFuelCell(c, x, y, r, t) {
  c.save(); c.translate(x, y + Math.sin(t * 3) * r * 0.2);
  const pulse = 0.5 + 0.5 * Math.sin(t * 5);
  c.fillStyle = `rgba(93,255,155,${0.12 + pulse * 0.12})`; c.beginPath(); c.arc(0, 0, r * 1.9, 0, TAU); c.fill();
  c.rotate(Math.sin(t * 1.5) * 0.2);
  const g = c.createLinearGradient(-r, 0, r, 0); g.addColorStop(0, "#1f8a50"); g.addColorStop(0.5, "#8bffbf"); g.addColorStop(1, "#1f8a50");
  c.fillStyle = g; c.beginPath(); c.roundRect(-r * 0.7, -r, r * 1.4, r * 2, r * 0.45); c.fill();
  c.strokeStyle = "#e8fff2"; c.lineWidth = Math.max(1.5, r * 0.12); c.stroke();
  c.fillStyle = "#c9d3e6"; c.fillRect(-r * 0.35, -r * 1.25, r * 0.7, r * 0.28);
  c.fillStyle = "#0b3a22"; c.beginPath(); c.moveTo(r * 0.12, -r * 0.6); c.lineTo(-r * 0.3, r * 0.08); c.lineTo(0, r * 0.08); c.lineTo(-r * 0.12, r * 0.6); c.lineTo(r * 0.3, -r * 0.08); c.lineTo(0, -r * 0.08); c.closePath(); c.fill();
  c.restore();
}

function launchIceSpire(c, x, y0, y1, w, seed, top) {
  c.save();
  const g = c.createLinearGradient(x - w, 0, x + w, 0); g.addColorStop(0, "#5a8ab8"); g.addColorStop(0.5, "#e8f6ff"); g.addColorStop(1, "#4a7aa8");
  c.fillStyle = g; c.beginPath();
  const tip = top ? y1 : y0, base = top ? y0 : y1, dir = top ? 1 : -1;
  c.moveTo(x - w, base); for (let k = 0; k <= 6; k++) { const yy = base + (tip - base) * k / 6; c.lineTo(x - w * (1 - k / 7) + Math.sin(seed + k * 2) * w * 0.15, yy); }
  c.lineTo(x, tip + dir * w * 0.25); for (let k = 6; k >= 0; k--) { const yy = base + (tip - base) * k / 6; c.lineTo(x + w * (1 - k / 7) + Math.sin(seed + k * 3) * w * 0.15, yy); }
  c.closePath(); c.fill(); c.strokeStyle = "rgba(255,255,255,0.7)"; c.lineWidth = 2; c.stroke();
  c.restore();
}

function artLaunch(c, w, h, t) { // Oort Gate approach
  sky(c, w, h, "#060c1c", "#14284a", 7);
  const padX = w * 0.8, planetY = h * 0.23, planetR = h * 0.12;
  const planet = c.createRadialGradient(padX - planetR * 0.3, planetY - planetR * 0.3, planetR * 0.1, padX, planetY, planetR);
  planet.addColorStop(0, "#e8f6ff"); planet.addColorStop(1, "#6a9ac8");
  c.fillStyle = planet; c.beginPath(); c.arc(padX, planetY, planetR, 0, TAU); c.fill();

  launchIceSpire(c, w * 0.19, -4, h * 0.25, h * 0.12, 1, true);
  launchIceSpire(c, w * 0.19, h * 0.71, h + 4, h * 0.12, 4, false);

  const ground = h * 0.86, padWidth = Math.min(h * 0.35, w * 0.2);
  const terrain = c.createLinearGradient(0, ground, 0, h);
  terrain.addColorStop(0, "#bcd8f0"); terrain.addColorStop(1, "#5a7a9c");
  c.fillStyle = terrain; c.beginPath();
  c.moveTo(w * 0.56, h); c.lineTo(w * 0.58, ground + 4); c.lineTo(w * 0.65, ground - 2);
  c.lineTo(w * 0.7, ground); c.lineTo(w * 0.9, ground);
  c.lineTo(w * 0.95, ground - 3); c.lineTo(w, ground + 2); c.lineTo(w, h); c.closePath(); c.fill();

  const beamTop = h * 0.44, padLeft = padX - padWidth / 2;
  const beam = c.createLinearGradient(0, beamTop, 0, ground);
  beam.addColorStop(0, "rgba(93,255,155,0)"); beam.addColorStop(1, "rgba(93,255,155,0.28)");
  c.fillStyle = beam; c.fillRect(padLeft, beamTop, padWidth, ground - beamTop);
  c.fillStyle = "#2a3350"; c.fillRect(padLeft, ground - 3, padWidth, 8);
  c.fillStyle = "#5dff9b"; c.fillRect(padLeft, ground - 5, padWidth, 3);
  for (let k = 0; k < 5; k++) {
    c.fillStyle = Math.floor(t * 4) % 5 === k ? "#fff" : "#5dff9b";
    c.beginPath(); c.arc(padLeft + padWidth * k / 4, ground - 7, 2, 0, TAU); c.fill();
  }

  launchFuelCell(c, w * 0.55, h * 0.29, h * 0.045, t);
  const sway = Math.sin(t * 1.7);
  launchLander(c, w * (0.48 + sway * 0.045), h * (0.53 + sway * 0.055),
    h * 0.12, 0.09 * Math.cos(t * 1.7), t, Math.cos(t * 1.7) < 0);
}

function artLanding(c, w, h, t) { // a saucer following a dotted path onto its pad, a hauler lining up for the runway
  sky(c, w, h, "#1d3352", "#122238", 11);
  c.fillStyle = "#262c3e"; c.fillRect(w * 0.55, h * 0.62, w * 0.38, 26); c.strokeStyle = "#ffb84d"; c.lineWidth = 2; c.strokeRect(w * 0.55, h * 0.62, w * 0.38, 26);
  c.strokeStyle = "rgba(230,236,255,0.5)"; c.setLineDash([10, 8]); c.beginPath(); c.moveTo(w * 0.6, h * 0.62 + 13); c.lineTo(w * 0.92, h * 0.62 + 13); c.stroke(); c.setLineDash([]);
  const px = w * 0.24, py = h * 0.38; c.fillStyle = "#262c3e"; c.beginPath(); c.arc(px, py, 30, 0, TAU); c.fill(); c.strokeStyle = "#4fd1ff"; c.lineWidth = 3; c.stroke();
  const k = (t * 0.25) % 1, sx = lerp(w * 0.95, px, k), sy = lerp(h * 0.08, py, k) + Math.sin(k * PI) * -20;
  c.strokeStyle = "rgba(93,255,155,0.8)"; c.lineWidth = 2.5; c.setLineDash([2, 7]); c.beginPath(); c.moveTo(sx, sy); c.quadraticCurveTo(lerp(sx, px, 0.5), Math.min(sy, py) - 20, px, py); c.stroke(); c.setLineDash([]);
  saucer(c, sx, sy, 14 * (1 - Math.max(0, k - 0.85) * 2), t);
  const hx = lerp(w * 0.2, w * 0.55, (t * 0.18) % 1), hy = h * 0.62 + 13; // hauler rolling in
  c.fillStyle = "#ffb84d"; c.beginPath(); c.roundRect(hx - 18, hy - 9, 36, 18, 8); c.fill(); c.fillStyle = "rgba(200,240,255,0.6)"; c.beginPath(); c.arc(hx + 9, hy, 6, 0, TAU); c.fill();
}
function artSnake(c, w, h, t) { // the rescue train looping on a grid
  sky(c, w, h, "#14284a", "#0a1428", 19);
  c.strokeStyle = "rgba(255,255,255,0.05)"; for (let x = 0; x < w; x += 22) { c.beginPath(); c.moveTo(x, 0); c.lineTo(x, h); c.stroke(); } for (let y = 0; y < h; y += 22) { c.beginPath(); c.moveTo(0, y); c.lineTo(w, y); c.stroke(); }
  const P = s => ({ x: w / 2 + Math.sin(s) * w * 0.34, y: h / 2 + Math.sin(s * 2) * h * 0.3 }), cols = ["#5dff9b", "#7ab8ff", "#ff8bd0", "#ffd25d"];
  eyeAlien(c, w * 0.82, h * 0.78, 10, "#5dff9b", t);
  for (let k = 6; k >= 1; k--) { const p = P(t * 0.9 - k * 0.24); c.fillStyle = "#b8c4e6"; c.beginPath(); c.arc(p.x, p.y, 9, 0, TAU); c.fill();
    c.strokeStyle = cols[k % 4]; c.lineWidth = 2; c.stroke(); eyeAlien(c, p.x, p.y + 1, 5, cols[k % 4], t + k); }
  const p0 = P(t * 0.9); saucer(c, p0.x, p0.y, 12, t);
}
function artDrAlien(c, w, h, t) { // a lab bottle filling with capsules and spores
  sky(c, w, h, "#24102e", "#100818", 23);
  const bx = w / 2 - 70, by = 18, bw = 140, bh = h - 30, cs = bw / 7;
  c.fillStyle = "rgba(255,255,255,0.06)"; c.fillRect(bx, by, bw, bh); c.strokeStyle = "#ff8bd0"; c.lineWidth = 3; c.strokeRect(bx, by, bw, bh);
  const cols = ["#5dff9b", "#4fd1ff", "#ffd25d", "#ff8bd0"];
  let s = 5; const R = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 9; i++) { const gx = Math.floor(R() * 7), gy = 3 + Math.floor(R() * 4), col = cols[Math.floor(R() * 4)], x = bx + gx * cs + cs / 2, y = by + gy * cs + cs / 2 + 8; // spores
    c.fillStyle = col; c.beginPath(); for (let k = 0; k < 8; k++) { const a = k / 8 * TAU + t, rr = cs * (k % 2 ? 0.28 : 0.4); c.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); } c.closePath(); c.fill();
    c.fillStyle = "#10162c"; c.beginPath(); c.arc(x, y, cs * 0.1, 0, TAU); c.fill(); }
  const fall = (t * 30) % (cs * 3), cx = bx + 3 * cs; // a capsule dropping in
  for (const [i, col] of [[0, "#4fd1ff"], [1, "#ffd25d"]]) { c.fillStyle = col; c.beginPath(); c.roundRect(cx + i * cs + 2, by + 4 + fall, cs - 4, cs - 4, cs * 0.45); c.fill(); }
  eyeAlien(c, bx + bw + 32, h * 0.6, 16, "#ff8bd0", t); // Dr. Hive Queen watching
}
const lerp = (a, b, k) => a + (b - a) * k;

// ---------- build the cards ----------
const grid = document.getElementById("grid");
grid.innerHTML = GAMES.map((g, i) => `<a class="card" href="${ROOT + g.href}" style="--c:${g.color}">
  <canvas data-i="${i}" role="img" aria-label="${g.name} gameplay"></canvas>
  <div class="info"><h2>${g.name} <span class="tag">${g.tag}</span></h2><p>${g.desc}</p><span class="play">Play ▶</span></div></a>`).join("");
const canvases = [...grid.querySelectorAll("canvas[data-i]")];

// Recorded gameplay uses a JPEG film strip. Draw the original animation until the frames are ready.
for (const g of GAMES) if (g.film) {
  const f = g.film, img = new Image(), fallback = g.art;
  img.decoding = "async";
  img.addEventListener("load", () => { if (reduce) requestAnimationFrame(frame); });
  img.src = f.src;
  f.total = f.ms.reduce((a, b) => a + b, 0);
  g.art = (c, w, h, t) => {
    if (!img.complete || !img.naturalWidth) {
      fallback(c, w, h, t);
      return;
    }
    let ms = (t * 1000) % f.total, i = 0;
    while (i < f.n - 1 && ms >= f.ms[i]) ms -= f.ms[i++];
    const sx = (i % f.cols) * f.fw, sy = Math.floor(i / f.cols) * f.fh;
    const k = Math.max(w / f.fw, h / f.fh), dw = f.fw * k, dh = f.fh * k; // cover the card
    c.drawImage(img, sx, sy, f.fw, f.fh, (w - dw) / 2, (h - dh) / 2, dw, dh);
  };
}

// ---------- background stars and Commander Zib ----------
const bg = document.getElementById("stars"), bc = bg.getContext("2d");
const STARS = Array.from({ length: 160 }, () => ({ x: Math.random(), y: Math.random(), z: 0.3 + Math.random() * 0.7 }));
function drawStars(t) {
  const d = Math.min(2, devicePixelRatio || 1), w = innerWidth, h = innerHeight;
  if (bg.width !== Math.round(w * d)) { bg.width = Math.round(w * d); bg.height = Math.round(h * d); }
  bc.setTransform(d, 0, 0, d, 0, 0);
  const g = bc.createRadialGradient(w * 0.7, -h * 0.1, 0, w * 0.7, -h * 0.1, Math.max(w, h)); g.addColorStop(0, "#1a2350"); g.addColorStop(1, "#070b16");
  bc.fillStyle = g; bc.fillRect(0, 0, w, h);
  for (const s of STARS) { bc.globalAlpha = 0.3 + 0.5 * s.z * (0.7 + 0.3 * Math.sin(t * 2 + s.x * 40)); bc.fillStyle = "#fff"; bc.fillRect(s.x * w, ((s.y + t * 0.004 * s.z) % 1) * h, s.z * 2, s.z * 2); }
  bc.globalAlpha = 1;
}
function drawZib(t) {
  const c = document.getElementById("zib").getContext("2d"); c.setTransform(1.8, 0, 0, 1.8, 0, 0); c.clearRect(0, 0, 80, 80);
  c.fillStyle = "#5dff9b"; c.beginPath(); c.arc(40, 62, 26, PI, 0); c.fill();
  c.strokeStyle = "#5dff9b"; c.lineWidth = 3; c.beginPath(); c.moveTo(40, 36); c.lineTo(40, 22 + Math.sin(t * 3) * 2); c.stroke();
  c.fillStyle = "#ffd25d"; c.beginPath(); c.arc(40, 20 + Math.sin(t * 3) * 2, 4, 0, TAU); c.fill();
  const blink = t % 3.5 < 0.12;
  c.fillStyle = "#fff"; c.beginPath(); c.ellipse(40, 52, 12, blink ? 1.5 : 12, 0, 0, TAU); c.fill();
  if (!blink) { c.fillStyle = "#10162c"; c.beginPath(); c.arc(42 + Math.sin(t * 0.8) * 3, 52, 5.5, 0, TAU); c.fill(); }
  c.strokeStyle = "#1a2240"; c.lineWidth = 4; c.beginPath(); c.arc(40, 56, 28, PI * 1.12, PI * 1.88); c.stroke();
}

// ---------- animate (only what's on screen) ----------
const visible = new Set();
const io = new IntersectionObserver(es => es.forEach(e => e.isIntersecting ? visible.add(e.target) : visible.delete(e.target)));
canvases.forEach(cv => io.observe(cv));
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
function frame(now) {
  const t = reduce ? 2 : now / 1000;
  drawStars(t); drawZib(t);
  for (const cv of canvases) {
    if (!reduce && !visible.has(cv)) continue;
    const d = Math.min(2, devicePixelRatio || 1), w = cv.clientWidth, h = cv.clientHeight;
    if (cv.width !== Math.round(w * d) || cv.height !== Math.round(h * d)) { cv.width = Math.round(w * d); cv.height = Math.round(h * d); }
    const c = cv.getContext("2d"); c.setTransform(d, 0, 0, d, 0, 0); c.clearRect(0, 0, w, h);
    GAMES[+cv.dataset.i].art(c, w, h, t);
  }
  if (!reduce) requestAnimationFrame(frame);
}
if (reduce) window.addEventListener("resize", () => requestAnimationFrame(frame));
requestAnimationFrame(frame);

// ---------- Add to Home Screen ----------
(() => {
  const btn = document.getElementById("install"), sheet = document.getElementById("sheet"), box = document.getElementById("sheetBox");
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  if (standalone) return; // already running from the home screen
  const ua = navigator.userAgent, ios = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const android = /Android/i.test(ua), chromeIOS = /CriOS/.test(ua);
  const otherIOSBrowser = ios && /FxiOS|EdgiOS|OPiOS/.test(ua);
  const hosted = location.protocol === "https:" ||
    (location.protocol === "http:" && ["localhost", "127.0.0.1", "[::1]"].includes(location.hostname));
  if (!hosted) {
    document.getElementById("installTip").textContent = "To install Alien Arcade, open its HTTPS web address in your browser.";
  }
  let prompt = null;
  addEventListener("beforeinstallprompt", e => {
    if (!hosted || android) return;
    e.preventDefault();
    prompt = e;
    btn.classList.add("show");
  });
  addEventListener("appinstalled", () => { btn.classList.remove("show"); sheet.classList.remove("open"); });
  if (ios || android) btn.classList.add("show"); // phones always get the button; desktop only when the browser can install
  const share = '<svg viewBox="0 0 24 24" fill="none" stroke="#4fd1ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m-4-8 4-4 4 4"/><path d="M6 11H5a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2h-1"/></svg>';
  const plus = '<svg viewBox="0 0 24 24" fill="none" stroke="#5dff9b" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M12 8v8m-4-4h8"/></svg>';
  const dots = '<svg viewBox="0 0 24 24" fill="#c9d3f0"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>';
  const tap = '<svg viewBox="0 0 24 24" fill="none" stroke="#ffd25d" stroke-width="2" stroke-linecap="round"><path d="M5 12l5 5L20 7"/></svg>';
  function show(html) { box.innerHTML = html + '<button type="button" id="sheetClose">Got it</button>'; sheet.classList.add("open"); document.getElementById("sheetClose").onclick = () => sheet.classList.remove("open"); }
  sheet.addEventListener("click", e => { if (e.target === sheet) sheet.classList.remove("open"); });
  btn.addEventListener("click", async () => {
    if (!hosted) {
      show(`<h3 id="sheetTitle">Open the web version</h3>
        <p>${location.protocol === "file:" ? "You're viewing a local HTML file." : "This address does not use HTTPS."}
        Open Alien Arcade's <b>HTTPS web address</b> in Chrome or Safari, then use your browser's install menu.</p>`);
      return;
    }
    if (prompt) {
      const installPrompt = prompt;
      prompt = null;
      try {
        await installPrompt.prompt();
        const { outcome } = await installPrompt.userChoice;
        if (outcome === "accepted") btn.classList.remove("show");
        return;
      } catch {
        // The browser may revoke the prompt. Show its menu steps instead.
      }
    }
    if (ios) show(`<h3 id="sheetTitle">Add to your Home Screen</h3>
      <p>${otherIOSBrowser ? "Open Alien Arcade in <b>Safari</b> first. " : ""}Use the <b>Share</b> menu in ${chromeIOS ? "Chrome" : "Safari"}.</p>
      <ol><li><span class="n">${share}</span><span>Tap <b>Share</b>${chromeIOS ? " next to the address bar" : ""}.</span></li>
        <li><span class="n">${plus}</span><span>Tap <b>View More</b>${chromeIOS ? "" : " if shown"}, then choose <b>Add to Home Screen</b>.</span></li>
        <li><span class="n">${tap}</span><span>${chromeIOS ? "" : "Turn on <b>Open as Web App</b> if offered. "}Tap <b>Add</b>.</span></li></ol>
      <p>If the action is missing, open the arcade's HTTPS address in a regular browser tab.</p>`);
    else if (android) show(`<h3 id="sheetTitle">Add to your Home Screen</h3>
      <ol><li><span class="n">${dots}</span><span>In Chrome, open <b>More</b> (⋮).</span></li>
        <li><span class="n">${plus}</span><span>Tap <b>Install and create shortcut</b>. On older versions, look for <b>Add to Home screen</b>.</span></li>
        <li><span class="n">${tap}</span><span>Tap <b>Create shortcut</b> and confirm.</span></li></ol>`);
    else show(`<h3 id="sheetTitle">Install Alien Arcade</h3>
      <p>In Chrome, open <b>More</b> (⋮), then <b>Save and share</b>. Look for the install option.</p>`);
  });
})();
</script>
