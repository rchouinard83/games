<style>

  #fsSheet h3 { font-size: 19px; margin-bottom: 6px; } #fsSheet p { font-size: 14px; color: #dcdff7; line-height: 1.4; margin: 4px 0 8px; }

<div id="app">
  <div id="hud">
    <div class="chip"><small id="hStage">Oort</small><span id="hLevel">Level 1</span></div>
    <div class="chip"><small>Shields</small><span id="hHearts">♥♥♥♥♥</span></div>

    <div class="spacer"></div>

<div id="overlay"><div id="box"></div></div>
<script>
"use strict";
// ============================================================
//  ALIEN POP — a bubble shooter. Aim the launcher, fire goo bubbles, and match 3 or more of a colour to pop them.
//  Anything left hanging with nothing holding it up falls. Some bubbles have aliens trapped inside: free them all to win.
//  Time and misses bring the ceiling down. Reaching the danger line or running out of shields ends the run.
//  The board is 360 x 640 units, scaled to fit; the bubbles sit on a hexagon grid, 10 across.
// ============================================================
const $ = id => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d");
const TAU = Math.PI * 2, PI = Math.PI;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const BW = 360, BH = 640, LEVELS = 8;
const R = 18, COLS = 10, ROW_H = R * Math.sqrt(3), TOP = 34;  // bubble radius, bubbles per (even) row, row spacing, top of the board
const GUN = { x: 180, y: 590 }, SHOT_SPEED = 820, DANGER_Y = 536;
const MAX_HEARTS = 5, POWER_FULL = 32;
const SCORE = { pop: 10, drop: 20, alien: 250 };

const CHARS = (() => {
  function shade(hex, f) { const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255; const m = f < 0 ? 0 : 255, a = Math.abs(f);
    r = Math.round(r + (m - r) * a); g = Math.round(g + (m - g) * a); b = Math.round(b + (m - b) * a); return `rgb(${r},${g},${b})`; }
  const circle = (c, x, y, r) => { c.beginPath(); c.arc(x, y, r, 0, TAU); };
  const oval = (c, x, y, rx, ry, rot = 0) => { c.beginPath(); c.ellipse(x, y, rx, ry, rot, 0, TAU); };
  function shadow(c, s, y = 1.0, w = 0.9) { c.fillStyle = "rgba(0,0,0,0.35)"; oval(c, 0, s * y, s * w, s * 0.22); c.fill(); }
  function eye(c, x, y, r, pupil = "#10131f", lx = 0.25, ly = 0) {
    c.fillStyle = "#ffffff"; circle(c, x, y, r); c.fill();
    c.fillStyle = pupil; circle(c, x + r * lx, y + r * ly, r * 0.52); c.fill();
    c.fillStyle = "#ffffff"; circle(c, x + r * lx - r * 0.18, y + r * ly - r * 0.2, r * 0.16); c.fill();
  }
  const G = "#5dff9b", Y = "#ffe35d", P = "#ff8bd0", B = "#7ab8ff", O = "#ff8f5d", R = "#ff5d7a";
  const list = [
    { id: "blip", name: "Blip", color: G, fit: 1, desc: "One-eyed blob that bounces along, antennae bobbing.",
      draw(c, t, s, hit = 0) {
        const b = Math.sin(t * 8); c.translate(0, s * 0.1); c.scale(1 - 0.06 * b, 1 + 0.08 * b);
        c.fillStyle = shade(G, -0.4); oval(c, -s * 0.4, s * 0.75, s * 0.25, s * 0.13); c.fill(); oval(c, s * 0.4, s * 0.75, s * 0.25, s * 0.13); c.fill();
        c.strokeStyle = shade(G, -0.2); c.lineWidth = s * 0.08; c.lineCap = "round";
        for (const sd of [-1, 1]) { const tx = sd * s * (0.5 + 0.06 * Math.sin(t * 5 + sd));
          c.beginPath(); c.moveTo(sd * s * 0.25, -s * 0.7); c.quadraticCurveTo(sd * s * 0.35, -s * 1.05, tx, -s * 1.2); c.stroke();
          c.fillStyle = "#fff7a0"; circle(c, tx, -s * 1.2, s * 0.1); c.fill(); }
        c.fillStyle = G; c.beginPath(); c.moveTo(-s * 0.85, s * 0.7);
        c.bezierCurveTo(-s * 1.0, -s * 0.3, -s * 0.5, -s * 0.85, 0, -s * 0.85); c.bezierCurveTo(s * 0.5, -s * 0.85, s * 1.0, -s * 0.3, s * 0.85, s * 0.7); c.closePath(); c.fill();
        c.fillStyle = shade(G, 0.4); oval(c, -s * 0.4, -s * 0.38, s * 0.18, s * 0.09, -0.6); c.fill();
        if (hit > 0.15 || Math.sin(t * 1.3) > 0.97) { c.strokeStyle = "#10261a"; c.lineWidth = s * 0.07; c.beginPath(); c.moveTo(-s * 0.3, -s * 0.15); c.lineTo(s * 0.3, -s * 0.15); c.stroke(); }
        else eye(c, 0, -s * 0.15, s * 0.36, "#10261a", 0.25, 0.05);
        c.strokeStyle = "#10261a"; c.lineWidth = s * 0.06; c.beginPath(); c.arc(0, s * 0.3, s * 0.15, 0.2, Math.PI - 0.2); c.stroke();
      } },
    { id: "runner", name: "Runner", color: Y, fit: 1, desc: "Skinny legs, wobbly eye stalks, always in a hurry.",
      draw(c, t, s) {
        c.translate(0, -s * 0.1);
        c.strokeStyle = "rgba(255,227,93,0.35)"; c.lineWidth = s * 0.07; c.lineCap = "round";
        for (let k = 0; k < 3; k++) { const y = -s * 0.3 + k * s * 0.3; c.beginPath(); c.moveTo(-s * 0.7, y); c.lineTo(-s * (1.05 + 0.2 * Math.sin(t * 20 + k)), y); c.stroke(); }
        c.strokeStyle = shade(Y, -0.4); c.lineWidth = s * 0.12;
        for (const ph of [0, Math.PI]) { const a = t * 16 + ph, fx = Math.sin(a) * s * 0.5, fy = s * 1.0 - Math.max(0, Math.cos(a)) * s * 0.3;
          c.beginPath(); c.moveTo(0, s * 0.3); c.lineTo(fx * 0.5 + s * 0.1, s * 0.65); c.lineTo(fx, fy); c.stroke(); }
        c.fillStyle = Y; oval(c, s * 0.05, 0, s * 0.55, s * 0.48, 0.15); c.fill();
        c.fillStyle = shade(Y, 0.45); oval(c, -s * 0.15, -s * 0.2, s * 0.15, s * 0.08, -0.5); c.fill();
        c.strokeStyle = shade(Y, -0.2); c.lineWidth = s * 0.08;
        for (const [ex, ey, ph] of [[s * 0.1, -s * 0.95, 0], [s * 0.5, -s * 0.85, 1.5]]) { const w = Math.sin(t * 6 + ph) * s * 0.06;
          c.beginPath(); c.moveTo(s * 0.15, -s * 0.35); c.quadraticCurveTo(ex - s * 0.1, ey + s * 0.3, ex + w, ey); c.stroke();
          eye(c, ex + w, ey, s * 0.17, "#2a1a00", 0.4, 0.1); }
        c.strokeStyle = "#2a1a00"; c.lineWidth = s * 0.05; c.beginPath(); c.arc(s * 0.3, s * 0.1, s * 0.1, 0.2, Math.PI - 0.4); c.stroke();
      } },
    { id: "goo", name: "Goo", color: P, fit: 1.15, desc: "Little wobbling slime drop. Squishy and bouncy.",
      draw(c, t, s) {
        const w = Math.sin(t * 10); c.scale(1 + 0.1 * w, 1 - 0.1 * w);
        c.fillStyle = P; c.beginPath(); c.moveTo(0, -s * 1.0);
        c.bezierCurveTo(s * 0.5, -s * 0.4, s * 0.9, s * 0.1, s * 0.75, s * 0.55); c.quadraticCurveTo(0, s * 0.85, -s * 0.75, s * 0.55);
        c.bezierCurveTo(-s * 0.9, s * 0.1, -s * 0.5, -s * 0.4, 0, -s * 1.0); c.fill();
        c.fillStyle = shade(P, 0.45); oval(c, -s * 0.25, -s * 0.25, s * 0.12, s * 0.22, 0.4); c.fill();
        c.fillStyle = "#3a0a22"; circle(c, -s * 0.2, s * 0.15, s * 0.11); c.fill(); circle(c, s * 0.25, s * 0.15, s * 0.11); c.fill();
      } },
    { id: "jelly", name: "Jelly", color: B, fit: 1, desc: "Floating jellyfish that drifts along, tentacles waving.",
      draw(c, t, s, hit = 0) {
        shadow(c, s, 1.0, 0.7); c.translate(0, Math.sin(t * 2.5) * s * 0.12 - s * 0.25);
        c.strokeStyle = shade(B, 0.2); c.lineWidth = s * 0.08; c.lineCap = "round";
        for (let k = 0; k < 5; k++) { const x = -s * 0.5 + k * s * 0.25; c.beginPath(); c.moveTo(x, s * 0.1);
          c.quadraticCurveTo(x + Math.sin(t * 4 + k) * s * 0.2, s * (0.6 - hit * 0.27), x * (1 - hit * 0.4) + Math.sin(t * 4 + k + 1) * s * 0.15, s * (1 - hit * 0.57)); c.stroke(); }
        const pul = 1 + 0.06 * Math.sin(t * 5);
        const g = c.createRadialGradient(-s * 0.2, -s * 0.4, s * 0.1, 0, -s * 0.1, s * 0.8); g.addColorStop(0, shade(B, 0.55)); g.addColorStop(1, shade(B, -0.1));
        c.fillStyle = g; c.beginPath(); c.ellipse(0, 0, s * 0.75 * pul, s * 0.7 / pul, 0, Math.PI, TAU);
        c.quadraticCurveTo(s * 0.4, s * 0.25, 0, s * 0.12); c.quadraticCurveTo(-s * 0.4, s * 0.25, -s * 0.75 * pul, 0); c.fill();
        c.fillStyle = "#0d1830"; circle(c, -s * 0.2, -s * 0.25, s * 0.09); c.fill(); circle(c, s * 0.2, -s * 0.25, s * 0.09); c.fill();
      } },
    { id: "chonk", name: "Chonk", color: O, fit: 0.95, desc: "Big round three-eyed bruiser. Built like a bowling ball.",
      draw(c, t, s, hit = 0) {
        c.translate(0, -Math.abs(Math.sin(t * 3)) * s * 0.12 + s * 0.05);
        c.fillStyle = shade(O, -0.3);
        for (const sd of [-1, 1]) { oval(c, sd * s * 0.95, s * 0.05 + Math.sin(t * 3 + sd) * s * 0.08, s * 0.18, s * 0.28, sd * 0.4); c.fill(); }
        oval(c, -s * 0.45, s * 0.82, s * 0.28, s * 0.14); c.fill(); oval(c, s * 0.45, s * 0.82, s * 0.28, s * 0.14); c.fill();
        const g = c.createRadialGradient(-s * 0.3, -s * 0.4, s * 0.1, 0, 0, s); g.addColorStop(0, shade(O, 0.35)); g.addColorStop(1, shade(O, -0.15));
        c.fillStyle = g; oval(c, 0, 0, s * 0.92, s * 0.85); c.fill();
        c.fillStyle = shade(O, -0.2); circle(c, -s * 0.6, s * 0.35, s * 0.1); c.fill(); circle(c, s * 0.62, s * 0.3, s * 0.08); c.fill(); circle(c, s * 0.5, -s * 0.55, s * 0.07); c.fill();
        eye(c, -s * 0.35, -s * 0.2, s * 0.2, "#2a1205"); eye(c, s * 0.35, -s * 0.2, s * 0.2, "#2a1205"); eye(c, 0, -s * 0.52, s * 0.16, "#2a1205");
        if (hit > 0.15) { c.strokeStyle = "#3a1405"; c.lineWidth = s * 0.14; c.lineCap = "round"; c.beginPath(); c.moveTo(-s * 0.26, s * 0.38); c.quadraticCurveTo(0, s * 0.08, s * 0.26, s * 0.38); c.stroke(); }
        else { c.fillStyle = "#3a1405"; oval(c, 0, s * 0.3, s * 0.25, s * (0.1 + 0.05 * Math.sin(t * 3))); c.fill(); }
      } },
    { id: "mother", name: "Mother Blob", color: R, fit: 0.85, desc: "Huge blob covered in eyes that all look in different directions.",
      draw(c, t, s) {
        const w = Math.sin(t * 2); c.scale(1 + 0.04 * w, 1 - 0.04 * w);

    <p>The ceiling also drops when you miss too many shots.</p>
    ${DIFFICULTIES.map((d, i) => `<button class="big ${i === SAVE.difficulty ? "main" : ""}" data-act="setDifficulty" data-arg="${i}">${d.name}<small>Ceiling drops after ${d.seconds} seconds</small></button>`).join("")}
    <button class="big" data-act="title">Back</button>`, null, "difficulty");
}
function worldsMenu() {
  openMenu(`<p class="kicker">Alien Pop</p><h2>Choose a stage</h2>
    <div class="menuList">${STAGES.map((st, i) => `<button class="big stageCard" data-act="stage" data-arg="${i}" ${stageOpen(i) ? "" : "disabled"}><canvas data-stage="${i}"></canvas>
      <span>${i + 1} · ${st.name}<small>${stageOpen(i) ? `8 levels · <span class="stars">${stageStars(i)}/24 ★</span>` : `Clear ${STAGES[i - 1].short} to unlock`}</small></span></button>`).join("")}</div>
    <button class="big" data-act="difficulty">Back to difficulty</button>`, null, "worlds");

function titleAnim(tt) { // a bubble flies up, joins two of its colour, and they pop and free an alien
  const cvs = $("titleArt"); if (!cvs) return; const [c, w, h] = fitCanvas(cvs);
  const g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, "#1a1440"); g.addColorStop(1, "#06061a"); c.fillStyle = g; c.fillRect(0, 0, w, h);
  const r = 15, T = tt % 3.6, popNow = T > 1.2, cols = [2, 3, 0, 4, 1, 5, 2, 0, 3];
  for (let row = 0; row < 3; row++) for (let k = 0; k < 9 - (row % 2); k++) { const x = w / 2 - 8 * r + k * 2 * r + (row % 2) * r, y = 16 + row * r * 1.73;
    const target = row === 1 && (k === 4 || k === 5); if (target && popNow) continue; const b = { col: target ? 2 : cols[(k + row * 2) % 9] }; if (row === 2 && k === 3) b.alien = CAST[b.col]; drawBubble(c, b, x, y, tt, r); }
  if (!popNow) { const k = T / 1.2, x = w / 2 + (w / 2 - 8 * r + 6 * r + r - w / 2) * k, y = h - 20 + (16 + 1.73 * r * 2 - h + 20) * k; drawBubble(c, { col: 2 }, x, y, tt, r); }
  else if (T < 2.6) { const k = (T - 1.2) / 1.4; c.globalAlpha = 1 - k; CHARS.draw(c, "goo", w / 2 + r, 16 + r * 1.73 - k * 40, 10, tt * 2); c.globalAlpha = 1; c.fillStyle = "#ffd25d"; c.font = "900 18px system-ui"; c.textAlign = "center"; c.fillText("POP!", w * 0.78, h * 0.6); }
  c.fillStyle = "#e2e8f6"; c.beginPath(); c.ellipse(w / 2, h - 8, 34, 9, 0, 0, TAU); c.fill(); CHARS.draw(c, SAVE.char, w / 2 + 28, h - 16, 6, tt);
}
function setupMenu(s, l) {
  const st = STAGES[s], ch = CHARS.byId(SAVE.char), power = POWERS[ch.id];
  openMenu(`<p class="kicker">Alien Pop · Level setup</p><h2>${st.short} · Level ${l + 1}</h2>
    <button class="big" data-act="chars" data-arg="${s}|${l}">Alien: <b>${ch.name}</b><small>Change alien ›</small></button>

}
function charMenu(s, l) {

    <p>Pop bubbles to fill the <b style="color:#ff8bd0">power ring</b>. When it's full you get your alien's <b style="color:#5dff9b">special bubble</b>.</p>
    <div class="chars">${CHARS.list.map(ch => `<button class="charBtn ${ch.id === SAVE.char ? "on" : ""}" aria-pressed="${ch.id === SAVE.char}" data-act="pick" data-arg="${s}|${l}|${ch.id}"><canvas data-char="${ch.id}"></canvas>${ch.name}<small>${POWERS[ch.id].name}</small></button>`).join("")}</div>
    <p class="powerDesc"><b>${P.name}:</b> ${P.text}</p>

    tt => { for (const cvs of $("box").querySelectorAll("canvas[data-char]")) { const [c, w, h] = fitCanvas(cvs); c.clearRect(0, 0, w, h); const on = cvs.dataset.char === SAVE.char;
      CHARS.draw(c, cvs.dataset.char, w / 2, h * 0.55, w * 0.24, tt + w, on ? Math.abs(Math.sin(tt * 5)) * 6 : 0); } }, "chars");
}
function stageMenu(s) {
  const st = STAGES[s];
  openMenu(`<p class="kicker">Stage ${s + 1} of ${STAGES.length}</p><h2>${st.name}</h2>
    <p>${st.intro}</p>
    <div class="facts"><span>${{ ice: "Frozen bubbles", wind: "Storm wind", stone: "Rocks", bomb: "Goo bombs" }[st.twist]}</span><span>${MAX_HEARTS} shields</span></div>
    <p class="score"><span class="stars">${stageStars(s)}/24 ★</span></p>
    <div class="levels">${Array.from({ length: LEVELS }, (_, i) => `<button class="big ${levelOpen(s, i) && !SAVE.best[s][i] ? "main" : ""}" data-act="setup" data-arg="${s}|${i}" ${levelOpen(s, i) ? "" : "disabled"}>${levelOpen(s, i) ? i + 1 : "🔒"}<small>${starStr(SAVE.best[s][i])}</small></button>`).join("")}</div>
    <button class="big" data-act="worlds">Back to stages</button>`, null, "stage");

function resultMenu() {
  if (state === "won") {
    const st = starsFor(hearts); if (st > SAVE.best[si][li]) SAVE.best[si][li] = st; const newBest = score > SAVE.score[si][li]; if (newBest) SAVE.score[si][li] = score; save();
    const next = li + 1 < LEVELS ? [si, li + 1] : si + 1 < STAGES.length && stageOpen(si + 1) ? [si + 1, 0] : null;
    openMenu(`<p class="kicker">${S.short} · Level ${li + 1}</p><h2>All ${aliensTotal} aliens free!</h2>
      <div class="bigStars">${starStr(st)}</div>
      <p>Shields left <b>${hearts}/${MAX_HEARTS}</b> · Score <b>${score.toLocaleString()}</b>${newBest ? " · <b>New best!</b>" : ""}<br>${st === 3 ? "The ceiling never moved. Perfect!" : st === 2 ? "Don't let the ceiling drop at all for three stars." : "Lose 2 or fewer shields for two stars."}</p>
      <p class="score">${S.short}: <span class="stars">${stageStars(si)}/24 ★</span></p>
      ${next ? `<button class="big main" data-act="play" data-arg="${next[0]}|${next[1]}">${next[0] !== si ? `Next stage: ${STAGES[next[0]].short} ▶` : `Level ${next[1] + 1} ▶`}</button>`
        : si + 1 === STAGES.length && li + 1 === LEVELS ? `<p><b>Every alien is free!</b> Go back for any missing stars.</p>` : ""}
      <button class="big" data-act="play" data-arg="${si}|${li}">Play again</button>
      <button class="big" data-act="stage" data-arg="${si}">All levels</button>`, null, "result");
  } else {
    openMenu(`<p class="kicker">${S.short} · Level ${li + 1}</p><h2>Bubbled!</h2>
      <p>You freed <b>${freed}</b> of ${aliensTotal} aliens. Tip: pop bubbles <b>above</b> a trapped alien and everything below falls, alien and all.</p>
      <button class="big main" data-act="play" data-arg="${si}|${li}">Try again</button>
      <button class="big" data-act="stage" data-arg="${si}">All levels</button>`, null, "result");
  }
}
function pauseMenu() {
  openMenu(`<p class="kicker">Paused</p><h2>${S.short} · Level ${li + 1}</h2>
    <p>Freed <b>${freed}/${aliensTotal}</b> · Shields <b>${hearts}</b> · Score <b>${score.toLocaleString()}</b></p>
    <button class="big main" data-act="resume">Resume ▶</button>
    <button class="big" data-act="play" data-arg="${si}|${li}">Restart level</button>
    <button class="big" data-act="help" data-arg="game|0">How to play</button>
    <button class="big" data-act="stage" data-arg="${si}">All levels</button>
    ${soundBtn()}
    <button class="big" data-act="title">Main menu</button>`, null, "pause");

// How to play
const HOWTO = [
  { title: "Aim and fire", lines: ["<b>Drag</b> anywhere to aim, <b>let go</b> to fire", "Bounce shots off the <b>side walls</b>", "<b>Tap</b> the small bubble to <b>swap</b> it in"], demo: demoAim },
  { title: "Match 3", lines: ["Join <b>3 or more</b> of one colour to <b>pop</b> them", "Anything left <b>hanging</b> with nothing above it <b>falls</b>", "Aliens are <b class='p'>trapped</b> in some bubbles: free them all!"], demo: demoMatch },
  { title: "The ceiling", lines: ["Shots that pop nothing are <b>misses</b> (the dots at the top)", "When the timer runs out or you miss too often, the ceiling <b class='r'>drops</b> and costs a <b class='r'>♥</b>", "Cross the <b class='r'>red line</b> or lose all shields and the run ends"], demo: demoCeiling },
  { title: "Power", lines: ["Popping fills the <b class='p'>power ring</b>", "Full ring = your alien's <b class='g'>special bubble</b>", "Blip <b>Laser</b> · Runner <b>Zap</b> · Goo <b>Rainbow</b> · Jelly <b>Burst</b> · Chonk <b>Bomb</b> · Mother <b>Call Home</b>"], demo: demoPower },
  { title: "Worlds and stars", lines: ["<b class='c'>Oort</b> frozen bubbles · <b class='y'>Jupiter</b> wind · <b>Mars</b> rocks · <b class='g'>Earth</b> goo bombs", "Win with all <b>5 ♥</b> = <b class='y'>★★★</b> · 3+ = <b class='y'>★★</b> · any win = <b class='y'>★</b>"], demo: demoStars },
];
function helpMenu(back, page = 0) {
  const p = HOWTO[page], lastPage = page === HOWTO.length - 1, done = back === "game" ? "resume" : "title";
  openMenu(`<p class="kicker">How to play · ${page + 1} of ${HOWTO.length}</p><h2>${p.title}</h2>
    <canvas id="howCv"></canvas><ul class="how">${p.lines.map(l => `<li>${l}</li>`).join("")}</ul>
    <div class="dots">${HOWTO.map((_, k) => `<i class="${k === page ? "on" : ""}"></i>`).join("")}</div>
    <div class="row">${page ? `<button class="big" data-act="help" data-arg="${back}|${page - 1}">◀ Back</button>` : `<button class="big" data-act="${done}">Close</button>`}
      ${lastPage ? `<button class="big main" data-act="${done}">Done</button>` : `<button class="big main" data-act="help" data-arg="${back}|${page + 1}">Next ▶</button>`}</div>`,
    tt => { const cvs = $("howCv"); if (!cvs) return; const [c, w, h] = fitCanvas(cvs); const g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, "#1a1440"); g.addColorStop(1, "#06061a"); c.fillStyle = g; c.fillRect(0, 0, w, h); p.demo(c, tt, w, h); }, "help");
}
function label(c, text, x, y, col) { c.fillStyle = col; c.font = "800 13px system-ui"; c.textAlign = "center"; c.fillText(text, x, y); }
function finger(c, x, y, down) { c.fillStyle = down ? "rgba(255,139,208,0.35)" : "rgba(255,255,255,0.22)"; c.beginPath(); c.arc(x, y, 15, 0, TAU); c.fill(); c.fillStyle = down ? "#ff8bd0" : "#fff"; c.beginPath(); c.arc(x, y, 6, 0, TAU); c.fill(); }
function demoAim(c, tt, w, h) {
  const gx = w / 2, gy = h - 18, a = -PI / 2 + Math.sin(tt * 1.1) * 0.9; drawBubble(c, { col: 3 }, gx, gy, tt, 13);
  c.fillStyle = COLORS[3]; let x = gx, y = gy, vx = Math.cos(a) * 9, vy = Math.sin(a) * 9; for (let i = 0; i < 24; i++) { x += vx; y += vy; if (x < 8 || x > w - 8) vx = -vx; if (y < 10) break; c.globalAlpha = 1 - i / 26; c.beginPath(); c.arc(x, y, 2.4, 0, TAU); c.fill(); } c.globalAlpha = 1;
  finger(c, gx + Math.cos(a) * 80, gy + Math.sin(a) * 80, true); drawBubble(c, { col: 1 }, gx - 46, gy + 4, tt, 9); label(c, "swap", gx - 46, gy - 10, "#a0a4d0");
}
function demoMatch(c, tt, w, h) {
  const r = 14, T = tt % 3.4, popped = T > 1.2;
  const pos = (row, k) => [w / 2 - 4 * r * 2 + k * 2 * r + (row % 2) * r + r, 18 + row * r * 1.73];
  for (let k = 0; k < 8; k++) { const [x, y] = pos(0, k); drawBubble(c, { col: [0, 4, 1, 3, 0, 4, 1, 3][k] }, x, y, tt, r); }
  const hang = [[1, 3, 2], [1, 4, 2], [2, 3, 5]];
  for (const [row, k, col] of hang) { if (popped && col === 2) continue; let [x, y] = pos(row, k); if (popped && col === 5) y += (T - 1.2) * (T - 1.2) * 120; if (y < h) drawBubble(c, row === 2 ? { col, alien: "mother" } : { col }, x, y, tt, r); }
  if (!popped) { const k = T / 1.2, [tx, ty] = pos(1, 5); drawBubble(c, { col: 2 }, w / 2 + (tx - w / 2) * k, h - 14 + (ty - h + 14) * k, tt, r); }
  else label(c, T < 2 ? "POP! and the rest falls" : "alien freed!", w / 2, h - 10, "#ff8bd0");
}
function demoCeiling(c, tt, w, h) {
  const T = tt % 4, drop = T > 2 ? Math.min(1, (T - 2) * 3) : 0, cy = 14 + drop * 22;
  c.fillStyle = "#2a2a5a"; c.fillRect(0, 0, w, cy); c.fillStyle = "#4a4a8a"; c.fillRect(0, cy - 3, w, 3);
  for (let k = 0; k < 6; k++) { c.fillStyle = k < 6 - Math.min(6, Math.floor(T / 0.33)) ? "#5dff9b" : "#ff5d7a"; c.beginPath(); c.arc(w / 2 - 30 + k * 12, cy - 8 > 4 ? cy - 8 : 8, 3.5, 0, TAU); c.fill(); }
  for (let k = 0; k < 9; k++) drawBubble(c, { col: k % 6 }, 20 + k * 28, cy + 16, tt, 13);
  c.strokeStyle = "rgba(255,93,122,0.8)"; c.setLineDash([8, 6]); c.lineWidth = 2; c.beginPath(); c.moveTo(0, h - 30); c.lineTo(w, h - 30); c.stroke(); c.setLineDash([]);
  if (T > 2) label(c, "CEILING DROPS · −1 ♥", w / 2, h * 0.6, "#ff5d7a");

function demoPower(c, tt, w, h) {
  CHARS.list.forEach((ch, i) => { const x = w * (0.1 + i * 0.16), on = ch.id === SAVE.char; CHARS.draw(c, ch.id, x, h * 0.4 - (on ? Math.abs(Math.sin(tt * 5)) * 6 : 0), 11, tt + i); label(c, POWERS[ch.id].name, x, h * 0.72, on ? "#5dff9b" : "#a0a4d0"); });
  const p = (tt % 3) / 3; c.strokeStyle = "rgba(255,255,255,0.15)"; c.lineWidth = 4; c.beginPath(); c.arc(w / 2, h - 18, 12, 0, TAU); c.stroke(); c.strokeStyle = p > 0.95 ? "#5dff9b" : "#ff8bd0"; c.beginPath(); c.arc(w / 2, h - 18, 12, -PI / 2, -PI / 2 + p * TAU); c.stroke();
}
function demoStars(c, tt, w, h) {
  [["♥♥♥♥♥", "★★★"], ["♥♥♥", "★★"], ["♥", "★"]].forEach(([a, b], i) => { const y = h * (0.28 + i * 0.25);
    c.font = "800 18px system-ui"; c.textAlign = "left"; c.fillStyle = "#ff5d7a"; c.fillText(a, w * 0.16, y); c.fillStyle = "#ffd25d"; c.fillText(b, w * 0.62, y); });
  label(c, "shields left when the last alien is free → stars", w / 2, h - 10, "#a0a4d0");
}

const ACT = {
  title: () => titleMenu(),
  difficulty: () => difficultyMenu(),
  setDifficulty: i => { SAVE.difficulty = Number(i); save(); worldsMenu(); },
  worlds: () => worldsMenu(),
  stage: s => stageMenu(+s),
  setup: a => setupMenu(...a.split("|").map(Number)),
  chars: a => charMenu(...a.split("|").map(Number)),
  pick: a => {
    const [s, l, id] = a.split("|");
    SAVE.char = id;
    save();
    charMenu(+s, +l);
  },
  play: a => { const [s, l] = a.split("|").map(Number); loadLevel(s, l); closeMenu(); },
  resume: () => closeMenu(),
  help: a => { const [back, page] = a.split("|"); helpMenu(back, +page || 0); },
  sound: () => { SAVE.sound = !SAVE.sound; save(); if (!SAVE.sound && keepAlive) keepAlive.pause(); else audio();
    for (const b of $("box").querySelectorAll("[data-act='sound']")) b.textContent = SAVE.sound ? "🔊 Sound: On" : "🔇 Sound: Off"; tone(520, 0.1, "triangle", 0.07); },
};
$("menuBtn").onclick = () => { audio(); if (playing() && !paused) pauseMenu(); else if (paused && menuName === "pause") closeMenu(); else titleMenu(); };
$("helpBtn").onclick = () => { audio(); helpMenu(playing() && !paused ? "game" : "title", 0); };

// ---------- full screen (like Dr Alien). iPhones can't, so there the button explains Add to Home Screen. ----------
(() => {
  const btn = $("fsBtn"), root = document.documentElement, req = root.requestFullscreen || root.webkitRequestFullscreen;
  const can = !!(req && (document.fullscreenEnabled || document.webkitFullscreenEnabled));
  const ICON = on => `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="${on ? "M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5" : "M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"}"/></svg>`;
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  if (!can) {
    if (standalone) { btn.hidden = true; return; }
    btn.innerHTML = ICON(false);
    btn.onclick = () => {
      const chrome = /CriOS/.test(navigator.userAgent), other = /FxiOS|EdgiOS|OPiOS/.test(navigator.userAgent), el = document.createElement("div"); el.id = "fsSheet";
      el.innerHTML = `<div class="sheet"><h3>Full screen on iPhone</h3><p>Apple doesn't let iPhone browsers fill the screen with a web page. This works:</p><ol>
        ${other ? `<li>Open this page in <b>Safari</b>, tap <b>Share</b> (□↑), then <b>Add to Home Screen</b>.</li>` : `<li>Tap <b>Share</b> (□↑)${chrome ? " at the right of the address bar" : ""}, then <b>Add to Home Screen</b>.</li>`}
        <li>Open <b>Alien Pop</b> from its new icon: it fills the whole screen like an app.</li>
        ${!chrome && !other ? `<li>Quick option: tap <b>aA</b> in the address bar, then <b>Hide Toolbar</b>.</li>` : ""}</ol>
        <button class="big main" type="button">Got it</button></div>`;
      el.addEventListener("click", e => { if (e.target === el || e.target.tagName === "BUTTON") el.remove(); }); document.body.appendChild(el);
    };
    return;
  }
  const isFull = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
  const sync = () => { const on = isFull(); btn.innerHTML = ICON(on); btn.setAttribute("aria-label", on ? "Exit full screen" : "Full screen"); btn.setAttribute("aria-pressed", String(on)); setTimeout(resize, 120); };
  btn.onclick = () => { audio(); const r = isFull() ? (document.exitFullscreen || document.webkitExitFullscreen).call(document) : req.call(root); if (r && r.catch) r.catch(() => {}); };
  document.addEventListener("fullscreenchange", sync); document.addEventListener("webkitfullscreenchange", sync); sync();
})();

// ============================================================
//  MAIN LOOP: fixed 1/60 s steps
// ============================================================
let last = performance.now(), acc = 0;
function frame(now) {
  const dt = clamp((now - last) / 1000, 0, 0.1);
  last = now;
  acc += dt; let n = 0;
  while (acc >= 1 / 60 && n < 6) { update(1 / 60); acc -= 1 / 60; n++; }
  if (n === 6) acc = 0;
  if (menuAnim) menuAnim(now / 1000);
  draw(now / 1000);
  requestAnimationFrame(frame);
}
resize();
loadLevel(0, 0); banner = null;
titleMenu();
requestAnimationFrame(frame);
</script>
