<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#070b16">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Alien Herd</title>
<style>
  :root { --bg: #070b16; --panel: #0e1530; --line: #2a3a66; --ink: #e6ecff; --dim: #8f9cc4; --good: #5dff9b; --bad: #ff5d7a; --accent: #4fd1ff; --gold: #ffd25d; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; overscroll-behavior: none;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #app { height: 100%; height: 100dvh; display: flex; flex-direction: column; align-items: center; padding: calc(6px + env(safe-area-inset-top)) 6px calc(6px + env(safe-area-inset-bottom)); gap: 6px; }
  #hud { width: 100%; max-width: 560px; display: flex; gap: 6px; }
  .chip { background: rgba(10,16,34,0.85); border: 1px solid var(--line); border-radius: 12px; padding: 4px 9px 5px; font-weight: 800; font-size: 15px; line-height: 1.15; }
  .chip small { display: block; font-size: 9.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); font-weight: 700; }
  .spacer { flex: 1; }
  .hudBtn { background: rgba(10,16,34,0.85); color: var(--ink); border: 1px solid var(--line); border-radius: 12px; font: inherit; font-weight: 900; font-size: 15px; padding: 0 12px; min-height: 44px; }
  .hudBtn.on { background: #3a2f0e; border-color: #c9a227; color: var(--gold); }
  #stage { flex: 1; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; }
  #cv { display: block; border-radius: 12px; border: 1px solid var(--line); touch-action: none; }
  #skills { width: 100%; max-width: 560px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .skill { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px 5px; border-radius: 12px; border: 1px solid var(--line);
    background: #121a3a; color: var(--ink); font: inherit; font-size: 11px; font-weight: 800; }
  .skill canvas { width: 36px; height: 30px; }
  .skill b { position: absolute; top: 3px; right: 6px; font-size: 13px; color: var(--gold); }
  .skill.sel { border-color: var(--good); background: #173a2c; box-shadow: 0 0 0 2px rgba(93,255,155,0.35); }
  .skill:disabled { opacity: 0.35; }
  #brief { display: flex; gap: 10px; align-items: center; width: 100%; max-width: 560px; min-height: 44px; padding: 6px 9px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); font-size: 13px; }
  #clock { margin-left: auto; color: var(--gold); font-weight: 900; white-space: nowrap; }
  #skills:empty { display: none; }
  .skill { min-width: 0; min-height: 44px; }
  .big small { display: block; margin-top: 3px; color: #c3cae8; font-size: 12px; }
  #box .worldCard { display: flex; align-items: center; gap: 12px; text-align: left; }
  .worldCard i { width: 40px; height: 40px; flex: 0 0 40px; border-radius: 50%; background: radial-gradient(circle at 34% 26%, #fff, var(--world) 22%, #273752 76%); }
  #box .resultStars { color: var(--gold); font-size: 30px; letter-spacing: .1em; }
  /* Menu styles travel with this HTML when it is published on its own. */
  #overlay {
    position: fixed; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center;
    padding: 12px;
    padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right))
      max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
    background: rgba(5, 5, 16, .78);
  }
  #overlay.hidden { display: none; }
  #box {
    width: min(100%, 430px); max-height: 100%; overflow: auto; overscroll-behavior: contain;
    touch-action: pan-y; padding: 16px; border: 1px solid #33336e; border-radius: 18px;
    background: #141436; color: #eef0ff; text-align: center; box-shadow: 0 0 40px #7070ca26;
  }
  #box h1 {
    margin: 8px 0 5px; font-size: clamp(32px, 9vw, 46px); letter-spacing: -.04em; line-height: 1.04;
    background: linear-gradient(90deg, #ff8bd0, #ffd25d 40%, #5dff9b 70%, #4fd1ff);
    background-clip: text; -webkit-background-clip: text; color: transparent;
  }
  #box h2 { margin: 4px 0 6px; font-size: 26px; line-height: 1.14; }
  #box p { margin: 6px 0 10px; color: #dcdff7; font-size: 15px; line-height: 1.4; }
  #box .kicker { margin: 6px 0 4px; color: #8fe9dc; font-size: 11px; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; }
  #titleArt { width: 100%; height: 145px; display: block; border-radius: 12px; }
  .big {
    display: block; width: 100%; min-height: 48px; margin: 8px 0; padding: 10px 11px;
    border: 1px solid #33336e; border-radius: 12px; background: #22225a; color: #eef0ff;
    font: 800 16px/1.2 system-ui, sans-serif; text-align: center; text-decoration: none;
  }
  a.big { display: grid; place-items: center; }
  .big.main { background: #1d4a3a; border-color: #2f7a5c; color: #82f7b2; }
  #box :is(button, a):focus-visible { outline: 2px solid #a7f5e5; outline-offset: 2px; }
  .menuList { display: grid; gap: 8px; margin: 8px 0; }
  .menuList .big { margin: 0; }
  .menuFooter { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .menuFooter .big { width: auto; flex: 1 1 135px; margin: 0; }
  .big:disabled { opacity: .44; }
  #howCv { width: 100%; height: 200px; display: block; border-radius: 12px; background: #0a1024; border: 1px solid #22305a; margin: 6px 0 4px; }
  .how { list-style: none; margin: 10px 0 8px; display: grid; gap: 6px; text-align: left; }
  .how li { font-size: 18px; font-weight: 650; color: #e6ecff; line-height: 1.3; padding: 7px 12px; background: #0b1228; border: 1px solid #22305a; border-radius: 10px; }
  .how b { font-weight: 900; color: #fff; }
  .how b.y { color: var(--gold); } .how b.c { color: var(--accent); } .how b.p { color: #ff8bd0; } .how b.r { color: var(--bad); } .how b.o { color: #ff8a3d; } .how b.g { color: var(--good); }
  .dots { display: flex; justify-content: center; gap: 6px; margin: 4px 0 2px; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: #2a3a66; }
  .dots i.on { background: var(--accent); }
  .row { display: flex; gap: 8px; } .row .big { flex: 1; }
  .stats { display: flex; justify-content: center; gap: 18px; margin: 6px 0 10px; }
  .stats div { font-size: 24px; font-weight: 900; }
  .stats small { display: block; font-size: 11px; color: var(--dim); font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
  @media (max-width: 520px), (max-height: 500px) and (pointer: coarse) {
    #overlay {
      bottom: auto; height: 100vh; height: 100dvh;
      background: radial-gradient(ellipse at 50% 18%, #20214a, #090c24 74%);
      -webkit-text-size-adjust: 100%;
    }
    #box { padding: clamp(12px, 4vw, 16px); }
    #box h1 { font-size: clamp(29px, 8vw, 39px); }
    #box h2 { font-size: clamp(23px, 6vw, 26px); }
    #box p { font-size: 14px; }
    #titleArt { height: clamp(100px, 19vh, 122px); }
    .big.main { min-height: 52px; background: #21744f; border-color: #429e70; color: #f3fff7; }
    #box:has(> .menuList) { display: flex; flex-direction: column; }
    #box:has(> .menuList) > :not(.menuList) { flex: 0 0 auto; }
    .menuList {
      min-height: min(112px, 32vh); overflow-y: auto; overscroll-behavior: contain;
      grid-auto-rows: max-content; padding: 2px;
    }
  }
  @media (max-height: 500px) and (pointer: coarse) {
    #box { width: min(100%, 580px); padding: 12px; }
    #titleArt { height: min(90px, 27vh); }
    .menuList { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    #howCv { height: min(100px, 28vh); }
  }
  @media (max-height: 500px) and (min-width: 540px) and (pointer: coarse) {
    #app {
      display: grid; grid-template-columns: minmax(232px, 33%) minmax(0, 1fr);
      grid-template-rows: auto auto 1fr; align-items: start;
      padding-left: max(6px, env(safe-area-inset-left)); padding-right: max(6px, env(safe-area-inset-right));
    }
    #hud, #brief, #skills { grid-column: 1; }
    #hud { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; }
    #hud .spacer { display: none; }
    .chip { padding: 4px 5px; }
    .hudBtn { padding: 0 7px; }
    #stage { grid-area: 1 / 2 / 4 / 3; height: 100%; }
  }
  @media (max-width: 380px) { #hud { gap: 3px; } .chip { padding: 4px 5px; } .hudBtn { padding: 0 7px; } }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="chip"><small>Released</small><span id="hOut">0</span></div>
    <div class="chip"><small>Home</small><span id="hSaved">0/4</span></div>
    <div class="chip"><small>Lost</small><span id="hLost">0</span></div>
    <div class="spacer"></div>
    <button class="hudBtn" id="helpBtn" aria-label="How to play">?</button>
    <button class="hudBtn" id="fastBtn" aria-label="Fast forward">▶▶</button>
    <button class="hudBtn" id="menuBtn">Pause</button>
  </div>
  <div id="brief"><span id="hint"></span><span id="clock" aria-label="Time remaining"></span></div>
  <div id="stage"><canvas id="cv"></canvas></div>
  <div id="skills"></div>
</div>
<div id="overlay"><div id="box"></div></div>
<script>
"use strict";
// ============================================================
//  ALIEN HERD — rescue puzzles across four worlds.
//  Little aliens walk blindly forward. Tap a job, then tap an alien, to guide enough of them to the saucer.
//  The world is a small pixel grid (180 x 320) that can be dug away; it's drawn scaled up to fit the screen.
// ============================================================
const $ = id => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d");
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const LW = 180, LH = 320;                     // logical world size in "pixels"
const ROCK = 1, STEEL = 2;
const T = new Uint8Array(LW * LH);            // the terrain: 0 air, 1 rock (diggable), 2 steel (not)
const SPLAT = 52, HEIGHT = 8, SPAWN_EVERY = 1.3;
// ---------- the jobs you can give ----------
const SKILLS = [
  { id: "block", name: "Blocker", tip: "Stands still and turns the others around." },
  { id: "dig",   name: "Digger",  tip: "Digs straight down through rock." },
  { id: "bash",  name: "Basher",  tip: "Tunnels sideways through a rock wall." },
  { id: "build", name: "Builder", tip: "Lays a staircase to bridge a gap." },
  { id: "jet",   name: "Jetpack", tip: "Floats down safely from any height." },
];

// Each rescue has a hatch, a beam, diggable terrain, and a limited supply of jobs.
const floor = (y, left = 8, right = 174) => [left, y, right, y + 12];
const wall = (x, y, width = 10) => [x, y - 24, x + width, y - 1];
const pool = (left, right, y) => [left, right, y];
const WORLDS = [
  {
    name: "Moon Training Base", color: "#8fe9ff", rock: [113, 138, 178], sky: ["#0b1837", "#253d63"],
    intro: "Six short rescues that start with one job and build up to trickier placements.",
    levels: [
      { name: "Open the Route", hatch: [58, 134], exit: [124, 159], crew: 5, need: 4, jobs: { bash: 3 },
        ground: [floor(160), wall(90, 160, 7)], steel: [[41, 136, 45, 159]],
        hint: "Tap Basher, then tap an alien with a yellow ring. It will open a tunnel for the herd." },
      { name: "Double Tunnel", hatch: [42, 129], exit: [151, 159], crew: 6, need: 4, jobs: { bash: 3 },
        ground: [floor(160), wall(83, 160), wall(120, 160)],
        hint: "Bash through the first wall, then use a second Basher on the far wall." },
      { name: "Dig Down", hatch: [43, 98], exit: [137, 164], crew: 6, need: 4, jobs: { dig: 2 }, ground: [floor(124), floor(165)],
        hint: "Select Digger and tap an alien on the upper shelf. The rest can follow through the hole." },
      { name: "Build a Bridge", hatch: [43, 133], exit: [137, 159], crew: 6, need: 4, jobs: { build: 3 }, ground: [floor(160, 8, 83), floor(160, 100)], lava: [pool(84, 99, 202)],
        hint: "Start a Builder just before the gap. The stairs give the rest of the herd a way across." },
      { name: "Turn Them Around", hatch: [64, 133], exit: [29, 159], crew: 7, need: 4, jobs: { block: 2 }, ground: [floor(160, 8, 125)], lava: [pool(126, 174, 202)],
        hint: "Place a Blocker to the right of the hatch. Everyone behind it turns back toward the saucer." },
      { name: "Soft Landing", hatch: [53, 103], exit: [139, 204], crew: 4, need: 3, jobs: { jet: 4 }, ground: [floor(130, 8, 98), floor(205)],
        hint: "Give each alien a Jetpack before it reaches the cliff. You can equip one while it is falling too." },
    ],
  },
  {
    name: "Comet Iceworks", color: "#8cecff", rock: [103, 171, 201], sky: ["#081f36", "#255a73"],
    intro: "Use two jobs in sequence. The frozen shelves give you time to plan your next move.",
    levels: [
      { name: "Tunnel to the Drop", hatch: [38, 103], exit: [143, 169], crew: 8, need: 6, jobs: { bash: 2, dig: 2 }, ground: [floor(130), wall(82, 130), floor(170)],
        hint: "Bash through the wall, then dig through the shelf once the herd is on the other side." },
      { name: "Across the Crevasse", hatch: [43, 132], exit: [158, 160], crew: 8, need: 6, jobs: { build: 2, bash: 2 }, ground: [floor(161, 8, 70), floor(161, 91), wall(123, 161)], lava: [pool(71, 90, 207)],
        hint: "Build just before the crevasse, then bash through the wall on the far side." },
      { name: "Below and Back", hatch: [54, 95], exit: [31, 155], crew: 9, need: 6, jobs: { dig: 2, block: 2 }, ground: [floor(120), floor(156, 8, 139)], lava: [pool(140, 174, 200)],
        hint: "Dig to the lower shelf, then put a Blocker to the right of the drop to send the herd left." },
      { name: "Icefall", hatch: [44, 78], exit: [148, 180], crew: 7, need: 6, jobs: { bash: 2, jet: 7 }, ground: [floor(108, 8, 106), wall(74, 108), floor(181)],
        hint: "Tunnel through the wall and equip the herd for the long fall on the far side." },
    ],
  },
  {
    name: "Mars Foundry", color: "#ffb08a", rock: [191, 97, 61], sky: ["#230c21", "#663129"],
    intro: "Lava and steel make placement matter. Inspect each route before the herd reaches the edge.",
    levels: [
      { name: "Twin Furnaces", hatch: [34, 135], exit: [158, 166], crew: 9, need: 7, jobs: { build: 3 }, ground: [floor(167, 8, 62), floor(167, 80, 113), floor(167, 134)], lava: [pool(63, 79, 204), pool(114, 133, 204)],
        hint: "Bridge two lava gaps. Save a Builder for the second lip." },
      { name: "Foundry Detour", hatch: [43, 100], exit: [145, 170], crew: 10, need: 8, jobs: { dig: 2, bash: 2 }, ground: [floor(130), floor(171), wall(103, 171)], steel: [[91, 100, 97, 129]],
        hint: "Steel blocks the upper path. Dig before it, then bash through the rock below." },
      { name: "Turn at the Furnace", hatch: [48, 114], exit: [26, 171], crew: 10, need: 7, jobs: { bash: 2, dig: 2, block: 2 }, ground: [floor(140), wall(80, 140), floor(172, 8, 149)], lava: [pool(150, 174, 214)],
        hint: "Tunnel, dig to the lower shelf, then turn the herd around before the lava." },
      { name: "The Lava Lift", hatch: [39, 79], exit: [155, 188], crew: 9, need: 7, jobs: { jet: 9, build: 2 }, ground: [floor(109, 8, 70), floor(189, 8, 106), floor(189, 127)], lava: [pool(107, 126, 225)],
        hint: "Equip the herd for the cliff, then bridge the lava gap below." },
    ],
  },
  {
    name: "Earth Relay", color: "#a1ffb1", rock: [91, 154, 109], sky: ["#092637", "#285d51"],
    intro: "The last rescues mix longer routes with tighter job supplies.",
    levels: [
      { name: "Canopy Crossing", hatch: [36, 128], exit: [157, 156], crew: 11, need: 9, jobs: { bash: 2, build: 2 }, ground: [floor(157, 8, 92), wall(61, 157), floor(157, 115)], lava: [pool(93, 114, 198)],
        hint: "Clear the rock first. Start your bridge close to the wide gap." },
      { name: "Switchback", hatch: [56, 96], exit: [24, 162], crew: 11, need: 8, jobs: { dig: 2, block: 2, bash: 2 }, ground: [floor(126), floor(163, 8, 153), wall(48, 163)], lava: [pool(154, 174, 204)],
        hint: "Dig to the right of the lower wall, turn the herd around, then tunnel left toward the beam." },
      { name: "Drop Team", hatch: [41, 77], exit: [154, 188], crew: 10, need: 8, jobs: { jet: 10, bash: 2 }, ground: [floor(110, 8, 78), floor(189), wall(118, 189)],
        hint: "Get the herd safely down the cliff, then clear the wall by the relay." },
      { name: "Final Evacuation", hatch: [31, 90], exit: [157, 166], crew: 12, need: 10, jobs: { bash: 2, dig: 2, build: 2 }, ground: [floor(126), wall(62, 126), floor(167, 8, 116), floor(167, 137)], lava: [pool(117, 136, 209)],
        hint: "Tunnel through the first wall, dig to the lower shelf, and bridge the final gap." },
    ],
  },
];

// ---------- terrain helpers ----------
const at = (x, y) => { x |= 0; y |= 0; if (x < 0 || x >= LW) return STEEL; if (y < 0) return 0; if (y >= LH) return 0; return T[y * LW + x]; };
const solid = (x, y) => at(x, y) > 0;
function fill(x0, y0, x1, y1, v) { for (let y = Math.max(0, y0 | 0); y <= Math.min(LH - 1, y1 | 0); y++) for (let x = Math.max(0, x0 | 0); x <= Math.min(LW - 1, x1 | 0); x++) T[y * LW + x] = v; dirty = true; }
function carve(x0, y0, x1, y1) { // remove rock (never steel); returns true if anything was rock
  let hit = false;
  for (let y = Math.max(0, y0 | 0); y <= Math.min(LH - 1, y1 | 0); y++) for (let x = Math.max(0, x0 | 0); x <= Math.min(LW - 1, x1 | 0); x++) if (T[y * LW + x] === ROCK) { T[y * LW + x] = 0; hit = true; }
  if (hit) dirty = true; return hit;
}
function anyIn(x0, y0, x1, y1, v) { for (let y = y0 | 0; y <= (y1 | 0); y++) for (let x = x0 | 0; x <= (x1 | 0); x++) if (at(x, y) === v) return true; return false; }

function buildLevel() {
  T.fill(0);
  fill(0, 0, 7, LH - 1, STEEL);
  fill(175, 0, LW - 1, LH - 1, STEEL);
  for (const rect of L.ground) fill(...rect, ROCK);
  for (const rect of L.steel || []) fill(...rect, STEEL);
}

let wi = 0, li = 0, L = WORLDS[0].levels[0], viewY = 0, viewHeight = LH;
let aliens = [], spawned = 0, saved = 0, lost = 0, time = 0, spawnT = 0.5;
let selected, paused = true, fast = false, over = false, dirty = true, tick = 0, fx = [];
let counts = {};
let stored = [];
try { stored = JSON.parse(localStorage.getItem("alienHerd.campaign.v1")) || []; } catch {}
const best = WORLDS.map((world, w) => world.levels.map((_, l) => clamp(Number(stored[w]?.[l]) || 0, 0, 3)));
const worldOpen = w => !!WORLDS[w] && (w === 0 || best[w - 1].every(n => n > 0));
const levelOpen = (w, l) => worldOpen(w) && !!WORLDS[w].levels[l] && (l === 0 || best[w][l - 1] > 0);
const timeLimit = () => wi === 0 ? 55 : 40 + wi * 8;
function newLevel(w = wi, l = li) {
  wi = w; li = l; L = WORLDS[w].levels[l];
  buildLevel(); aliens = []; spawned = saved = lost = tick = 0; time = acc = 0; spawnT = 0.6; over = false; fx = [];
  counts = { ...L.jobs }; selected = wi === 0 && li === 0 ? null : Object.keys(counts)[0]; bubbleT = 0; $("hint").textContent = L.hint;
  const bottom = Math.max(L.exit[1] + 27, ...(L.lava || []).map(([, , y]) => y + 12));
  viewHeight = Math.max(126, bottom - L.hatch[1] + 28);
  viewY = Math.max(0, L.hatch[1] - 28);
  fast = false; syncFast(); renderSkills(); hud(); resize();
}

// ============================================================
//  ALIEN BEHAVIOUR (30 steps per second)
// ============================================================
function spawn() { aliens.push({ x: L.hatch[0], y: L.hatch[1], dir: 1, state: "fall", fall: 0, t: 0, jet: false, bricks: 0, id: spawned++ }); }
const blockers = () => aliens.filter(a => a.state === "block");
function step() {
  tick++;
  for (const a of aliens) {
    if (a.state === "saved" || a.state === "dead") { a.t++; continue; }
    a.t++;
    if (L.lava?.some(([left, right, y]) => a.y >= y && a.x >= left && a.x <= right)) { kill(a, "lava"); continue; }
    if (a.y > LH + 4) { kill(a, "fall"); continue; }
    switch (a.state) {
      case "fall": {
        const sp = a.jet ? 0.6 : 2;
        for (let k = 0; k < sp; k += 1) {
          if (solid(a.x, a.y + 1)) {
            if (a.fall > SPLAT && !a.jet) { kill(a, "splat"); break; }
            a.state = "walk"; a.fall = 0; break;
          }
          a.y += Math.min(1, sp - k); a.fall += Math.min(1, sp - k);
        }
        break;
      }
      case "walk": if (tick % 2 === 0) walk(a); break;
      case "block": if (!solid(a.x, a.y + 1)) a.state = "fall"; break;
      case "dig":
        if (tick % 4) break;
        if (anyIn(a.x - 3, a.y + 1, a.x + 3, a.y + 2, STEEL)) { a.state = "walk"; say("Steel! Diggers can't get through that.", 2); break; }
        if (!carve(a.x - 3, a.y + 1, a.x + 3, a.y + 1)) { a.state = "fall"; a.fall = 0; break; }
        a.y += 1; dust(a.x, a.y + 2);
        break;
      case "bash": {
        if (tick % 3) break;
        const fx0 = a.dir > 0 ? a.x + 1 : a.x - 6, fx1 = a.dir > 0 ? a.x + 6 : a.x - 1;
        if (anyIn(fx0, a.y - HEIGHT, fx1, a.y, STEEL)) { a.state = "walk"; a.dir *= -1; break; }
        const hit = carve(fx0, a.y - HEIGHT, fx1, a.y - 1);
        if (!hit && !anyIn(a.dir > 0 ? a.x + 1 : a.x - 10, a.y - HEIGHT, a.dir > 0 ? a.x + 10 : a.x - 1, a.y - 1, ROCK)) { a.state = "walk"; break; }

  { title: "Dig and bash", lines: ["<b class='y'>Digger</b> digs <b>down</b>", "<b class='y'>Basher</b> tunnels <b>sideways</b>", "<b>Grey steel</b> stops both"], demo: demoDigBash },
  { title: "Build and block", lines: ["<b class='c'>Builder</b> makes <b>stairs</b> over gaps", "<b class='p'>Blocker</b> <b>turns everyone back</b>"], demo: demoBuildBlock },
  { title: "Stay safe", lines: ["<b class='r'>Big falls</b> and <b class='o'>lava</b> are deadly", "<b class='c'>Jetpack</b> = <b>safe landing</b>"], demo: demoJet },
  { title: "Bring them home", lines: [`Walk them into the <b class='g'>beam</b>`, "Meet the rescue goal before time runs out", "<b>▶▶</b> faster · <b>Pause</b> pauses · <b>?</b> help"], demo: demoHome },
];
function helpMenu(back, page = 0) {
  const p = HOWTO[page], lastPage = page === HOWTO.length - 1;
  const done = back === "game" ? "resume" : "title";
  openMenu(`<p class="kicker">How to play · ${page + 1} of ${HOWTO.length}</p><h2>${p.title}</h2>
    <canvas id="howCv"></canvas><ul class="how">${p.lines.map(l => `<li>${l}</li>`).join("")}</ul>
    <div class="dots">${HOWTO.map((_, k) => `<i class="${k === page ? "on" : ""}"></i>`).join("")}</div>
    <div class="row">${page ? `<button class="big" data-act="help" data-arg="${back}|${page - 1}">◀ Back</button>` : `<button class="big" data-act="${done}">Close</button>`}
      ${lastPage ? `<button class="big main" data-act="${done}">${back === "game" ? "Back to the game" : "Done"}</button>` : `<button class="big main" data-act="help" data-arg="${back}|${page + 1}">Next ▶</button>`}</div>`,
    t => { const [c, w, h] = fitDemo($("howCv"));
      const g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, "#1a0a08"); g.addColorStop(1, "#4a1c14"); c.fillStyle = g; c.fillRect(0, 0, w, h);
      const k = Math.min(w / 120, h / 70);
      c.save(); c.translate((w - k * 120) / 2, 0); p.demo(c, t, w, h, k); c.restore(); });
}
// demo helpers (positions in mini-world units, k = screen pixels per unit)
function dRock(c, k, x0, y0, x1, y1, steel = false) {
  c.fillStyle = steel ? "#828c9e" : "#9a4e34"; c.fillRect(x0 * k, y0 * k, (x1 - x0) * k, (y1 - y0) * k);
  c.fillStyle = steel ? "#a8b2c4" : "#d27a52"; c.fillRect(x0 * k, y0 * k, (x1 - x0) * k, Math.max(1.5, k * 0.8));
}
function dHole(c, k, x0, y0, x1, y1) { c.fillStyle = "#2a0e0a"; c.fillRect(x0 * k, y0 * k, (x1 - x0) * k, (y1 - y0) * k); }
function dLabel(c, k, x, y, text, col = "#e6ecff") { c.fillStyle = col; c.font = `800 ${Math.max(10, k * 3.4)}px system-ui`; c.textAlign = "center"; c.fillText(text, x * k, y * k); }
function dFinger(c, k, x, y, down) { c.fillStyle = down ? "rgba(93,255,155,0.35)" : "rgba(255,255,255,0.22)"; c.beginPath(); c.arc(x * k, y * k, 5 * k, 0, TAU); c.fill();
  c.fillStyle = down ? "#5dff9b" : "rgba(255,255,255,0.85)"; c.beginPath(); c.arc(x * k, y * k, 2.2 * k, 0, TAU); c.fill(); }
const dA = (c, k, x, y, dir, st, t, jet = false) => alienArt(c, x * 1.6, y * 1.6, k / 1.6, dir, st, t * 30, jet); // x, y in mini-world units
function demoWalk(c, t, w, h, k) {
  dRock(c, k, 22, 30, 80, 70); dRock(c, k, 74, 6, 80, 30); dRock(c, k, 44, 28, 52, 30); dRock(c, k, 0, 58, 22, 70);
  const T = t % 8; let x, y = 30, dir = 1;
  if (T < 3) { x = 26 + T * 15; dir = 1; } else if (T < 6) { x = 71 - (T - 3) * 15; dir = -1; } else if (T < 6.4) { x = 22; y = 30 + (T - 6) * 70; dir = -1; } else { x = 22 - (T - 6.4) * 9; y = 58; dir = -1; }
  y = Math.min(y, 58); if (T < 6 && x > 44 && x < 52) y = 28; // climbing the small bump
  dA(c, k, x, y, dir, T >= 6 && T < 6.4 ? "fall" : "walk", t);
  dLabel(c, k, 64, 50, "turns at walls →", "#ffd25d"); dLabel(c, k, 14, 50, "← walks off edges", "#ffd25d"); dLabel(c, k, 44, 40, "↑ climbs bumps", "#9fe8ff");
}
function demoTap(c, t, w, h, k) {
  const T = t % 7, bar = 50, names = ["Blocker", "Digger", "Basher", "Builder", "Jetpack"];
  dRock(c, k, 0, 28, 120, 40);
  const digging = T > 2.6, depth = digging ? Math.min(12, (T - 2.6) * 4) : 0, ax = digging ? 60 : 30 + T * 11.5;
  if (depth) dHole(c, k, ax - 4, 28, ax + 4, 28 + depth);
  const fallen = depth >= 12, ay = fallen ? Math.min(70, 40 + (T - 5.6) * 40) : 28 + depth;
  if (ay < 66) dA(c, k, ax, ay, 1, digging ? (fallen ? "fall" : "dig") : "walk", t);
  for (let i = 0; i < 5; i++) { const bx = 4 + i * 23, sel = i === 1 && T > 1;
    c.fillStyle = sel ? "#173a2c" : "#121a3a"; c.strokeStyle = sel ? "#5dff9b" : "#2a3a66"; c.lineWidth = 1.5; c.beginPath(); c.roundRect(bx * k, bar * k, 21 * k, 12 * k, 2 * k); c.fill(); c.stroke();
    dLabel(c, k, bx + 10.5, bar + 8, names[i], sel ? "#5dff9b" : "#c9d3f0"); }
  const fx = T < 1 ? 70 - T * 42 : T < 2.4 ? 27 + (T - 1) / 1.4 * (ax - 27) : ax, fy = T < 1 ? 66 : T < 2.4 ? 56 - (T - 1) / 1.4 * 36 : 20;
  const down = (T > 0.85 && T < 1.15) || (T > 2.35 && T < 2.7);
  if (T < 3.4) dFinger(c, k, fx, fy, down);
  dLabel(c, k, 25, 10, T < 1.2 ? "1. tap a job" : T < 2.7 ? "2. tap an alien" : "3. it gets to work!", "#ffd25d");
}
function demoDigBash(c, t, w, h, k) {
  const T = t % 6;
  dRock(c, k, 0, 30, 54, 44); // left: digger
  const depth = Math.min(14, Math.max(0, (T - 0.6) * 4)); if (depth) dHole(c, k, 23, 30, 31, 30 + depth);
  const ay = depth >= 14 ? Math.min(66, 44 + (T - 4.1) * 30) : 30 + depth; if (ay < 64) dA(c, k, 27, ay, 1, depth >= 14 ? "fall" : depth ? "dig" : "walk", t);
  dRock(c, k, 0, 64, 54, 70); dLabel(c, k, 27, 12, "Digger: down", "#ffd25d");
  dRock(c, k, 60, 44, 120, 50); dRock(c, k, 92, 14, 100, 44); dRock(c, k, 112, 10, 120, 44, true); // right: basher
  const bx = T < 1.6 ? 66 + T * 15 : Math.min(108, 90 + (T - 1.6) * 5.5), dug = Math.max(0, Math.min(8, bx - 90));
  if (dug) dHole(c, k, 92, 30, 92 + dug, 44);
  dA(c, k, bx, 44, 1, bx > 90 && bx < 100 ? "bash" : "walk", t);
  dLabel(c, k, 92, 10, "Basher: sideways", "#ffd25d"); dLabel(c, k, 116, 56, "steel", "#c9d3e6");
}
function demoBuildBlock(c, t, w, h, k) {
  const T = t % 7;
  dRock(c, k, 0, 40, 18, 70); dRock(c, k, 40, 40, 58, 70); dHole(c, k, 18, 40, 40, 70); // left: builder over a gap
  const n = Math.min(12, Math.floor(T * 3.2)); c.fillStyle = "#d27a52";
  for (let i = 0; i < n; i++) c.fillRect((14 + i * 2) * k, (39 - i) * k, 6 * k, 1 * k);
  if (n < 12) dA(c, k, (14 + n * 2), (39 - n + 1), 1, "build", t);
  else { const wx = Math.min(54, 38 + (T - 3.75) * 9), wy = wx < 40 ? 28 : Math.min(40, 28 + (wx - 40) * 3); dA(c, k, wx, wy, 1, "walk", t); }
  dLabel(c, k, 29, 12, "Builder: stairs", "#9fe8ff");
  dRock(c, k, 62, 40, 120, 46); // right: blocker turning others round
  dA(c, k, 100, 40, 1, "block", t);
  for (let i = 0; i < 2; i++) { const ph = (t * 0.9 + i * 0.5) % 2, x = ph < 1 ? 68 + ph * 26 : 94 - (ph - 1) * 26; dA(c, k, x, 40, ph < 1 ? 1 : -1, "walk", t + i); }
  dRock(c, k, 114, 46, 120, 70); dLabel(c, k, 92, 12, "Blocker: turn back", "#ff8bd0");
}
function demoJet(c, t, w, h, k) {
  const T = t % 6;
  dRock(c, k, 0, 14, 40, 20); dRock(c, k, 0, 64, 84, 70);
  const lg = c.createLinearGradient(0, 62 * k, 0, 70 * k); lg.addColorStop(0, "#ffb84d"); lg.addColorStop(1, "#c0301a"); c.fillStyle = lg; c.fillRect(84 * k, (62 + Math.sin(t * 3) * 0.5) * k, 36 * k, 8 * k);
  const jy = Math.min(64, 14 + Math.max(0, T - 0.5) * 14); dA(c, k, 44, jy, 1, jy < 64 ? "fall" : "walk", t, true); // jetpack: floats down
  if (jy >= 64) dLabel(c, k, 44, 56, "safe ✓", "#5dff9b");
  const fy = 14 + Math.max(0, T - 0.5) * 60;
  if (fy < 64) dA(c, k, 30, fy, -1, "fall", t);
  else if (T < 4.5) { for (let i = 0; i < 8; i++) { const a = i / 8 * TAU, r = (T - 1.33) * 8; c.fillStyle = i % 2 ? "#5dff9b" : "#ff5d7a"; c.fillRect((30 + Math.cos(a) * r) * k, (62 + Math.sin(a) * r * 0.5) * k, k * 1.2, k * 1.2); }
    dLabel(c, k, 26, 54, "SPLAT!", "#ff5d7a"); }
  dLabel(c, k, 20, 10, "too high to fall", "#ffd25d"); dLabel(c, k, 102, 56, "lava!", "#ff8a3d"); dLabel(c, k, 62, 30, "Jetpack", "#9fe8ff");
}
function demoHome(c, t, w, h, k) {
  dRock(c, k, 0, 54, 120, 70);
  saucerArt(c, 92, 54, k, t); // saucer + beam
  const home = Math.floor((t % 6) / 1.6);
  for (let i = 0; i < 3; i++) { const ph = ((t % 6) - i * 1.6), x = 20 + ph * 26; if (ph < 0) continue;
    if (x < 90) dA(c, k, x, 54, 1, "walk", t + i); else { const up = (x - 90) * 1.5; if (up < 40) { c.globalAlpha = Math.max(0, 1 - up / 40); dA(c, k, 92, (54 - up), 1, "fall", t); c.globalAlpha = 1; } } }
  c.fillStyle = "rgba(10,16,34,0.85)"; c.beginPath(); c.roundRect(4 * k, 4 * k, 34 * k, 13 * k, 3 * k); c.fill();
  dLabel(c, k, 21, 13, `Home ${home}/3`, home >= 3 ? "#5dff9b" : "#e6ecff");
}

const ACT = {
  start: arg => { const [w, l] = arg.split("|").map(Number); if (levelOpen(w, l)) { newLevel(w, l); closeMenu(); } },
  worlds: () => worldsMenu(),
  levels: arg => levelsMenu(Number(arg)),
  brief: arg => briefing(...arg.split("|").map(Number)),
  finish: () => finishLevel(),
  help: arg => { const [back, page] = String(arg).split("|"); helpMenu(back, +(page || 0)); },
  title: () => titleMenu(),
  resume: () => closeMenu(),
  sound: () => { soundOn = !soundOn; try { localStorage.setItem("alienHerd.sound", soundOn ? "1" : "0"); } catch (e) {}
    for (const b of $("box").querySelectorAll("[data-act='sound']")) b.textContent = soundOn ? "🔊 Sound: On" : "🔇 Sound: Off"; blip(660); },
};
$("menuBtn").onclick = () => { audio(); if (!$("overlay").classList.contains("hidden")) return; if (!over) pauseMenu(); };
addEventListener("blur", () => { if (!over && $("overlay").classList.contains("hidden")) pauseMenu(); }); // switching apps pauses the game
$("helpBtn").onclick = () => { audio(); if (over || !$("overlay").classList.contains("hidden")) return; helpMenu("game", 0); };
function syncFast() { $("fastBtn").classList.toggle("on", fast); $("fastBtn").textContent = fast ? "2×" : "▶▶"; $("fastBtn").setAttribute("aria-pressed", fast); }
$("fastBtn").onclick = () => { fast = !fast; syncFast(); };

// ============================================================
//  LOOP
// ============================================================
function resize() {
  const st = $("stage"), w = st.clientWidth, h = st.clientHeight, d = Math.min(3, devicePixelRatio || 1);
  K = Math.max(0.1, Math.min(w / LW, h / viewHeight));
  cv.style.width = LW * K + "px"; cv.style.height = viewHeight * K + "px"; cv.width = Math.round(LW * K * d); cv.height = Math.round(viewHeight * K * d); skyCv = null;
}
addEventListener("resize", resize);
if (window.ResizeObserver) new ResizeObserver(resize).observe($("stage"));
let last = performance.now(), acc = 0;
function frame(now) {
  const dt = clamp((now - last) / 1000, 0, 0.1); last = now;
  if (!paused && !over) {
    acc += dt * (fast ? 2 : 1);
    while (acc >= 1 / 30) {
      acc -= 1 / 30; time += 1 / 30;
      spawnT -= 1 / 30; if (spawnT <= 0 && spawned < L.crew) { spawn(); spawnT = SPAWN_EVERY; hud(); }
      step();
      for (let i = fx.length - 1; i >= 0; i--) { const p = fx[i]; p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life -= 1 / 30; if (p.life <= 0) fx.splice(i, 1); }
    }
    if (time >= timeLimit() || (spawned === L.crew && saved + lost + blockers().length === L.crew)) finishLevel();
    hud();
  }
  if (bubbleT > 0) { bubbleT -= dt; if (bubbleT <= 0) $("hint").textContent = L.hint; }
  draw(now / 1000);
  if (menuAnim) menuAnim(now / 1000);
  requestAnimationFrame(frame);
}
newLevel();
titleMenu();
requestAnimationFrame(frame);
</script>
